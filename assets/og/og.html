<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#0E1218;font-family:'Plus Jakarta Sans',Inter,Arial,sans-serif;color:#F4F7FB;position:relative}
.glow{position:absolute;inset:0;background:radial-gradient(520px 360px at 50% 30%,rgba(110,134,240,.22),transparent 70%),radial-gradient(600px 400px at 92% 95%,rgba(138,92,240,.18),transparent 70%)}
.in{position:absolute;inset:0;padding:0 96px 40px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:30px}
.lock{display:flex;flex-direction:column;align-items:center;gap:22px}
.word{font-size:76px;font-weight:800;letter-spacing:-2.5px;line-height:1}
.word span{color:#6E86F0}
.tag{font-size:40px;font-weight:700;letter-spacing:-.8px;line-height:1.2;max-width:960px}
.sub{font-size:28px;font-weight:500;color:#A9B4C8}
.foot{position:absolute;left:96px;right:96px;bottom:52px;display:flex;justify-content:space-between;font-size:24px;font-weight:700;color:#7F8AA0}
.foot b{color:#6E86F0}
</style></head>
<body><div class="glow"></div>
<div class="in">
  <div class="lock">
    <svg width="170" height="170" viewBox="7 4 50 56"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B5BD9"/><stop offset="1" stop-color="#8A5CF0"/></linearGradient></defs>
      <polygon points="32,4 57,18.5 57,45.5 32,60 7,45.5 7,18.5" fill="url(#g)"/>
      <text x="32" y="41" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">SJ</text></svg>
    <div class="word">Sync<span>Journal</span></div>
  </div>
  <div>
    <div class="tag">Jouw trades, eindelijk overzichtelijk.</div>
    <div class="sub" style="margin-top:14px">Je P&amp;L zegt wat er gebeurde. Je journal zegt waarom.</div>
  </div>
</div>
<div class="foot"><span><b>syncjournal.nl</b></span><span>Gratis · lokaal · geen account</span></div>
</body></html>
