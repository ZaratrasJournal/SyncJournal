# SyncJournal-testsuite online (GitHub Actions) — draait de volledige suite,
# inclusief de e2e-doorloop, bij elke push/PR die SyncJournal of de tests raakt.
# Zo draait dezelfde doorloop die we lokaal gebruiken óók automatisch in de cloud.
name: SyncJournal tests

on:
  push:
    paths: ['work/syncjournal.html', 'site/**', 'tests/**']
  pull_request:
    paths: ['work/syncjournal.html', 'site/**', 'tests/**']
  workflow_dispatch: {}

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Run SyncJournal suite (incl. e2e-doorloop)
        run: node tests/run-all-sj.js
