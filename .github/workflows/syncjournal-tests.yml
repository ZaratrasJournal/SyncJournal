# SyncJournal-testsuite online (GitHub Actions) — draait de volledige suite,
# inclusief de e2e-doorloop, bij elke push/PR die SyncJournal of de tests raakt.
# Zo draait dezelfde doorloop die we lokaal gebruiken óók automatisch in de cloud.
name: SyncJournal tests

on:
  push:
    paths: ['work/syncjournal.html', 'site/**', 'tests/**', '.github/workflows/syncjournal-tests.yml']
  pull_request:
    paths: ['work/syncjournal.html', 'site/**', 'tests/**', '.github/workflows/syncjournal-tests.yml']
  workflow_dispatch: {}

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Europe/Amsterdam   # de suite toetst NL-gebruikersgedrag (sessies/tijden); op UTC falen 3 specs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install Playwright
        # De specs draaien op playwright@1.59.1 (zelfde als lokaal) en die verwacht
        # browser-build 1217. 'npx playwright install' pakte de CLI uit @playwright/test
        # (^1.59.1 → 1.6x uit package.json) en zette dús andere builds neer: de runtime
        # vond daarna geen chrome-headless-shell en álle 33 specs crashten in 0,6s.
        # Daarom de CLI van het geteste pakket zelf aanroepen; die downloadt 1217.
        run: |
          npm install playwright@1.59.1
          node node_modules/playwright/cli.js --version
          node node_modules/playwright/cli.js install --with-deps chromium chromium-headless-shell
      - name: Run SyncJournal release gate (incl. e2e-doorloop)
        # De release-poort, niet de hele map: ongeveer de helft van tests/ beschrijft nog de oude
        # journal en staat rood zonder dat de app stuk is. Toen run-all-sj.js op 29-09-2026 de map
        # ging lezen, werd deze workflow daardoor rood. --hier: deze checkout is al een losse kopie.
        run: node tests/run-release.js --hier
