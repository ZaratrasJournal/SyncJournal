<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Trading Plan v3 · prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Tokens 1-op-1 uit work/syncjournal.html (:root + body.dark) */
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --raise:#FBFCFE; --sink:#F7F9FC;
  --ink:#191E2A; --ink2:#525A6B; --muted:#6B7385; --faint:#7A8291;
  --line:#E8EBF2; --line2:#F0F2F7;
  --accent:#3B5BD9; --accent-soft:#EDF0FD; --accent-line:#CDD6F7;
  --green:#12946A; --green-soft:#E3F4EC; --red:#D64259; --red-soft:#FBE8EC; --amber:#C0821C; --amber-soft:#F8EFDD;
  --violet:#7C5CE0; --teal:#0E9E96;--pink:#D6409F;
  --grid:#EDEFF5; --hover:#F6F8FC; --track:#EEF1F6; --zebra:#FAFBFD;
  --fb:'Inter',sans-serif; --fd:'Plus Jakarta Sans',sans-serif; --fn:'IBM Plex Mono',monospace;
  --sh:0 1px 2px rgba(20,30,60,.05);
}
body.dark{
  --bg:#0E1218; --surface:#141A22; --raise:#171E28; --sink:#10151c;
  --ink:#F4F7FB; --ink2:#C7CFDB; --muted:#939CAC; --faint:#6C7583;
  --line:#232B36; --line2:#1C232D;
  --accent:#6E86F0; --accent-soft:#1B2436; --accent-line:#2E3B57;
  --green:#37C48B; --green-soft:#12261F; --red:#F0637A; --red-soft:#2A1820; --amber:#E0A63C; --amber-soft:#28210F;
  --violet:#A78BFA; --teal:#2CC5B6;--pink:#F472B6;
  --grid:#1B222C; --hover:#19212B; --track:#1E2732; --zebra:#12171f;
  --sh:0 1px 2px rgba(0,0,0,.25);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--fb);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
.num{font-family:var(--fn);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 80px}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.logo{width:30px;height:30px;flex:none}
.brand b{font-family:var(--fd);font-size:16px;font-weight:800;letter-spacing:-.01em}
.brand span{display:block;font-size:11px;color:var(--muted)}
.tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--track);border-radius:9px;padding:2px;gap:2px}
.seg button{padding:5px 10px;border-radius:7px;font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh)}
.seg.sm button{padding:3px 8px;font-size:11px}
.ibtn{height:30px;min-width:30px;padding:0 9px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;gap:5px}
.ibtn:hover{background:var(--hover)}
.varlbl{font-size:11px;color:var(--muted);font-weight:600}
.tabs{width:100%;display:flex;gap:2px;margin-top:4px;overflow:hidden}
.tabs button{padding:9px 12px 10px;font-weight:600;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}

/* basics */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh)}
.pad{padding:14px}
h1{font-family:var(--fd);font-size:20px;font-weight:800;letter-spacing:-.01em}
h2{font-family:var(--fd);font-size:15px;font-weight:700}
h3{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack>*+*{margin-top:12px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:18px 0 14px}
.pagehead p{color:var(--muted);font-size:13px;margin-top:2px}
.btn{padding:7px 12px;border-radius:9px;font-weight:600;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none;color:var(--accent)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:8px}
.inp{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--raise);outline:none}
.inp:focus{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{resize:vertical;min-height:64px}
label.f{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:4px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.set{border-color:var(--accent-line)}
.chip.conf{background:var(--surface);color:var(--ink2);border-color:var(--line)}
.chip.inh{opacity:.55;border-style:dashed}
.chip.inh.off{opacity:.4;text-decoration:line-through}
.chip.add{background:none;border:1px dashed var(--line);color:var(--muted)}
.chip.add:hover{color:var(--accent);border-color:var(--accent-line)}
.chip .x{opacity:.6;font-weight:700}
.chip.pick{cursor:pointer;background:var(--surface);color:var(--ink2);border-color:var(--line)}
.chip.pick.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.bias{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px}
.bias.Bullish{color:var(--green);background:var(--green-soft)}
.bias.Bearish{color:var(--red);background:var(--red-soft)}
.bias.Neutraal{color:var(--ink2);background:var(--track)}
.dir{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;text-transform:uppercase;letter-spacing:.03em}
.dir.long{color:var(--green);background:var(--green-soft)} .dir.short{color:var(--red);background:var(--red-soft)}
.grade{font-family:var(--fd);font-weight:800;font-size:12px;width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;background:var(--track);color:var(--ink)}
.grade.A{background:var(--green-soft);color:var(--green)} .grade.B{background:var(--accent-soft);color:var(--accent)} .grade.C{background:var(--amber-soft);color:var(--amber)}
.tag-sterk{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--green);background:var(--green-soft);padding:2px 7px;border-radius:6px}
.rel{font-size:11px;font-weight:600;padding:1px 7px;border-radius:6px;white-space:nowrap}
.rel.weinig{color:var(--amber);background:var(--amber-soft)} .rel.redelijk{color:var(--accent);background:var(--accent-soft)} .rel.genoeg{color:var(--green);background:var(--green-soft)}
.dots{letter-spacing:1px;font-size:11px;white-space:nowrap}
.dots .w{color:var(--green)} .dots .l{color:var(--red)} .dots .b{color:var(--faint)}
.pos{color:var(--green)} .neg{color:var(--red)}

/* layer editor */
.layer{display:grid;grid-template-columns:58px 1fr;gap:8px;align-items:start;padding:7px 0}
.layer+.layer{border-top:1px dashed var(--line2)}
.layer .tf{font-family:var(--fn);font-size:12px;font-weight:600;color:var(--ink2);padding-top:3px}
.layer.inh .tf{color:var(--faint)}
.layer .chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.inhnote{font-size:11px;color:var(--faint)}

/* status */
.st{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.st button{font-size:11px;font-weight:600;padding:4px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:7px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.st button.on.open{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.st button.on.genomen{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.st button.on.gemist{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.st button.on.niet{background:var(--track);border-color:var(--faint);color:var(--ink2)}
.st button.on.ongeldig{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.sdot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.sdot.open{background:var(--accent)} .sdot.genomen{background:var(--green)} .sdot.gemist{background:var(--amber)} .sdot.niet{background:var(--faint)} .sdot.ongeldig{background:var(--red)}
.schip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:8px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--surface);max-width:100%}
.schip.genomen{border-color:var(--green);background:var(--green-soft)} .schip.gemist{border-color:var(--amber);background:var(--amber-soft)}
.schip.ongeldig{border-color:var(--red);background:var(--red-soft)} .schip.niet{background:var(--track)}
.schip .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* checklist */
.chk{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;cursor:pointer;user-select:none}
.box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--faint);display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:12px;color:#fff;font-weight:800}
.chk.on .box{background:var(--green);border-color:var(--green)}
.chk.on .lbl{color:var(--ink2)}
.prog{height:5px;border-radius:3px;background:var(--track);overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);border-radius:3px}

/* mental */
.mental{display:inline-flex;gap:4px}
.mental button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;color:var(--muted)}
.mental button.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* pre-flight pills */
.pf{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 7px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--ink2)}
.pf .box{width:16px;height:16px;border-radius:50%}
.pf.on{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.pf.on .box{background:var(--green);border-color:var(--green)}

/* edge numbers */
.edge2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ebox{background:var(--sink);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;min-width:0}
.ebox .k{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.ebox .big{font-family:var(--fn);font-size:17px;font-weight:600;margin-top:2px}
.ebox .sub{font-family:var(--fn);font-size:11.5px;color:var(--muted)}
.ebox.basis{border-color:var(--accent-line)}
.enote{font-size:11.5px;color:var(--muted);margin-top:6px}
.enote b{color:var(--ink2);font-weight:600}
.etable{width:100%;border-collapse:collapse;font-size:12.5px}
.etable th{text-align:right;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:4px 6px}
.etable td{text-align:right;padding:5px 6px;border-top:1px solid var(--line2);font-family:var(--fn)}
.etable th:first-child,.etable td:first-child{text-align:left;font-family:var(--fb)}

/* A: kaarten */
.strip{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.scard{padding:14px;display:flex;flex-direction:column;gap:10px;position:relative}
.scard.isOngeldig,.scard.isNiet{opacity:.6}
.scard .ttl{font-family:var(--fd);font-weight:700;font-size:15px}
.scard .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.ifthen{font-size:12.5px;display:grid;grid-template-columns:auto 1fr;gap:2px 8px}
.ifthen dt{font-weight:700;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding-top:1px}
.addcard{border:1.5px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;min-height:140px;color:var(--muted);font-weight:600}
.addcard:hover{color:var(--accent);border-color:var(--accent-line)}
.ctxbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* B: cockpit */
.cockpit{display:grid;grid-template-columns:330px 1fr;gap:14px;align-items:start}
.funnel{position:sticky;top:96px}
.fstep{position:relative;padding:10px 12px 10px 26px}
.fstep::before{content:"";position:absolute;left:11px;top:16px;bottom:-10px;width:2px;background:var(--line)}
.fstep:last-child::before{display:none}
.fstep::after{content:"";position:absolute;left:7px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.fstep h3{margin-bottom:4px}
.rlist{display:flex;flex-direction:column;gap:8px}
.rrow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 12px;cursor:pointer}
.rrow:hover{background:var(--hover)}
.rnum{font-family:var(--fd);font-weight:800;font-size:18px;color:var(--faint);text-align:center}
.rnum.one{color:var(--green)}
.rline{font-family:var(--fn);font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rdetail{border-top:1px solid var(--line2);padding:12px 14px 14px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ritem.isOngeldig .rrow,.ritem.isNiet .rrow{opacity:.55}

/* C: flow */
.flow{max-width:720px;margin:0 auto}
.step{display:grid;grid-template-columns:34px 1fr;gap:12px;position:relative}
.step+.step{margin-top:6px}
.step .n{width:30px;height:30px;border-radius:50%;background:var(--surface);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-family:var(--fd);color:var(--muted);position:relative;z-index:1}
.step.done .n{background:var(--green);border-color:var(--green);color:#fff}
.step::before{content:"";position:absolute;left:14px;top:30px;bottom:-6px;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.step .body{padding-bottom:18px;min-width:0}
.step .body>h2{margin:4px 0 8px}
.fsc{padding:14px;margin-bottom:10px}
.fsc.ready{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.sentence{font-size:13px;color:var(--ink2);background:var(--sink);border-radius:9px;padding:9px 11px;border:1px solid var(--line2)}
.sentence b{color:var(--ink)}

/* week / afsluiting / log */
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{padding:12px 14px}
.kpi .v{font-family:var(--fn);font-size:22px;font-weight:600;margin-top:2px}
.kpi .s{font-size:12px;color:var(--muted)}
.score{padding:16px 18px;font-size:15px;line-height:1.55}
.score b{font-family:var(--fd)}
.lvl{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line2);font-size:13px}
.lvl:first-child{border-top:0}
.lvl .p{font-family:var(--fn);font-weight:600}
.dayrow{padding:12px 14px}
.dayrow+.dayrow{border-top:1px solid var(--line2)}
.dayhead{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:7px;flex-wrap:wrap}
.daychips{display:flex;flex-wrap:wrap;gap:6px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:12.5px;max-width:100%}
.bar2{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--track)}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:13px}
.empty b{display:block;color:var(--ink2);margin-bottom:3px;font-size:14px}

/* modal / sheet */
.ov{position:fixed;inset:0;background:rgba(10,14,22,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;border:1px solid var(--line);width:100%;max-width:560px;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 12px 40px -12px rgba(0,0,0,.4)}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line2);position:sticky;top:0;background:var(--surface);z-index:1}
.modal .mb{padding:14px 16px}
.modal .mf{padding:12px 16px;border-top:1px solid var(--line2);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted);font-weight:600;font-size:12px;padding-top:2px}
.callout{border-radius:10px;padding:10px 12px;font-size:12.5px;background:var(--accent-soft);color:var(--ink2);border:1px solid var(--accent-line)}
.callout.warn{background:var(--amber-soft);border-color:var(--amber)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid .full{grid-column:1/-1}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
.demo-note{margin-top:28px;font-size:11.5px;color:var(--faint);text-align:center}

@media(max-width:860px){
  .cockpit{grid-template-columns:1fr}
  .funnel{position:static}
  .rdetail{grid-template-columns:1fr}
  .funnel.shut .fstep.opt{display:none}
  .rline{white-space:normal}
}
@media(min-width:861px){.mobonly{display:none}}
@media(max-width:600px){
  .two,.three{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr}
  .tabs button{padding:8px 9px 9px;font-size:13px}
  .brand span{display:none}
  .varlbl{display:none}
  .ov{align-items:flex-end;padding:0}
  .modal{border-radius:14px 14px 0 0;max-height:88vh}
  .kv{grid-template-columns:92px 1fr}
  .edge2{grid-template-columns:1fr 1fr}
  .st .si{display:none}
}
</style>
</head>
<body>
<header class="top"><div class="top-in" id="top"></div></header>
<main class="wrap" id="app"><div class="empty"><b>Plan laden…</b>Trades, tags en playbooks uit de demo-dataset.</div></main>
<div id="modal"></div>
<script>
'use strict';
// ───────────────────────── journal-logica (gekopieerd uit work/syncjournal.html) ─────────────────────────
const R_SANE_MAX=100, PF_ONEINDIG=99;
function isLive(t){return !t.kind||t.kind==='live';}
function rNetto(t){const entry=+t.entry,stop=+t.stop,size=+t.size,pnl=t.pnlUsd!=null?+t.pnlUsd:+t.pnl;
  if(!(entry>0)||!(stop>0)||!(size>0)||!isFinite(pnl)||Math.abs(entry-stop)<entry*1e-4)return null;
  const risk=Math.abs(entry-stop)/entry*size;return risk>0?pnl/risk:null;}
function theoR(t){const entry=+t.entry,stop=+t.stop;if(!(entry>0)||!(stop>0)||stop===entry)return null;
  const dir=t.dir==='short'?-1:1;let exit=+t.hindsightExit||+t.exit||0;
  if(!exit&&Array.isArray(t.tps)&&t.tps.length){exit=+((t.tps[t.tps.length-1]||{}).price)||0;}
  if(!exit)exit=+t.tp||0; if(!exit)return null;
  return +(((exit-entry)*dir)/Math.abs(entry-stop)).toFixed(2);}
function tradeROrNull(t){
  if(t&&isLive(t)&&(t.status==='closed'||t._geboekt)){const n=rNetto(t);if(n!=null&&Math.abs(n)<=R_SANE_MAX)return n;}
  const r=+t.r;if(r&&Math.abs(r)<=R_SANE_MAX)return r;const th=theoR(t);return (th==null||!isFinite(th)||Math.abs(th)>R_SANE_MAX)?null:th;}
function aggR(rows){let sum=0,n=0,miss=0;(rows||[]).forEach(t=>{const r=tradeROrNull(t);if(r==null)miss++;else{sum+=r;n++;}});return {sum,n,miss};}
function gemR(rows){const a=aggR(rows);return {avg:a.n?a.sum/a.n:0,n:a.n,miss:a.miss};}
function aggOf(list){const wins=list.filter(t=>t.pnl>0),losses=list.filter(t=>t.pnl<0),net=list.reduce((s,t)=>s+t.pnl,0),gW=wins.reduce((s,t)=>s+t.pnl,0),gL=Math.abs(losses.reduce((s,t)=>s+t.pnl,0)),n=list.length||1;return {net,wr:wins.length/n*100,pf:gL?gW/gL:(gW>0?PF_ONEINDIG:0),exp:net/n,...(g=>({avgR:g.avg,rN:g.n,rMiss:g.miss}))(gemR(list)),n:list.length};}
const rS=v=>{const a=Math.abs(+v||0);return (v<0?'−':'+')+a.toFixed(a>0&&a<1?2:1).replace('.',',')+'R';};

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const pfS=v=>v>=PF_ONEINDIG?'∞':nl(v,1);
const usd=v=>(v<0?'−$':'+$')+Math.abs(v).toFixed(0);
function datumLang(iso){const d=new Date(iso+'T12:00:00Z');return DAGEN[d.getUTCDay()]+' '+d.getUTCDate()+' '+MAANDEN[d.getUTCMonth()];}
function datumKort(iso){const d=new Date(iso+'T12:00:00Z');return DAGEN[d.getUTCDay()].slice(0,2)+' '+d.getUTCDate()+'-'+(d.getUTCMonth()+1);}
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function rng(seed){let h=2166136261;for(const c of seed)h=Math.imul(h^c.charCodeAt(0),16777619);return ()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return ((h>>>0)%10000)/10000;};}
const tagKind=g=>TAGS.setupTags.includes(g)?'set':'conf';

// ───────────────────────── edge (blok A) ─────────────────────────
// Eisen van een scenario: geërfde lagen (week → dag, min uitgezette chips) + eigen entry-laag.
function reqsOf(sc){
  const out=[],seen={};
  const add=(L,from)=>{[...L.setups.map(g=>[g,'setup']),...L.confirmations.map(g=>[g,'conf'])].forEach(([tag,kind])=>{
    const key=L.tf+'|'+tag;if(seen[key])return;if(from!=='scenario'&&sc.excl[key])return;seen[key]=1;out.push({tf:L.tf,tag,kind,from,key});});};
  S.week.layers.forEach(L=>add(L,'week'));S.day.layers.forEach(L=>add(L,'dag'));add(sc.layer,'scenario');
  return out;
}
function hasTag(t,r){return (t.layers||[]).some(L=>L.timeframe===r.tf&&((L.setups||[]).includes(r.tag)||(L.confirmations||[]).includes(r.tag)));}
// minst specifiek eerst: hoogste tijdframe; binnen één tijdframe eerst confirmations, dan setups
const dropOrder=(a,b)=>TF_ORDER.indexOf(a.tf)-TF_ORDER.indexOf(b.tf)||(a.kind==='conf'?-1:1)-(b.kind==='conf'?-1:1);
const recent=(a,b)=>(b.date+b.time).localeCompare(a.date+a.time);
function statsOf(list){
  if(!list.length)return {n:0};
  const a=aggOf(list),last=[...list].sort(recent).slice(0,10);
  return {n:a.n,wr:a.wr,avgR:a.avgR,rN:a.rN,rMiss:a.rMiss,pf:a.pf,exp:a.exp,last};
}
const relOf=n=>n>=REL_GENOEG?'genoeg':n>=REL_REDELIJK?'redelijk':'weinig';
const EDGE_CACHE=new Map();
function edgeOf(sc){
  const all=reqsOf(sc),sig=sc.pb+'#'+all.map(r=>r.key).join(',');
  if(EDGE_CACHE.has(sig))return EDGE_CACHE.get(sig);
  const ctx=all.filter(r=>!TRADE_TFS.has(r.tf));          // Weekly/Daily: komen niet voor op trades
  let reqs=all.filter(r=>TRADE_TFS.has(r.tf));
  const base=TR.filter(t=>t.setup===sc.pb&&t.status==='closed');
  const match=rs=>base.filter(t=>rs.every(r=>hasTag(t,r)));
  const telt=m=>m.filter(t=>t.kind!=='gemist').length;
  let m=match(reqs);const dropped=[],queue=[...reqs].sort(dropOrder);
  while(telt(m)<MIN_N&&queue.length){const d=queue.shift();reqs=reqs.filter(r=>r!==d);dropped.push(d);m=match(reqs);}
  const live=m.filter(t=>isLive(t)),bt=m.filter(t=>t.kind==='backtest'||t.kind==='paper'),gem=m.filter(t=>t.kind==='gemist');
  const L=statsOf(live),B=statsOf(bt),gR=aggR(gem);
  const basis=L.n>=RANK_LIVE_MIN?'live':'bt',bs=basis==='live'?L:B;
  const res={reqs,ctx,dropped,live:L,bt:B,gem:{n:gem.length,sumR:gR.sum},basis,score:bs.n&&bs.rN?bs.avgR:null,n:telt(m),rel:relOf(bs.n||0)};
  EDGE_CACHE.set(sig,res);return res;
}
function ranking(list){
  const r=list.map(sc=>({sc,e:edgeOf(sc)})).sort((a,b)=>(b.e.score??-1e9)-(a.e.score??-1e9));
  r.forEach((x,i)=>{x.rank=i+1;x.sterkste=i===0&&x.e.score!=null&&x.e.score>0;});return r;
}
function dotsH(last){if(!last||!last.length)return '';
  return '<span class="dots" title="laatste '+last.length+', nieuwste links">'+last.map(t=>t.pnl>0?'<span class="w">●</span>':t.pnl<0?'<span class="l">○</span>':'<span class="b">◌</span>').join('')+'</span>';}
function relH(rel){return `<span class="rel ${rel}">${rel==='weinig'?'weinig data':rel==='redelijk'?'redelijk wat data':'genoeg data'}</span>`;}
const rH=v=>`<span class="${v>0?'pos':v<0?'neg':''}">${rS(v)}</span>`;
function avgRH(s){return s.rN?rH(s.avgR):'<span class="faint" title="geen trades met stop">–</span>';}
function dropNote(e){
  const p=[];
  if(e.dropped.length)p.push(`op basis van <b>${e.n} trades</b>, zonder <i>${e.dropped.map(r=>r.tf+' '+esc(r.tag)).join('</i>, <i>')}</i>`);
  return p.length?`<div class="enote">${p.join(' · ')}</div>`:'';
}
// één keer per scherm i.p.v. op elke kaart
const ctxNote=()=>'<div class="inhnote" style="flex-basis:100%">Weekly/Daily sturen je bias, maar tellen niet mee in de edge: je trades hebben die lagen niet.</div>';
function gemNote(e){return e.gem.n?`<div class="enote">👻 ${e.gem.n}× gemist, samen ${rH(e.gem.sumR)} <span class="faint">· telt niet mee</span></div>`:'';}
// één regel, zoals in het ontwerp: "Live 23 · 61% · +1,4R · Backtest 40 · 55% · +1,1R"
function edgeLine(e){
  if(!e.live.n&&!e.bt.n)return '<span class="faint">Nog geen trades met deze combinatie.</span>';
  const p=(lbl,s)=>s.n?`${lbl} ${s.n} · ${pct(s.wr)} · ${avgRH(s)}`:`${lbl} –`;
  return p('Live',e.live)+' <span class="faint">|</span> '+p('Backtest',e.bt);
}
function edgeBoxes(e){
  if(!e.live.n&&!e.bt.n)return '<div class="enote">Nog geen trades met deze combinatie.</div>';
  const box=(k,s,key)=>`<div class="ebox ${e.basis===key?'basis':''}"><div class="k"><span>${k}</span><span>${s.n||0}</span></div>`+
    (s.n?`<div class="big">${avgRH(s)}</div><div class="sub">${pct(s.wr)} win · PF ${pfS(s.pf)}</div><div style="margin-top:3px">${dotsH(s.last)}</div>`:'<div class="big faint">–</div><div class="sub">geen trades</div>')+'</div>';
  return `<div class="edge2">${box('Live',e.live,'live')}${box('Backtest',e.bt,'bt')}</div>`;
}
function edgeTable(e){
  if(!e.live.n&&!e.bt.n)return '<div class="enote">Nog geen trades met deze combinatie.</div>';
  const col=s=>s.n?[s.n,pct(s.wr),avgRH(s),usd(s.exp),pfS(s.pf),dotsH(s.last)]:[0,'–','–','–','–',''];
  const L=col(e.live),B=col(e.bt),rows=['Trades','Winrate','Gem. R (= expectancy in R)','Expectancy / trade','Profit factor','Laatste 10'];
  return `<table class="etable"><tr><th></th><th>Live${e.basis==='live'?' ★':''}</th><th>Backtest${e.basis==='bt'?' ★':''}</th></tr>`+
    rows.map((r,i)=>`<tr><td>${r}</td><td>${L[i]}</td><td>${B[i]}</td></tr>`).join('')+'</table>';
}
function basisNote(e){return `<span class="faint small">gerangschikt op ${e.basis==='live'?'Live':'Backtest (minder dan 10 Live)'}</span>`;}

// ───────────────────────── demo-data ─────────────────────────
function buildData(){
  TAGS=D.tagConfig;PB=D.pbook;TRADE_TFS=new Set(TAGS.timeframeTags);
  TR=D.trades.map(t=>Object.assign({},t,{pnl:+t.pnl||0}));
  // De dataset heeft (nog) geen gemiste trades. Voor de demo: elke 14e gesloten live-trade krijgt een
  // gemiste tweeling (kind 'gemist'), zodat de "6× gemist, samen +8R"-regel iets laat zien.
  TR.filter(t=>isLive(t)&&t.status==='closed').forEach((t,i)=>{if(i%14===7)TR.push(Object.assign({},t,{id:'g'+t.id,kind:'gemist',r:theoR(t)}));});
  buildHist();
}
const LESSEN=['Te vroeg in vóór de 15M-close — wacht de close af.','Goede dag: alleen A-setups en na de TP gestopt.','Scenario 2 was te ruim; ongeldig-regel scherper maken.','Twee trades buiten plan na de eerste winst. Niet doen.'];
function buildHist(){
  const live=TR.filter(t=>isLive(t)&&t.status==='closed'&&t.date<TODAY);
  const dates=[...new Set(live.map(t=>t.date))].sort().slice(-10);
  const pbs=Object.keys(PB),pairs=['BTC/USDT','ETH/USDT','SOL/USDT','ARB/USDT','AVAX/USDT'];
  S.hist=dates.reverse().map((date,di)=>{
    const R=rng(date),sc=[],buiten=[];
    live.filter(t=>t.date===date).forEach(t=>{
      // A/B-trades horen meestal bij een scenario, C-trades meestal niet: dat is het verschil dat blok D moet tonen
      if(R()<(t.grade==='C'?0.25:0.8))sc.push(mkScen({title:t.setup+' '+t.pair.split('/')[0],pair:t.pair,dir:t.dir,pb:t.setup,grade:t.grade,status:'genomen',trade:t}));
      else buiten.push(t);});
    const extra=1+Math.floor(R()*2);
    for(let k=0;k<extra;k++){const st=['gemist','niet','ongeldig','niet','gemist'][Math.floor(R()*5)],pb=pbs[Math.floor(R()*pbs.length)],pair=pairs[Math.floor(R()*pairs.length)];
      sc.push(mkScen({title:pb+' '+pair.split('/')[0],pair,dir:R()<.6?'long':'short',pb,grade:['A','B','B','C'][Math.floor(R()*4)],status:st,missR:st==='gemist'?[2.4,1.2,-1,3.1,0.8,1.9][Math.floor(R()*6)]:null}));}
    return {date,mental:2+Math.floor(R()*4),scen:sc,buiten,les:di%3===0?LESSEN[(di/3)%LESSEN.length]:''};
  });
  S.weekLes='';
}
function allDays(){return [{date:TODAY,mental:S.day.mental,scen:S.scen,buiten:[],les:S.day.les,today:true},...S.hist];}
function scR(sc){return sc.status==='genomen'&&sc.trade?tradeROrNull(sc.trade):sc.status==='gemist'?sc.missR:null;}

// ───────────────────────── blok D ─────────────────────────
function blokD(days){
  const sc=days.flatMap(d=>d.scen),beslist=sc.filter(s=>s.status!=='open');
  const gen=sc.filter(s=>s.status==='genomen'),gem=sc.filter(s=>s.status==='gemist'),niet=sc.filter(s=>s.status==='niet'),ong=sc.filter(s=>s.status==='ongeldig');
  const uit=gen.length+gem.length;
  const binnen=gen.map(s=>s.trade).filter(Boolean),buiten=days.flatMap(d=>d.buiten);
  return {n:sc.length,beslist:beslist.length,open:sc.length-beslist.length,gen:gen.length,gem:gem.length,niet:niet.length,ong:ong.length,uit,
    pUit:beslist.length?uit/beslist.length*100:null,pNeem:uit?gen.length/uit*100:null,gemR:gem.reduce((s,x)=>s+(x.missR||0),0),
    binnen:{...gemR(binnen),wr:binnen.length?binnen.filter(t=>t.pnl>0).length/binnen.length*100:0,cnt:binnen.length},
    buiten:{...gemR(buiten),wr:buiten.length?buiten.filter(t=>t.pnl>0).length/buiten.length*100:0,cnt:buiten.length}};
}
function scoreSentence(b){
  if(!b.beslist)return 'Nog geen afgeronde scenario\'s. Zet na de sessie per scenario de status, dan komt hier je voorspel-score.';
  return `Je scenario's komen in <b>${pct(b.pUit)}</b> uit. Daarvan neem je <b>${b.pNeem==null?'–':pct(b.pNeem)}</b>.`+
    (b.gem?` De gemiste waren samen <b class="${b.gemR>=0?'pos':'neg'}">${rS(b.gemR)}</b>.`:'');
}
function planVsH(b){
  const box=(k,x,cls)=>`<div class="ebox ${cls}"><div class="k"><span>${k}</span><span>${x.cnt} trades</span></div><div class="big">${x.n?rH(x.avg):'<span class="faint">–</span>'}</div><div class="sub">gem. R · ${x.cnt?pct(x.wr)+' win':'–'}</div></div>`;
  return `<div class="edge2">${box('Binnen plan',b.binnen,'basis')}${box('Buiten plan',b.buiten,'')}</div>`;
}

function chipH(tag,opts={}){
  const k=tagKind(tag);
  if(opts.inh)return `<span class="chip ${k} inh ${opts.off?'off':''}" ${opts.act||''} title="${opts.title||'geërfd'}">↑ ${esc(tag)}</span>`;
  return `<span class="chip ${k}">${esc(tag)}${opts.rm?` <button class="x" ${opts.rm} aria-label="verwijder">×</button>`:''}</span>`;
}
function biasSeg(path,val){return `<span class="seg sm">${['Bullish','Bearish','Neutraal'].map(b=>`<button class="${val===b?'on':''}" data-a="bias" data-p="${path}" data-v="${b}">${b==='Neutraal'?'Neutr.':b}</button>`).join('')}</span>`;}

  const dr=draftOf(i);return (dr||findScen(i)).layer;}

function draftOf(id){const M=S.modal,dr=M&&(M.draft||(M.back&&M.back.draft));return dr&&dr.id===id?dr:null;}

function mentalH(){return `<span class="mental">${[1,2,3,4,5].map(n=>`<button class="${S.day.mental===n?'on':''}" data-a="mental" data-v="${n}">${n}</button>`).join('')}</span>`;}
function levelsH(list,path){return list.map((l,i)=>{const [p,...r]=l.split(' · ');return `<div class="lvl"><span class="p">${esc(p)}</span><span class="muted">${esc(r.join(' · '))}</span>${path?`<button class="x faint" style="margin-left:auto" data-a="rmlvl" data-p="${path}" data-v="${i}" aria-label="verwijder">×</button>`:''}</div>`;}).join('');}
function lvlAdd(path){return `<div class="row" style="margin-top:6px;flex-wrap:nowrap"><input class="inp" id="lvl-${path}" placeholder="bv. BTC 76.200 · Asia-low" style="padding:6px 9px;font-size:12.5px"><button class="btn sm" data-a="addlvl" data-p="${path}">+</button></div>`;}

function edgeSentence(e){
  if(!e.live.n&&!e.bt.n)return 'Nog geen trades met deze combinatie. Dit scenario is een gok tot je data hebt.';

  return t;
}

}

      ${S.settings.risk[sc.grade]?'':'<div class="callout warn" style="margin-bottom:12px">Grade C staat in je instellingen op <b>niet traden</b>.</div>'}
      <dl class="kv"><dt>Pair</dt><dd>${esc(sc.pair)}</dd><dt>Richting</dt><dd><span class="dir ${sc.dir}">${sc.dir}</span></dd><dt>Playbook</dt><dd>${esc(sc.pb)}</dd>
      <dt>Grade</dt><dd><span class="grade ${sc.grade}">${sc.grade}</span> <span class="muted small">${S.settings.risk[sc.grade]?nl(S.settings.risk[sc.grade],1)+'% risico':''}</span></dd>
      <dt>Lagen</dt><dd>${lagen.map(L=>`<div style="margin-bottom:5px"><span class="num small">${L.tf}</span> <span class="bias ${L.bias}">${L.bias}</span> ${[...L.setups,...L.confirmations].map(g=>chipH(g)).join(' ')}</div>`).join('')}
        ${unch.length?`<div class="faint small">Niet afgevinkt, gaat niet mee: ${unch.map(esc).join(', ')}</div>`:''}</dd>
      <dt>Stop</dt><dd class="num">${esc(sc.stop)||'–'}</dd><dt>TP's</dt><dd class="num">${sc.tps.map(esc).join(' · ')||'–'}</dd>
      <dt>Soort</dt><dd>${ex?'Live (exchange)':'Kies in het formulier: live, backtest of paper'}</dd></dl>`;
    f=`<button class="btn" data-a="close">Annuleer</button><button class="btn pri" data-a="doConvert">${ex?'Zet op genomen':'Open tradeformulier'}</button>`;
  } else if(M.type==='settings'){
    const s=M.draft;t='Instellingen';
    h=`<h3 style="margin-bottom:6px">Risico per grade</h3><div class="three" style="grid-template-columns:repeat(3,1fr)">${['A','B','C'].map(g=>`<div><label class="f">Grade ${g} (%)</label><input class="inp num" type="number" step="0.25" min="0" data-f="draft.risk.${g}" value="${s.risk[g]}"></div>`).join('')}</div>
      <div class="enote">0% = niet traden. Dit vervangt de poort: het scenario is de check, de grade bepaalt de size.</div>
      <h3 style="margin:16px 0 6px">Pre-flight (hooguit 3)</h3>${s.preflight.map((p,i)=>`<input class="inp" style="margin-bottom:6px" data-f="draft.preflight.${i}" value="${esc(p)}">`).join('')}`;
    f=`<button class="btn" data-a="close">Annuleer</button><button class="btn pri" data-a="saveSettings">Bewaar</button>`;
  } else if(M.type==='picker'){
    const L=layerRef(M.path),has=g=>L.setups.includes(g)||L.confirmations.includes(g);
    t='Tags · '+L.tf;
    const grp=(lbl,list)=>`<h3 style="margin:4px 0 6px">${lbl}</h3><div class="row" style="gap:6px;margin-bottom:12px">${list.map(g=>`<button class="chip pick ${has(g)?'on':''}" data-a="pick" data-v="${esc(g)}">${has(g)?'✓ ':''}${esc(g)}</button>`).join('')}</div>`;
    h=grp('Setups',TAGS.setupTags)+grp('Confirmations',TAGS.confirmationTags)+
      `<h3 style="margin:4px 0 6px">Ontbreekt er een?</h3><div class="row" style="flex-wrap:nowrap"><input class="inp" id="newtag" placeholder="Nieuwe tag"><select class="inp" id="newkind" style="width:auto"><option value="conf">Confirmation</option><option value="set">Setup</option></select><button class="btn" data-a="newtag">+</button></div>
       <div class="enote">Komt ook in de taglijst van je journal. Geen vrije tekst: alleen tags die je trades ook kunnen hebben.</div>`;
    f=`<button class="btn pri" data-a="close">Klaar</button>`;
  } else if(M.type==='edit'){
    const d=M.draft,e=edgeOf(d);t=M.isNew?'Nieuw scenario':'Scenario bewerken';
    h=`<div class="fgrid">
      <div class="full"><label class="f">Titel</label><input class="inp" data-f="draft.title" value="${esc(d.title)}" placeholder="bv. BTC London sweep"></div>
      <div><label class="f">Playbook</label><select class="inp" data-f="draft.pb" data-rerender="1"><option value="">Kies…</option>${Object.keys(PB).map(p=>`<option ${d.pb===p?'selected':''}>${esc(p)}</option>`).join('')}</select></div>
      <div><label class="f">Pair</label><input class="inp" data-f="draft.pair" value="${esc(d.pair)}"></div>
      <div><label class="f">Richting</label><span class="seg" style="display:flex">${['long','short'].map(x=>`<button style="flex:1" class="${d.dir===x?'on':''}" data-a="dset" data-p="dir" data-v="${x}">${cap(x)}</button>`).join('')}</span></div>
      <div><label class="f">Grade</label><span class="seg" style="display:flex">${['A','B','C'].map(x=>`<button style="flex:1" class="${d.grade===x?'on':''}" data-a="dset" data-p="grade" data-v="${x}">${x}</button>`).join('')}</span></div>
      <div class="full"><label class="f">Trigger</label><input class="inp" data-f="draft.trigger" value="${esc(d.trigger)}" placeholder="Als…"></div>
      <div class="full"><label class="f">Ongeldig als</label><input class="inp" data-f="draft.invalid" value="${esc(d.invalid)}" placeholder="één regel"></div>
      <div class="full"><label class="f">Geërfd van week en dag <span class="faint">(tik om uit te zetten)</span></label><div class="row" style="gap:5px">${inhChips(d)}</div></div>
      <div class="full"><label class="f">Entry-laag</label><div class="row" style="gap:6px;margin-bottom:4px"><select class="inp" style="width:auto" data-f="draft.layer.tf" data-rerender="1">${['4H','1H','30M','15M','5M'].map(x=>`<option ${d.layer.tf===x?'selected':''}>${x}</option>`).join('')}</select></div>${layerEdit('scen.'+d.id,d.layer)}</div>
      <div><label class="f">Stop <span class="faint">(optioneel)</span></label><input class="inp num" data-f="draft.stop" value="${esc(d.stop)}"></div>
      <div><label class="f">TP's <span class="faint">(optioneel, komma = decimaal, spatie scheidt)</span></label><input class="inp num" data-f="draft.tpsTxt" value="${esc(d.tps.join(' '))}"></div>
      <div class="full"><label class="f">Chart / TradingView-link <span class="faint">(optioneel)</span></label><input class="inp" data-f="draft.tv" value="${esc(d.tv)}" placeholder="https://"></div>
      <div class="full"><label class="f">Notitie</label><textarea class="inp" data-f="draft.note">${esc(d.note)}</textarea></div>
      <div class="full card pad" style="background:var(--sink)"><div class="row between"><h3>Edge van deze combinatie</h3>${d.pb?relH(e.rel):''}</div><div style="margin-top:6px">${d.pb?edgeLine(e)+dropNote(e)+gemNote(e):'<span class="faint small">Kies een playbook.</span>'}</div></div>
    </div>`;
    f=`${M.isNew?'':'<button class="btn" style="margin-right:auto;color:var(--red)" data-a="delScen">Verwijder</button>'}<button class="btn" data-a="close">Annuleer</button><button class="btn pri" data-a="saveScen">Bewaar</button>`;
  }
  return `<div class="ov" data-a="ovclose"><div class="modal" role="dialog" aria-label="${esc(t)}"><div class="mh"><h2>${esc(t)}</h2><button class="ibtn" data-a="close" aria-label="sluit">✕</button></div><div class="mb">${h}</div><div class="mf">${f}</div></div></div>`;
}

// ───────────────────────── render ─────────────────────────
const LOGO=`<svg class="logo" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B5BD9"/><stop offset="1" stop-color="#8A5CF0"/></linearGradient></defs><polygon points="32,4 57,18.5 57,45.5 32,60 7,45.5 7,18.5" fill="url(#g)" stroke="url(#g)" stroke-width="6" stroke-linejoin="round"/><text x="33" y="42" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="800" letter-spacing="-1.5" text-anchor="middle" fill="#fff">SJ</text></svg>`;
function renderTop(){
  const dark=document.body.classList.contains('dark');
  document.getElementById('top').innerHTML=`
    <div class="brand">${LOGO}<div><b>Trading Plan</b><span>v3-prototype · door Zaratras</span></div></div>
    <div class="tools">${S.tab==='dag'?`<span class="varlbl">Dag-variant</span><span class="seg" role="group" aria-label="Dag-variant">${[['A','A · Kaarten'],['B','B · Cockpit'],['C','C · Flow']].map(([k,l])=>`<button class="${S.variant===k?'on':''}" data-a="variant" data-v="${k}">${l}</button>`).join('')}</span>`:''}
      <button class="ibtn" data-a="theme" aria-label="thema">${dark?'☀':'☾'}</button><button class="ibtn" data-a="settings" aria-label="instellingen">⚙</button></div>
    <nav class="tabs">${[['week','Week'],['dag','Dag'],['afsluiting','Afsluiting'],['log','Log']].map(([k,l])=>`<button class="${S.tab===k?'on':''}" data-a="tab" data-v="${k}">${l}</button>`).join('')}</nav>`;
}
function render(){
  renderTop();
  const app=document.getElementById('app');
  if(!D){return;}
  let h='';
  if(S.tab==='dag'){
    const pfOk=S.day.pre.filter(Boolean).length;
    h=`<div class="pagehead"><div><h1>${cap(datumLang(S.day.date))}</h1><p>Week ${S.week.id.slice(-2)} · ${S.scen.length} scenario's · pre-flight ${pfOk}/3</p></div>
      <span class="small muted">${esc(S.week.focus)}</span></div>`+(S.variant==='A'?dagA():S.variant==='B'?dagB():dagC());
  } else if(S.tab==='week')h=weekView();
  else if(S.tab==='afsluiting')h=afslView();
  else h=logView();
  h+=`<div class="demo-note">Prototype op de demo-dataset (${TR.filter(t=>t.kind!=='gemist').length} trades). Gemiste trades en de Log-historie zijn voor de demo nagemaakt. Niets wordt opgeslagen.</div>`;
  app.innerHTML=h;
  document.getElementById('modal').innerHTML=modalH()+(S.toast?`<div class="toast">${esc(S.toast)}</div>`:'');
}
function toast(m){S.toast=m;render();clearTimeout(toast.t);toast.t=setTimeout(()=>{S.toast='';render();},2600);}

// ───────────────────────── acties ─────────────────────────
const tagNorm=s=>s.trim().replace(/\s+/g,' ');
function toggleTag(L,g){
  const arr=tagKind(g)==='set'?L.setups:L.confirmations,i=arr.indexOf(g);
  if(i>=0)arr.splice(i,1);else arr.push(g);
}
function prefillFromPb(d){const p=PB[d.pb];if(!p)return;const L=p.layers[p.layers.length-1];
  d.layer={tf:L.timeframe,bias:d.dir==='short'?'Bearish':L.bias,setups:L.setups.slice(0,1),confirmations:[...L.confirmations]};d.grade=p.defaultGrade||d.grade;d.checked={};}
const A={
  tab:(el)=>{S.tab=el.dataset.v;S.modal=null;window.scrollTo(0,0);},
  variant:el=>{S.variant=el.dataset.v;},
  theme:()=>{document.body.classList.toggle('dark');},
  settings:()=>{S.modal={type:'settings',draft:JSON.parse(JSON.stringify(S.settings))};},
  saveSettings:()=>{S.settings=S.modal.draft;S.modal=null;},
  close:()=>{S.modal=S.modal&&S.modal.back?S.modal.back:null;},   // picker vanuit het formulier: terug naar het formulier
  ovclose:(el,ev)=>{if(ev.target===el)S.modal=null;else return false;},
  ctx:()=>{S.ctxOpen=!S.ctxOpen;},
  pre:el=>{const i=+el.dataset.v;S.day.pre[i]=!S.day.pre[i];},
  mental:el=>{const n=+el.dataset.v;S.day.mental=S.day.mental===n?null:n;},
  bias:el=>{layerRef(el.dataset.p).bias=el.dataset.v;},
  rmtag:el=>{toggleTag(layerRef(el.dataset.p),el.dataset.v);EDGE_CACHE.clear();},
  picker:el=>{const back=S.modal&&S.modal.type==='edit'?S.modal:null;S.modal={type:'picker',path:el.dataset.p,back};},
  pick:el=>{toggleTag(layerRef(S.modal.path),el.dataset.v);EDGE_CACHE.clear();},
  newtag:()=>{const g=tagNorm(document.getElementById('newtag').value||''),k=document.getElementById('newkind').value;if(!g)return;
    const list=k==='set'?TAGS.setupTags:TAGS.confirmationTags;if(!TAGS.setupTags.includes(g)&&!TAGS.confirmationTags.includes(g))list.push(g);
    toggleTag(layerRef(S.modal.path),g);EDGE_CACHE.clear();},
  excl:el=>{const sc=draftOf(el.dataset.s)||findScen(el.dataset.s);if(!sc)return;const k=el.dataset.v;if(sc.excl[k])delete sc.excl[k];else sc.excl[k]=true;},
  chk:el=>{const sc=findScen(el.dataset.s);sc.checked[el.dataset.v]=!sc.checked[el.dataset.v];},
  status:el=>{const sc=findScen(el.dataset.s);sc.status=el.dataset.v;},
  toggle:el=>{const id=el.dataset.s;S.open[id]=!S.open[id];},
  convert:el=>{S.modal={type:'convert',id:el.dataset.s,acc:'ex'};},
  acc:el=>{S.modal.acc=el.dataset.v;},
  doConvert:()=>{const sc=findScen(S.modal.id),ex=S.modal.acc!=='hand';sc.status='genomen';S.modal=null;
    toast(ex?'Op genomen gezet · wacht op de trade van de exchange':'Demo: hier opent het tradeformulier van de journal');return false;},
  edit:el=>{const sc=findScen(el.dataset.s);S.modal={type:'edit',id:sc.id,draft:JSON.parse(JSON.stringify(sc))};},
  new:()=>{const d=mkScen({});d.layer.bias=S.day.layers[S.day.layers.length-1].bias;S.modal={type:'edit',isNew:true,draft:d};},
  dset:el=>{S.modal.draft[el.dataset.p]=el.dataset.v;},
  saveScen:()=>{const d=S.modal.draft;if(!d.title)d.title=(d.pb||'Scenario')+' '+d.pair.split('/')[0];
    if(S.modal.isNew)S.scen.push(d);else{const i=S.scen.findIndex(s=>s.id===d.id);if(i>=0)S.scen[i]=d;}EDGE_CACHE.clear();S.modal=null;},
  delScen:()=>{S.scen=S.scen.filter(s=>s.id!==S.modal.draft.id);S.modal=null;},
  addlvl:el=>{const p=el.dataset.p,inp=document.getElementById('lvl-'+p),v=(inp.value||'').trim();if(!v)return;(p==='week'?S.week:S.day).levels.push(v);},
  rmlvl:el=>{(el.dataset.p==='week'?S.week:S.day).levels.splice(+el.dataset.v,1);},
  afsl:el=>{S.afsl=el.dataset.v;},
  afslDag:el=>{S.afslDag=el.dataset.v;},
  logEdit:el=>{S.logEdit=S.logEdit===el.dataset.s?null:el.dataset.s;},
  logReset:()=>{S.logF={status:'',pb:'',dir:''};},
};
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-a]');if(!el)return;
  const fn=A[el.dataset.a];if(!fn)return;
  if(el.tagName==='A')ev.preventDefault();
  if(fn(el,ev)===false)return;
  render();
});
document.addEventListener('input',ev=>{
  const el=ev.target,f=el.dataset&&el.dataset.f;if(!f)return;
  if(f.startsWith('les:')){const d=allDays().find(x=>x.date===f.slice(4));if(d){if(d.today)S.day.les=el.value;else d.les=el.value;}return;}
  if(f==='draft.tpsTxt'){S.modal.draft.tps=el.value.split(/\s+/).filter(Boolean);return;}
  const parts=f.split('.');let o=parts[0]==='draft'?S.modal.draft:S;const p=parts[0]==='draft'?parts.slice(1):parts;
  for(let i=0;i<p.length-1;i++)o=o[p[i]];
  const k=p[p.length-1];o[k]=el.type==='number'?+el.value:el.value;
  if(f==='draft.pb')prefillFromPb(S.modal.draft);
  if(el.dataset.rerender||el.tagName==='SELECT'){EDGE_CACHE.clear();render();}
});

// ───────────────────────── start ─────────────────────────
(function init(){
  const q=new URLSearchParams(location.search);
  if(q.get('theme')==='dark'||(!q.get('theme')&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches))document.body.classList.add('dark');
  if(q.get('tab'))S.tab=q.get('tab');if(q.get('v'))S.variant=q.get('v').toUpperCase();
  render();
  fetch('../site/demo-dataset.json').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(j=>{D=j;buildData();
    if(q.get('open'))S.open[S.scen[0].id]=true;render();})
    .catch(e=>{document.getElementById('app').innerHTML=`<div class="card empty" style="margin-top:20px"><b>Kon de demo-dataset niet laden</b>${esc(e.message)}. Serveer de repo-root via een lokale server en open <code>/demos/plan-v3-demo.html</code>.</div>`;});
})();
</script>
</body>
</html>
