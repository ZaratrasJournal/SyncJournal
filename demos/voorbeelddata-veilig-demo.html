<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voorbeelddata veilig — demo</title>
<style>
/* Tokens copied from work/syncjournal.html (:root and body.dark) so the prototype looks like the app. */
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --raise:#FBFCFE; --sink:#F7F9FC;
  --ink:#191E2A; --ink2:#525A6B; --muted:#6B7385; --faint:#7A8291;
  --line:#E8EBF2; --line2:#F0F2F7;
  --accent:#3B5BD9; --accent-soft:#EDF0FD; --accent-line:#CDD6F7;
  --green:#12946A; --green-soft:#E3F4EC; --red:#D64259; --red-soft:#FBE8EC; --amber:#C0821C; --amber-soft:#F8EFDD;
  --track:#EEF1F6;
  --fb:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --fd:'Plus Jakarta Sans',var(--fb); --fn:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --sh:0 1px 2px rgba(20,30,60,.05); --shl:0 12px 40px -12px rgba(20,30,60,.28);
}
body.dark{
  --bg:#0E1218; --surface:#141A22; --raise:#171E28; --sink:#10151c;
  --ink:#F4F7FB; --ink2:#C7CFDB; --muted:#939CAC; --faint:#6C7583;
  --line:#232B36; --line2:#1C232D;
  --accent:#6E86F0; --accent-soft:#1B2436; --accent-line:#2E3B57;
  --green:#37C48B; --green-soft:#12261F; --red:#F0637A; --red-soft:#2A1820; --amber:#E0A63C; --amber-soft:#28210F;
  --track:#1E2732;
  --sh:0 1px 2px rgba(0,0,0,.25); --shl:0 12px 40px -12px rgba(0,0,0,.6);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--fd);letter-spacing:-.01em}
.num{font-family:var(--fn);font-variant-numeric:tabular-nums}
.g{color:var(--green)} .r{color:var(--red)}
a{color:var(--accent)}

/* ── demo chrome (not part of the app) ── */
.ctl{position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.ctl .grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ctl .lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--sink)}
.seg button{padding:5px 10px;font-size:12.5px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface);font-weight:600}
.cap{padding:10px 16px;font-size:13px;color:var(--ink2);border-bottom:1px solid var(--line2);background:var(--raise)}
.cap b{color:var(--ink)}
.cap .stap{display:inline-block;font-family:var(--fn);font-size:11px;padding:1px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);margin-right:6px}
.stage{max-width:1180px;margin:18px auto 40px;padding:0 16px}
.frame{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg);box-shadow:var(--shl);position:relative;min-height:560px}
.url{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--sink);border-bottom:1px solid var(--line);font-family:var(--fn);font-size:12px;color:var(--muted);min-width:0}
.url span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.url .dots{display:flex;gap:5px;flex:none}
.url .dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}

/* ── buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:13.5px;text-decoration:none}
.btn:hover{border-color:var(--accent-line)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.big{padding:13px 20px;font-size:15px}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 35%,var(--line))}
.btn:disabled{opacity:.5}
.linklike{color:var(--accent);text-decoration:underline;text-underline-offset:2px;font-weight:500}

/* ── landing ── */
.land{padding:56px 28px 64px;text-align:center}
.land .logo{font-family:var(--fd);font-weight:800;font-size:15px;color:var(--ink2);margin-bottom:28px}
.land .logo span,.side .logo span{color:var(--accent)}
.land h1{font-size:clamp(26px,5vw,40px);line-height:1.15;max-width:640px;margin:0 auto 12px}
.land p.sub{color:var(--ink2);max-width:520px;margin:0 auto 26px}
.cta{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.welkom{display:inline-block;font-size:12.5px;color:var(--muted);margin-bottom:14px;padding:3px 10px;border-radius:99px;background:var(--sink);border:1px solid var(--line2)}
.klein{margin-top:16px;font-size:13px;color:var(--muted)}
.klein .uitleg{display:block;font-size:12px;color:var(--faint);margin-top:2px}
.sub2{display:block;font-size:11.5px;font-weight:500;color:var(--muted)}

/* ── app shell ── */
.shell{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:520px}
.side{background:var(--surface);border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:2px}
.side .logo{font-family:var(--fd);font-weight:800;font-size:15px;padding:0 10px 14px}
.nav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:13.5px;text-align:left;width:100%}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav:hover{background:var(--sink)}
.side .sp{flex:1}
.syncbtn{margin:8px 4px 0;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;font-size:12.5px;text-align:left}
.syncbtn small{font-size:11px;color:var(--muted);font-weight:400}
.main{padding:20px 22px 28px;min-width:0}
.topline{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.topline h2{font-size:20px}
.topline .who{font-size:12.5px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.kpi .k{font-size:11.5px;color:var(--muted)}
.kpi .v{font-size:19px;font-weight:600;margin-top:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;min-width:0}
.panel h3{font-size:14px;margin-bottom:8px}
.curve{width:100%;height:120px;display:block}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;font-weight:600;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line2)}
.tbl td.n,.tbl th.n{text-align:right}
.empty{text-align:center;padding:46px 16px;color:var(--ink2)}
.empty h3{font-size:17px;margin-bottom:6px;color:var(--ink)}
.empty p{max-width:420px;margin:0 auto 16px;font-size:13.5px}
.setrow{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.setrow:last-child{border-bottom:none}
.setrow .txt{flex:1 1 260px;min-width:0}
.setrow .txt b{display:block;font-size:13.5px}
.setrow .txt small{display:block;color:var(--muted);font-size:12.5px}
.setrow.uit .txt b,.setrow.uit .txt small{color:var(--faint)}
.why{display:block;margin-top:3px;font-size:12px;color:var(--amber)}
.hl{outline:2px solid var(--accent-line);outline-offset:4px;border-radius:8px}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--sink);border:1px solid var(--line);color:var(--muted);font-weight:500}

/* ── banners ── */
.sandbar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;padding:9px 14px;background:var(--amber-soft);border-bottom:1px solid color-mix(in srgb,var(--amber) 40%,var(--line));color:var(--ink)}
.sandbar .t{font-size:13px;min-width:0}
.sandbar .t b{color:var(--amber)}
.sandbar .t span{color:var(--ink2)}
.info{padding:10px 14px;border-radius:10px;background:var(--accent-soft);border:1px solid var(--accent-line);font-size:13px;color:var(--ink);margin-bottom:12px}
.info.warn{background:var(--amber-soft);border-color:color-mix(in srgb,var(--amber) 40%,var(--line))}

/* ── dialogs ── */
.scrim{position:absolute;inset:0;background:color-mix(in srgb,var(--ink) 38%,transparent);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shl);width:100%;max-width:470px;padding:20px}
.dlg h3{font-size:17px;margin-bottom:6px}
.dlg p{font-size:13.5px;color:var(--ink2);margin-bottom:10px}
.dlg .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.dlg .acts .btn{flex:1 1 150px}
.dlg .gevaar{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.dlg .gevaar ul{margin:6px 0 10px 18px;font-size:12.5px;color:var(--ink2)}
.dlg .gevaar li{margin-bottom:3px}
/* imitation of a native browser confirm(): deliberately plain */
.native{background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shl);width:100%;max-width:440px;padding:16px 18px;font-family:system-ui,sans-serif;font-size:13px}
.native .host{font-weight:600;margin-bottom:8px}
.native p{white-space:pre-line;color:var(--ink);margin-bottom:14px}
.native .acts{display:flex;justify-content:flex-end;gap:8px}
.native button{padding:5px 14px;border-radius:4px;border:1px solid var(--line)}
.native button.ok{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:10px;font-size:13px;z-index:30;max-width:calc(100% - 32px);text-align:center}

/* ── phone ── */
@media (max-width:720px){
  .ctl{position:static}
  .stage{padding:0 8px;margin-top:10px}
  .frame{border-radius:10px;min-height:0}
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{flex-direction:row;flex-wrap:wrap;align-items:center;border-right:none;border-bottom:1px solid var(--line);padding:8px 10px;gap:4px}
  .side .logo{padding:0 8px 0 2px}
  .side .nav.opt{display:none}
  .side .nav{width:auto;padding:6px 9px}
  .side .sp{display:none}
  .syncbtn{margin:0;width:100%}
  .main{padding:14px 12px 20px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tbl .opt{display:none}
  .land{padding:36px 16px 44px}
}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Demo-instellingen">
  <div class="grp"><span class="lbl">Variant</span><div class="seg" id="segVar"></div></div>
  <div class="grp"><span class="lbl">Journal</span><div class="seg" id="segJ"></div></div>
  <div class="grp"><span class="lbl">Drive-backup</span><div class="seg" id="segD"></div></div>
  <div class="grp"><span class="lbl">Thema</span><div class="seg" id="segT"></div></div>
  <button class="btn" id="opnieuw" style="padding:5px 10px;font-size:12.5px">↺ Opnieuw</button>
</div>
<div class="cap" id="cap" aria-live="polite"></div>
<div class="stage"><div class="frame" id="frame"></div></div>

<script>
/* Static prototype: no storage, no network. All numbers are made up. */
const VARIANTEN={A:'A · Landing past zich aan',B:'B · Eigen keuzevenster',C:'C · Rondkijk-modus'};
const EIGEN={naam:'Zaratras',trades:214,pnl:3482.40,win:46,r:0.38,rows:[
  ['30-10','BTC','Long','+$184,20','+1,2R'],['29-10','BTC','Short','−$92,10','−1,0R'],['28-10','ETH','Long','+$61,75','+0,6R'],
  ['27-10','BTC','Long','+$240,00','+2,1R'],['24-10','SOL','Short','−$45,30','−0,5R']],pts:[0,4,3,8,7,12,10,15,19,17,22,26,24,29]};
const DEMO={naam:'Voorbeeld',trades:3000,pnl:12940.15,win:51,r:0.42,rows:[
  ['31-10','ETH','Long','+$412,00','+2,4R'],['31-10','BTC','Short','+$128,60','+0,9R'],['30-10','XRP','Long','−$110,00','−1,0R'],
  ['30-10','BTC','Long','+$305,10','+1,8R'],['29-10','SOL','Long','−$64,20','−0,6R']],pts:[0,3,6,5,9,14,13,18,22,21,27,31,30,36]};

const S={variant:'A',journal:'gevuld',drive:true,dark:false,
  scherm:'landing',  // landing | app
  data:'eigen',      // eigen | demo | leeg  (what the app shows)
  view:'dash',       // dash | data
  sandbox:false, modal:null, toast:'', hl:false, gesloten:false};

function reset(){Object.assign(S,{scherm:'landing',data:S.journal==='gevuld'?'eigen':'leeg',view:'dash',sandbox:false,modal:null,toast:'',hl:false});}

/* ── demo controls ── */
function seg(id,opts,cur,fn){const el=document.getElementById(id);
  el.innerHTML=opts.map(([v,l])=>`<button type="button" aria-pressed="${v===cur}" data-v="${v}">${l}</button>`).join('');
  el.onclick=e=>{const b=e.target.closest('button');if(b){fn(b.dataset.v);reset();draw();}};}
function controls(){
  seg('segVar',Object.keys(VARIANTEN).map(k=>[k,k]),S.variant,v=>S.variant=v);
  seg('segJ',[['gevuld','Eigen trades'],['leeg','Nieuw (leeg)']],S.journal,v=>S.journal=v);
  seg('segD',[['aan','Aan'],['uit','Uit']],S.drive?'aan':'uit',v=>S.drive=v==='aan');
  seg('segT',[['licht','Licht'],['donker','Donker']],S.dark?'donker':'licht',v=>{S.dark=v==='donker';document.body.classList.toggle('dark',S.dark);});
}
document.getElementById('opnieuw').onclick=()=>{reset();draw();};

/* ── caption: where are we in the click-through ── */
function caption(){
  const v=S.variant,leeg=S.journal==='leeg';let stap,t;
  if(S.scherm==='landing'){stap='1/3';t=leeg?'Nieuwe bezoeker zonder trades. Rondkijken moet meteen kunnen.':(v==='A'?'Terugkerend lid. De demo-knop is een klein linkje geworden.':v==='B'?'Terugkerend lid. De landing blijft zoals nu.':'Terugkerend lid. Rondkijken opent een losse kijk-modus.');}
  else if(S.modal){stap='2/3';t=S.modal==='native'?'De huidige browser-<code>confirm()</code>: tekst zonder opmaak, OK staat rechts als hoofdknop.':'Het eigen keuzevenster: de veilige keuze eerst, vervangen pas daarna en met de gevolgen erbij.';}
  else if(S.sandbox){stap='2/3';t=S.view==='data'?'Instellingen → Data tijdens rondkijken: alles wat schrijft staat uit, met de reden erbij.':'Rondkijken: voorbeelddata alleen in dit tabblad. Klik op Stop, of sluit het tabblad.';}
  else{stap='3/3';t=S.data==='eigen'?'Terug in je eigen journal.':S.data==='demo'?'Voorbeelddata staat nu ín je journal. Je eigen trades zitten alleen nog in de veiligheidskopie.':'Lege journal.';
    if(S.view==='data'&&!S.sandbox&&S.data!=='demo')stap='2/3',t='Instellingen → Data: hier staat de voorbeelddata voor wie hem echt wil laden.';}
  document.getElementById('cap').innerHTML=`<span class="stap">${stap}</span><b>${VARIANTEN[v]}</b> · ${t}`;
}

/* ── landing ── */
function landing(){
  const leeg=S.journal==='leeg',v=S.variant;let cta;
  if(leeg){
    cta=`<div class="cta"><button class="btn pri big" data-a="begin">Begin je journal →</button><button class="btn big" data-a="demo">Rondkijken met voorbeelddata${v==='C'?'<span class="sub2">alleen in dit tabblad</span>':''}</button></div>`;
  }else if(v==='A'){
    cta=`<div class="cta"><button class="btn pri big" data-a="open">Open mijn journal →</button></div>
      <div class="klein">Eerst rondkijken met voorbeelddata? <button class="linklike" data-a="demo">Voorbeelddata bekijken</button>
      <span class="uitleg">Vervangt je eigen journal, terugzetten kan met de veiligheidskopie. Staat ook in de journal onder Instellingen → Data.</span></div>`;
  }else if(v==='B'){
    cta=`<div class="cta"><button class="btn pri big" data-a="open">Open mijn journal →</button><button class="btn big" data-a="demo">Rondkijken met voorbeelddata</button></div>`;
  }else{
    cta=`<div class="cta"><button class="btn pri big" data-a="open">Open mijn journal →</button><button class="btn big" data-a="demo">Rondkijken met voorbeelddata<span class="sub2">je eigen journal blijft staan</span></button></div>`;
  }
  return `<div class="url"><span class="dots"><i></i><i></i><i></i></span><span>syncjournal.nl</span></div>
  <div class="land"><div class="logo">Sync<span>Journal</span></div>
    ${leeg?'':`<div class="welkom">Welkom terug, ${EIGEN.naam}</div>`}
    <h1>Je trades, je regels, op één rustige plek</h1>
    <p class="sub">Een journal dat met je meedenkt over je proces. Je data blijft in je eigen browser.</p>
    ${cta}</div>`;
}

/* ── app ── */
function curve(pts){const w=600,h=120,max=Math.max(...pts),min=Math.min(...pts),sx=w/(pts.length-1),sy=(h-16)/((max-min)||1);
  const d=pts.map((p,i)=>`${i?'L':'M'}${(i*sx).toFixed(1)},${(h-8-(p-min)*sy).toFixed(1)}`).join(' ');
  return `<svg class="curve" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" fill="none" stroke="var(--green)" stroke-width="2.2" vector-effect="non-scaling-stroke"/></svg>`;}
const geld=x=>'$'+x.toLocaleString('nl-NL',{minimumFractionDigits:2,maximumFractionDigits:2});
function dash(){
  if(S.data==='leeg')return `<div class="panel"><div class="empty"><h3>Nog geen trades</h3>
    <p>Koppel een exchange en start een sync, importeer een CSV, of voeg je eerste trade handmatig toe.</p>
    <div class="cta"><button class="btn pri" data-a="nop">Exchange koppelen</button><button class="btn" data-a="demo">Rondkijken met voorbeelddata</button></div></div></div>`;
  const d=S.data==='demo'?DEMO:EIGEN;
  return `<div class="kpis">
    <div class="kpi"><div class="k">Netto P&amp;L</div><div class="v num g">+${geld(d.pnl)}</div></div>
    <div class="kpi"><div class="k">Winrate</div><div class="v num">${d.win}%</div></div>
    <div class="kpi"><div class="k">Gem. R</div><div class="v num">+${String(d.r).replace('.',',')}R</div></div>
    <div class="kpi"><div class="k">Trades</div><div class="v num">${d.trades.toLocaleString('nl-NL')}</div></div></div>
  <div class="panel"><h3>Equity</h3>${curve(d.pts)}</div>
  <div class="panel"><h3>Laatste trades</h3><table class="tbl"><thead><tr><th>Datum</th><th>Pair</th><th class="opt">Richting</th><th class="n">P&amp;L</th><th class="n">R</th></tr></thead><tbody>
    ${d.rows.map(r=>`<tr><td class="num">${r[0]}</td><td>${r[1]}</td><td class="opt">${r[2]}</td><td class="n num ${r[3][0]==='+'?'g':'r'}">${r[3]}</td><td class="n num">${r[4]}</td></tr>`).join('')}
  </tbody></table></div>`;
}
function rij(titel,uitleg,knop,uit,waarom){
  return `<div class="setrow${uit?' uit':''}"><div class="txt"><b>${titel}</b><small>${uitleg}</small>${uit&&waarom?`<span class="why">${waarom}</span>`:''}</div>${knop?`<button class="btn" ${uit?'disabled':''} data-a="nop">${knop}</button>`:''}</div>`;
}
function dataView(){
  const sb=S.sandbox,w='Uit tijdens rondkijken: er is niets van jou veranderd, dus er valt niets te bewaren.';
  const drive=S.drive?'Elke dag een back-up in je eigen Google Drive. Laatste: vandaag 09:12.':'Staat uit. Je back-ups staan alleen in deze browser.';
  let demoRij;
  if(sb)demoRij=rij('Je kijkt nu rond','Alleen in dit tabblad, er wordt niets opgeslagen. Stop rondkijken bovenaan brengt je terug naar je eigen journal.','',false);
  else if(S.data==='demo')demoRij=rij('Voorbeelddata opruimen','Haalt de voorbeeld-trades weg. Je eigen trades komen hiermee <b>niet</b> terug, daarvoor herstel je de veiligheidskopie hieronder.','Opruimen',false);
  else if(S.variant==='C')demoRij=rij('Voorbeelddata','Kijk rond in een volle journal. Gebeurt alleen in dit tabblad, je eigen journal blijft staan.','Rondkijken',false).replace('data-a="nop">Rondkijken','data-a="demo">Rondkijken');
  else demoRij=`<div class="${S.hl?'hl':''}">`+rij('Voorbeelddata laden',`Vervangt je journal (${S.data==='leeg'?'nu leeg':EIGEN.trades+' trades'}, playbooks, tags en saldi) door 3.000 voorbeeld-trades. Eerst wordt automatisch een veiligheidskopie gemaakt.`,'Laden…',false).replace('data-a="nop">Laden…','data-a="laden">Laden…')+'</div>';
  return `<div class="panel"><h3>Back-ups</h3>
    ${rij('Google Drive-backup',drive,S.drive?'Nu back-uppen':'Koppelen',sb,w)}
    ${rij('Exporteren','Download je hele journal als één bestand.','Exporteer',sb,w)}
    ${rij('Automatische map-backup','Elke dag een bestand in een map op je computer.','Kies map',sb,w)}
    ${rij('Veiligheidskopieën','De laatste 3, automatisch vóór risicovolle acties.'+(S.data==='demo'&&!sb?' <span class="pill">vóór voorbeelddata · 31-10 10:04</span>':''),S.data==='demo'&&!sb?'Herstel':'Bekijk',sb,w)}
  </div>
  <div class="panel"><h3>Voorbeelddata</h3>${demoRij}</div>`;
}
function app(){
  const sb=S.sandbox,d=S.data==='demo'?DEMO:S.data==='eigen'?EIGEN:null;
  const sync=sb?`<button class="syncbtn" disabled aria-describedby="syncw">↻ Sync <small id="syncw">Uit tijdens rondkijken</small></button>`
               :`<button class="syncbtn" data-a="nop">↻ Sync <small>${S.data==='leeg'?'Nog geen koppeling':'2 min geleden'}</small></button>`;
  const nav=(id,l,opt)=>`<button class="nav${opt?' opt':''}" data-a="nav" data-v="${id}" ${S.view===id?'aria-current="page"':''}>${l}</button>`;
  const titel=S.view==='data'?'Instellingen → Data':'Dashboard';
  const wie=sb?'Voorbeelddata · 3.000 trades':d?`${d===DEMO?'Voorbeelddata':EIGEN.naam} · ${d.trades.toLocaleString('nl-NL')} trades`:'Nog leeg';
  return `<div class="url"><span class="dots"><i></i><i></i><i></i></span><span>syncjournal.nl/app${sb?'?rondkijken=1':''}</span></div>
  ${sb?`<div class="sandbar" role="status"><div class="t"><b>Je kijkt naar voorbeelddata</b> · <span>je eigen journal is veilig${S.journal==='leeg'?' (en nog leeg)':''} · sluit je dit tabblad, dan ben je ook terug</span></div><button class="btn pri" data-a="stop">Stop rondkijken</button></div>`:''}
  <div class="shell"><aside class="side"><div class="logo">Sync<span>Journal</span></div>
    ${nav('dash','Dashboard')}<button class="nav opt" data-a="nop">Trades</button><button class="nav opt" data-a="nop">Analytics</button><button class="nav opt" data-a="nop">Playbooks</button>
    ${nav('data','Instellingen')}<div class="sp"></div>${sync}</aside>
  <main class="main">
    ${S.data==='demo'&&!sb?`<div class="info warn">Voorbeelddata staat nu in je journal. Je eigen trades terug? Instellingen → Data → Veiligheidskopieën → Herstel.${S.drive?' Je Drive-backup van vandaag bevat vanaf nu de voorbeelddata.':''}</div>`:''}
    <div class="topline"><h2>${titel}</h2><span class="who">${wie}</span></div>
    ${S.view==='data'?dataView():dash()}
  </main></div>`;
}

/* ── dialogs ── */
function modal(){
  if(S.modal==='native'){
    const tekst='Voorbeelddata laden? Dit OVERSCHRIJFT je huidige journal (trades, playbooks, tags en saldi). Er wordt eerst automatisch een veiligheidskopie gemaakt.'+(S.drive?'\n\nLet op: je automatische Drive-backup gaat daarna deze voorbeelddata bevatten. Eerdere dagbestanden blijven in je Drive-map staan.':'');
    return `<div class="scrim"><div class="native" role="alertdialog" aria-modal="true" aria-labelledby="nh"><div class="host" id="nh">syncjournal.nl meldt het volgende</div><p>${tekst}</p>
      <div class="acts"><button data-a="annuleer">Annuleren</button><button class="ok" data-a="vervang">OK</button></div></div></div>`;}
  if(S.modal==='keuze'){
    const drive=S.drive?`<li><b>Drive-backup staat aan.</b> De back-up van vandaag gaat de voorbeelddata bevatten. Eerdere dagbestanden in je Drive-map blijven staan.</li>`
                       :`<li><b>Drive-backup staat uit.</b> De veiligheidskopie in deze browser is dan je enige weg terug. Download eerst zelf een back-up.</li>`;
    return `<div class="scrim"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="kh"><h3 id="kh">Je hebt al een eigen journal</h3>
      <p>Er staan <b>${EIGEN.trades} trades</b> van jou in deze browser. Voorbeelddata laden vervangt ze.</p>
      <div class="acts"><button class="btn pri" data-a="open" autofocus>Open mijn journal</button><button class="btn" data-a="annuleer">Annuleren</button></div>
      <div class="gevaar"><b style="font-size:13px">Toch vervangen door voorbeelddata?</b><ul>
        <li>Je trades, playbooks, tags en saldi worden vervangen.</li>
        <li>Eerst komt er een <b>veiligheidskopie</b> in deze browser (Instellingen → Data → Veiligheidskopieën). Daarmee haal je je eigen journal terug, "Voorbeelddata opruimen" doet dat niet.</li>
        ${drive}</ul>
        <div class="acts">${S.drive?'':'<button class="btn" data-a="nop">Download back-up</button>'}<button class="btn danger" data-a="vervang">Vervang door voorbeelddata</button></div></div></div></div>`;}
  return '';
}

/* ── click handling ── */
function act(a,v){
  const leeg=S.journal==='leeg';S.toast='';
  if(a==='nop'){S.toast='Niet uitgewerkt in deze demo';}
  else if(a==='begin'||a==='open'){S.scherm='app';S.view='dash';S.modal=null;S.data=leeg?'leeg':'eigen';}
  else if(a==='nav'){S.view=v;S.hl=false;}
  else if(a==='demo'){
    S.scherm='app';S.view='dash';
    if(S.variant==='C'){S.sandbox=true;S.data='demo';S.toast='Voorbeelddata geladen, alleen in dit tabblad';}
    else if(S.data==='leeg'||(leeg&&S.data!=='eigen')){S.data='demo';S.toast='✓ Voorbeelddata geladen: 3.000 trades';}
    else if(S.variant==='A'){S.view='data';S.hl=true;}
    else S.modal='keuze';}
  else if(a==='laden'){S.modal=S.data==='leeg'?null:'native';if(S.data==='leeg'){S.data='demo';S.view='dash';S.toast='✓ Voorbeelddata geladen: 3.000 trades';}}
  else if(a==='annuleer'){S.modal=null;S.view='dash';S.hl=false;S.toast='Er is niets veranderd';}
  else if(a==='vervang'){S.modal=null;S.data='demo';S.view='dash';S.hl=false;S.toast='Veiligheidskopie gemaakt · ✓ voorbeelddata geladen';}
  else if(a==='stop'){S.sandbox=false;S.data=leeg?'leeg':'eigen';S.view='dash';S.toast=leeg?'Terug in je journal, die is nog leeg':'Terug in je eigen journal, er is niets veranderd';}
  draw();
  if(S.modal){const f=document.querySelector('.scrim [autofocus], .scrim .ok');if(f)f.focus();}
}
document.getElementById('frame').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled)act(b.dataset.a,b.dataset.v);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal)act('annuleer');});

function draw(){
  controls();caption();
  document.getElementById('frame').innerHTML=(S.scherm==='landing'?landing():app())+modal()+(S.toast?`<div class="toast" role="status">${S.toast}</div>`:'');
}
reset();draw();
</script>
</body>
</html>
