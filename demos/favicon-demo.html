<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SyncJournal · Favicon-keuzevel</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F6FA;--surface:#fff;--ink:#191E2A;--ink2:#525A6B;--muted:#8A92A3;--line:#E8EBF2;--accent:#3B5BD9;--sh:0 1px 2px rgba(20,30,60,.05)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;font-size:13.5px;line-height:1.5;padding:34px 26px 80px}
h1,h2,h3{font-family:'Plus Jakarta Sans',sans-serif;letter-spacing:-.01em}
.wrap{max-width:1160px;margin:0 auto}
.head{margin-bottom:24px}
.head h1{font-size:21px;margin-bottom:5px}
.head p{color:var(--ink2);max-width:660px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:960px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:20px 22px}
.card.reco{border-color:#CDD6F7;box-shadow:0 0 0 3px #EDF0FD,var(--sh)}
.card h3{font-size:15px;display:flex;align-items:center;gap:9px;margin-bottom:2px}
.card .tag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;background:var(--accent);color:#fff;border-radius:20px;padding:3px 9px}
.card p{color:var(--ink2);font-size:12.5px;margin-bottom:14px}
.sizes{display:flex;align-items:flex-end;gap:22px;margin-bottom:16px}
.sz{text-align:center}
.sz small{display:block;color:var(--muted);font-size:10.5px;margin-top:6px}
.sz svg{display:block;image-rendering:auto}
/* gesimuleerde browser-contexten */
.ctx{border-radius:10px;overflow:hidden;border:1px solid var(--line);margin-bottom:8px}
.tabbar{display:flex;align-items:flex-end;gap:2px;padding:8px 10px 0;background:#DEE1E6}
.tabbar.dark{background:#202124}
.tab{display:flex;align-items:center;gap:7px;background:#fff;border-radius:9px 9px 0 0;padding:7px 14px;font-size:11.5px;font-weight:500;color:#3c4043;min-width:0}
.tabbar.dark .tab{background:#35363A;color:#e8eaed}
.tab.off{background:transparent;color:#5f6368}
.tabbar.dark .tab.off{color:#9aa0a6}
.tab svg{width:16px;height:16px;flex:none}
.bookbar{display:flex;align-items:center;gap:18px;background:#fff;padding:7px 14px;font-size:11.5px;color:#3c4043;border-top:1px solid #DEE1E6}
.bookbar.dark{background:#292A2D;color:#e8eaed;border-top-color:#3c4043}
.bm{display:flex;align-items:center;gap:6px;font-weight:500}
.bm svg{width:16px;height:16px}
.bm.dim{opacity:.55}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>🎨 Favicon — SJ in een hexagon, vier varianten</h1>
    <p>Ronde 2: SJ-monogram in een hexagon (de crypto-badge-vorm). Elk ontwerp op 64 / 32 / 16 px, plus in een nagemaakte browser-tab en bookmarkbalk (licht + donker). Let vooral op de 16px-versie — dat is wat je 95% van de tijd ziet.</p>
  </div>
  <div class="grid" id="grid"></div>
</div>

<script>
'use strict';
/* ── de vier kandidaten als SVG-strings (viewBox 64) ── */
const GRAD='<linearGradient id="g%ID%" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B5BD9"/><stop offset="1" stop-color="#8A5CF0"/></linearGradient>';
function svgWrap(id,inner,defs){return '<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">'+(defs?'<defs>'+defs.replace(/%ID%/g,id)+'</defs>':'')+inner.replace(/%ID%/g,id)+'</svg>';}

/* pointy-top hexagon, gecentreerd in viewBox 64; stroke-linejoin=round geeft zachte hoeken */
const HEX_PTS='32,4 57,18.5 57,45.5 32,60 7,45.5 7,18.5';
const HEXF='<polygon points="'+HEX_PTS+'" fill="%FILL%" stroke="%STROKE%" stroke-width="6" stroke-linejoin="round"/>';
const SJ=(fillS,fillJ)=>'<text x="33" y="42" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="800" letter-spacing="-1.5" text-anchor="middle"><tspan fill="'+fillS+'">S</tspan><tspan fill="'+fillJ+'">J</tspan></text>';
const CANDS=[
 {key:'A',name:'A · Hexagon vol verloop',reco:true,
  desc:'De strakke variant: hexagon volledig in het merk-verloop (blauw→violet), witte SJ. Rustig, premium, maximaal leesbaar op 16px.',
  svg:svgWrap('a',HEXF.replace('%FILL%','url(#g%ID%)').replace('%STROKE%','url(#g%ID%)')+SJ('#fff','#fff'),GRAD)},
 {key:'B',name:'B · Duotone SJ',reco:false,
  desc:'Zelfde hexagon, maar de J in mint — een subtiel kleuraccent dat naar de groene winst-kant knipoogt. Iets speelser, op 16px nét wat drukker.',
  svg:svgWrap('b',HEXF.replace('%FILL%','url(#g%ID%)').replace('%STROKE%','url(#g%ID%)')+SJ('#fff','#5FF0B4'),GRAD)},
 {key:'C',name:'C · Coin-stijl (navy + rand)',reco:false,
  desc:'Donkere navy-kern met een gradient-rand — het meest "crypto-coin". Mooi groot, maar op 16px wordt de rand dun en oogt hij donkerder.',
  svg:svgWrap('c',HEXF.replace('%FILL%','#12161e').replace('%STROKE%','url(#g%ID%)')+SJ('#fff','#fff'),GRAD)},
 {key:'D',name:'D · Gradient-letters',reco:false,
  desc:'Omgekeerd: lichte kern, SJ in het merk-verloop. Fris in een lichte browser, maar valt weg tussen witte tabs en verliest kracht in dark mode.',
  svg:svgWrap('d',HEXF.replace('%FILL%','#F4F6FA').replace('%STROKE%','#CDD6F7')+SJ('url(#g%ID%)','url(#g%ID%)'),GRAD)},
];

function sized(svg,px){return svg.replace('<svg ','<svg width="'+px+'" height="'+px+'" ');}
function card(c){
  const s=c.svg;
  return `<div class="card ${c.reco?'reco':''}">
    <h3>${c.name} ${c.reco?'<span class="tag">Mijn advies</span>':''}</h3>
    <p>${c.desc}</p>
    <div class="sizes">
      <div class="sz">${sized(s,64)}<small>64px</small></div>
      <div class="sz">${sized(s,32)}<small>32px</small></div>
      <div class="sz">${sized(s,16)}<small>16px — de echte test</small></div>
      <div class="sz">${sized(s,24)}<small>24px</small></div>
    </div>
    <div class="ctx">
      <div class="tabbar"><div class="tab">${sized(s,16)}<span>SyncJournal — Dashboard</span></div><div class="tab off">📈 <span>TradingView</span></div></div>
      <div class="bookbar"><span class="bm">${sized(s,16)}<span>SyncJournal</span></span><span class="bm dim">📊 Discord</span><span class="bm dim">🦊 MEXC</span></div>
    </div>
    <div class="ctx">
      <div class="tabbar dark"><div class="tab">${sized(s,16)}<span>SyncJournal — Dashboard</span></div><div class="tab off">📈 <span>TradingView</span></div></div>
      <div class="bookbar dark"><span class="bm">${sized(s,16)}<span>SyncJournal</span></span><span class="bm dim">📊 Discord</span><span class="bm dim">🦊 MEXC</span></div>
    </div>
  </div>`;
}
document.getElementById('grid').innerHTML=CANDS.map(card).join('');
</script>
</body>
</html>
