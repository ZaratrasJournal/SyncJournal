document.getElementById('navbot').innerHTML=NAVBOT.map(navBtn).join('');
const MORANI=[['https://x.com/moranitrading','Morani op X','X'],['https://www.youtube.com/@moranitraden','Morani op YouTube','YouTube'],['https://moranitraden.nl/','moranitraden.nl','moranitraden.nl']];
const moraniLine=()=>`<p class="morline">Meer van Morani: ${MORANI.map(([h,l,t])=>`<a href="${h}" target="_blank" rel="noopener noreferrer" aria-label="${l}">${t}</a>`).join(' <span class="dot" aria-hidden="true">·</span> ')}</p>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function say(msg){const l=document.getElementById('live');l.textContent='';setTimeout(()=>{l.textContent=msg;},30);}
function demoNav(l){say('Demo: in de app opent dit '+l+'.');}
function goMori(){say('Demo: in de app opent dit Mori.');}

/* ═══ Model: categorieën met korte uitleg ═══ */
// Eén regel uitleg per categorie (Linear-patroon): zegt wat erin zit, in de woorden van een beginner.
const DESC={
  '🚀':'Wat het is, wat het kost en hoe je begint',
  '💡':'Waarom SyncJournal werkt zoals hij werkt',
  '💾':'Waar je data staat, back-ups en overzetten',
  '✍️':'Invullen, screenshots, tags, setups en playbooks',
  '🔄':'Exchange koppelen, API-sleutels, sync en CSV',
  '📊':'P&L, R, win-rate en de grafieken uitgelegd',
  '🧭':'Je edge en je lek vinden',
  '✅':'Trades terugkijken en delen met je coach',
  '🤖':'Wat Mori kan, wat het kost en wat hij ziet',
  '🛠️':'Thema, dashboard, updates en als iets hapert'
};
// Beginnersvragen die vaak terugkomen (Stripe/Linear "Popular").
const POPULAR=['Hoe voeg ik mijn eerste trade toe?','Hoe maak ik een back-up (en waarom is dat belangrijk)?','Hoe koppel ik een exchange?','Wat betekent R-multiple (die "R" overal)?','Ik zie lege grafieken of "geen trades", hoe kan dat?','Wat is Mori?'];
const SUGGEST=['back-up','R-multiple','koppelen','screenshot','Mori'];
const SIGN='Zaratras';
const OPEN_MAX=3;   // bij zoveel treffers of minder klappen ze vanzelf open   // zichtbare naam van de maker

const fold=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/-/g,'');
const plain=h=>h.replace(/<\/?(b|i|strong|em|a|button)\b[^>]*>/g,'').replace(/<[^>]+>/g,' ').replace(/&amp;/g,'&').replace(/\s+/g,' ');

// Eerste zin, buiten tags; slaat afkortingen als "bv." over.
function splitFirst(h){
  let depth=0;
  for(let i=0;i<h.length;i++){
    const ch=h[i];
    if(ch==='<'){const j=h.indexOf('>',i);const tag=h.slice(i,j+1);
      if(/^<\/(b|i|a|button|strong|em)\b/.test(tag))depth--;else if(/^<(b|i|a|button|strong|em)\b/.test(tag))depth++;
      i=j;continue;}
    if('.?!'.includes(ch)&&depth===0){
      const nx=h[i+1];if(nx!==undefined&&nx!==' ')continue;
      if(/(^|[\s(])(bv|bijv|o\.a|t\.o\.v|enz|ca|vs)\.$/i.test(h.slice(Math.max(0,i-6),i+1)))continue;
      return [h.slice(0,i+1),h.slice(i+2).trim()];
    }
  }
  return [h,''];
}
// "(1) … (2) …" of "1. … 2. …" in een alinea wordt een genummerde lijst.
function stepify(c){
  for(const tok of [n=>`(${n}) `,n=>`${n}. `,n=>`Stap ${n}: `]){
    const pos=[];let from=0;
    for(let n=1;;n++){const t=tok(n);let i=c.indexOf(t,from);
      while(i>0&&!/\s/.test(c[i-1]))i=c.indexOf(t,i+1);
      if(i<0)break;pos.push(i);from=i+t.length;}
    if(pos.length<2)continue;
    const pre=c.slice(0,pos[0]).trim();
    const items=pos.map((p,k)=>c.slice(p+tok(k+1).length,k+1<pos.length?pos[k+1]:undefined).trim());
    let post='';const m=items[items.length-1].match(/^(.*?[.!?])\s+(?=[A-Z<])(.*)$/s);
    if(m){items[items.length-1]=m[1];post=m[2];}
    return [pre&&`<p>${pre}</p>`,`<ol>${items.map(t=>`<li>${t}</li>`).join('')}</ol>`,post&&`<p>${post}</p>`].filter(Boolean);
  }
  return [`<p>${c}</p>`];
}
// Antwoord-HTML → alinea's, lijsten en een vet "kort antwoord".
function fmtAnswer(a,lead){
  let sig=false;
  let h=a.replace(/<br>\s*<br>\s*<i>[^<]+<\/i>\s*$/,()=>{sig=true;return '';});
  h=h.replace(/<br>\s*<br>/g,'\n\n').replace(/<(ul|ol)>/g,'\n\n<$1>').replace(/<\/(ul|ol)>/g,'</$1>\n\n');
  const out=[];
  h.split(/\n\n/).map(s=>s.trim()).filter(Boolean).forEach(c=>{if(/^<(ul|ol)>/.test(c))out.push(c);else out.push(...stepify(c));});
  if(lead&&out[0]&&out[0].startsWith('<p>')){
    const [s,rest]=splitFirst(out[0].slice(3,-4));
    if(s&&(rest||out.length>1))out.splice(0,1,`<p class="kort">${s}</p>`,...(rest?[`<p>${rest}</p>`]:[]));
  }
  return {html:out.join(''),sig};
}
const CATS=FAQS.map(([name,items],ci)=>{
  const sp=name.indexOf(' ');const ic=name.slice(0,sp),title=name.slice(sp+1);
  const maker=items.some(it=>(it[2]||'').startsWith('visie-'));
  return {ci,ic,title,desc:DESC[ic]||'',maker,items:items.map(([q,a,id],qi)=>{
    const f=fmtAnswer(a,!maker);
    return {ci,qi,key:`q-${ci}-${qi}`,dom:id?`faq-${id}`:`q-${ci}-${qi}`,id,q,html:f.html,sig:f.sig,idx:fold(q+' '+plain(a))};
  })};
});
const MAKER=CATS.find(c=>c.maker);
const HELP=CATS.filter(c=>!c.maker);
const ALL=CATS.flatMap(c=>c.items);
const byQ=q=>ALL.find(it=>it.q===q);
const byDom=d=>ALL.find(it=>it.dom===d);
const makerQuote=()=>splitFirst(MAKER.items[0].html.replace(/^<p>|<\/p>.*$/gs,''))[0];

/* ═══ Zoeken: alle woorden moeten voorkomen, in vraag óf antwoord ═══ */
function match(it,q){const ws=fold(q).split(/\s+/).filter(Boolean);return ws.every(w=>it.idx.includes(w));}
function hl(text,q){
  let s=esc(text);if(!q.trim())return s;
  q.trim().split(/\s+/).filter(w=>w.length>1).forEach(w=>{
    const re=new RegExp('('+esc(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    s=s.replace(/(<[^>]*>)|([^<]+)/g,(m,tag,txt)=>tag?tag:txt.replace(re,'<mark>$1</mark>'));
  });
  return s;
}
// Staat het zoekwoord alleen in het antwoord? Toon dan een stukje antwoord rond de treffer.
const SNIP_PAD=50;   // tekens context aan weerszijden
function snippet(it,q){
  const ws=q.trim().split(/\s+/).filter(Boolean);if(!ws.length||ws.every(w=>fold(it.q).includes(fold(w))))return '';
  const txt=plain(it.html).trim();const f=fold(txt);let at=-1;
  for(const w of ws){const i=f.indexOf(fold(w));if(i>=0&&!fold(it.q).includes(fold(w))){at=i;break;}}
  if(at<0)return '';
  let a=Math.max(0,at-SNIP_PAD),b=Math.min(txt.length,at+SNIP_PAD*1.6);
  if(a){const sp=txt.indexOf(' ',a);if(sp>=0&&sp<at)a=sp+1;}
  if(b<txt.length){const sp=txt.lastIndexOf(' ',b);if(sp>at)b=sp;}
  return (a?'…':'')+txt.slice(a,b).trim()+(b<txt.length?'…':'');
}
const snipHtml=(it,q)=>{const s=snippet(it,q);return s?`<span class="snip">${hl(s,q)}</span>`:'';};
const srchBox=(id,ph,big)=>`<label class="srch">${svg(IC.search,big?19:17)}<span class="sr">Zoek in veelgestelde vragen</span><input id="${id}" type="search" autocomplete="off" placeholder="${ph}" aria-describedby="${id}-hint"></label>`;
function noneBox(q){
  return `<div class="none" role="status"><h3>Niets gevonden voor “${esc(q)}”.</h3>
    <p>Probeer een ander woord, bijvoorbeeld:</p>
    <div class="chips">${SUGGEST.map(s=>`<button class="chip" data-sug="${esc(s)}">${esc(s)}</button>`).join('')}</div>
    <p>Gaat je vraag over je eigen cijfers? <button class="linklike" onclick="goMori()">Vraag het Mori</button>. Iets anders? Stel hem in de Morani Discord.</p></div>`;
}
function wireSuggest(root,input,run){root.querySelectorAll('[data-sug]').forEach(b=>b.onclick=()=>{input.value=b.dataset.sug;run();input.focus();});}

const qrow=(it,q='')=>`<details class="qrow" id="${it.dom}" data-key="${it.key}"><summary><span class="qt">${hl(it.q,q)}${snipHtml(it,q)}</span><span class="chev">${svg(IC.chev,18)}</span></summary><div class="ans">${it.html}${it.sig?`<p class="sig">${SIGN}</p>`:''}</div></details>`;
const catHead=(c,tag='h2')=>`<div class="cat-h"><span class="ci" aria-hidden="true">${c.ic}</span><div><${tag} id="h-${c.ci}">${esc(c.title)}</${tag}><p>${esc(c.desc)}</p></div><span class="cnt">${c.items.length} vragen</span></div>`;
function makerBlock(opts={}){
  return `<section class="maker" id="cat-${MAKER.ci}" aria-labelledby="h-${MAKER.ci}">
    <div class="mk-top"><span class="mk-av" aria-hidden="true">Z</span><div><div class="mk-kick">Van de maker</div><h2 id="h-${MAKER.ci}">Waarom SyncJournal is zoals hij is</h2></div></div>
    <blockquote>${makerQuote()}</blockquote><div class="mk-sig">${SIGN}, maker van SyncJournal</div>
    ${opts.teaser?`<div class="mk-go"><button class="linklike" data-open-maker>Lees mijn visie · ${MAKER.items.length} korte stukken →</button></div>`
      :`<div class="rows">${MAKER.items.map(it=>qrow(it,opts.q||'')).join('')}</div>`}
  </section>`;
}

/* ═══ Variant A · Inhoudsopgave links, rijen per categorie ═══ */
const A={
  render(){
    const order=[HELP[0],MAKER,...HELP.slice(1)];
    main.innerHTML=`<div class="va">
      <aside class="toc" aria-label="Onderwerpen"><div class="toc-h">Onderwerpen</div><nav>
        ${order.map(c=>`<a href="#cat-${c.ci}" data-ci="${c.ci}" class="${c.maker?'mk':''}"><span class="ti" aria-hidden="true">${c.maker?'💬':c.ic}</span><span class="tn">${c.maker?'Van de maker':esc(c.title)}</span><span class="tc" aria-label="${c.items.length} vragen">${c.items.length}</span></a>`).join('')}
      </nav><div class="toc-help">Staat je vraag er niet bij? Stel hem in de <b>Morani Discord</b>. Over je eigen cijfers: <button class="linklike" onclick="goMori()">vraag het Mori</button>.</div></aside>
      <div class="va-main">
        <div class="va-hero"><h2>Waarmee kunnen we je helpen?</h2>
          <p>Van je eerste trade tot je edge vinden. Zoek je vraag, of kies een onderwerp.</p>
          ${srchBox('qA','Zoek een vraag, bv. back-up, R of Mori')}<div class="srch-hint" id="qA-hint">Zoekt ook in de antwoorden.</div>
          <div class="va-pop"><div class="pl">Veel gevraagd</div><div class="chips">${POPULAR.map(q=>`<button class="chip" data-go="${byQ(q).dom}">${esc(byQ(q).q)}</button>`).join('')}</div></div>
        </div>
        <div id="aList">${order.map(c=>c.maker?makerBlock():`<section class="cat" id="cat-${c.ci}" aria-labelledby="h-${c.ci}">${catHead(c)}<div class="rows">${c.items.map(it=>qrow(it)).join('')}</div></section>`).join('')}</div>
        <div id="aNone"></div>
        ${moraniLine()}
      </div></div>`;
    const inp=document.getElementById('qA');
    inp.oninput=()=>A.filter(inp.value);
    main.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>A.open(b.dataset.go));
    main.querySelectorAll('.toc a').forEach(a=>a.onclick=e=>{e.preventDefault();if(a.classList.contains('dim'))return;const s=document.getElementById('cat-'+a.dataset.ci);if(s){s.scrollIntoView({behavior:'smooth',block:'start'});history.replaceState(null,'',location.search+'#cat-'+a.dataset.ci);}});
    window.onscroll=A.spy;A.spy();
  },
  filter(q){
    let hits=0;
    CATS.forEach(c=>{let n=0;
      c.items.forEach(it=>{const d=document.getElementById(it.dom);const ok=!q.trim()||match(it,q);d.hidden=!ok;d.open=false;
        d.querySelector('.qt').innerHTML=hl(it.q,ok?q:'')+(ok?snipHtml(it,q):'');if(ok)n++;});
      const cnt=document.querySelector(`#cat-${c.ci} .cnt`);if(cnt)cnt.textContent=q.trim()?`${n} van ${c.items.length}`:`${c.items.length} vragen`;
      const sec=document.getElementById('cat-'+c.ci);sec.hidden=!n;hits+=n;
      const a=main.querySelector(`.toc a[data-ci="${c.ci}"]`);a.classList.toggle('dim',!n);a.setAttribute('aria-disabled',String(!n));a.querySelector('.tc').textContent=n;
    });
    // Weinig treffers: klap ze open, zodat je ziet waarom ze matchen (het woord kan in het antwoord staan).
    if(q.trim()&&hits<=OPEN_MAX)ALL.forEach(it=>{const d=document.getElementById(it.dom);if(!d.hidden)d.open=true;});
    document.querySelector('.va-pop').hidden=!!q.trim();
    const none=document.getElementById('aNone');
    none.innerHTML=q.trim()&&!hits?noneBox(q):'';wireSuggest(none,document.getElementById('qA'),()=>A.filter(document.getElementById('qA').value));
    if(q.trim())say(hits?`${hits} ${hits===1?'vraag':'vragen'} gevonden`:'Niets gevonden');
    A.spy();
  },
  open(dom){const d=document.getElementById(dom);if(!d)return;
    const inp=document.getElementById('qA');if(inp.value){inp.value='';A.filter('');}
    d.open=true;d.scrollIntoView({behavior:'smooth',block:'center'});d.querySelector('summary').focus({preventScroll:true});},
  spy(){
    if(cur!=='A')return;
    const off=innerHeight*.35;   // de categorie die op ruim een derde van het scherm staat, is "waar je bent"
    let act=null;
    main.querySelectorAll('.va-main section[id^="cat-"]').forEach(s=>{if(!s.hidden&&s.getBoundingClientRect().top<off)act=s.id.slice(4);});
    if(act===null){const f=main.querySelector('.va-main section[id^="cat-"]:not([hidden])');act=f&&f.id.slice(4);}
    main.querySelectorAll('.toc a').forEach(a=>{const on=a.dataset.ci===act;a.setAttribute('aria-current',on?'true':'false');
      if(on){const bar=a.closest('.toc');if(bar.scrollWidth>bar.clientWidth){const br=bar.getBoundingClientRect(),ar=a.getBoundingClientRect();
        if(ar.left<br.left+16||ar.right>br.right-16)bar.scrollLeft+=ar.left-br.left-16;}}});
  },
  goto(id){A.open('faq-'+id);}
};

/* ═══ Variant B · Tegels: eerst kiezen, dan lezen ═══ */
const B={
  view:'home',
  render(){
    main.innerHTML=`<div class="vb"><div id="bTop"></div><div id="bBody"></div>${moraniLine()}</div>`;
    B.view==='home'?B.home():B.cat(B.view);
  },
  hero(){return `<div class="vb-hero"><h2>Waarmee kunnen we je helpen?</h2><p>Zoek je vraag, of kies hieronder een onderwerp.</p>
    ${srchBox('qB','Typ je vraag, bv. back-up, R of koppelen',true)}<div class="srch-hint" id="qB-hint">Zoekt ook in de antwoorden.</div></div>`;},
  wireSearch(){const inp=document.getElementById('qB');if(inp)inp.oninput=()=>B.search(inp.value);},
  home(){
    B.view='home';
    document.getElementById('bTop').innerHTML=B.hero();B.wireSearch();
    B.homeBody();
  },
  homeBody(){
    document.getElementById('bBody').innerHTML=`
      <h3 class="vb-sec">Kies een onderwerp</h3>
      <div class="tiles">${HELP.map(c=>`<button class="tile" data-cat="${c.ci}"><span class="ti" aria-hidden="true">${c.ic}</span><span class="tn">${esc(c.title)}</span><span class="td">${esc(c.desc)}</span><span class="tc">${c.items.length} vragen →</span></button>`).join('')}</div>
      <div class="vb-two"><div class="vb-pop"><h3>Populaire vragen</h3><ul>${POPULAR.map(q=>{const it=byQ(q);return `<li><button data-q="${it.dom}"><span>${esc(it.q)}</span><small>${esc(CATS[it.ci].title)}</small></button></li>`;}).join('')}</ul></div>
      ${makerBlock({teaser:true})}</div>`;
    B.wireBody();
  },
  wireBody(){
    main.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>B.cat(+b.dataset.cat));
    main.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const it=byDom(b.dataset.q);B.cat(it.ci,it.dom);});
    main.querySelectorAll('[data-open-maker]').forEach(b=>b.onclick=()=>B.cat(MAKER.ci));
  },
  cat(ci,openDom){
    B.view=ci;const c=CATS[ci];
    document.getElementById('bTop').innerHTML='';
    const others=HELP.filter(o=>o.ci!==ci);
    document.getElementById('bBody').innerHTML=`<div class="vb-cat" id="bCat" tabindex="-1">
      <button class="vb-back" data-home>${svg(IC.back,16)} Alle onderwerpen</button>
      ${c.maker?makerBlock():`<section class="cat" aria-labelledby="h-${c.ci}">${catHead(c)}<div class="rows">${c.items.map(it=>qrow(it)).join('')}</div></section>`}
      <div class="vb-other"><h3 class="vb-sec">Andere onderwerpen</h3><div class="chips">${others.map(o=>`<button class="chip" data-cat="${o.ci}">${o.ic} ${esc(o.title)}</button>`).join('')}${c.maker?'':`<button class="chip" data-cat="${MAKER.ci}">💬 Van de maker</button>`}</div></div></div>`;
    main.querySelector('[data-home]').onclick=()=>{B.home();document.getElementById('qB').focus();};
    B.wireBody();
    window.scrollTo(0,0);
    if(openDom){const d=document.getElementById(openDom);d.open=true;d.scrollIntoView({block:'center'});d.querySelector('summary').focus({preventScroll:true});}
    else document.getElementById('bCat').focus({preventScroll:true});
  },
  search(q){
    if(!q.trim()){B.homeBody();return;}
    let hits=0;
    const groups=CATS.map(c=>({c,its:c.items.filter(it=>match(it,q))})).filter(g=>g.its.length);
    groups.forEach(g=>hits+=g.its.length);
    document.getElementById('bBody').innerHTML=hits?`<div class="vb-cat vb-results"><h3 class="vb-sec">${hits} ${hits===1?'vraag':'vragen'} gevonden</h3>
      ${groups.map(g=>`<section class="cat">${catHead(g.c,'h3')}<div class="rows">${g.its.map(it=>qrow(it,q).replace('<details class="qrow"',hits<=OPEN_MAX?'<details open class="qrow"':'<details class="qrow"')).join('')}</div></section>`).join('')}</div>`
      :`<div class="vb-cat">${noneBox(q)}</div>`;
    wireSuggest(document.getElementById('bBody'),document.getElementById('qB'),()=>B.search(document.getElementById('qB').value));
    say(hits?`${hits} ${hits===1?'vraag':'vragen'} gevonden`:'Niets gevonden');
  },
  open(dom){const it=byDom(dom);if(it)B.cat(it.ci,dom);},
  goto(id){B.open('faq-'+id);}
};

/* ═══ Variant C · Lezen: vragenlijst links, antwoord groot rechts ═══ */
const C={
  sel:null,q:'',
  render(){
    main.innerHTML=`<div class="vc" id="vc">
      <div class="vc-list"><div class="srchbox">${srchBox('qC','Zoek, bv. back-up of R')}<div class="srch-hint sr" id="qC-hint">Zoekt ook in de antwoorden. Enter opent de eerste.</div>
        <label class="vc-jump"><span>Spring naar</span><select id="cJump"><option value="">Kies een onderwerp…</option>${HELP.map(c=>`<option value="${c.ci}">${c.ic} ${esc(c.title)} (${c.items.length})</option>`).join('')}</select></label></div>
        <div class="vc-scroll" id="cList"></div></div>
      <article class="vc-pane" id="cPane" tabindex="-1" aria-live="off"></article></div>${moraniLine()}`;
    const inp=document.getElementById('qC');
    inp.oninput=()=>{C.q=inp.value;C.list();};
    document.getElementById('cJump').onchange=e=>{const v=e.target.value;if(v==='')return;
      if(C.q){C.q='';inp.value='';C.list();}
      const g=document.getElementById('g-'+v);const box=document.getElementById('cList');
      box.scrollTop+=g.getBoundingClientRect().top-box.getBoundingClientRect().top;
      if(document.getElementById('vc').offsetWidth<700)g.scrollIntoView({block:'start'});
      const f=g.parentElement.querySelector('.vc-q');if(f)f.focus({preventScroll:true});e.target.value='';};
    inp.onkeydown=e=>{if(e.key==='Enter'){const f=document.querySelector('#cList .vc-q');if(f)f.click();}
      if(e.key==='ArrowDown'){e.preventDefault();const f=document.querySelector('#cList button');if(f)f.focus();}};
    document.getElementById('cList').onkeydown=e=>{
      if(e.key!=='ArrowDown'&&e.key!=='ArrowUp')return;e.preventDefault();
      const bs=[...document.querySelectorAll('#cList button')];const i=bs.indexOf(document.activeElement);
      const n=bs[i+(e.key==='ArrowDown'?1:-1)];if(n)n.focus();else if(e.key==='ArrowUp')inp.focus();};
    C.list();C.pane();
  },
  list(){
    const q=C.q;let hits=0;
    const groups=HELP.map(c=>({c,its:c.items.filter(it=>!q.trim()||match(it,q))})).filter(g=>g.its.length);
    groups.forEach(g=>hits+=g.its.length);
    const mkHit=!q.trim()||MAKER.items.some(it=>match(it,q));
    document.getElementById('cList').innerHTML=
      (mkHit?`<button class="vc-mk" data-maker aria-current="${C.sel==='maker'}"><span class="mk-av" aria-hidden="true">Z</span><span><b>Van de maker</b><small>Waarom SyncJournal is zoals hij is</small></span></button>`:'')+
      groups.map(g=>`<div class="vc-g" role="group" aria-labelledby="g-${g.c.ci}"><h3 id="g-${g.c.ci}"><span aria-hidden="true">${g.c.ic}</span>${esc(g.c.title)}<span class="c">${g.its.length}</span></h3>
        ${g.its.map(it=>`<button class="vc-q" data-k="${it.key}" aria-current="${C.sel===it.key}">${hl(it.q,q)}${snipHtml(it,q)}</button>`).join('')}</div>`).join('')+
      (q.trim()&&!hits&&!mkHit?`<div style="padding:8px">${noneBox(q)}</div>`:'');
    document.querySelectorAll('#cList [data-k]').forEach(b=>b.onclick=()=>C.select(b.dataset.k,true));
    document.querySelectorAll('#cList [data-maker]').forEach(b=>b.onclick=()=>C.select('maker',true));
    wireSuggest(document.getElementById('cList'),document.getElementById('qC'),()=>{C.q=document.getElementById('qC').value;C.list();});
    if(q.trim())say(hits||mkHit?`${hits} ${hits===1?'vraag':'vragen'} gevonden`:'Niets gevonden');
  },
  select(k,focus,anchor){
    C.sel=k;document.getElementById('vc').classList.add('reading');
    document.querySelectorAll('#cList [aria-current]').forEach(b=>b.setAttribute('aria-current',String((b.dataset.k||'maker')===k)));
    C.pane();
    const pane=document.getElementById('cPane');
    if(anchor){const s=document.getElementById(anchor);if(s)s.scrollIntoView({block:'start'});}
    else if(pane.getBoundingClientRect().top<0||document.getElementById('vc').offsetWidth<700)window.scrollTo(0,0);
    if(focus)pane.focus({preventScroll:true});
  },
  pane(){
    const pane=document.getElementById('cPane');
    const back=`<button class="vc-back" data-back>${svg(IC.back,16)} Alle vragen</button>`;
    if(!C.sel){
      pane.innerHTML=`<div class="vc-welcome"><h2>Waarmee kunnen we je helpen?</h2><p>Kies links een vraag, of zoek. Nieuw hier? Begin met een van deze:</p>
        <div class="grid">${POPULAR.map(q=>{const it=byQ(q);return `<button data-k="${it.key}"><small>${CATS[it.ci].ic} ${esc(CATS[it.ci].title)}</small>${esc(it.q)}</button>`;}).join('')}</div></div>`;
    }else if(C.sel==='maker'){
      pane.innerHTML=`${back}<div class="vc-letter"><div class="mk-top"><span class="mk-av" aria-hidden="true">Z</span><div><div class="mk-kick">Van de maker</div><h2 style="margin:0">Waarom SyncJournal is zoals hij is</h2></div></div>
        ${MAKER.items.map(it=>`<section id="${it.dom}"><h3>${esc(it.q)}</h3><div class="ans">${it.html}</div></section>`).join('')}
        <div class="mk-sig">${SIGN}</div></div>`;
    }else{
      const it=ALL.find(x=>x.key===C.sel);const c=CATS[it.ci];
      const flat=HELP.flatMap(x=>x.items);const i=flat.indexOf(it);const pv=flat[i-1],nx=flat[i+1];
      pane.innerHTML=`${back}<div class="vc-crumb"><span aria-hidden="true">${c.ic}</span>${esc(c.title)}</div>
        <h2>${esc(it.q)}</h2><div class="ans">${it.html}</div>
        <div class="vc-more"><h3>Meer over ${esc(c.title.toLowerCase())}</h3><ul>${c.items.filter(x=>x!==it).map(x=>`<li><button data-k="${x.key}">${esc(x.q)}</button></li>`).join('')}</ul></div>
        <div class="vc-nav">${pv?`<button data-k="${pv.key}"><small>← Vorige</small>${esc(pv.q)}</button>`:''}${nx?`<button class="nx" data-k="${nx.key}"><small>Volgende →</small>${esc(nx.q)}</button>`:''}</div>`;
    }
    pane.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>C.select(b.dataset.k,true));
    pane.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{document.getElementById('vc').classList.remove('reading');const k=C.sel;
      const t=document.querySelector(`#cList [data-k="${k}"]`)||document.querySelector('#cList [data-maker]');if(t){t.scrollIntoView({block:'center'});t.focus();}});
  },
  open(dom){const it=byDom(dom);if(!it)return;
    if(it.ci===MAKER.ci)C.select('maker',true,dom);else{if(C.q){C.q='';document.getElementById('qC').value='';C.list();}C.select(it.key,true);}},
  goto(id){C.open('faq-'+id);}
};

/* ═══ "Lees mijn visie ↗" uit de app-data: werkt in elke variant ═══ */
function faqGoto(id){V[cur].goto(id);}

/* ═══ Schakelaars ═══ */
const V={A,B,C};
const main=document.getElementById('main');
const P=new URLSearchParams(location.search);
let cur=['A','B','C'].includes(P.get('v'))?P.get('v'):'A';
let theme=P.get('t')==='dark'?'dark':'light';
let width=P.get('w')==='390'?'390':'desk';
function syncUrl(){const u=new URLSearchParams({v:cur,t:theme,w:width});history.replaceState(null,'','?'+u);}
function paint(){
  document.body.classList.toggle('dark',theme==='dark');
  document.getElementById('stage').classList.toggle('w390',width==='390');
  document.getElementById('btnTheme').innerHTML=svg(theme==='dark'?IC.sun:IC.moon,16);
  document.querySelectorAll('.seg').forEach(s=>{const val={v:cur,t:theme,w:width}[s.dataset.k];s.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.val===val)));});
}
function show(){window.onscroll=null;B.view='home';C.sel=null;C.q='';V[cur].render();window.scrollTo(0,0);}
document.querySelectorAll('.seg').forEach(s=>s.querySelectorAll('button').forEach(b=>b.onclick=()=>{
  const k=s.dataset.k,val=b.dataset.val;
  if(k==='v'){cur=val;show();}else if(k==='t')theme=val;else{width=val;if(cur==='A')setTimeout(A.spy,50);}
  paint();syncUrl();}));
document.getElementById('btnTheme').onclick=()=>{theme=theme==='dark'?'light':'dark';paint();syncUrl();};
const shell=document.getElementById('shell'),mb=document.getElementById('btnMenu');
mb.onclick=()=>{const o=shell.classList.toggle('nav-open');mb.setAttribute('aria-expanded',String(o));};
document.getElementById('navscrim').onclick=()=>{shell.classList.remove('nav-open');mb.setAttribute('aria-expanded','false');};
paint();show();
// ?open=<dom-id>,<dom-id> opent vragen direct (handig voor screenshots)
(P.get('open')||'').split(',').filter(Boolean).forEach(d=>V[cur].open(d));
</script>
