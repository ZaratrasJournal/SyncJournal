<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SyncJournal · FAQ-demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  FAQ-demo (25-10-2026). Drie varianten voor opmaak, navigatie en leesbaarheid van de FAQ.
  De teksten zijn de echte FAQS uit work/syncjournal.html (main, bijgewerkt bij het
  archiveren op 26-10-2026). Zie docs/research-faq-design-2026-10-25.md en
  docs/demo-faq-keuzes.md. Schakelaars bovenin; ook via de URL: ?v=A|B|C&t=light|dark&w=390
-->
<style>
/* ══ Tokens: overgenomen uit work/syncjournal.html ══ */
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --raise:#FBFCFE; --sink:#F7F9FC;
  --ink:#191E2A; --ink2:#525A6B; --muted:#6B7385; --faint:#7A8291;
  --line:#E8EBF2; --line2:#F0F2F7;
  --accent:#3B5BD9; --accent-soft:#EDF0FD; --accent-line:#CDD6F7;
  --green:#12946A; --green-soft:#E3F4EC; --red:#D64259; --red-soft:#FBE8EC; --amber:#C0821C; --amber-soft:#F8EFDD;
  --violet:#7C5CE0; --teal:#0E9E96;--pink:#D6409F;
  --grid:#EDEFF5; --hover:#F6F8FC; --track:#EEF1F6; --zebra:#FAFBFD;
  --fb:'Inter',sans-serif; --fd:'Plus Jakarta Sans',sans-serif; --fn:'IBM Plex Mono',monospace;
  --sh:0 1px 2px rgba(20,30,60,.05);
  /* demo-only */
  --scrim:rgba(10,20,40,.45);
  --tb:48px; --ab:62px;
}
body.dark{
  --bg:#0E1218; --surface:#141A22; --raise:#171E28; --sink:#10151c;
  --ink:#F4F7FB; --ink2:#C7CFDB; --muted:#939CAC; --faint:#6C7583;
  --line:#232B36; --line2:#1C232D;
  --accent:#6E86F0; --accent-soft:#1B2436; --accent-line:#2E3B57;
  --green:#37C48B; --green-soft:#12261F; --red:#F0637A; --red-soft:#2A1820; --amber:#E0A63C; --amber-soft:#28210F;
  --violet:#A78BFA; --teal:#2CC5B6;--pink:#F472B6;
  --grid:#1B222C; --hover:#19212B; --track:#1E2732; --zebra:#12171f;
  --sh:0 1px 2px rgba(0,0,0,.25);
  --scrim:rgba(0,0,0,.55);
}
*{margin:0;padding:0;box-sizing:border-box}
/* Afgeleide tokens op body, niet op :root: dan rekenen ze met de donkere waarden als body.dark actief is */
body{--mark:color-mix(in srgb,var(--amber) 28%,transparent);
  --mk-ink:color-mix(in srgb,var(--violet) 78%,var(--ink));   /* paars voor tekst: haalt AA op de maker-achtergrond */}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
h1,h2,h3,h4{font-family:var(--fd);font-weight:700;letter-spacing:-.01em}
input{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);border:0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ══ Demo-balk (hoort niet bij de app) ══ */
.demobar{position:sticky;top:0;z-index:100;height:var(--tb);display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
.demobar .dlab{font-family:var(--fd);font-weight:800;font-size:13px}
.demobar .dlab span{color:var(--muted);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.seg button{padding:6px 11px;font-size:12px;font-weight:700;color:var(--ink2);background:var(--sink)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.stagewrap{background:var(--sink)}
.stage{container:stage/inline-size;margin:0 auto;width:100%;background:var(--bg);min-height:calc(100vh - var(--tb));overflow-x:clip}   /* clip, geen hidden: hidden breekt position:sticky */
.stage.w390{width:390px;border-left:1px solid var(--line);border-right:1px solid var(--line)}

/* ══ App-shell: overgenomen uit work/syncjournal.html ══ */
.shell{display:grid;grid-template-columns:236px 1fr;min-height:calc(100vh - var(--tb));position:relative}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:var(--tb);height:calc(100vh - var(--tb))}
.logo{font-family:var(--fd);font-weight:800;font-size:17px;letter-spacing:-.02em;padding:20px 22px 16px}
.logo span{color:var(--accent)}
.side nav{display:flex;flex-direction:column;gap:2px;padding:6px 12px}
.side .navbot{border-top:1px solid var(--line2);padding-top:9px}
.side .side-sp{flex:1 1 auto;min-height:10px}
.side nav button{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;color:var(--ink2);font-size:13.5px;font-weight:600;text-align:left;width:100%;border-left:2px solid transparent}
.side nav button .nav-ic{color:var(--pc,var(--accent));display:inline-flex;opacity:.9}
.side nav button:hover{background:var(--hover);color:var(--ink)}
.side nav button.on{background:color-mix(in srgb,var(--pc,var(--accent)) 13%,transparent);color:var(--pc,var(--accent));border-left-color:var(--pc,var(--accent));border-radius:0 8px 8px 0}
.side-foot{border-top:1px solid var(--line);padding:10px 18px;font-size:8px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);line-height:1.5}
.side-foot b{font-size:9.5px;color:var(--ink2);letter-spacing:.04em}
.body{min-width:0;display:flex;flex-direction:column}
.appbar{display:flex;align-items:center;gap:16px;padding:0 30px;height:var(--ab);border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:var(--tb);z-index:30}
.appbar h1{font-size:19px}
.appbar .ptbar{width:4px;height:21px;border-radius:3px;background:var(--teal);flex:none;margin-right:-8px}
.appbar .sub{color:var(--muted);font-size:12.5px;font-weight:500;margin-left:-8px}
.appbar .sp{flex:1}
.iconbtn,.hamb{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink2)}
.iconbtn:hover{color:var(--ink);border-color:var(--accent-line)}
.hamb{display:none}
.navscrim{position:absolute;inset:0;background:var(--scrim);z-index:70;opacity:0;pointer-events:none;transition:opacity .25s}
main{padding:26px 30px 46px}
.morline{margin-top:28px;padding:14px 2px 0;border-top:1px solid var(--line2);font-size:12.5px;color:var(--ink2)}   /* app: --muted, 4,39:1 in licht */
.morline a{color:var(--ink2);font-weight:600;text-decoration:none;border-radius:4px}
.morline a:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.morline .dot{margin:0 2px;color:var(--faint)}
.linklike{border:none;background:none;color:var(--accent);font-weight:700;cursor:pointer;padding:0;font-size:inherit;font-family:inherit;text-align:left}
.linklike:hover{text-decoration:underline;text-underline-offset:3px}
@container stage (max-width:720px){
  .shell{grid-template-columns:1fr}
  .side{position:absolute;top:0;left:0;bottom:0;height:auto;width:252px;z-index:80;transform:translateX(-100%);transition:transform .25s ease}
  .shell.nav-open .side{transform:none}
  .shell.nav-open .navscrim{opacity:1;pointer-events:auto}
  .hamb{display:grid}
  .appbar{padding:0 14px;gap:10px}
  .appbar .sub{display:none}
  main{padding:18px 16px 40px}
}

/* ══ Gedeeld: zoeken, vraag-rijen, antwoorden ══ */
.srch{position:relative;display:block}
.srch svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.srch input{width:100%;border:1.5px solid var(--line);border-radius:11px;background:var(--surface);color:var(--ink);padding:12px 14px 12px 42px;font-size:15px;outline:none;box-shadow:var(--sh)}
.srch input::placeholder{color:var(--muted)}
.srch input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.srch-hint{margin-top:7px;font-size:12.5px;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{text-align:left;display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:12.5px;font-weight:600;color:var(--ink2)}
.chip:hover{border-color:var(--accent-line);color:var(--accent)}

.rows{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);overflow:hidden}
details.qrow+details.qrow{border-top:1px solid var(--line2)}
details.qrow summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:14px 18px;font-size:14.5px;font-weight:600;color:var(--ink);line-height:1.4}
details.qrow summary::-webkit-details-marker{display:none}
details.qrow summary:hover{background:var(--hover)}
details.qrow summary:focus-visible{outline-offset:-2px;border-radius:12px}
details.qrow summary .qt{flex:1;min-width:0}
details.qrow summary .chev{flex:none;color:var(--muted);transition:transform .2s}
details.qrow[open] summary .chev{transform:rotate(180deg);color:var(--accent)}
details.qrow[open] summary{color:var(--accent)}
details.qrow .ans{padding:0 18px 18px}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.snip{display:block;margin-top:4px;font-size:13px;font-weight:400;color:var(--ink2);line-height:1.45}

/* Antwoordtekst: 15px, gewone tekstkleur, echte alinea's, ±68 tekens per regel */
.ans{font-size:15px;line-height:1.65;color:var(--ink);max-width:68ch}
.ans>*+*{margin-top:.7em}
.ans p.kort{font-weight:650;font-size:15.5px;line-height:1.55}
.ans b{font-weight:650}
.ans ul,.ans ol{padding-left:0;list-style:none;display:flex;flex-direction:column;gap:.45em}
.ans ul li{position:relative;padding-left:20px}
.ans ul li::before{content:"";position:absolute;left:5px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.ans ol{counter-reset:st}
.ans ol li{counter-increment:st;position:relative;padding-left:34px;min-height:24px}
.ans ol li::before{content:counter(st);position:absolute;left:0;top:.05em;width:23px;height:23px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:700 12px/23px var(--fd);text-align:center}
.ans .linklike{display:inline-flex;margin-top:2px}
.ans .sig{font-family:var(--fd);font-weight:700;font-style:italic;color:var(--mk-ink)}

/* Lege staat bij zoeken */
.none{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:22px;font-size:14px;color:var(--ink);line-height:1.6}
.none h3{font-size:15px;margin-bottom:6px}
.none p+p{margin-top:8px}
.none .chips{margin:10px 0 4px}

/* "Van de maker": persoonlijk blok, duidelijk anders dan de helpdesk-vragen */
.maker{position:relative;background:color-mix(in srgb,var(--violet) 7%,var(--surface));border:1px solid color-mix(in srgb,var(--violet) 25%,var(--line));border-left:4px solid var(--violet);border-radius:14px;padding:22px 24px 18px}
.maker .mk-top{display:flex;align-items:center;gap:12px}
.maker .mk-av{width:40px;height:40px;border-radius:50%;background:var(--violet);color:var(--surface);display:grid;place-items:center;font:800 17px var(--fd);flex:none}
.maker .mk-kick{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mk-ink)}
.maker h2{font-size:18px;line-height:1.25}
.maker blockquote{margin:16px 0 4px;font-family:var(--fd);font-size:18px;line-height:1.45;font-weight:600;color:var(--ink);padding-left:26px;position:relative;max-width:60ch}
.maker blockquote::before{content:"\201C";position:absolute;left:-4px;top:-14px;font-size:52px;line-height:1;color:var(--violet);font-family:Georgia,serif}
.maker .mk-sig{font-family:var(--fd);font-style:italic;font-weight:700;color:var(--mk-ink);padding-left:26px}
.maker .rows{margin-top:16px;box-shadow:none;border-color:color-mix(in srgb,var(--violet) 22%,var(--line))}
.maker details.qrow[open] summary{color:var(--mk-ink)}
.maker details.qrow[open] summary .chev{color:var(--violet)}

/* ══ Variant A · Sidebar ══ */
.va{display:grid;grid-template-columns:252px minmax(0,740px);gap:36px;align-items:start}
.va .maker{margin-bottom:34px}
.toc{position:sticky;top:calc(var(--tb) + var(--ab) + 20px);max-height:calc(100vh - var(--tb) - var(--ab) - 40px);overflow:auto}
.toc-h{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);padding:0 10px 8px}
.toc nav{display:flex;flex-direction:column;gap:1px}
.toc a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--ink2);text-decoration:none;font-size:13.5px;font-weight:600;border-left:2px solid transparent}
.toc a .ti{width:22px;text-align:center;flex:none}
.toc a .tn{flex:1;min-width:0}
.toc a .tc{font-family:var(--fn);font-size:11.5px;color:var(--ink2);flex:none}
.toc a:hover{background:var(--hover);color:var(--ink)}
.toc a[aria-current="true"]{background:var(--accent-soft);color:var(--accent);border-left-color:var(--accent);border-radius:0 9px 9px 0}
.toc a[aria-current="true"] .tc{color:var(--accent)}
.toc a.mk[aria-current="true"]{background:color-mix(in srgb,var(--violet) 12%,transparent);color:var(--mk-ink);border-left-color:var(--violet)}
.toc a.dim{font-weight:500;cursor:default}
.toc a.dim .ti{filter:grayscale(1)}
.toc a.dim:hover{background:none;color:var(--ink2)}
.toc-help{margin-top:14px;padding:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink2);line-height:1.5}
.va-hero{margin-bottom:26px}
.va-hero h2{font-size:24px;line-height:1.2}
.va-hero p{margin:6px 0 14px;font-size:14px;color:var(--ink2);max-width:62ch}
.va-pop{margin-top:14px}
.va-pop .pl{font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:7px}
.cat{margin-bottom:34px;scroll-margin-top:calc(var(--tb) + var(--ab) + 18px)}
.cat-h{display:flex;align-items:center;gap:13px;margin-bottom:12px}
.cat-h .ci{width:40px;height:40px;border-radius:11px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:20px;flex:none}
.cat-h h2{font-size:19px;line-height:1.2}
.cat-h p{font-size:13.5px;color:var(--ink2);margin-top:2px}
.cat-h .cnt{margin-left:auto;font-size:12px;color:var(--ink2);font-weight:600;white-space:nowrap;align-self:flex-start;padding-top:3px}
@container stage (max-width:980px){
  .va{grid-template-columns:1fr;gap:0}
  .toc{position:sticky;top:calc(var(--tb) + var(--ab));z-index:20;max-height:none;margin:0 -16px 18px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
  .toc::-webkit-scrollbar{display:none}
  .toc-h,.toc-help{display:none}
  .toc nav{flex-direction:row;gap:6px;width:max-content}
  .toc a{border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:6px 12px;font-size:12.5px;white-space:nowrap;gap:6px}
  .toc a .ti{width:auto}
  .toc a[aria-current="true"],.toc a.mk[aria-current="true"]{border-radius:999px;border-left-width:1px}
  .va-hero{order:-1}
  .cat{scroll-margin-top:calc(var(--tb) + var(--ab) + 64px)}
}
@container stage (max-width:720px){
  .va-hero h2{font-size:21px}
  .cat-h .cnt{display:none}
  .cat-h h2{font-size:17.5px}
  .maker{padding:18px 16px 14px}
  .maker blockquote{font-size:16.5px}
  details.qrow summary{padding:14px 14px}
  details.qrow .ans{padding:0 14px 16px}
}

/* ══ Variant B · Tegels ══ */
.vb{max-width:1000px;margin:0 auto}
.vb-hero{text-align:center;padding:18px 0 6px}
.vb-hero h2{font-size:27px;line-height:1.2}
.vb-hero p{margin:6px auto 18px;font-size:14.5px;color:var(--ink2);max-width:58ch}
.vb-hero .srch{max-width:620px;margin:0 auto}
.vb-hero .srch input{padding:15px 16px 15px 46px;font-size:16px;border-radius:13px}
.vb-hero{margin-bottom:26px}
.vb-two{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.vb-pop{text-align:left}
.vb-pop h3,.vb-sec{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin:0 0 9px 2px;font-family:var(--fb)}
.vb-pop ul{list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);overflow:hidden}
.vb-pop li+li{border-top:1px solid var(--line2)}
.vb-pop button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 16px;font-size:14.5px;font-weight:600;color:var(--ink)}
.vb-pop button:hover{background:var(--hover);color:var(--accent)}
.vb-pop button small{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:26px}
@container stage (max-width:1100px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;box-shadow:var(--sh);transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--accent-line);transform:translateY(-1px)}
.tile .ti{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;font-size:21px;margin-bottom:6px}
.tile .tn{font-family:var(--fd);font-weight:700;font-size:15.5px;color:var(--ink);line-height:1.25}
.tile .td{font-size:13px;color:var(--ink2);line-height:1.45}
.tile .tc{margin-top:auto;padding-top:8px;font-size:12px;font-weight:700;color:var(--accent)}
.vb .maker{margin-top:27px}
.vb .maker blockquote{font-size:16.5px}
.vb .maker .mk-go{margin-top:12px;padding-left:26px}
.vb-back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--accent);padding:6px 0;margin-bottom:12px}
.vb-cat{max-width:780px;margin:0 auto}
.vb-cat .cat-h h2{font-size:22px}
.vb-cat:focus{outline:none}
.vb-other{margin-top:26px}
.vb-results .cat{margin-bottom:22px}
.vb-results .cat-h .ci{width:32px;height:32px;font-size:16px;border-radius:9px}
.vb-results .cat-h h2{font-size:16px}
@container stage (max-width:720px){
  .vb-hero{text-align:left;padding-top:4px}
  .vb-hero h2{font-size:22px}
  .vb-hero p{margin-left:0}
  .tiles{grid-template-columns:1fr 1fr;gap:9px}
  .tile{padding:13px 12px 12px}
  .tile .td{display:none}
  .tile .ti{width:36px;height:36px;font-size:18px}
  .tile .tn{font-size:14px}
  .vb-pop button small{display:none}
  .vb-two{grid-template-columns:1fr}
  .maker{padding:18px 16px 14px}
  .maker blockquote{font-size:16.5px}
  details.qrow summary{padding:14px 14px}
  details.qrow .ans{padding:0 14px 16px}
}

/* ══ Variant C · Lezen (lijst + leesvenster) ══ */
.vc{display:grid;grid-template-columns:360px minmax(0,1fr);gap:28px;align-items:start}
.vc-list{position:sticky;top:calc(var(--tb) + var(--ab) + 20px);max-height:calc(100vh - var(--tb) - var(--ab) - 40px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);overflow:hidden}
.vc-list .srchbox{padding:12px;border-bottom:1px solid var(--line2)}
.vc-list .srch input{box-shadow:none;background:var(--sink);padding:10px 12px 10px 40px;font-size:14px}
.vc-scroll{overflow:auto;padding:6px 6px 10px}
.vc-jump{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:12px;font-weight:700;color:var(--ink2)}
.vc-jump select{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:7px 8px;font:600 13px var(--fb)}
.vc-g h3{scroll-margin-top:calc(var(--tb) + var(--ab) + 8px)}
.vc-mk{display:flex;align-items:center;gap:10px;width:calc(100% - 4px);margin:4px 2px 6px;padding:10px 12px;border-radius:10px;text-align:left;background:color-mix(in srgb,var(--violet) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--violet) 25%,var(--line));border-left:3px solid var(--violet)}
.vc-mk .mk-av{width:30px;height:30px;border-radius:50%;background:var(--violet);color:var(--surface);display:grid;place-items:center;font:800 13px var(--fd);flex:none}
.vc-mk b{display:block;font-size:13.5px;color:var(--ink)}
.vc-mk small{font-size:12px;color:var(--ink2)}
.vc-mk[aria-current="true"]{box-shadow:0 0 0 2px var(--violet) inset}
.vc-g h3{position:sticky;top:-6px;background:var(--surface);z-index:1;display:flex;align-items:center;gap:7px;font-family:var(--fb);font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);padding:12px 10px 6px}
.vc-g h3 span.c{margin-left:auto;font-family:var(--fn);font-weight:500;letter-spacing:0;color:var(--ink2)}
.vc-q{display:block;width:100%;text-align:left;padding:8px 10px 8px 12px;border-radius:8px;font-size:13.5px;line-height:1.4;color:var(--ink);font-weight:500;border-left:2px solid transparent}
.vc-q:hover{background:var(--hover)}
.vc-q[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:650;border-left-color:var(--accent);border-radius:0 8px 8px 0}
.vc-pane{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:28px 34px 30px;min-height:420px}
.vc-pane:focus{outline:none}
.vc-crumb{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:8px}
.vc-pane h2{font-size:23px;line-height:1.25;max-width:30ch;margin-bottom:16px}
.vc-pane .ans{font-size:15.5px;max-width:66ch}
.vc-pane .ans p.kort{font-size:16.5px}
.vc-more{margin-top:28px;padding-top:16px;border-top:1px solid var(--line2)}
.vc-more h3{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);font-family:var(--fb);margin-bottom:8px}
.vc-more ul{list-style:none;display:flex;flex-direction:column;gap:2px}
.vc-more button{font-size:14px;font-weight:600;color:var(--accent);text-align:left;padding:4px 0}
.vc-more button:hover{text-decoration:underline;text-underline-offset:3px}
.vc-nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.vc-nav button{flex:1;max-width:48%;text-align:left;border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-size:13px;color:var(--ink);background:var(--sink)}
.vc-nav button:hover{border-color:var(--accent-line)}
.vc-nav button small{display:block;font-size:11px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
.vc-nav button.nx{text-align:right;margin-left:auto}
.vc-back{display:none;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--accent);padding:4px 0;margin-bottom:12px}
.vc-welcome h2{max-width:none}
.vc-welcome p{font-size:15px;color:var(--ink2);max-width:60ch;margin-bottom:16px}
.vc-welcome .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.vc-welcome .grid button{text-align:left;border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:var(--sink);font-size:14px;font-weight:600;color:var(--ink);line-height:1.4}
.vc-welcome .grid button:hover{border-color:var(--accent-line);color:var(--accent)}
.vc-welcome .grid button small{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-bottom:3px}
.vc-letter{border-left:4px solid var(--violet);padding-left:22px}
.vc-letter .mk-top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.vc-letter .mk-av{width:44px;height:44px;border-radius:50%;background:var(--violet);color:var(--surface);display:grid;place-items:center;font:800 18px var(--fd)}
.vc-letter .mk-kick{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mk-ink)}
.vc-letter section{margin-top:26px;scroll-margin-top:calc(var(--tb) + var(--ab) + 20px)}
.vc-letter section h3{font-size:17px;margin-bottom:8px;color:var(--ink)}
.vc-letter .mk-sig{margin-top:22px;font-family:var(--fd);font-style:italic;font-weight:700;font-size:16px;color:var(--mk-ink)}
@container stage (max-width:900px){
  .vc{grid-template-columns:1fr}
  .vc-list{position:static;max-height:none}
  .vc.reading .vc-list{display:none}
  .vc:not(.reading) .vc-pane{display:none}
  .vc-back{display:inline-flex}
  .vc-pane{padding:20px 18px 22px;border-radius:12px}
  .vc-pane h2{font-size:20px}
  .vc-pane .ans{font-size:15px}
  .vc-pane .ans p.kort{font-size:15.5px}
  .vc-letter{padding-left:14px}
  .vc-g h3{top:0}
  .vc-q{padding:10px 10px 10px 12px;font-size:14px}
}
</style>

<script>
/* ═══ Echte FAQ-data, gekopieerd uit work/syncjournal.html (main) ═══ */
const faqVisie=id=>' <button class="linklike" onclick="faqGoto(\''+id+'\')">Waarom zo? Lees mijn visie ↗</button>';
const FAQS=[
  ['🚀 Aan de slag',[
    ['Wat is SyncJournal precies?','Een <b>trading-journal</b>: een dagboek voor je trades. Per trade bewaar je je instap, je uitstap, je screenshots en hoe je je voelde. Je kunt ook je <b>exchange</b> koppelen (het platform waar je handelt, zoals Kraken of OKX); dan komen je trades vanzelf binnen. De app rekent daarna uit wat bij jou werkt en wat niet. Zo leer je van je eigen gedrag in plaats van te gokken.'],
    ['Is SyncJournal echt gratis? Heb ik een account nodig?','Ja, het is gratis, en je hebt geen account, e-mail of wachtwoord nodig. Alles draait in je eigen browser.'],
    ['Ik ben niet zo technisch, is dit iets voor mij?','Ja. Begin klein: voer trades in op <b>Trades</b> en kijk af en toe op het <b>Dashboard</b>. Analytics en Tendencies worden pas interessant als er meer trades in staan. Vind je het druk? Kies bij <b>Instellingen → Weergave</b> de stand <b>🌿 Rustig</b>; dan zie je alleen de basis. De meeste dingen zet je met één klik terug. Alleen het tabje <b>Wissen</b> is echt onomkeerbaar, dus maak daarvoor eerst een back-up.'],
    ['Hoe voeg ik mijn eerste trade toe?','Klik op <b>Trades → + Nieuwe trade</b>. Verplicht is alleen het <b>pair</b> (wat je handelt, bv. BTC/USDT). Bij een gesloten trade ook je <b>entry</b> (je instapprijs) of je <b>P&L</b> (je winst of verlies). De rest vul je in wanneer je wilt. Liever niet alles met de hand? Koppel je exchange bij <b>Instellingen → Accounts</b>, of lees een back-up in bij <b>Instellingen → Data</b>.'],
    ['Kan ik eerst rondkijken zonder mijn eigen trades?','Ja, met voorbeelddata. Klik op de startpagina van syncjournal.nl op <b>Rondkijken met voorbeelddata</b>, of kies in de app <b>Instellingen → Data → Voorbeelddata laden</b>. Je krijgt dan ±1.100 voorbeeldtrades van één trader, met accounts, playbooks en tags. Let op: laden <b>overschrijft</b> je huidige journal. De app maakt eerst wel automatisch een veiligheidskopie. Klaar met kijken? <b>Voorbeelddata opruimen</b> op dezelfde plek haalt het weer weg; wat je zelf toevoegde blijft staan.'],
    ['In welke volgorde leer ik de app het beste kennen?','Volg het menu van boven naar beneden.<ol><li><b>Trades</b>: voer je trades in, of koppel je exchange.</li><li><b>Dashboard</b>: je resultaat in één oogopslag.</li><li><b>Kalender</b>: welke dagen groen en welke rood waren.</li><li><b>Playbook</b>: leg je vaste manieren van traden vast.</li><li><b>Analytics</b> en <b>Tendencies</b>: vanaf ongeveer 30 trades zie je hier patronen.</li><li><b>Review</b>: kijk je trades terug en leer ervan.</li></ol>Stel ook meteen je tags in bij <b>Instellingen → Tags</b>. Dan wordt alles daarna rijker.'],
  ]],
  ['💡 Waarom SyncJournal · mijn visie',[
    ['Waarom heb je SyncJournal gebouwd?','Om mezelf structuur en kaders te geven, en om jullie daarbij te helpen.<br><br>Ik heb zelf structuur en kaders nodig om goed te traden, en traden liet me dat heel duidelijk zien. Het is een goede spiegel: ik heb mezelf er ook beter door leren kennen.<br><br>Om die structuur en kaders vorm te geven heb ik de journal gebouwd. Voor mezelf, maar ook om jullie daarbij te helpen. Inmiddels ben ik echt mega blij met hoe de journal draait, en ik werk er nog wekelijks aan om verbeteringen door te voeren.<br><br><i>Zaratras</i>','visie-waarom'],
    ['Voor wie is de journal gemaakt?','Voor jullie: ik heb hem zo gebouwd dat je de strategieën van Morani er optimaal in kwijt kunt.<br><br>De strategieën werken. Het verschil zit in hoe jij ze toepast.<br><br>De één legt makkelijk de puzzelstukjes vanuit kennis, ervaring en intuïtie. De ander heeft meer structuur en kaders nodig. Iedereen is anders, en ik hoop dat de journal jullie daarin kan ondersteunen.','visie-voorwie'],
    ['Waarom werk ik met een vaste set tags?','Omdat je dan vooraf goed nadenkt over welke tags je wilt gebruiken, en je data overzichtelijk blijft.<br><br><b>Wat zijn tags?</b> Tags zijn sleutelwoorden die je aan iets koppelt, hier aan een trade. Ze helpen je om data te ordenen, in groepen in te delen en makkelijker terug te vinden.<br><br>Als je tags consequent aan je trades koppelt, bouw je data op. Daarmee haal je sneller je goede en je slechte trades eruit.<br><br><b>Waar stel je ze in?</b> Op de instellingenpagina, bij <b>Instellingen → Tags</b>. Daarbij heb ik zoveel mogelijk ingespeeld op de strategieën van Morani, en hoe je die gestructureerd kunt inzetten:<ul><li>het setup-type</li><li>je confirmaties (de bevestigingen voor je instap)</li><li>het timeframe (de tijdsperiode van je chart, bv. 4H of Daily)</li><li>emoties</li><li>fouten</li><li>missed-redenen (waarom je een trade liet liggen; handig voor het backtesten, oefenen op koersdata uit het verleden)</li><li>en je eigen labels.</li></ul><b>Waarom niet in de trade zelf?</b> Bij andere journals voeg je tags toe in de trade zelf. Het nadeel daarvan vond ik dat je op dat moment steeds nieuwe tags aan de bestaande lijst toevoegt. Dat werd een grote wirwar aan tags, waar je vervolgens niks mee deed. Daarom mijn visie: werk vanuit een standaardset tags waar jij mee wilt werken.','visie-tags'],
    ['Waarom een playbook?','Omdat je data nodig hebt om je edge te bewijzen, en een <b>playbook</b> (je vaste manier van traden, met regels) laat zien waar die zit.<br><br>De visie achter het playbook komt van SMB Capital, een grote prop firm in New York (een bedrijf dat traders met zijn eigen geld laat handelen). Mike Bellafiore heeft er ook een boek over geschreven: <i>The Playbook</i>. Ik heb het zelf (nog) niet gelezen, maar wel een aantal YouTube-video\'s erover bekeken.<br><br><b>Waarom het zo belangrijk is.</b> Het playbook laat zien wat je best en slechtst presterende strategieën zijn, wat je sterke kanten zijn en waar je valkuilen zitten. Om je <b>edge</b> (je voordeel: waar je structureel geld verdient) te bewijzen heb je data nodig. Zo kom je uit de emotie, en ga je traden op harde criteria, onderbouwd door data.<br><br>Als je een beetje serieus wilt worden met traden en wilt gaan opschalen, dan heb je naar mijn mening een journal en playbooks nodig.','visie-playbook'],
    ['Waarom een review-pagina?','Omdat je het meest leert van je eigen trades als je ze terugkijkt.<br><br>Zoals vaak is benoemd is backtesten (terugkijken en testen op koersdata uit het verleden) belangrijk. Niet alleen in de chart, maar ook door even je trades van die week erbij te pakken. Hoe ben ik ingestapt, en hoe zijn ze uitgespeeld?<br><br>De review-pagina biedt de mogelijkheid om dit per trade zelf te doen (<b>Per trade</b>). Of per beeld samen met de coach (<b>🖼 Beeld</b>), met een snel overzicht om samen met de coach te doorlopen.<br><br>Je kunt de trades ook exporteren of presenteren, waarbij Sebas zijn comments kan geven.<br><br><small>Met "de coach" bedoel ik hier Sebas, de coach van onze community. Dat is iets anders dan <b>Mori</b>: die kijkt automatisch naar je eigen cijfers.</small>','visie-review'],
  ]],
  ['💾 Jouw data & privacy',[
    ['Waar wordt mijn data opgeslagen? Staat die online?','In je eigen browser, op dít apparaat. Ook als je SyncJournal opent via syncjournal.nl: de site levert alleen de app, je trades verlaten je computer niet. Er zijn drie uitzonderingen, en die kies je zelf:<ul><li>Een <b>sync</b> (je trades ophalen bij je exchange) praat met je exchange. Bij OKX en Kraken loopt dat via onze tussenserver.</li><li>Een <b>Drive-back-up</b> gaat naar je eigen Google Drive.</li><li>Voor bedragen in euro haalt de app de dagkoers van de ECB (Europese Centrale Bank) op.</li></ul>Je data hoort dus bij deze browser. Andere computer? Zie de vraag over overzetten.'],
    ['Ik kom van de oude TradeJournal, hoe zet ik mijn trades over?','Met een back-up uit je oude journal, die je hier inleest.<ol><li>Open je <b>oude</b> journal en maak een back-up: <b>Backup & Restore → Backup exporteren (.json)</b>.</li><li>Ga hier naar <b>Instellingen → Data</b>. Klik bij <b>Overzetten uit oude TradeJournal</b> op <b>Importeer oude backup</b> en kies het bestand.</li><li>Je ziet eerst een <b>overzicht ter controle</b>. Pas daarna wordt er iets opgeslagen.</li></ol>Trades, playbooks, tags en je koppelingen gaan mee. Je oude journal blijft ongemoeid. Staat je oude journal in dezelfde browser, dan vindt SyncJournal hem zelf en heet de knop <b>Overzetten</b>.'],
    ['Hoe maak ik een back-up (en waarom is dat belangrijk)?','Via <b>Instellingen → Data → Exporteer JSON</b>. Je ziet eerst wat er meegaat, daarna krijg je één bestand. Zie het als de reservesleutel van je journal: bewaar het op een veilige plek. Doe dit zeker voordat je je browser opschoont of van computer wisselt.<br><br>Automatisch kan ook, onder <b>Backups</b>: <b>📁 Map</b> (een map op je computer, alleen in Chrome en Edge), <b>☁️ Drive</b> (je eigen Google Drive) of <b>✋ Zelf</b> (de app herinnert je eraan).<br><br><b>Je API-sleutels</b> (de codes waarmee de app je exchange uitleest) gaan standaard <b>niet</b> mee. Bovenaan zie je de keuze: <b>Zonder API-sleutels</b> (aanbevolen) of <b>Met API-sleutels</b>. Kies "met" alleen als je verhuist naar een andere browser of pc: iedereen met dat bestand kan je exchange-account gebruiken. Zonder sleutels vragen je koppelingen na het terugzetten opnieuw om je sleutel. Automatische back-ups en veiligheidskopieën gaan altijd zonder sleutels.','backup'],
    ['Hoe werkt de Google Drive-backup?','Je koppelt je eigen Google Drive, en de app zet daar automatisch back-ups neer.<ol><li>Ga naar <b>Instellingen → Data → Backups</b> en kies <b>☁️ Drive</b>.</li><li>Geef toestemming in het Google-venster. De app maakt een zichtbare map <b>“SyncJournal”</b> in jóuw Drive; wij kunnen daar niet bij.</li></ol>Op een andere computer open je syncjournal.nl en koppel je Drive opnieuw. Staat er al een back-up, dan biedt de app aan die over te nemen. Werk je daarna weer thuis, dan meldt de app dat er elders een nieuwere back-up is, met de knop <b>Overnemen</b>. Je huidige stand wordt dan eerst als veiligheidskopie bewaard.'],
    ['Hoe zet ik mijn journal over naar een andere computer, browser of adres?','Met een back-up: exporteren op de oude plek, importeren op de nieuwe.<ol><li>Op de oude plek: <b>Instellingen → Data → Exporteer JSON</b>.</li><li>Op de nieuwe plek: open SyncJournal en kies <b>Instellingen → Data → Importeer</b>.</li><li>Kies wat je overneemt. Trades kun je <b>vervangen</b> of <b>samenvoegen</b>.</li></ol>Dit geldt ook als je SyncJournal eerst lokaal draaide en nu syncjournal.nl gebruikt: de browser bewaart data per adres, dus je gegevens verhuizen niet vanzelf mee. Trades, screenshots, playbooks en instellingen gaan allemaal mee.'],
    ['Wat gebeurt er als ik mijn browsergegevens of cache wis?','Dan is je journal op dit apparaat weg, en de veiligheidskopieën in je browser ook. Met een back-up zet je alles in een minuut terug via <b>Instellingen → Data → Importeer</b>. Zonder back-up is het echt verloren. Maak dus regelmatig een back-up, of zet automatische back-ups aan. Bij <b>Instellingen → Data → Opslag-bescherming</b> zie je of je browser heeft beloofd je opslag niet zelf op te ruimen.'],
    ['Wat zijn veiligheidskopieën?','Reservekopieën die de app zelf maakt vóór een risicovolle actie: importeren, voorbeelddata laden of wissen. De laatste 3 staan bij <b>Instellingen → Data → Veiligheidskopieën</b>. Ging er iets mis? Klik bij de juiste kopie op <b>Herstel</b>. Met <b>Maak kopie</b> leg je zelf de huidige stand vast. Let op: deze kopieën staan in je browser. Wis je je browsergegevens, dan zijn ze ook weg. Ze vervangen dus geen echte back-up.'],
    ['Kan ik mijn bedragen verbergen?','Ja: klik op het <b>oog-icoon</b> rechtsboven, of zet <b>Instellingen → Weergave → Bedragen verbergen</b> aan. Alle bedragen in dollars of euro\'s worden dan vervaagd, ook in de grafieken, de Kalender en Analytics. Handig voor screenshots of als iemand meekijkt. Je percentages en je R-waarden (je resultaat gedeeld door je risico) blijven zichtbaar.'],
  ]],
  ['✍️ Trades bijhouden',[
    ['Wat moet ik minimaal invullen per trade?','Verplicht is alleen het pair, plus een entry of je P&L bij een gesloten trade. Maar hoe meer je invult, hoe meer de app voor je uitrekent. Deze velden zijn goud waard:<ul><li><b>Stop-loss</b>: de prijs waarop je uitstapt als het tegenzit. Zonder stop kan de app je R (resultaat gedeeld door risico) niet berekenen.</li><li><b>Playbook</b>: welke van jouw vaste manieren van traden dit was.</li><li><b>Setup-lagen</b>: per timeframe wat je op de chart zag.</li><li><b>Emoties</b> en <b>Fouten</b>: daar draait Tendencies op.</li></ul>'],
    ['Hoe voeg ik screenshots van mijn chart toe?','In het trade-formulier, bij <b>Screenshots</b>. Klik op <b>＋</b> om een bestand te kiezen. Of kopieer een screenshot en plak hem met <b>Ctrl+V</b> (Mac: ⌘+V). Je kunt er 8 per trade toevoegen. Klik op een miniatuur om hem groot te bekijken.'],
    ['Wat zijn TradingView-links en hoe gebruik ik ze?','Een link naar een plaatje van je chart in TradingView, die je later met één klik terugziet. Maak in TradingView met het <b>camera-icoon</b> een link naar je chart. Plak die in het trade-formulier bij <b>TradingView-links</b> (max 8). Op de Review-pagina open je hem met één klik in een nieuw tabblad. Zo zie je later precies de chart van dat moment.'],
    ['Wat is het verschil tussen een playbook en een setup?','Een playbook is je vaste manier van traden; een setup is het patroon dat je op de chart ziet.<ul><li><b>Playbook</b>: je recept met regels, bv. "Trend-pullback": wanneer stap je in, waar ligt je stop, wanneer blijf je weg. Per trade kies je één playbook.</li><li><b>Setup</b>: wat je ziet op één timeframe (de tijdsperiode van je chart), bv. een BOS (break of structure: de koers breekt door een eerdere top of bodem). Setups kies je in de <b>Setup-lagen</b> van een trade.</li></ul>Het veld dat vroeger "Setup" heette, heet sinds v1.9 <b>Playbook</b>. Filteren kan op allebei: <b>Alle playbooks</b> en <b>Alle setups</b>.'],
    ['Wat is het Playbook?','Je verzameling vaste manieren van traden, elk met eigen regels. Je maakt er een op de <b>Playbook</b>-pagina met <b>+ Nieuwe playbook</b>. Per playbook rekent SyncJournal uit hoe het gaat, onder andere je <b>win-rate</b> (hoe vaak je wint) en je <b>expectancy</b> (wat je gemiddeld per trade verdient). Je ziet ook welke combinaties van timeframe en setup het best werken, en of je resultaat zakt van backtest naar live.'+faqVisie('visie-playbook')],
    ['Hoe werken tags, en waar stel ik ze in?','Tags zijn sleutelwoorden die je aan een trade hangt, zodat je later ziet wat werkt. Je stelt ze één keer in bij <b>Instellingen → Tags</b>, per soort: Setup-type, Confirmaties, Timeframe, Emoties, Fouten, Missed-redenen en Eigen labels. Elke soort heeft een eigen kleur. Bij emoties bepaal je zelf wat negatief (rood) en wat positief (groen) is. In het trade-formulier klik je ze daarna alleen nog aan.'+faqVisie('visie-tags')],
    ['Wat betekenen Live, Paper, Backtest en Gemist?','Dat is de <b>soort</b> trade, en die kies je in het trade-formulier.<ul><li><b>Live</b>: met echt geld.</li><li><b>Paper</b>: op papier of een demo-account, zonder echt geld.</li><li><b>Backtest</b>: een oefentrade op koersdata uit het verleden, om een strategie te testen.</li><li><b>Gemist</b>: een trade die je zag maar niet nam. Met een <b>missed-reden</b> leg je vast waarom.</li></ul>Standaard tonen de pagina\'s alleen <b>Live trades</b>. Met het filter <b>Soort trades</b> bovenaan kijk je naar je oefentrades.'],
    ['Wat is de Plan-pagina?','Een aparte pagina (<b>Plan</b> in het menu) waar je vóór de handelsdag je plan vastlegt: je scenario\'s, je voorwaarden en waar je van afblijft. Daarna koppelt de journal zelf: een trade hoort bij het plan met hetzelfde pair en dezelfde richting dat er het kortst vóór ligt (standaard binnen 45 minuten). Zo zie je achteraf of je trade uit je plan kwam of erbuiten. Pas je een koppeling zelf aan, dan blijft die staan.'],
    ['Wat betekent de status "partial"?','Een <b>partial</b> is een positie die deels gesloten is: een of meer TP\'s (take-profits, je winstdoelen) zijn geraakt, maar de rest loopt nog.<ul><li>Het geboekte deel telt meteen mee in je Netto P&L, je equity-curve en de Kalender.</li><li>Win-rate en de andere statistieken wachten tot de hele positie dicht is. De rest kan immers nog op je stop eindigen.</li><li>Onder het bedrag staat klein de <b>unrealized</b> P&L: de stand van het open deel bij de laatste sync. Die telt nergens mee.</li></ul>Je vindt ze via het filter <b>Alle statussen → Partial</b>.'],
    ['Waarom kan ik entry en exit niet aanpassen bij een gesyncte trade?','Omdat bij een gesyncte trade (opgehaald via je exchange-koppeling) de exchange de bron is. Entry, exit, size (de grootte van je positie), fees (kosten) en P&L komen dan van de exchange en staan vast. Stop-loss, risico, notities, tags, grade en screenshots blijven van jou. Komt je stop zelf van de exchange, dan staat die ook vast; zie de vraag over de stop-loss. Handmatige trades en CSV-imports kun je wel helemaal aanpassen.'],
  ]],
  ['🔄 Exchanges koppelen & sync',[
    ['Welke exchanges worden ondersteund?','Vier exchanges met een koppeling: <b>Blofin</b>, <b>OKX</b>, <b>Hyperliquid</b> en <b>Kraken Futures</b>. Een koppeling haalt je trades automatisch op; dat heet een <b>sync</b>. Daarnaast lees je een <b>CSV-bestand</b> (een export van je trade-geschiedenis) in van Kraken, Blofin, MEXC, Hyperliquid, FTMO en OKX. <b>MEXC</b> heeft geen koppeling meer: MEXC stopt in november 2026 met Nederlandse klanten en heeft geen MiCA-licentie (de Europese vergunning). Je oude MEXC-trades blijven zichtbaar en tellen mee.'],
    ['Hoe koppel ik een exchange?','Met een read-only API-sleutel. Een <b>API-key</b> is een code waarmee de app je account mag uitlezen; <b>read-only</b> betekent alleen kijken, nooit handelen of geld opnemen.<ol><li>Maak bij je exchange een read-only API-key aan. Bij OKX en Kraken: zet de <b>IP-whitelist uit</b>, want de aanvraag komt van onze tussenserver, niet van jouw IP-adres.</li><li>Ga naar <b>Instellingen → Accounts</b> en klik bij je exchange op <b>Verbinden</b>.</li><li>Plak je key en secret (bij OKX ook je passphrase; bij Hyperliquid alleen je wallet-adres). Kies eventueel <b>Sync vanaf</b>; anders haalt de eerste sync 30 dagen op.</li><li>Klik op <b>Verbinden</b>.</li></ol>'],
    ['Zijn mijn API-keys veilig?','Ja, als je read-only sleutels gebruikt: die kunnen alleen meekijken, nooit handelen of geld opnemen. Je sleutels staan in je eigen browser, niet bij ons. Bij <b>Blofin</b> praat de app rechtstreeks met de exchange; <b>Hyperliquid</b> heeft geen sleutel nodig, alleen je openbare wallet-adres. <b>OKX</b> en <b>Kraken</b> staan een rechtstreekse verbinding niet toe. Daar gaat je aanvraag via onze tussenserver, die hem ondertekent en doorstuurt. Je sleutels gaan <b>niet</b> mee in je automatische back-ups, en bij <b>Exporteer JSON</b> of <b>Backup nu</b> standaard ook niet. Kies je bij het exporteren toch <b>Met API-sleutels</b> (om te verhuizen naar een andere browser of pc), bewaar dat bestand dan veilig en stuur het nooit door: iedereen met dat bestand kan je exchange-account gebruiken.'],
    ['Hoe zie ik of mijn sync loopt?','Aan de stip links van je balans, rechtsboven. Een sync is het ophalen van je trades bij je exchange.<ul><li><b>Groen</b>: de automatische sync loopt op schema.</li><li><b>Oranje</b>: al een tijd niet gesynct, bv. omdat je laptop sliep.</li><li><b>Rood</b>: een sync mislukte, of een koppeling heeft een fout.</li><li><b>Grijs</b>: automatisch synchroniseren staat uit.</li></ul>Houd je muis erop voor het moment van de laatste sync. Bij <b>Instellingen → Accounts</b> staat per koppeling hoe de laatste sync ging. Onder <b>Synchronisatie</b> zet je auto-sync aan, kies je hoe vaak, en vind je de <b>Sync-geschiedenis</b>.','sync'],
    ['Komt mijn stop-loss vanzelf binnen?','Bij Kraken, Hyperliquid en OKX wel; bij Blofin, CSV-imports en handmatige trades vul je hem zelf in. Je <b>stop-loss</b> is de prijs waarop je uitstapt als het tegenzit. Zonder stop kan de app je R (resultaat gedeeld door risico) niet berekenen. De journal neemt de <b>oorspronkelijke</b> stop van je instap over. Het veld staat dan vast, met "van Kraken" (of je andere exchange) erbij. Heb je de stop later verzet, bv. naar break-even (je instapprijs), dan staat er "verschoven" bij. Je R rekent dan met het risico van je instap.'],
    ['Wat betekenen TP1, SL en Close ✋ bij een trade?','Ze vertellen hoe elk deel van je positie dichtging. Je ziet ze bij Kraken, Hyperliquid en OKX.<ul><li><b>TP1, TP2…</b>: een geraakte take-profit (een vooraf ingestelde winstorder).</li><li><b>TP3 ✋</b>: winst genomen met de hand.</li><li><b>SL</b>: je stop-loss is geraakt, ook als die op break-even of in de winst stond.</li><li><b>Close ✋</b>: met de hand gesloten, met verlies.</li></ul>Bijvoorbeeld: TP1 → TP2 → SL. Je vindt het in "Zo is deze positie gelopen", in de tijdlijn en in de presentatie.'],
    ['Mijn exchange staat er niet tussen, wat nu?','Probeer de CSV-import; lukt dat niet, houd dan een handmatig account bij. Zes formaten worden automatisch herkend: Kraken, Blofin, MEXC, Hyperliquid, FTMO en OKX. Bij andere bestanden zoekt de import naar gangbare kolomnamen, zoals symbol of pair, date, entry, exit en pnl. Dat lukt niet bij elk bestand, dus controleer na het inlezen of je trades kloppen. Inlezen doe je bij <b>Instellingen → Accounts → CSV-import → Bestand kiezen</b>. Twee keer inlezen kan geen kwaad: dubbele trades worden overgeslagen.'],
    ['Ik gebruik geen koppeling, kan ik toch een account bijhouden?','Ja, met een handmatig account. Ga naar <b>Instellingen → Accounts → Handmatige accounts</b>, vul een naam en een saldo in en klik op <b>+ Toevoegen</b>. Handig voor een prop-firm-challenge (een test bij een bedrijf als FTMO, dat je daarna met zijn geld laat traden), een beurs zonder koppeling, of om je backtests apart te houden. Via <b>Beheren</b> houd je zelf stortingen en opnames bij. Zet handmatige trades op zo\'n eigen account, niet op een gekoppelde exchange: daar zitten ze bij een sync in de weg.'],
  ]],
  ['📊 Analytics begrijpen',[
    ['Wat betekenen P&L, win-rate, profit factor en expectancy?','Dat zijn de vier basiscijfers van je trading.<ul><li><b>P&L</b> (profit & loss): je winst of verlies. <b>Netto</b> betekent na fees (de kosten van je exchange).</li><li><b>Win-rate</b>: hoeveel procent van je trades winst maakt.</li><li><b>Profit factor</b>: al je winst gedeeld door al je verlies. Boven de 1 verdien je geld.</li><li><b>Expectancy</b>: wat je gemiddeld per trade verdient of verliest.</li></ul>Een lage win-rate is niet erg als je winnaars veel groter zijn dan je verliezers. Kijk daarom altijd naar de combinatie.'],
    ['Wat betekent R-multiple (die "R" overal)?','Je resultaat gedeeld door wat je riskeerde. Riskeer je $100 en win je $200, dan is dat <b>+2R</b>. Verlies je precies je risico, dan is dat −1R. Zo vergelijk je grote en kleine trades eerlijk. SyncJournal rekent met je netto P&L (na fees) gedeeld door je risico. Je risico volgt uit je entry, je stop-loss en je size (de grootte van je positie). Zonder stop-loss is R niet te bepalen: dan staat er een streepje, en telt de trade niet mee in je gemiddelde R.'],
    ['Wat doet de schakelaar $ / % / R?','Hij bepaalt waarin je je resultaten ziet, op elke pagina. Je vindt hem op het Dashboard, rechtsboven in het blok met je balans.<ul><li><b>$</b> (of <b>€</b>): bedragen.</li><li><b>%</b>: je resultaat als percentage van je account op dat moment.</li><li><b>R</b>: je resultaat gedeeld door je risico (zie de vraag over R-multiple).</li></ul>Wat niet te bepalen is, telt niet als nul. Een trade zonder stop-loss heeft in R geen waarde en blijft dan neutraal. Je balans zelf blijft altijd in geld.'],
    ['Waarom staat er ≈ voor mijn saldo in euro?','Omdat het een schatting is. Je exchange houdt je geld in dollars. De journal rekent dat om met de officiële koers van de ECB (Europese Centrale Bank) van de laatste werkdag. Je exchange gebruikt een eigen live koers, dus het kan een paar tienden van een procent schelen. Houd je muis op je saldo om te zien welke koers van welke dag. Wordt je saldo oranje, dan is de koers verouderd. Wil je precies dezelfde cijfers als je exchange? Kies dan <b>$ USD</b> bij <b>Instellingen → Weergave → Valuta</b>.'],
    ['Ik zie lege grafieken of "geen trades", hoe kan dat?','Bijna altijd door een filter. Kijk in de filterbalk bovenaan de pagina:<ol><li>Staat het <b>datumfilter</b> op een periode zonder trades? Kies <b>Alle datums</b>.</li><li>Staat <b>Soort trades</b> goed? Standaard zie je alleen <b>Live trades</b>. Je backtests en paper-trades zie je met <b>Oefentrades (alle)</b> of <b>Alle soorten</b>.</li><li>Staat er nog een ander filter aan? Klik op <b>✕ Wis</b>.</li></ol>Een lege pagina vertelt meestal ook zelf wat er ontbreekt.'],
    ['Hoe werkt het datum-filter?','Met het datumfilter bovenaan elke pagina kies je welke periode je ziet. Kies <b>Deze week</b>, <b>Deze maand</b>, <b>Dit kwartaal</b>, <b>Dit jaar</b> of <b>Alle datums</b>, of stel zelf een van–tot in. Alle grafieken en cijfers passen zich meteen aan. Het filter geldt voor de hele app, dus ook als je van pagina wisselt. Zo vergelijk je bv. deze maand met vorige maand.'],
    ['Wat is MFE / MAE?','Ze laten zien hoe ver een trade vóór en tegen je liep. <b>MFE</b> (maximum favorable excursion): hoe ver de koers maximaal in je voordeel ging. <b>MAE</b> (maximum adverse excursion): hoe ver maximaal tegen je. Allebei in R. Veel onbenutte MFE betekent dat je vaak te vroeg winst pakt. Een MAE die steeds tot vlak bij je stop komt, zegt iets over waar je je stop zet. Je vult ze in het trade-formulier in. Het paneel <b>MFE / MAE-efficiency</b> in Analytics, onder <b>Kwaliteit van je trades</b>, zet ze per trade uit.'],
    ['Wat is de Trade-score?','Een cijfer van 0 tot 100 voor de kwaliteit van je proces. Het begint op 50 en gaat omhoog of omlaag door je win-rate, je profit factor (winst gedeeld door verlies) en je payoff (gemiddelde winst gedeeld door gemiddeld verlies). Vanaf 75 heet het <b>sterk</b>, vanaf 50 <b>oké</b>, daaronder <b>aandacht</b>. Daardoor kan je score boven de 50 uitkomen met een win-rate onder de 50%: wie 45% wint, maar winnaars heeft die twee keer zo groot zijn als zijn verliezers, heeft een prima proces.'],
    ['Wat is SQN?','Een getal dat meet hoe <b>consistent</b> je resultaten zijn, niet alleen hoe hoog. SQN staat voor System Quality Number. Een paar toevalstreffers kunnen je winst mooier maken dan hij is; je SQN niet. De app geeft het een label: onder 1,6 <b>zwak</b>, van 1,6 tot 2,5 <b>gemiddeld</b>, van 2,5 tot 3 <b>goed</b>, vanaf 3 <b>uitstekend</b>. Kijk er pas serieus naar vanaf ongeveer 30 trades.'],
    ['Waarom zie ik een melding over een klein sample?','Omdat je minder dan 30 gesloten trades in beeld hebt, en dan zegt statistiek weinig. Een goede of slechte week kan dan puur toeval zijn. De melding verdwijnt vanzelf als je meer trades hebt, of als je het datumfilter ruimer zet. Tot die tijd: conclusies met een korreltje zout.'],
  ]],
  ['🧭 Tendencies, je edge vinden',[
    ['Wat betekenen "edge" en "lek"?','Je <b>edge</b> is waar je structureel geld verdient, je <b>lek</b> waar je structureel geld verliest. Bijvoorbeeld: je edge is Trend-pullback in de Londen-sessie, je lek zijn FOMO-trades (uit angst iets te missen) in de avond. Bovenaan Tendencies, onder <b>Conclusie</b>, staan <b>Jouw sterkste combinatie</b> en je <b>Structureel lek</b> kant-en-klaar. Een combinatie telt pas mee vanaf 8 trades.'],
    ['Hoe lees ik de Kruis-analyse?','Hij zet twee kenmerken van je trades tegen elkaar, zodat je ziet waar het verband zit.<ol><li>Kies in <b>🔀 Kruis-analyse</b> met de twee keuzelijsten wat je kruist, bv. playbook × sessie, of tijdframe × richting.</li><li>Elke cel toont je gemiddelde R, je win-rate en het aantal trades voor die combinatie. Groen verdient geld, rood kost geld.</li><li><b>Klik op een cel</b> en je springt naar precies die trades.</li></ol>Is de tabel leeg, dan staat erbij wat er ontbreekt, met een knop naar een combinatie die wel iets laat zien.'],
    ['Waarom zijn sommige cellen vervaagd?','Die combinaties hebben minder dan 8 trades: te weinig om iets over te zeggen. Een cel is ook grijs als geen van de trades een R heeft, omdat er geen stop-loss is ingevuld. Zulke cellen tellen niet mee voor je edge en je lek. Met meer trades kleuren ze vanzelf mee.'],
    ['Waarom zijn sommige blokken in Setup × sessie groter dan andere?','De grootte laat zien waar het meeste gebeurt, de kleur of het daar goed of slecht gaat. In het paneel <b>🎯 Setup × sessie</b> op Tendencies is elke sessie een groep en elke setup een blok. Met de knop rechtsboven kies je of de grootte het <b># trades</b> is of het bedrag (<b>|P&L|</b>). Groot en groen is je motor; groot en rood is waar je geld lekt. Het werkt zoals de bekende heatmap van TradingView.'],
    ['Wat kan ik met deze inzichten dóén?','Drie dingen. (1) Doe <b>meer</b> van je edge: daar ligt je brood. (2) <b>Vermijd</b> je lek, of neem die trades alleen nog onder perfecte omstandigheden. (3) Kijk na een maand of twee opnieuw: je patronen veranderen mee met jou. Leg wat je leert vast in je playbook. Dan wordt het een regel in plaats van een voornemen.'],
  ]],
  ['✅ Review & delen met je coach',[
    ['Waarom zou ik trades reviewen?','Omdat terugkijken met je screenshots de snelste manier is om te leren. Je ziet wat je toen zag, en wat je miste. De Review-pagina zet alles voor je klaar: chart, notities en cijfers. Plan er een vast moment voor, bv. elk weekend.'+faqVisie('visie-review')],
    ['Hoe markeer ik een trade als gereviewd?','Met de knop <b>Markeer gereviewd</b>: bovenaan een trade in <b>Per trade</b>, of onder een kaart in <b>🖼 Beeld</b>. Met de filters <b>Alle / Te doen / Gereviewed</b> en de periodeknoppen zie je wat er nog ligt. Let op: het vakje vóór een trade is om hem te <b>selecteren</b> voor delen, niet om hem af te vinken.'],
    ['Hoe deel ik trades met mijn coach of trading-buddy?','Via <b>Review → 🖼 Beeld → Selectie & delen</b>. In Beeld staan alleen trades met een screenshot of TradingView-link.<ol><li>Vink de trades aan met het vakje vóór de datum.</li><li>Vul je naam in en kies of bedragen verborgen blijven.</li><li>Kies <b>▶ Presenteer geselecteerde</b> (samen op volledig scherm doorlopen), <b>⬇ Coach-pakket</b> (één HTML-bestand met beelden, info, review en coach-feedback, dat je coach gewoon in de browser opent) of <b>📋 Kopieer voor Discord</b> (chart en trade-info als één beeld, van de eerste geselecteerde trade).</li></ol>'+faqVisie('visie-review')],
    ['Ziet mijn coach mijn bedragen?','Alleen als jij dat wilt. <b>Bedragen verbergen (alleen R)</b> staat standaard aan in <i>Selectie & delen</i>. Je coach ziet dan R-multiples (je resultaat gedeeld door je risico) en percentages in plaats van bedragen. Genoeg om je proces te beoordelen, zonder je saldo te delen.'],
    ['Waar schrijf ik op wat mijn coach zegt?','In het veld <b>💬 Coach-feedback</b> bij de trade: op Review in <b>Per trade</b>, of tijdens het presenteren. Het wordt bewaard bij de trade, gaat mee in je back-up en staat in het coach-pakket. Met "coach" bedoelen we hier je menselijke coach, zoals Sebas, niet Mori.'],
  ]],
  ['🤖 Mori, je AI-coach',[
    ['Wat is Mori?','Mori is de AI-coach van SyncJournal: een coach waarmee je chat over je eigen trades. Mori draait op <b>Claude</b>, een AI van het bedrijf Anthropic. De journal rekent alle cijfers zelf uit en geeft ze aan Mori; Mori rekent zelf niets. Daardoor kloppen zijn cijfers met wat je in Analytics ziet. Mist Mori iets, dan vraagt hij de journal om precies die cijfers. Je vindt Mori op één plek: de pagina <b>AI-coach</b> in het menu. Op je Dashboard en in Analytics zie je niets van hem. Mori is iets anders dan je menselijke coach, en geeft geen financieel advies.','mori'],
    ['Wat kan ik Mori vragen?','Alles over je eigen trades. Vier vragen staan als knop klaar:<ul><li><b>Waar lek ik geld?</b></li><li><b>Waar zit mijn edge?</b> (waar je structureel geld verdient)</li><li><b>Review mijn week</b>: wat ging goed, wat kostte geld, en één ding om volgende week anders te doen</li><li><b>Hoe ging mijn laatste trade?</b></li></ul>Je kunt ook zelf typen, bv. "hoe doet mijn London SFP het op vrijdag?". Is Mori gekoppeld, dan staat op Review bij een trade een 🤖-knopje: dat opent Mori met die trade klaargezet. Mori kijkt naar de trades die je filter bovenaan laat zien.'],
    ['Kan Mori mijn trade-idee checken?','Ja, met <b>Check mijn trade-idee</b> onder de vaste vragen.<ol><li>Vul pair, richting, setup, entry, stop en eventueel je TP (take-profit, je winstdoel) in.</li><li>De journal rekent je geplande R:R uit: hoeveel je kunt winnen tegenover wat je riskeert.</li><li>Mori zegt hoe die setup het bij jou deed, en of het idee past bij je playbook-regels. Gebruik je TradingPlan, dan ook bij je weekplan en vaste regels.</li></ol>Mori geeft <b>geen koop- of verkoopadvies</b>: hij houdt je je eigen regels voor.'],
    ['Wat heb ik nodig om Mori te gebruiken?','Een eigen API-sleutel van Anthropic. Een <b>API-sleutel</b> is een code waarmee de app namens jou Claude mag gebruiken.<ol><li>Maak een account op console.anthropic.com.</li><li>Zet er tegoed op, bv. $5, en stel een maandlimiet in.</li><li>Maak een sleutel aan.</li><li>Plak die op de pagina <b>AI-coach</b> en klik op <b>Koppelen</b>.</li></ol>Een Claude Pro- of Max-abonnement werkt hier niet: Anthropic staat dat niet toe in andere apps.'],
    ['Wat kost Mori?','Ongeveer 30 cent tot een dollar per maand met Sonnet 5.5, en een paar cent met Haiku 5.5, bij een paar vragen per week en een weekreview. Jij betaalt Anthropic direct, niet ons. Onder elk antwoord staat wat die vraag ongeveer kostte. Bij <b>Instellingen → Mori</b> zie je het verbruik van deze maand, kies je het model en zet je een eigen <b>maandlimiet</b>: daarboven vraagt Mori eerst of je echt wilt versturen. Stel ook een limiet in bij Anthropic zelf; die is hard. Vervolgvragen zijn goedkoper, omdat je cijfers een paar minuten bij Anthropic bewaard blijven.'],
    ['Wat krijgt Mori van mij te zien?','Alleen wat een vraag nodig heeft, en het gaat alleen naar Anthropic, niet naar ons. Dat zijn de cijfers die de journal uitrekent (kerncijfers, en per setup, sessie, weekdag, fout en emotie), een paar trades op één regel, en je notities. Zoekt Mori iets op, dan krijgt hij alleen het resultaat. Bij <b>Instellingen → Mori</b> zet je <b>Bedragen verbergen voor Mori</b> aan of <b>Notities meesturen</b> uit. Onder elk antwoord zie je bij <b>Wat is er verstuurd?</b> precies wat Mori kreeg. Je exchange-sleutels, je wallet-adres en je saldo gaan nooit mee.'],
    ['Mori geeft een foutmelding, wat nu?','Lees de melding: die zegt wat er mis is en wat je kunt doen. Je vraag blijft in het invoerveld staan. De meest voorkomende:<ul><li><b>Sleutel niet herkend</b>: verlopen of verwijderd. Maak een nieuwe en kies <b>Vergeet sleutel</b>.</li><li><b>Tegoed op</b> of <b>limiet bereikt</b>: regel je in je console bij Anthropic.</li><li><b>Te veel vragen achter elkaar</b>: probeer het over een minuut.</li><li><b>Claude overbelast</b>: probeer het over een paar minuten.</li><li><b>Geen verbinding</b>: check je internet.</li></ul>Duurt een antwoord te lang, druk dan op <b>Stop</b>. Wat er al stond, blijft staan.'],
    ['Waar staat mijn sleutel voor Mori?','Alleen op dit apparaat, in je browser. Hij gaat <b>nooit</b> mee in een export of back-up. Op een gedeelde computer vink je <b>Alleen voor deze sessie onthouden</b> aan; dan is hij weg zodra je het tabblad sluit. Het ergste wat iemand met een gelekte sleutel kan doen, is je tegoed bij Anthropic opmaken. Houd dat tegoed dus laag en zet een maandlimiet.'],
    ['Hoe zet ik Mori uit?','Bij <b>Instellingen → Mori</b>. Met <b>Vergeet sleutel</b> haal je je sleutel weg; met de schakelaar <b>AI-coach ingeschakeld</b> zet je Mori helemaal uit. Wil je de sleutel ook bij Anthropic intrekken? Doe dat in je console onder API keys.'],
  ]],
  ['🛠️ Weergave & problemen oplossen',[
    ['Hoe wissel ik tussen licht en donker thema?','Klik op het maan- of zonicoon rechtsboven. Of kies het bij <b>Instellingen → Weergave → Thema</b>. Er zijn twee thema\'s, licht en donker, en je keuze wordt onthouden.'],
    ['Kan ik mijn Dashboard aanpassen?','Ja, bij <b>Instellingen → Weergave</b>. Kies een stand: <b>🌿 Rustig</b> (alleen de essentie), <b>📊 Standaard</b> of <b>🔬 Alles</b>. Of zet zelf onderdelen aan en uit: pagina\'s, blokken op het Dashboard (zoals de equity-curve, de lijn van je totale resultaat door de tijd), kolommen in de trades-tabel en velden in het formulier. Dit verandert alleen wat je ziet. Je data en berekeningen blijven hetzelfde.'],
    ['Iets doet het niet of ziet er vreemd uit, wat nu?','Ververs eerst, check dan je filters, en meld het daarna met een diagnose-rapport.<ol><li>Ververs de pagina (F5).</li><li>Check de filterbalk bovenaan: datum, soort trades en de rest. Negen van de tien "bugs" zijn een filter.</li><li>Nog steeds raar? Ga naar <b>Instellingen → Data → Hulp bij problemen</b> en klik bij <b>Diagnose-rapport</b> op <b>Kopieer</b>. Plak het bij je melding in de Morani Discord. Er staan geen sleutels, notities of screenshots in.</li></ol>'],
    ['Ik heb per ongeluk een trade verwijderd, kan die terug?','Ja. Direct na het verwijderen klik je onderin op <b>Ongedaan maken</b>. Later kan ook: verwijderde trades staan 30 dagen in de <b>Prullenbak</b>, bij <b>Instellingen → Data</b>. Klik daar op <b>↩ Terugzetten</b>. Een sync haalt een verwijderde trade niet opnieuw binnen. Na 30 dagen wordt de prullenbak vanzelf geleegd.'],
    ['Hoe weet ik of er een nieuwe versie is?','Bij <b>Instellingen → Updates</b> zie je welke versie je hebt. De app kijkt zelf af en toe of er een nieuwere is; met <b>🔄 Check voor updates</b> doe je dat meteen. Is er een nieuwe versie, dan krijg je een melding met <b>↻ Update nu</b>: de pagina ververst en je bent bij. Je trades blijven gewoon staan, want die zitten in je browser, niet in de app zelf. Wat er nieuw is, lees je in de changelog (de lijst met wijzigingen) via de link op dezelfde plek.'],
  ]],
];

};
const svg=(p,w=18)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="${w}" height="${w}" aria-hidden="true">${p}</svg>`;
const NAVDEF=[['dashboard','Dashboard','--accent'],['trades','Trades','--teal'],['analytics','Analytics','--green'],['tendencies','Tendencies','--red'],['kalender','Kalender','--amber'],['playbook','Playbook','--violet'],['review','Review','--violet']];
const NAVBOT=[['plan','Plan','--accent'],['instellingen','Instellingen','--muted'],['faq','FAQ','--teal'],['ai','Mori','--violet']];
const navBtn=([p,l,c])=>`<button class="${p==='faq'?'on':''}" ${p==='faq'?'aria-current="page"':''} style="--pc:var(${c})" onclick="demoNav('${l}')"><span class="nav-ic">${svg(IC[p],17)}</span><span>${l}</span></button>`;
