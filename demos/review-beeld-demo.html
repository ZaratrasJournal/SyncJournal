<!doctype html>
<!-- PROTOTYPE — weggooi-demo (13-10-2026). Vraag: hoe moet de "beeld-modus" van de reviewpagina eruitzien
     (filteren op playbook/tag, alleen screenshots + TradingView-links, vergroten, datum, naar de trade),
     bruikbaar met de coach (samen doorlopen én opsturen)? Vier varianten via ?variant=A|B|C|D en de balk
     onderin (of ← →). Nep-data, niets wordt opgeslagen. Antwoord vastleggen in demos/review-beeld-NOTES.md. -->
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Review beeld-modus — demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f9;--surface:#fff;--sink:#f0f2f7;--line:#e4e7ef;--line2:#eef0f5;--ink:#141826;--ink2:#3b4256;--muted:#717892;--faint:#a3a9bd;
  --accent:#4655d4;--accent-soft:#e8eafb;--green:#169a6d;--green-soft:#e2f5ee;--red:#d4424e;--red-soft:#fbe8ea;--amber:#d08a1b;--track:#e9ecf3;
  --shadow:0 1px 2px rgba(20,30,60,.06),0 4px 14px -6px rgba(20,30,60,.10)}
body.dark{--bg:#0d1118;--surface:#151a23;--sink:#10141c;--line:#252c39;--line2:#1d2330;--ink:#eef1f7;--ink2:#c3c9d6;--muted:#8a92a6;--faint:#5b6377;
  --accent:#7d88ff;--accent-soft:#232a4a;--green:#2fbf8a;--green-soft:#123326;--red:#ef5d6a;--red-soft:#3a1a1f;--amber:#e3a33c;--track:#202634;--shadow:0 1px 2px rgba(0,0,0,.4)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif}
.num{font-family:"IBM Plex Mono",monospace;font-weight:600}
.g{color:var(--green)}.r{color:var(--red)}.mu{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:200px 1fr;min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 14px}
.logo{font-weight:800;font-size:17px;margin-bottom:22px}.logo b{color:var(--accent)}
.nav div{padding:8px 10px;border-radius:8px;color:var(--ink2);font-weight:600;margin-bottom:2px}
.nav .on{background:var(--accent-soft);color:var(--accent)}
.main{padding:18px 26px 120px;min-width:0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.top h1{font-size:20px;margin:0}.top .sub{color:var(--muted)}
.sp{flex:1}
.modes{display:inline-flex;background:var(--sink);border:1px solid var(--line);border-radius:10px;padding:3px}
.modes button{border:0;background:none;padding:6px 14px;border-radius:7px;font-weight:600;color:var(--muted)}
.modes .on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;margin-bottom:14px;position:sticky;top:8px;z-index:5}
select,.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 10px;font:inherit;font-weight:600;color:var(--ink)}
.chipbtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.count{color:var(--muted);font-size:12.5px;margin-left:auto}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--sink);border:1px solid var(--line);color:var(--ink2);margin:0 4px 4px 0}
.rbadge{font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:12px;padding:2px 7px;border-radius:6px}
.rbadge.g{background:var(--green-soft)}.rbadge.r{background:var(--red-soft)}
.tvbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--sink);border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:600;color:var(--ink);text-decoration:none}
.tvbtn:hover{border-color:var(--accent)}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;padding:0}
img.shot{display:block;width:100%;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;background:#131722}
.empty{padding:40px;text-align:center;color:var(--muted)}
/* A */
.feed{display:flex;flex-direction:column;gap:16px;max-width:1100px}
.feedhd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line2)}
.feedbody{padding:14px 16px;display:grid;gap:10px}
.feedbody .more{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.note{font-size:13px;color:var(--ink2);background:var(--sink);border-radius:9px;padding:8px 11px}
/* B */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tile{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#131722;cursor:zoom-in;aspect-ratio:16/10}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 8px;background:linear-gradient(transparent,rgba(5,8,14,.85));color:#fff;font-size:12px;display:flex;gap:6px;align-items:center}
.tile .tvonly{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#c9d1e4;gap:6px;font-weight:700}
.grouphd{margin:18px 0 8px;font-weight:800;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
/* C */
.coach{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start}
.crow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line2)}
.crow .thumbs{display:flex;gap:6px}.crow .thumbs img{width:86px;height:54px;object-fit:cover;border-radius:7px;border:1px solid var(--line);cursor:zoom-in}
.crow input{width:18px;height:18px;accent-color:var(--accent)}
.basket{position:sticky;top:8px;padding:14px}
.basket h3{margin:0 0 4px;font-size:15px}
.bitem{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line)}
.bitem .o{display:flex;flex-direction:column}.bitem .o button{border:0;background:none;padding:0 4px;line-height:1;color:var(--muted)}
.act{display:grid;gap:8px;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-weight:700;text-align:left}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn small{display:block;font-weight:500;color:inherit;opacity:.75;font-size:11.5px}
/* D */
.rev{display:grid;grid-template-columns:270px 1fr;gap:16px;align-items:start}
.rlist .it{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line2);cursor:pointer}
.rlist .it.on{background:var(--accent-soft)}
.rlist .it img{width:44px;height:28px;object-fit:cover;border-radius:5px}
.revhd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.revhd h2{margin:0;font-size:17px}
.facts{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line2);border-radius:10px;overflow:hidden}
.facts div{background:var(--surface);padding:9px 11px}.facts .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;padding:16px}
textarea{width:100%;min-height:70px;border:1px solid var(--line);background:var(--sink);border-radius:10px;padding:9px;color:var(--ink);font:inherit}
.emo{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:4px 10px;margin:0 5px 5px 0;font-size:12.5px;font-weight:600}
.emo.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
/* lightbox / presentatie */
.lb{position:fixed;inset:0;background:rgba(6,9,15,.985);z-index:50;display:none;grid-template-columns:1fr 340px}
.lb.on{display:grid}.lb.nopanel{grid-template-columns:1fr}
.lb .stage{display:flex;align-items:center;justify-content:center;padding:30px 70px;position:relative;min-width:0}
.lb .stage img{max-width:100%;max-height:calc(100vh - 110px);border-radius:8px}
.lb .nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:24px}
.lb .prev{left:14px}.lb .next{right:14px}
.lb .x{position:absolute;top:14px;right:16px;border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:9px;padding:6px 11px;font-size:16px}
.lb .capbar{position:absolute;left:70px;right:70px;bottom:16px;color:#dfe5f2;display:flex;gap:10px;align-items:center;font-size:13px;flex-wrap:wrap}
.lb .capbar .tvbtn,.lb .capbar .linkbtn{color:#fff}.lb .capbar .tvbtn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2)}
.lb aside{background:var(--surface);color:var(--ink);padding:18px;overflow:auto}
.lb aside h3{margin:0 0 6px}
.switch{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:6px;background:#111;color:#fff;border-radius:99px;padding:6px 8px;box-shadow:0 8px 30px rgba(0,0,0,.35);font-size:13px}
.switch button{border:0;background:#2a2a2a;color:#fff;border-radius:99px;width:30px;height:30px}
.switch .lbl{padding:0 10px;font-weight:700;min-width:250px;text-align:center}
.switch .th{width:auto;padding:0 10px;font-size:12px}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.coach,.rev{grid-template-columns:1fr}.lb{grid-template-columns:1fr}.lb aside{display:none}.facts{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <div class="side"><div class="logo">Sync<b>Journal</b></div>
    <div class="nav"><div>Dashboard</div><div>Trades</div><div>Analytics</div><div>Tendencies</div><div>Kalender</div><div>Playbook</div><div class="on">Review</div></div></div>
  <div class="main" id="main"></div>
</div>
<div class="lb" id="lb"></div>
<div class="switch" id="switch"></div>
<script>
// ── nep-data ───────────────────────────────────────────────────────────
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};
const pick=a=>a[Math.floor(rnd()*a.length)];
const PB=['Trend-pullback','London SFP','BOS-retest','Range-fade','1H MSB/BOS'];
const TAGS=['Liquidity Sweep','FVG','EQL/EQH','Range retest','Support OB','Session sweep'];
const PAIRS=['BTC/USDT','ETH/USDT','SOL/USDT','BTC/USDC','ETH/USDC'];
const TFS=[['4H','1H'],['Daily','1H'],['1H','15M'],['4H','15M']];
const NOTES=['Mooie sweep van de Asia-low, geduldig op de retest gewacht.','Te vroeg in, geen bevestiging op de 15M.','TP1 geraakt, rest op break-even gezet.','Tegen de 4H-bias in — had ik niet moeten nemen.','Precies volgens plan, A+ setup.','FOMO-entry na een gemiste eerste kans.',''];
// chart-plaatje tekenen (TradingView-achtig), deterministisch per trade
function chart(t,k){const c=document.createElement('canvas');c.width=1280;c.height=760;const g=c.getContext('2d');
  const dark=k%2===0;g.fillStyle=dark?'#131722':'#ffffff';g.fillRect(0,0,1280,760);
  g.strokeStyle=dark?'#1e2433':'#eef0f4';g.lineWidth=1;for(let x=0;x<1280;x+=80){g.beginPath();g.moveTo(x,0);g.lineTo(x,700);g.stroke();}for(let y=0;y<700;y+=70){g.beginPath();g.moveTo(0,y);g.lineTo(1180,y);g.stroke();}
  let p=380;const pts=[];for(let i=0;i<95;i++){const o=p;p+= (rnd()-0.5)*26+(t.dir==='long'?(i>55?-3:1.2):(i>55?3:-1.2))*(i>55?-1:1);const h=Math.min(o,p)-rnd()*14,l=Math.max(o,p)+rnd()*14;pts.push([o,p,h,l]);}
  pts.forEach(([o,cl,h,l],i)=>{const x=20+i*12;const up=cl<o;g.strokeStyle=g.fillStyle=up?'#26a69a':'#ef5350';g.beginPath();g.moveTo(x+4,h);g.lineTo(x+4,l);g.stroke();g.fillRect(x,Math.min(o,cl),8,Math.max(2,Math.abs(cl-o)));});
  const ey=pts[55][1],sy=ey+(t.dir==='long'?60:-60),ty=ey-(t.dir==='long'?1:-1)*150;
  const zone=(y1,y2,col)=>{g.fillStyle=col;g.fillRect(680,Math.min(y1,y2),420,Math.abs(y2-y1));};
  zone(ey,ty,'rgba(38,166,154,.18)');zone(ey,sy,'rgba(239,83,80,.18)');
  g.font='bold 22px Inter,sans-serif';g.fillStyle=dark?'#d1d4dc':'#131722';g.fillText(t.pair.replace('/','')+' · '+(k?t.tf[1]:t.tf[0])+' · '+t.setup,24,40);
  g.fillStyle='#2962ff';g.fillRect(1180,ey-12,100,24);g.fillStyle='#fff';g.font='bold 15px IBM Plex Mono,monospace';g.fillText('ENTRY',1196,ey+5);
  return c.toDataURL('image/jpeg',0.82);}
const TRADES=[];const d0=new Date('2026-10-12');
for(let i=0;i<26;i++){const dt=new Date(d0-i*86400000*1.4);const R=+((rnd()<0.52?1:-1)*(0.3+rnd()*2.6)).toFixed(2);
  const t={id:100+i,date:dt.toISOString().slice(0,10),time:String(8+Math.floor(rnd()*12)).padStart(2,'0')+':'+pick(['05','15','30','45']),pair:pick(PAIRS),dir:rnd()<0.55?'long':'short',
    setup:pick(PB),tf:pick(TFS),r:R,pnl:Math.round(R*95),tags:[pick(TAGS),...(rnd()<0.4?[pick(TAGS)]:[])].filter((v,j,a)=>a.indexOf(v)===j),
    note:pick(NOTES),lesson:R<0?'Wacht op de candle-close boven het level.':'',emo:pick(['Kalm','Gefocust','FOMO','Twijfel','Gehaast']),reviewed:rnd()<0.4,shots:[],tv:[]};
  const ns=rnd()<0.15?0:(rnd()<0.5?1:2);for(let k=0;k<ns;k++)t.shots.push(chart(t,k));
  const nt=rnd()<0.45?1:(rnd()<0.2?2:0);for(let k=0;k<nt;k++)t.tv.push('https://www.tradingview.com/x/'+Math.random().toString(36).slice(2,10)+'/');
  TRADES.push(t);}
// ── state ─────────────────────────────────────────────────────────────
const S={variant:new URLSearchParams(location.search).get('variant')||'A',pb:'',tags:[],res:'all',per:'all',sel:[],hide:true,revId:null,dark:false};
const VARIANTS=[['A','Stroom — alles onder elkaar'],['B','Raster + presentatie'],['C','Coach-sessie: kiezen, doorlopen, delen'],['D','Review per trade (nieuwe indeling)']];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtD=d=>new Date(d+'T12:00').toLocaleDateString('nl-NL',{weekday:'short',day:'numeric',month:'short'});
const rB=r=>`<span class="rbadge ${r>=0?'g':'r'}">${r>=0?'+':'−'}${Math.abs(r).toFixed(2).replace('.',',')}R</span>`;
const money=v=>S.hide?'':` <span class="num ${v>=0?'g':'r'}">${v>=0?'+':'−'}$ ${Math.abs(v)}</span>`;
function shown(){return TRADES.filter(t=>(!S.pb||t.setup===S.pb)&&(!S.tags.length||S.tags.some(x=>t.tags.includes(x)))&&(S.res==='all'||(S.res==='win'?t.r>0:t.r<0))
  &&(S.per==='all'||(S.per==='30'?(d0-new Date(t.date))/864e5<=30:(d0-new Date(t.date))/864e5<=7))&&(t.shots.length||t.tv.length));}
function filterBar(){const L=shown();const nS=L.reduce((a,t)=>a+t.shots.length,0),nT=L.reduce((a,t)=>a+t.tv.length,0);
  return `<div class="panel bar">
    <select onchange="S.pb=this.value;draw()"><option value="">Alle playbooks</option>${PB.map(p=>`<option ${S.pb===p?'selected':''}>${esc(p)}</option>`).join('')}</select>
    ${TAGS.map(t=>`<button class="chipbtn ${S.tags.includes(t)?'on':''}" onclick="togTag('${t}')">${esc(t)}</button>`).join('')}
    <select onchange="S.res=this.value;draw()"><option value="all">Winst + verlies</option><option value="win" ${S.res==='win'?'selected':''}>Alleen winst</option><option value="loss" ${S.res==='loss'?'selected':''}>Alleen verlies</option></select>
    <select onchange="S.per=this.value;draw()"><option value="all">Alle datums</option><option value="30" ${S.per==='30'?'selected':''}>30 dagen</option><option value="7" ${S.per==='7'?'selected':''}>7 dagen</option></select>
    <span class="count">${L.length} trades · ${nS} screenshots · ${nT} TV-links</span></div>`;}
function togTag(t){const i=S.tags.indexOf(t);i<0?S.tags.push(t):S.tags.splice(i,1);draw();}
const tvLinks=t=>t.tv.map((u,i)=>`<a class="tvbtn" href="${esc(u)}" target="_blank" rel="noopener">📈 TradingView${t.tv.length>1?' '+(i+1):''} ↗</a>`).join(' ');
const openTrade=id=>`<button class="linkbtn" onclick="naarTrade(${id})">Open trade →</button>`;
function naarTrade(id){S.revId=id;S.variant='D';closeLb();syncUrl();draw();scrollTo(0,0);}
// ── lightbox (A, C) en presentatie (B, C) ─────────────────────────────
let LB=null;
function beelden(list){const out=[];list.forEach(t=>{t.shots.forEach((s,k)=>out.push({t,src:s,k}));if(!t.shots.length&&t.tv.length)out.push({t,src:null,k:0});});return out;}
function openLb(tradeId,k,panel){const items=beelden(shown());const i=items.findIndex(x=>x.t.id===tradeId&&x.k===k);LB={items,i:Math.max(0,i),panel:!!panel};drawLb();}
function drawLb(){const el=document.getElementById('lb');if(!LB){el.className='lb';el.innerHTML='';return;}
  const it=LB.items[LB.i],t=it.t;el.className='lb on'+(LB.panel?'':' nopanel');
  el.innerHTML=`<div class="stage">${it.src?`<img src="${it.src}" alt="">`:`<div style="color:#c9d1e4;text-align:center"><div style="font-size:46px">📈</div><b>Alleen een TradingView-link</b><div style="margin-top:10px">${tvLinks(t)}</div></div>`}
    <button class="nav prev" onclick="lbGo(-1)" aria-label="vorige">‹</button><button class="nav next" onclick="lbGo(1)" aria-label="volgende">›</button>
    <button class="x" onclick="closeLb()" aria-label="sluiten">✕</button>
    <div class="capbar"><b>${fmtD(t.date)} ${t.time}</b> · ${esc(t.pair)} · ${esc(t.setup)} ${rB(t.r)}${money(t.pnl)} <span class="mu">· beeld ${LB.i+1}/${LB.items.length}</span><span class="sp"></span>${tvLinks(t)} ${openTrade(t.id)}</div></div>
    ${LB.panel?`<aside><div class="mu" style="font-size:12px">${fmtD(t.date)} · ${t.time} · ${t.dir.toUpperCase()}</div><h3>${esc(t.pair)} · ${esc(t.setup)}</h3>
      <div style="margin:6px 0 12px">${rB(t.r)}${money(t.pnl)}</div>
      <div style="font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em">Lagen</div><div style="margin:4px 0 12px">${t.tf.join(' → ')} ${esc(t.setup)}</div>
      <div style="font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em">Tags</div><div style="margin:4px 0 10px">${t.tags.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>
      ${t.note?`<div style="font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em">Notitie</div><div class="note" style="margin:4px 0 10px">${esc(t.note)}</div>`:''}
      ${t.lesson?`<div style="font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em">Leerpunt</div><div class="note" style="margin:4px 0 10px">${esc(t.lesson)}</div>`:''}
      <div style="font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em">Coach-feedback</div><textarea placeholder="Wat zegt je coach hierover? (demo)"></textarea>
      <div style="margin-top:10px">${openTrade(t.id)}</div></aside>`:''}`;}
function lbGo(d){if(!LB)return;LB.i=(LB.i+d+LB.items.length)%LB.items.length;drawLb();}
function closeLb(){LB=null;drawLb();}
// ── A: stroom ─────────────────────────────────────────────────────────
function VariantA(){const L=shown();if(!L.length)return filterBar()+'<div class="panel empty">Geen trades met beeld in deze selectie. Pas je filter aan.</div>';
  return filterBar()+`<div class="feed">${L.map(t=>`<div class="panel">
    <div class="feedhd"><b>${fmtD(t.date)} · ${t.time}</b><span>${esc(t.pair)}</span><span class="mu">${esc(t.setup)} · ${t.tf.join(' → ')}</span>${rB(t.r)}${money(t.pnl)}<span class="sp"></span>${tvLinks(t)} ${openTrade(t.id)}</div>
    <div class="feedbody">${t.shots[0]?`<img class="shot" src="${t.shots[0]}" onclick="openLb(${t.id},0)" alt="">`:''}
      ${t.shots.length>1?`<div class="more">${t.shots.slice(1).map((s,k)=>`<img class="shot" src="${s}" onclick="openLb(${t.id},${k+1})" alt="">`).join('')}</div>`:''}
      ${!t.shots.length?`<div class="note">Geen screenshot, alleen een TradingView-link.</div>`:''}
      ${t.note?`<div class="note">💬 ${esc(t.note)}</div>`:''}<div>${t.tags.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div></div></div>`).join('')}</div>`;}
// ── B: raster + presentatie ───────────────────────────────────────────
function VariantB(){const L=shown();if(!L.length)return filterBar()+'<div class="panel empty">Geen trades met beeld in deze selectie.</div>';
  const items=beelden(L);const perMaand={};items.forEach(x=>{const m=new Date(x.t.date+'T12:00').toLocaleDateString('nl-NL',{month:'long',year:'numeric'});(perMaand[m]=perMaand[m]||[]).push(x);});
  return filterBar()+`<div style="display:flex;gap:10px;margin:-4px 0 6px"><button class="btn pri" onclick="openLb(${items[0].t.id},${items[0].k},true)">▶ Presenteer (${items.length} beelden)</button><span class="mu" style="align-self:center;font-size:12.5px">Volledig scherm met de trade ernaast — handig als je met je coach je scherm deelt. ← → bladert.</span></div>`
   +Object.entries(perMaand).map(([m,xs])=>`<div class="grouphd">${m}</div><div class="grid">${xs.map(x=>`<div class="tile" onclick="openLb(${x.t.id},${x.k},true)">
     ${x.src?`<img src="${x.src}" alt="">`:`<div class="tvonly"><span style="font-size:30px">📈</span>Alleen TV-link</div>`}
     <div class="cap"><b>${fmtD(x.t.date)}</b> · ${esc(x.t.pair)} <span class="sp"></span>${rB(x.t.r)}</div></div>`).join('')}</div>`).join('');}
// ── C: coach-sessie ───────────────────────────────────────────────────
function VariantC(){const L=shown();const sel=S.sel.map(id=>TRADES.find(t=>t.id===id)).filter(Boolean);
  return filterBar()+`<div class="coach"><div class="panel">${L.length?L.map(t=>`<div class="crow"><input type="checkbox" ${S.sel.includes(t.id)?'checked':''} onchange="togSel(${t.id})" aria-label="kies voor sessie">
      <div style="min-width:150px"><b>${fmtD(t.date)}</b><div class="mu" style="font-size:12px">${esc(t.pair)} · ${esc(t.setup)}</div></div>${rB(t.r)}
      <div class="thumbs">${t.shots.map((s,k)=>`<img src="${s}" onclick="openLb(${t.id},${k})" alt="">`).join('')}${!t.shots.length?'<span class="tag">alleen TV-link</span>':''}</div><span class="sp"></span>${tvLinks(t)}</div>`).join(''):'<div class="empty">Geen trades in deze selectie.</div>'}</div>
    <div class="panel basket"><h3>Sessie met je coach</h3><div class="mu" style="font-size:12.5px;margin-bottom:8px">${sel.length?sel.length+' trades, in deze volgorde':'Vink links trades aan die je wilt bespreken.'}</div>
      ${sel.map((t,i)=>`<div class="bitem"><span class="o"><button onclick="mv(${i},-1)" aria-label="omhoog">▲</button><button onclick="mv(${i},1)" aria-label="omlaag">▼</button></span><span class="num mu">${i+1}</span><span style="flex:1"><b>${esc(t.pair)}</b> <span class="mu" style="font-size:12px">${fmtD(t.date)}</span></span>${rB(t.r)}<button class="linkbtn" onclick="togSel(${t.id})" aria-label="weghalen">✕</button></div>`).join('')}
      <label style="display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13px"><input type="checkbox" ${S.hide?'checked':''} onchange="S.hide=this.checked;draw()"> Bedragen verbergen (alleen R)</label>
      <div class="act">
        <button class="btn pri" ${sel.length?'':'disabled'} onclick="sessie()">▶ Samen doorlopen<small>volledig scherm, trade + notities ernaast</small></button>
        <button class="btn" ${sel.length?'':'disabled'} onclick="alert('Demo: download het coach-pakket (één HTML-bestand met deze trades, screenshots en links) — zoals het huidige Deel.')">⬇ Coach-pakket<small>één bestand om op te sturen</small></button>
        <button class="btn" ${sel.length?'':'disabled'} onclick="discord()">📋 Kopieer voor Discord<small>screenshot met een balk (pair · setup · R · datum) + tekst</small></button>
      </div><div id="dprev"></div></div></div>`;}
function togSel(id){const i=S.sel.indexOf(id);i<0?S.sel.push(id):S.sel.splice(i,1);draw();}
function mv(i,d){const j=i+d;if(j<0||j>=S.sel.length)return;[S.sel[i],S.sel[j]]=[S.sel[j],S.sel[i]];draw();}
function sessie(){const list=S.sel.map(id=>TRADES.find(t=>t.id===id));LB={items:beelden(list),i:0,panel:true};drawLb();}
function discord(){const t=TRADES.find(x=>x.id===S.sel[0]);const c=document.createElement('canvas'),img=new Image();img.onload=()=>{c.width=img.width;c.height=img.height+70;const g=c.getContext('2d');g.drawImage(img,0,0);
  g.fillStyle='#0d1118';g.fillRect(0,img.height,c.width,70);g.fillStyle='#fff';g.font='bold 28px Inter';g.fillText(`${t.pair} · ${t.setup} · ${t.r>=0?'+':'−'}${Math.abs(t.r).toFixed(2)}R · ${fmtD(t.date)}`,24,img.height+45);
  g.fillStyle='#7d88ff';g.font='bold 22px Inter';g.fillText('SyncJournal',c.width-170,img.height+44);
  document.getElementById('dprev').innerHTML=`<div style="margin-top:12px;font-size:12.5px" class="mu">Voorbeeld (eerste trade): dit gaat naar je klembord, plus de tekst eronder.</div><img src="${c.toDataURL('image/jpeg',.8)}" style="width:100%;border-radius:8px;margin-top:6px"><div class="note" style="margin-top:6px">${esc(t.pair)} ${t.dir} · ${esc(t.setup)} · ${t.tf.join(' → ')} · ${t.r>=0?'+':'−'}${Math.abs(t.r).toFixed(2)}R${t.note?'\n'+esc(t.note):''}</div>`;};
  img.src=t.shots[0]||chart(t,0);}
// ── D: review per trade, nieuwe indeling ──────────────────────────────
function VariantD(){const L=TRADES;const t=TRADES.find(x=>x.id===S.revId)||L[0];const i=L.indexOf(t);
  return `<div class="rev"><div class="panel rlist"><div style="padding:10px 12px;font-weight:800;border-bottom:1px solid var(--line2)">Trades <span class="mu" style="font-weight:600">· ${L.filter(x=>x.reviewed).length}/${L.length} gereviewd</span></div>
    <div style="max-height:78vh;overflow:auto">${L.map(x=>`<div class="it ${x.id===t.id?'on':''}" onclick="S.revId=${x.id};draw()">${x.shots[0]?`<img src="${x.shots[0]}" alt="">`:'<span style="width:44px;text-align:center">📈</span>'}<div style="flex:1;min-width:0"><b style="font-size:13px">${esc(x.pair)}</b><div class="mu" style="font-size:11.5px">${fmtD(x.date)} · ${esc(x.setup)}</div></div>${rB(x.r)}${x.reviewed?'<span class="g">✓</span>':''}</div>`).join('')}</div></div>
   <div class="panel"><div class="revhd"><h2>${esc(t.pair)} <span class="mu" style="font-weight:600">· ${esc(t.setup)}</span></h2><span class="tag">${t.dir.toUpperCase()}</span>${rB(t.r)}${money(t.pnl)}<span class="sp"></span>
      <button class="iconbtn" onclick="S.revId=L_id(${i-1});draw()">‹</button><span class="num mu">${i+1}/${L.length}</span><button class="iconbtn" onclick="S.revId=L_id(${i+1});draw()">›</button>
      <button class="btn ${t.reviewed?'':'pri'}" style="padding:6px 12px" onclick="t_rev(${t.id})">${t.reviewed?'✓ Gereviewd':'Markeer gereviewd'}</button><button class="iconbtn" title="delen">⤴</button><button class="iconbtn" title="bewerken">✎</button></div>
    <div style="padding:16px 16px 0">${t.shots[0]?`<img class="shot" src="${t.shots[0]}" onclick="openLb(${t.id},0)" alt="">`:`<div class="note">Nog geen screenshot — plak er een (Ctrl+V) of sleep hem hierheen.</div>`}
      <div style="display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap">${t.shots.slice(1).map((s,k)=>`<img src="${s}" onclick="openLb(${t.id},${k+1})" style="width:120px;border-radius:7px;border:1px solid var(--line);cursor:zoom-in" alt="">`).join('')}<button class="iconbtn">+ screenshot</button>${tvLinks(t)}</div></div>
    <div style="padding:14px 16px 0"><div class="facts">${[['Datum',fmtD(t.date)+' '+t.time],['Lagen',t.tf.join(' → ')],['Entry','83.871,8'],['Stop','84.880,3'],['Exit','84.011,3'],['Gepland R:R','1,9 : 1']].map(([l,v])=>`<div><div class="l">${l}</div><div class="num" style="font-size:13px">${v}</div></div>`).join('')}</div>
      <div class="mu" style="font-size:12px;margin-top:6px">Stappen, TP-breakdown en alle details: uitklapbaar ▾ (zoals nu, maar niet meer in een smalle kolom)</div></div>
    <div class="two"><div><div style="font-weight:800;margin-bottom:6px">Wat gebeurde er?</div><textarea>${esc(t.note)}</textarea><div style="font-weight:800;margin:10px 0 6px">Leerpunt</div><textarea style="min-height:50px">${esc(t.lesson)}</textarea></div>
      <div><div style="font-weight:800;margin-bottom:6px">Emotie</div>${['Kalm','Gefocust','FOMO','Twijfel','Gehaast','Revenge'].map(e=>`<span class="emo ${t.emo===e?'on':''}">${e}</span>`).join('')}
        <div style="font-weight:800;margin:10px 0 6px">Discipline</div>${['Setup uit playbook','Risk ≤ 1%','Plan vooraf','Geen emotionele instap','TP/SL vooraf'].map((c,j)=>`<label style="display:flex;gap:8px;font-size:13px;margin-bottom:4px"><input type="checkbox" ${j<3?'checked':''}> ${c}</label>`).join('')}
        <div style="font-weight:800;margin:10px 0 6px">Tags</div>${t.tags.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div></div></div></div>`;}
function L_id(i){const L=TRADES;return L[(i+L.length)%L.length].id;}
function t_rev(id){const t=TRADES.find(x=>x.id===id);t.reviewed=!t.reviewed;draw();}
// ── render + schakelaar ───────────────────────────────────────────────
function draw(){const v=S.variant;
  document.getElementById('main').innerHTML=`<div class="top"><h1>Review</h1><span class="sub">leer van elke trade</span><span class="sp"></span>
    <div class="modes"><button class="${v==='D'?'on':''}" onclick="setV('D')">Per trade</button><button class="${v!=='D'?'on':''}" onclick="setV(S.lastBeeld||'A')">🖼 Beeld</button></div>
    <button class="iconbtn" onclick="S.hide=!S.hide;draw()">${S.hide?'👁 Toon bedragen':'🙈 Verberg bedragen'}</button></div>`
    +({A:VariantA,B:VariantB,C:VariantC,D:VariantD}[v]||VariantA)();
  const lbl=VARIANTS.find(x=>x[0]===v);
  document.getElementById('switch').innerHTML=`<button onclick="cycle(-1)" aria-label="vorige variant">←</button><span class="lbl">${v} — ${lbl?lbl[1]:''}</span><button onclick="cycle(1)" aria-label="volgende variant">→</button><button class="th" onclick="document.body.classList.toggle('dark')">licht/donker</button>`;}
function setV(v){if(v!=='D')S.lastBeeld=v;S.variant=v;syncUrl();draw();}
function syncUrl(){const u=new URL(location);u.searchParams.set('variant',S.variant);history.replaceState(null,'',u);}
function cycle(d){const ks=VARIANTS.map(x=>x[0]);setV(ks[(ks.indexOf(S.variant)+d+ks.length)%ks.length]);}
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]'))return;
  if(LB){if(e.key==='ArrowLeft')lbGo(-1);else if(e.key==='ArrowRight')lbGo(1);else if(e.key==='Escape')closeLb();return;}
  if(e.key==='ArrowLeft')cycle(-1);else if(e.key==='ArrowRight')cycle(1);});
draw();
</script>
</body>
</html>
