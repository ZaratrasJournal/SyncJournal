<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SyncJournal · Trades-tabel — 4 indelingen</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6FA;--surface:#fff;--sink:#F7F9FC;--ink:#191E2A;--ink2:#525A6B;--muted:#8A92A3;--faint:#AAB1C0;
  --line:#E8EBF2;--line2:#F0F2F7;--accent:#3B5BD9;--accent-soft:#EDF0FD;--green:#12946A;--red:#D64259;--amber:#C0821C;--amber-soft:#F8EFDD;
  --fb:'Inter',sans-serif;--fd:'Plus Jakarta Sans',sans-serif;--fn:'IBM Plex Mono',monospace;--sh:0 1px 2px rgba(20,30,60,.05);
}
body.dark{
  --bg:#0E1218;--surface:#141A22;--sink:#10151c;--ink:#F4F7FB;--ink2:#C7CFDB;--muted:#939CAC;--faint:#6C7583;
  --line:#232B36;--line2:#1C232D;--accent:#6E86F0;--accent-soft:#1B2436;--green:#37C48B;--red:#F0637A;--amber:#E0A63C;--amber-soft:#28210F;--sh:0 1px 2px rgba(0,0,0,.25);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:13.5px;line-height:1.5;padding:28px 24px 80px;-webkit-font-smoothing:antialiased}
.num{font-family:var(--fn);font-variant-numeric:tabular-nums}
.g{color:var(--green)}.r{color:var(--red)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
h1,h3{font-family:var(--fd)}
.wrap{max-width:1560px;margin:0 auto}
.head{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px}
.head h1{font-size:20px;margin-bottom:3px}
.head p{color:var(--ink2);font-size:12.5px;max-width:720px}
.head .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-size:12.5px;font-weight:600;color:var(--ink2);box-shadow:var(--sh)}
.vswitch{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.vswitch button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:8px 18px;font-size:13px;font-weight:700;color:var(--ink2)}
.vswitch button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:13px;box-shadow:var(--sh);overflow:hidden}
.note{font-size:12px;color:var(--muted);margin:10px 2px 16px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;padding:11px 13px;border-bottom:1px solid var(--line);background:var(--sink);white-space:nowrap}
tbody td{padding:9px 13px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr:hover{background:var(--sink)}
th.rt,td.rt{text-align:right}
.sub{font-size:10.5px;color:var(--muted)}
.pill{font-size:10px;font-weight:800;padding:2px 8px;border-radius:5px;letter-spacing:.04em}
.pill.long{background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green)}
.pill.short{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.status-open{font-size:10px;font-weight:800;padding:2px 8px;border-radius:5px;background:var(--amber-soft);color:var(--amber)}
.setup{font-size:11px;font-weight:700;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:6px;padding:2px 8px;white-space:nowrap}
.sess{font-size:10.5px;font-weight:700;color:var(--muted)}
.exav{width:20px;height:20px;border-radius:26%;display:inline-grid;place-items:center;font-size:8px;font-weight:800;color:#fff;vertical-align:middle;margin-right:6px}
.dur{display:inline-block;font-family:var(--fn);font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:12px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.dur.live{background:var(--amber-soft);color:var(--amber)}
/* B: mini-tijdlijn */
.tlwrap{display:flex;align-items:center;gap:6px;white-space:nowrap}
.tlwrap .mo{text-align:right}
.tlwrap .dots{color:var(--faint);letter-spacing:2px;font-size:10px}
/* C: presets */
.presetbar{display:flex;gap:5px;padding:10px 13px;border-bottom:1px solid var(--line2);background:var(--sink)}
.presetbar button{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 13px;font-size:11.5px;font-weight:700;color:var(--ink2)}
.presetbar button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.presetbar .hint{margin-left:auto;font-size:11px;color:var(--muted);align-self:center}
/* D: hover-uitklaprij (patroon originele journal) */
.mrow{cursor:pointer}
.drow>td{background:var(--sink);border-bottom:1px solid var(--line);padding:11px 18px 13px 52px}
.drow:hover>td{background:var(--sink)}
.dstats{display:flex;gap:24px;flex-wrap:wrap}
.dstat .lb{font-size:9px;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--muted);margin-bottom:2px}
.dstat .vl{font-family:var(--fn);font-weight:700;font-size:12px}
.dstat .vl .xtra{color:var(--muted);font-weight:500;font-size:10px;font-family:var(--fb)}
.dnotes{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.dnote{flex:1 1 240px;min-width:0;padding:7px 12px;border-left:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 5%,transparent);border-radius:0 7px 7px 0;font-size:11.5px;color:var(--ink2);line-height:1.55}
.dnote .lb{font-size:9px;text-transform:uppercase;letter-spacing:.09em;font-weight:800;color:var(--accent);margin-bottom:2px}
.dnote.rev{border-left-color:var(--muted);background:color-mix(in srgb,var(--muted) 6%,transparent)}
.dnote.rev .lb{color:var(--muted)}
.dmeta{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--ink2)}
.dmeta .lay{font-family:var(--fn);font-weight:600;color:var(--accent)}
.dmeta .arr{color:var(--faint)}
.dmeta .star{color:var(--amber)}.dmeta .staro{color:var(--faint)}
.dmeta .mchip{padding:1px 7px;border-radius:4px;background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red);font-size:10px;font-weight:700;margin-left:3px}
.dhint{font-size:10px;color:var(--faint);margin-left:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div style="font-size:26px">📋</div>
    <div><h1>Trades-tabel — vier indelingen</h1>
      <p>Zelfde 8 trades, vier manieren om open/close/duur te tonen. Wissel hieronder. In alle varianten blijft de volledige tijdlijn (open → TP's → close) beschikbaar via de trade zelf.</p></div>
    <span class="sp"></span>
    <button class="btn" onclick="document.body.classList.toggle('dark')">◐ Thema</button>
  </div>
  <div class="vswitch" id="vsw"></div>
  <div class="note" id="vnote"></div>
  <div class="panel" id="stage"></div>
</div>
<script>
'use strict';
const EX={mexc:['MEXC','#0057FF','M'],blofin:['Blofin','#15181d','B'],okx:['OKX','#000','⊞'],hyperliquid:['Hyperliquid','#011916','~'],ftmo:['FTMO','#262729','F']};
const T=[
 {o:'31-08 19:04',c:'31-08 21:18',d:'2u 14m',ex:'mexc',pair:'LINK/USDT',dir:'short',entry:'17,07',exit:'16,71',size:'14.149',pnl:287,pct:'1,17',r:'+1.3R',setup:'Reclaim',sess:'US PM'},
 {o:'31-08 18:59',c:'01-09 00:11',d:'5u 12m',ex:'blofin',pair:'BTC/USDT',dir:'short',entry:'58.563,2',exit:'58.180,2',size:'20.388',pnl:124,pct:'0,50',r:'+1.4R',setup:'London SFP',sess:'US PM'},
 {o:'31-08 16:29',c:'31-08 17:07',d:'38m',ex:'okx',pair:'ARB/USDT',dir:'long',entry:'1,096',exit:'1,128',size:'7.446',pnl:212,pct:'0,86',r:'+1.9R',setup:'London SFP',sess:'US AM'},
 {o:'31-08 16:02',c:null,d:'~2u 41m',ex:'mexc',pair:'ETH/USDT',dir:'long',entry:'3.180,2',exit:'',size:'2.507',pnl:-24,pct:'0,10',r:'',setup:'BOS-retest',sess:'US AM',open:true},
 {o:'31-08 14:50',c:'31-08 15:09',d:'19m',ex:'hyperliquid',pair:'ETH/USDT',dir:'short',entry:'3.767',exit:'3.845,5',size:'21.827',pnl:-465,pct:'1,89',r:'-1.1R',setup:'Reclaim',sess:'US AM'},
 {o:'31-08 12:12',c:'31-08 15:23',d:'3u 11m',ex:'blofin',pair:'ETH/USDT',dir:'short',entry:'3.641,3',exit:'3.588,6',size:'6.558',pnl:88,pct:'0,36',r:'+2.1R',setup:'BOS-retest',sess:'London'},
 {o:'29-08 12:01',c:'29-08 14:04',d:'2u 3m',ex:'okx',pair:'SOL/USDT',dir:'long',entry:'150,18',exit:'149,31',size:'14.479',pnl:-98,pct:'0,40',r:'-0.9R',setup:'London SFP',sess:'Weekend'},
 {o:'26-08 16:00',c:'29-08 08:58',d:'2d 17u',ex:'ftmo',pair:'BNB/USDT',dir:'long',entry:'542,52',exit:'539,15',size:'21.643',pnl:-142,pct:'0,58',r:'-0.9R',setup:'Trend-pullback',sess:'US AM'},
];
const av=ex=>{const[n,c,m]=EX[ex];return `<span class="exav" style="background:${c}">${m}</span>${n}`;};
const pnlC=t=>`<span class="num ${t.pnl>=0?'g':'r'}" style="font-weight:700">${t.pnl>=0?'+':'−'}$ ${Math.abs(t.pnl)}<div class="sub ${t.pnl>=0?'g':'r'}" style="opacity:.75">${t.pnl>=0?'▲':'▼'}${t.pct}%</div></span>`;
const rC=t=>t.r?`<span class="num" style="font-weight:700;color:${t.r.startsWith('+')?'var(--green)':'var(--red)'}">${t.r}</span>`:'<span class="sub">–</span>';
const two=(s)=>{const[a,b]=s.split(' ');return `${a}<div class="sub num">${b}</div>`;};
const common=t=>`<td>${av(t.ex)}</td><td><b>${t.pair}</b></td><td><span class="pill ${t.dir}">${t.dir.toUpperCase()}</span></td>
  <td class="rt num">${t.entry}</td><td class="rt num">${t.exit||'–'}</td><td class="rt num">$ ${t.size}</td>
  <td class="rt">${pnlC(t)}</td><td class="rt">${rC(t)}</td><td><span class="setup">${t.setup}</span></td><td><span class="sess">${t.sess}</span></td>`;
const commonHead=`<th>Exchange</th><th>Pair</th><th>Richting</th><th class="rt">Entry</th><th class="rt">Exit</th><th class="rt">Size</th><th class="rt">P&L</th><th class="rt">R</th><th>Setup</th><th>Sessie</th>`;

const VARIANTS={
 A:{name:'A · Compact',note:'Industrie-minimaal (Stonk Journal / TradeStream-model): één Gesloten-kolom (datum + tijd) en één duur-token. Het open-moment zie je in de trade zelf (tijdlijn) en als tooltip. 12 kolommen totaal — maximale rust.',
  html(){return `<table><thead><tr><th>Gesloten ▾</th><th class="rt">Duur</th>${commonHead}</tr></thead><tbody>
   ${T.map(t=>`<tr title="Geopend ${t.o.replace(' ',' om ')}"><td class="num">${t.open?'<span class="status-open">● OPEN</span>':two(t.c)}</td>
     <td class="rt"><span class="dur${t.open?' live':''}">${t.d}</span></td>${common(t)}</tr>`).join('')}</tbody></table>`;}},
 B:{name:'B · Mini-tijdlijn',note:'Coin Market Manager-stijl: Open ⋯ duur ⋯ Close als één visuele unit — je leest het trade-verloop in één oogopslag. Iets breder dan A, maar de vijf losse tijd-kolommen zijn terug naar één blok.',
  html(){return `<table><thead><tr><th colspan="3" style="text-align:center">Open · duur · close</th>${commonHead}</tr></thead><tbody>
   ${T.map(t=>`<tr><td class="num" style="padding-right:4px"><div class="tlwrap"><span class="mo">${two(t.o)}</span></div></td>
     <td style="padding:9px 2px;text-align:center;white-space:nowrap"><span class="dots">⋯</span> <span class="dur${t.open?' live':''}">${t.d}</span> <span class="dots">⋯</span></td>
     <td class="num" style="padding-left:4px">${t.open?'<span class="status-open">● OPEN</span>':two(t.c)}</td>${common(t)}</tr>`).join('')}</tbody></table>`;}},
 C:{name:'C · Kolom-presets',note:'Tradervue/TraderSync-model: jij kiest wat je ziet. Drie benoemde presets (keuze wordt onthouden). Compact = scannen, Standaard = dagelijks gebruik, Alles = onderzoek. Probeer de knoppen!',
  html(){const p=window.__preset||'standaard';
   const rows=T.map(t=>{
     const open=`<td class="num">${two(t.o)}</td>`;
     const close=`<td class="num">${t.open?'<span class="status-open">● OPEN</span>':two(t.c)}</td>`;
     const dur=`<td class="rt"><span class="dur${t.open?' live':''}">${t.d}</span></td>`;
     if(p==='compact')return `<tr>${close}${dur}<td><b>${t.pair}</b></td><td><span class="pill ${t.dir}">${t.dir.toUpperCase()}</span></td><td class="rt">${pnlC(t)}</td><td class="rt">${rC(t)}</td><td><span class="setup">${t.setup}</span></td></tr>`;
     if(p==='alles')return `<tr>${open}${close}${dur}${common(t)}<td><span class="sub">FVG · OB</span></td></tr>`;
     return `<tr>${close}${dur}${common(t)}</tr>`;
   }).join('');
   const head=p==='compact'?`<th>Gesloten</th><th class="rt">Duur</th><th>Pair</th><th>Richting</th><th class="rt">P&L</th><th class="rt">R</th><th>Setup</th>`
     :p==='alles'?`<th>Open</th><th>Gesloten</th><th class="rt">Duur</th>${commonHead}<th>Tags</th>`
     :`<th>Gesloten</th><th class="rt">Duur</th>${commonHead}`;
   return `<div class="presetbar">${[['compact','Compact'],['standaard','Standaard'],['alles','Alles']].map(([k,l])=>`<button class="${p===k?'on':''}" onclick="window.__preset='${k}';show('C')">${l}</button>`).join('')}<span class="hint">keuze wordt onthouden per gebruiker</span></div>
     <table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`;}},
};
// D: extra detail-data per trade (index-parallel aan T) — vult de uitklap-rij
const DX=[
 {sl:'17,26',risk:'220',riskPct:'1,0',fees:'4,10',rating:4,layers:['4H Range-high','15m Reclaim'],tps:'2 TP’s · 2 hit',acct:'MEXC · Main',
  thesis:'Sweep van range-high met directe reclaim eronder; short mee met US PM momentum.',review:'Volgens plan uitgevoerd, TP2 had iets verder gekund.'},
 {sl:'58.840',risk:'90',riskPct:'0,5',fees:'6,20',rating:5,layers:['1D Weerstand','1H London SFP'],tps:'2 TP’s · 2 hit',acct:'Blofin · Main',
  thesis:'SFP van London-high recht in 1D-weerstand. A+ setup, halve risk vanwege nieuwsweek.',review:'Perfecte uitvoering — dit is het playbook.'},
 {sl:'1,079',risk:'110',riskPct:'0,5',fees:'1,90',rating:4,layers:['4H BOS','5m London SFP'],tps:'1 TP · 1 hit',acct:'OKX',
  thesis:'Snelle scalp op London SFP; target de equal highs erboven.'},
 {sl:'3.135',risk:'115',riskPct:'1,0',rating:0,layers:['4H Steun','15m BOS-retest'],tps:'2 TP’s · 0 hit',acct:'MEXC · Main',
  thesis:'BOS-retest op 4H steun; swing-target de weekly open erboven.'},
 {sl:'3.845',risk:'420',riskPct:'2,0',fees:'9,80',rating:2,layers:['1H Reclaim'],tps:'2 TP’s · 0 hit',acct:'Hyperliquid',mistakes:['Te vroeg ingestapt','SL verruimd'],
  thesis:'Reclaim-short op 1H, maar zonder HTF-bevestiging.',review:'Stop verruimd onder druk — dubbele risk verloren. Grootste fout deze week.'},
 {sl:'3.664',risk:'42',riskPct:'0,25',fees:'2,30',rating:3,layers:['4H Trend','15m BOS-retest'],tps:'3 TP’s · 2 hit',acct:'Blofin · Sub'},
 {rating:3,acct:'OKX'},
 {sl:'546,10',risk:'160',riskPct:'0,8',fees:'3,40',rating:2,layers:['1D Trend','4H Pullback'],tps:'2 TP’s · 0 hit',acct:'FTMO · Challenge',
  review:'Weekend-gap tegen de positie in; swing over het weekend heroverwegen.'}];
function dDetail(t,d){
  const stat=(lb,vl,cls)=>`<div class="dstat"><div class="lb">${lb}</div><div class="vl ${cls||''}">${vl}</div></div>`;
  let s='';
  if(d.sl)s+=stat('Stop-loss',d.sl,'r');
  if(d.risk)s+=stat('Risk',`$ ${d.risk} <span class="xtra">(${d.riskPct}%)</span>`,'r');
  if(d.fees)s+=stat('Fees','$ '+d.fees);
  s+=stat('Duur',t.d,t.open?'':undefined)+(t.open?stat('Status','loopt nog',''):'');
  if(!t.open)s+=stat('PnL %',(t.pnl>=0?'+':'−')+t.pct+'%',t.pnl>=0?'g':'r');
  if(d.acct)s+=stat('Account',d.acct);
  let notes='';
  if(d.thesis)notes+=`<div class="dnote"><div class="lb">Thesis</div>${d.thesis}</div>`;
  if(d.review)notes+=`<div class="dnote rev"><div class="lb">Review</div>${d.review}</div>`;
  let meta='';
  if(d.layers)meta+=`<span>📐 ${d.layers.map(l=>`<span class="lay">${l}</span>`).join(' <span class="arr">→</span> ')}</span>`;
  if(d.tps)meta+=`<span>🎯 <span class="num">${d.tps}</span></span>`;
  if(d.rating)meta+=`<span>${[1,2,3,4,5].map(n=>`<span class="${n<=d.rating?'star':'staro'}">${n<=d.rating?'★':'☆'}</span>`).join('')}</span>`;
  if(d.mistakes)meta+=`<span>⚠${d.mistakes.map(m=>`<span class="mchip">${m}</span>`).join('')}</span>`;
  if(!s&&!notes&&!meta)return '<span class="sub" style="font-style:italic">Klik om meer details toe te voegen</span>';
  return `<div class="dstats">${s}</div>${notes?`<div class="dnotes">${notes}</div>`:''}${meta?`<div class="dmeta">${meta}</div>`:''}`;
}
VARIANTS.D={name:'D · Hover-uitklap',note:'Het patroon van de originele journal: compacte tabel met één Datum-kolom. Hover over een rij en er klapt een detail-rij onder open met duur, stop-loss, risk, fees, thesis/review, lagen, TP’s, rating en fouten-tags. Niets permanent in de tabel — alles op afroep.',
 html(){return `<table><thead><tr><th>Datum ▾</th>${commonHead}</tr></thead><tbody onmouseleave="dHide()">
  ${T.map((t,i)=>`<tr class="mrow" onmouseenter="dShow(${i})"><td class="num">${two(t.o)}${t.open?' <span class="status-open">● OPEN</span>':''}<span class="dhint">⌄</span></td>${common(t)}</tr>
  <tr class="drow" id="drow${i}" hidden><td colspan="11">${dDetail(t,DX[i]||{})}</td></tr>`).join('')}</tbody></table>`;}};
let dCur=-1;
function dShow(i){if(dCur===i)return;dHide();const r=document.getElementById('drow'+i);if(r){r.hidden=false;dCur=i;}}
function dHide(){if(dCur<0)return;const r=document.getElementById('drow'+dCur);if(r)r.hidden=true;dCur=-1;}
function show(k){window.__v=k;
  document.getElementById('vsw').innerHTML=Object.entries(VARIANTS).map(([key,v])=>`<button class="${key===k?'on':''}" onclick="show('${key}')">${v.name}</button>`).join('');
  document.getElementById('vnote').textContent=VARIANTS[k].note;
  document.getElementById('stage').innerHTML=VARIANTS[k].html();
}
show('A');
</script>
</body>
</html>
