<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Funded modus · demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── Overgenomen uit work/syncjournal.html (variabelen, shell, panel, kpi, tbl, btn, seg, setrow, sw, field, empty, tabs) ── */
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --raise:#FBFCFE; --sink:#F7F9FC;
  --ink:#191E2A; --ink2:#525A6B; --muted:#6B7385; --faint:#7A8291;
  --line:#E8EBF2; --line2:#F0F2F7;
  --accent:#3B5BD9; --accent-soft:#EDF0FD; --accent-line:#CDD6F7;
  --green:#12946A; --green-soft:#E3F4EC; --red:#D64259; --red-soft:#FBE8EC; --amber:#C0821C; --amber-soft:#F8EFDD;
  --violet:#7C5CE0; --teal:#0E9E96;--pink:#D6409F;
  --grid:#EDEFF5; --hover:#F6F8FC; --track:#EEF1F6; --zebra:#FAFBFD;
  --fb:'Inter',sans-serif; --fd:'Plus Jakarta Sans',sans-serif; --fn:'IBM Plex Mono',monospace;
  --sh:0 1px 2px rgba(20,30,60,.05);
}
body.dark{
  --bg:#0E1218; --surface:#141A22; --raise:#171E28; --sink:#10151c;
  --ink:#F4F7FB; --ink2:#C7CFDB; --muted:#939CAC; --faint:#6C7583;
  --line:#232B36; --line2:#1C232D;
  --accent:#6E86F0; --accent-soft:#1B2436; --accent-line:#2E3B57;
  --green:#37C48B; --green-soft:#12261F; --red:#F0637A; --red-soft:#2A1820; --amber:#E0A63C; --amber-soft:#28210F;
  --violet:#A78BFA; --teal:#2CC5B6;--pink:#F472B6;
  --grid:#1B222C; --hover:#19212B; --track:#1E2732; --zebra:#12171f;
  --sh:0 1px 2px rgba(0,0,0,.25);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .35s,color .35s}
.num{font-family:var(--fn);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.g{color:var(--green)} .r{color:var(--red)} .a{color:var(--accent)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
h1,h2,h3,h4{font-family:var(--fd);font-weight:700;letter-spacing:-.01em}
input,select{font-family:inherit}
.shell{display:grid;grid-template-columns:236px 1fr;min-height:calc(100vh - 52px)}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column}
.logo{font-family:var(--fd);font-weight:800;font-size:17px;letter-spacing:-.02em;padding:20px 22px 16px}
.logo span{color:var(--accent)}
.side nav{display:flex;flex-direction:column;gap:2px;padding:6px 12px}
.side nav button{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;color:var(--ink2);font-size:13.5px;font-weight:600;text-align:left;width:100%;border-left:2px solid transparent}
.side nav button:hover{background:var(--hover);color:var(--ink)}
.side nav button.on{background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent);border-left-color:var(--accent);border-radius:0 8px 8px 0}
.body{min-width:0;display:flex;flex-direction:column}
.appbar{display:flex;align-items:center;gap:16px;padding:0 30px;height:62px;border-bottom:1px solid var(--line);background:var(--bg)}
.appbar h1{font-size:19px}
.appbar .ptbar{width:4px;height:21px;border-radius:3px;background:var(--accent);flex:none;margin-right:-8px}
.appbar .sp{flex:1}
main{padding:26px 30px 46px}
.grid{display:grid;gap:16px}
.grid>*,.kpis>*{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--sh)}
.phead{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.phead h3{font-size:14px}
.phead .sp{flex:1}
.pbody{padding:16px}
.chip{font-size:11px;color:var(--muted);font-weight:600}
.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:15px 16px 15px 18px;box-shadow:var(--sh);position:relative}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:.85;border-radius:9px 0 0 9px}
.kpi.pos::before{background:var(--green)}.kpi.neg::before{background:var(--red)}.kpi.fund::before{background:var(--violet)}.kpi.mix::before{background:var(--amber)}
.kpi .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.kpi .v{font-family:var(--fn);font-variant-numeric:tabular-nums;font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:9px;color:var(--ink)}
.kpi .v.g{color:var(--green)} .kpi .v.r{color:var(--red)}
.kpi .d{font-size:12.5px;margin-top:6px;color:var(--muted)}
.tblwrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl thead th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sink)}
.tbl thead th.rt,.tbl td.rt{text-align:right}
.tbl td.num{white-space:nowrap}
.tbl tbody td{padding:8px 14px;border-bottom:1px solid var(--line2)}
.tbl tbody tr:nth-child(even) td{background:var(--zebra)}
.tbl tbody tr:hover td{background:var(--hover)}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl tfoot td{padding:11px 14px;border-top:1px solid var(--line);font-weight:700;font-size:12.5px}
.pill{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap}
.pill.long{color:var(--green);background:var(--green-soft)} .pill.short{color:var(--red);background:var(--red-soft)}
.seg{display:flex;gap:2px;background:var(--sink);border:1px solid var(--line);border-radius:9px;padding:3px;width:max-content;max-width:100%;flex-wrap:wrap}
.seg button{color:var(--muted);font-size:12px;font-weight:600;padding:5px 11px;border-radius:6px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.setrow{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.setrow:last-child{border-bottom:none}
.setrow .txt{flex:1;min-width:0}
.setrow .txt b{font-size:13.5px;font-weight:600}
.setrow .txt small{display:block;color:var(--muted);font-size:11.5px}
.sw{width:42px;height:24px;border-radius:999px;background:var(--track);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.sw.on{background:var(--accent)} .sw.on::after{left:21px}
.btn{font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn:hover{border-color:var(--accent-line)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.field input,.field select{border:1px solid var(--line);border-radius:9px;background:var(--sink);color:var(--ink);padding:9px 11px;font-size:13.5px;outline:none;min-width:0}
.field input:focus,.field select:focus{border-color:var(--accent);background:var(--surface)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:42px 24px;max-width:460px;margin:0 auto}
.empty-ico{font-size:34px;margin-bottom:14px;line-height:1}
.empty-h{font-size:17px;margin-bottom:8px}
.empty-d{color:var(--muted);font-size:13px;line-height:1.55;margin-bottom:18px}
.dov-note{padding:9px 13px;border-radius:8px;font-size:12.5px;line-height:1.55}
.dov-note.warn{background:var(--amber-soft);color:var(--amber)} .dov-note.bad{background:var(--red-soft);color:var(--red)} .dov-note.ok{background:var(--green-soft);color:var(--green)} .dov-note.info{background:var(--sink);color:var(--muted)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:none;background:none;color:var(--muted);font-size:13.5px;font-weight:600;padding:8px 13px;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.settabs button{padding:9px 15px}
.settabs{flex-wrap:wrap;row-gap:2px}
.settabs .tico2{margin-right:7px;font-size:13px;filter:grayscale(.15)}
.setintro{font-size:12.5px;color:var(--muted);margin:0 0 14px;line-height:1.5}
.section-sub{font-size:12px;font-weight:700;color:var(--ink2);margin:20px 2px 8px;letter-spacing:-.01em}
.section-sub .hint{font-weight:500;color:var(--muted);font-size:11.5px}
.setrow.trsel{background:var(--accent-soft)}


/* ── Alleen voor deze demo (uitsluitend app-variabelen) ── */
.demobar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding:9px 16px;background:var(--surface);border-bottom:2px dashed var(--accent-line)}
.demobar .lbl{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.demobar .grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.newbar{font-size:12.5px;color:var(--ink2);padding:8px 30px;background:var(--accent-soft);border-bottom:1px solid var(--accent-line)}
.newbar b{color:var(--accent)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;letter-spacing:.02em;white-space:nowrap;border:1px solid transparent}
.badge.fund{background:color-mix(in srgb,var(--violet) 12%,transparent);color:var(--violet);border-color:color-mix(in srgb,var(--violet) 30%,transparent)}
.badge.mix{background:var(--amber-soft);color:var(--amber);border-color:color-mix(in srgb,var(--amber) 35%,transparent)}
.badge.own{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.badge.st-bezig,.badge.st-actief{background:var(--accent-soft);color:var(--accent)}
.badge.st-gehaald{background:var(--green-soft);color:var(--green)}
.badge.st-niet{background:var(--red-soft);color:var(--red)}
.badge.st-gestopt{background:var(--sink);color:var(--muted);border-color:var(--line)}
.duo{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.hero{padding:20px 22px}
.hero .big{font-family:var(--fd);font-size:32px;font-weight:800;letter-spacing:-.03em;margin:6px 0 4px}
.hero .meta{color:var(--ink2);font-size:13px;display:flex;gap:6px 16px;flex-wrap:wrap}
.hero.ownside{border-left:3px solid var(--accent)}
.hero.mixside{border-left:3px solid var(--amber)}
.split{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.split{gap:4px 18px}
.split span{font-size:12.5px;color:var(--muted)}
.split span b{color:var(--ink2);font-family:var(--fn);font-weight:600}
.fcard{padding:16px 18px;border-left:3px solid var(--violet);display:flex;flex-direction:column;gap:10px}
.fcard .fh{display:flex;align-items:center;gap:8px}
.calc{font-family:var(--fn);font-size:12px;color:var(--ink2);background:var(--sink);border-radius:7px;padding:8px 11px;overflow-x:auto;white-space:nowrap}
.filterbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.iform{background:var(--sink);border:1px solid var(--line2);border-radius:9px;padding:12px}
.formrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn.sm{padding:5px 10px;font-size:12px}
.linkbtn{color:var(--accent);font-weight:600;text-decoration:underline;font-size:inherit;padding:0}
.files{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.filebtn{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:12px 14px;box-shadow:var(--sh)}
.filebtn:hover{border-color:var(--accent-line)}
.filebtn.on{border-color:var(--accent);background:var(--accent-soft)}
.filebtn b{display:block;font-family:var(--fn);font-size:12px;word-break:break-all}
.filebtn small{color:var(--muted);font-size:11.5px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kv div{background:var(--sink);border-radius:8px;padding:8px 11px;min-width:0}
.kv div small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.kv div b{font-family:var(--fn);font-size:13px;word-break:break-all}
.opt{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border-bottom:1px solid var(--line2);cursor:pointer}
.opt:last-child{border-bottom:none}
.opt:hover{background:var(--hover)}
.opt.on{background:var(--accent-soft)}
.opt input{margin-top:3px;accent-color:var(--accent);flex:none}
.opt .txt{flex:1;min-width:0}
.opt .txt b{font-weight:600}
.opt .txt small{display:block;color:var(--muted);font-size:11.5px}
.dim{color:var(--muted)}
.acc-name{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.explain summary{cursor:pointer;padding:12px 18px;font-size:12.5px;font-weight:600;color:var(--ink2)}
details.explain[open] summary{border-bottom:1px solid var(--line2)}
.sums{display:flex;gap:28px;margin:18px 2px 10px;flex-wrap:wrap}
.sums small{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.sums b{font-size:18px;font-weight:700;letter-spacing:-.02em}
.clist{display:grid;gap:8px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:var(--sh)}
.ccard.open{border-color:var(--accent-line)}
.chead{display:flex;align-items:center;gap:14px;padding:13px 16px;cursor:pointer;border-radius:9px}
.chead:hover{background:var(--hover)}
.chead:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.cname{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.cn{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.cn b{font-family:var(--fd);font-size:15px;font-weight:700}
.firm{font-size:12px;color:var(--muted)}
.tag-sm{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.tag-sm.fund{color:var(--violet)}
.pillwrap{position:relative}
.pill-btn{cursor:pointer;font-family:var(--fb)}
.pill-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.smenu{position:absolute;top:calc(100% + 4px);left:0;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:0 6px 22px color-mix(in srgb,var(--ink) 14%,transparent);padding:5px;display:flex;flex-direction:column;gap:2px;min-width:170px}
.smenu button{text-align:left;padding:5px 7px;border-radius:6px}
.smenu button:hover,.smenu button.on{background:var(--hover)}
.cval{text-align:right;flex:none}
.cp{font-size:19px;font-weight:700;letter-spacing:-.02em}
.cpct{font-size:12px;color:var(--muted);margin-top:1px}
.cbody{border-top:1px solid var(--line2);padding:12px 16px 14px;display:grid;gap:12px}
.cdl{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;font-size:13px}
.cdl dt{color:var(--muted)}
.cdl dd{color:var(--ink)}
.pays .ph{font-size:12px;color:var(--muted);margin-bottom:4px}
.pays .pr{display:flex;justify-content:space-between;max-width:260px;font-size:13px;padding:2px 0}
details.done{margin-top:16px}
details.done>summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted);padding:6px 2px;list-style:none}
details.done>summary::before{content:'▸ ';}
details.done[open]>summary::before{content:'▾ ';}
details.done>summary::-webkit-details-marker{display:none}
details.done .ccard{box-shadow:none;background:var(--raise)}
.fbig{font-size:26px;font-weight:700;letter-spacing:-.02em}
.fsub{font-size:12.5px;color:var(--muted)}
.fsub b{color:var(--ink2);font-weight:600}
.fsub .dot{margin:0 7px}
@media(max-width:960px){.kpis{grid-template-columns:1fr 1fr}.duo{grid-template-columns:1fr}.files{grid-template-columns:1fr}}
@media(max-width:720px){
  .shell{grid-template-columns:1fr}
  .side{flex-direction:row;align-items:center;border-right:none;border-bottom:1px solid var(--line);overflow-x:auto}
  .logo{padding:12px 14px;font-size:15px;flex:none}
  .side nav{flex-direction:row;padding:6px 8px 6px 0}
  .side nav button{white-space:nowrap;padding:7px 10px;border-left:none;border-bottom:2px solid transparent}
  .side nav button.on{border-radius:8px 8px 0 0;border-bottom-color:var(--accent)}
  .appbar{padding:10px 16px;height:auto;flex-wrap:wrap;gap:8px 12px}
  main{padding:16px 16px 40px}
  .newbar{padding:8px 16px}
  .kpis{grid-template-columns:1fr}
  .demobar .seg{width:auto}
  .demobar .seg button{padding:5px 8px}
  .setrow{flex-wrap:wrap}
  .setrow .txt{flex:1 1 100%}
  .settabs{flex-wrap:nowrap}
  .settabs button{padding:8px 11px}
  .hero .big{font-size:27px}
  .tbl thead th,.tbl tbody td{padding:7px 9px}
}
</style>
</head>

</div>

/* ═══ Afgeleide data ═══ */
const isOwn=id=>OWN.some(o=>o.id===id);
const itemOf=id=>D.items.find(i=>i.id===id);
// Funded modus uit: funded items en hun trades zijn verborgen (niet gewist) en tellen nooit als eigen geld.
const visItems=()=>S.fm?D.items:[];
function riskOf(id){const o=OWN.find(x=>x.id===id);if(o)return o.risk;const i=itemOf(id);return i?i.size/100:0;}
function trades(){return D.trades.filter(t=>isOwn(t.acct)||(S.fm&&itemOf(t.acct))).map(t=>({...t,pnl:t.pnl!=null?t.pnl:Math.round(t.r*riskOf(t.acct)),funded:!isOwn(t.acct)}));}
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const tradesOf=id=>trades().filter(t=>t.acct===id);
const isLive=i=>i.kind==='challenge'?i.status==='bezig':i.status==='actief';
const paidOf=i=>sum(i.payouts||[],p=>p.amount);
function stats(i){const ts=tradesOf(i.id),pnl=sum(ts,t=>t.pnl);return {n:ts.length,pnl,pct:pnl/i.size*100,bal:i.size+pnl};}
function totals(){
  const own=OWN.map(a=>{const ts=tradesOf(a.id),pnl=sum(ts,t=>t.pnl);return {a,pnl,bal:a.start+pnl};});
  const o={bal:sum(own,x=>x.bal),pnl:sum(own,x=>x.pnl),base:sum(OWN,a=>a.start)};o.pct=o.pnl/o.base*100;
  const it=visItems(),live=it.filter(isLive),traded=it.filter(i=>tradesOf(i.id).length);
  const f={pnl:sum(it,i=>stats(i).pnl),bal:sum(live,i=>stats(i).bal),base:sum(traded,i=>i.size),paid:sum(it,paidOf),
    nCh:it.filter(i=>i.kind==='challenge'&&i.status==='bezig').length,nFu:it.filter(i=>i.kind==='funded'&&i.status==='actief').length,n:it.length};
  f.pct=f.base?f.pnl/f.base*100:0;
  const m={bal:o.bal+f.bal,pnl:o.pnl+f.pnl,base:o.base+f.base};m.pct=m.pnl/m.base*100;
  return {own,o,f,m};
}

const sgn=v=>v>0?'+':v<0?'−':'';
const CENTEN_ONDER=100;   // same rule as eur() in the app: cents only below $ 100
const usd=(v,s)=>{const a=Math.abs(+v||0);return (s?sgn(v):v<0?'−':'')+'$ '+(a>0&&a<CENTEN_ONDER?a.toLocaleString('nl-NL',{minimumFractionDigits:2,maximumFractionDigits:2}):Math.round(a).toLocaleString('nl-NL'));};
const pct=v=>sgn(v)+Math.abs(v).toFixed(2).replace('.',',')+'%';
const rr=v=>sgn(v)+Math.abs(v).toFixed(2).replace('.',',')+'R';
const cls=v=>v>0?'g':v<0?'r':'';
const dmy=d=>d?d.slice(8,10)+'-'+d.slice(5,7):'';
const ST_CH={bezig:'bezig',gehaald:'gehaald',niet:'niet gehaald'};

  const conn=OWN.map(a=>`<div class="setrow"><div class="txt"><b>${esc(a.name)}</b><small>gekoppeld via API · read-only</small></div><span class="badge st-gehaald">verbonden</span></div>`).join('');
  return `<p class="setintro">Koppel je exchanges via read-only API-keys, of houd accounts handmatig bij.</p>
    <div class="section-sub">🔗 Exchange-koppelingen</div><div class="panel">${conn}</div>${impSection()}
    <div class="section-sub">✎ Handmatige accounts <span class="hint">(geen exchange, zelf bijhouden)</span></div>
    <div class="panel"><div class="setrow"><div class="txt" style="color:var(--muted);font-size:12.5px">Nog geen handmatige accounts.</div></div></div>`;
}
function swRow(on,label,small,act,id){return `<div class="setrow"><div class="txt"><b>${label}</b><small>${small}</small></div><button class="sw ${on?'on':''}" role="switch" aria-checked="${on}" aria-label="${esc(label)}" id="${id}" onclick="${act}"></button></div>`;}
function setFunded(){
  const T=totals();
  let out=`<p class="setintro">Challenges en funded accounts bij een prop firm. Telt niet als eigen geld; de trades wel in je analyse.</p>
    <div class="panel">${swRow(S.fm,'Funded modus','Toon challenges en funded accounts in je journal.',`setFm(${!S.fm})`,'swFm')}
    ${S.fm?swRow(S.fundedMee,'Funded meetellen','Tel funded op bij je balans op het Dashboard.',`setMee(${!S.fundedMee})`,'swMee'):''}
    ${S.fm&&D.items.length?`<details class="explain" style="border-top:1px solid var(--line2)"><summary>Hoe telt het P&L-percentage?</summary><div class="pbody grid" style="gap:8px">
      <div class="calc">uit · eigen ${pct(T.o.pct)} · funded ${pct(T.f.pct)}</div>
      <div class="calc">aan · samen (${usd(T.o.pnl,1)} ${T.f.pnl<0?'−':'+'} ${usd(Math.abs(T.f.pnl))}) / (${usd(T.o.base)} + ${usd(T.f.base)}) = ${pct(T.m.pct)}</div>
      <div class="dim" style="font-size:12px">Samen zegt het % weinig over je eigen rendement: het funded-kapitaal weegt veel zwaarder.</div></div></details>`:''}</div>`;
  if(!S.fm){
    const n=D.items.length,nt=D.trades.filter(t=>!isOwn(t.acct)).length;
    return out+(n?`<p class="setintro" style="margin-top:12px">${n} challenges en funded accounts (${nt} trades) zijn verborgen, niet gewist.</p>`:'');
  }
  if(!D.items.length)return out+`<div style="height:16px"></div>`+(S.form?addForm():empty('🏁','Nog geen challenges','Voeg je eerste challenge toe, of importeer een MT5-bestand bij Accounts.','Challenge toevoegen',"S.form={kind:'challenge'};render()"));
  // Running = what needs attention: a challenge in progress, a passed one not yet converted, an active funded account.
  const top=D.items.filter(i=>isLive(i)||(i.kind==='challenge'&&i.status==='gehaald'&&!i.funded));
  const done=D.items.filter(i=>!top.includes(i));
  out+=`<div class="sums"><div><small>Funded P&L</small><b class="num ${cls(T.f.pnl)}">${usd(T.f.pnl,1)}</b></div><div><small>Uitbetaald</small><b class="num">${usd(T.f.paid)}</b></div></div>`;
  out+=`<div class="clist">${top.length?top.map(card).join(''):'<div class="dim" style="padding:14px 4px;font-size:13px">Niets lopend.</div>'}</div>`;
  if(done.length)out+=`<details class="done" ${S.afOpen?'open':''} ontoggle="S.afOpen=this.open"><summary>Afgerond (${done.length})</summary><div class="clist">${done.map(card).join('')}</div></details>`;
  out+=S.form?`<div style="margin-top:14px">${addForm()}</div>`
    :`<div class="actions" style="margin-top:16px;align-items:center"><button class="btn pri" onclick="S.form={kind:'challenge'};render()">+ Challenge toevoegen</button><button class="linkbtn" style="font-size:12.5px" onclick="S.form={kind:'funded'};render()">+ Funded account</button><span class="dim" style="font-size:11.5px">al funded zonder challenge</span></div>`;
  return out;
}
const pillText=i=>i.kind==='challenge'?ST_CH[i.status]:i.status;
function statusMenu(i){
  const opts=i.kind==='challenge'?Object.entries(ST_CH).map(([k,l])=>[k,null,l]):[['actief',null,'actief'],['gestopt','eruit','gestopt · eruit gezet'],['gestopt','zelf','gestopt · zelf gestopt']];
  return `<div class="smenu" role="menu">${opts.map(([st,stop,l])=>{const on=i.status===st&&(!stop||i.stop===stop);
    return `<button role="menuitemradio" aria-checked="${on}" class="${on?'on':''}" onclick="event.stopPropagation();pickStatus('${i.id}','${st}','${stop||''}')"><span class="badge st-${st}">${l}</span></button>`;}).join('')}</div>`;
}
function card(i){
  const s=stats(i),open=S.open===i.id,link=i.kind==='challenge'&&i.funded?'<span class="tag-sm">→ funded</span>':'';
  const head=`<div class="chead" role="button" tabindex="0" aria-expanded="${open}" onclick="toggleCard('${i.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleCard('${i.id}')}">
    <div class="cname"><div class="cn"><b>${esc(i.name)}</b><span class="firm">${esc(i.firm)}</span>${i.kind==='funded'?'<span class="tag-sm fund">funded</span>':''}${link}</div>
      <div class="pillwrap"><button class="badge st-${i.status} pill-btn" aria-haspopup="menu" aria-expanded="${S.menu===i.id}" aria-label="Status ${esc(fullName(i))}: ${pillText(i)}" onclick="event.stopPropagation();S.menu=S.menu==='${i.id}'?null:'${i.id}';render()">${pillText(i)} ▾</button>${S.menu===i.id?statusMenu(i):''}</div></div>
    <div class="cval"><div class="cp num ${cls(s.pnl)}">${s.n?usd(s.pnl,1):'–'}</div><div class="cpct num">${s.n?pct(s.pct):'nog geen trades'}</div></div></div>`;
  if(!open)return `<div class="ccard" id="it-${i.id}">${head}</div>`;
  const rows=[['Grootte',`<span class="num">${usd(i.size)}</span>`],['Trades',`<span class="num">${s.n}</span>`],[i.logins.length>1?'Logins':'Login',i.logins.length?`<span class="num">${i.logins.map(esc).join(', ')}</span>`:'<span class="dim">nog geen, de import vult hem in</span>']];
  if(i.kind==='funded'&&i.status==='gestopt')rows.push(['Reden',STOP[i.stop]||'gestopt']);
  if(i.kind==='funded'&&i.from&&itemOf(i.from))rows.push(['Herkomst',`uit challenge ${esc(itemOf(i.from).name)}`]);
  if(i.kind==='challenge'&&i.funded&&itemOf(i.funded))rows.push(['Omgezet',`naar ${esc(itemOf(i.funded).name)}`]);
  let body=`<dl class="cdl">${rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
  if(i.kind==='funded'){
    body+=`<div class="pays"><div class="ph">Uitbetalingen</div>${(i.payouts||[]).length?i.payouts.map(p=>`<div class="pr"><span>${dmy(p.date)}-2026</span><span class="num">${usd(p.amount)}</span></div>`).join(''):'<div class="dim" style="font-size:12.5px">Nog geen uitbetaling.</div>'}</div>`;
    body+=S.form&&S.form.pay===i.id?`<div class="iform"><div class="formrow"><div class="field"><label>Bedrag ($)</label><input id="pA" inputmode="decimal" placeholder="bijv. 1.200"></div><div class="field"><label>Datum</label><input id="pD" type="date" value="2026-10-25"></div><div class="actions"><button class="btn pri" onclick="addPayout('${i.id}')">Toevoegen</button><button class="btn" onclick="S.form=null;render()">Annuleren</button></div></div></div>`
      :`<div><button class="btn sm" onclick="S.form={pay:'${i.id}'};render()">Uitbetaling toevoegen</button></div>`;
  }
  if(i.kind==='challenge'&&i.status==='gehaald'&&!i.funded)
    body+=S.form&&S.form.convert===i.id?`<div class="iform"><div class="formrow"><div class="field"><label>Naam funded account</label><input id="cvName" value="${esc(i.name)}"></div><div class="actions"><button class="btn pri" onclick="convert('${i.id}')">Omzetten</button><button class="btn" onclick="S.form=null;render()">Annuleren</button></div></div><p class="dim" style="font-size:12px;margin-top:8px">Firm (${esc(i.firm)}) en grootte gaan mee. De trades blijven bij de challenge.</p></div>`
      :`<div><button class="btn pri sm" onclick="S.form={convert:'${i.id}'};render()">Omzetten naar funded account</button></div>`;
  return `<div class="ccard open" id="it-${i.id}">${head}<div class="cbody">${body}</div></div>`;
}
function toggleCard(id){S.open=S.open===id?null:id;S.menu=null;S.form=null;render();}
function pickStatus(id,st,stop){const i=itemOf(id);i.status=st;if(i.kind==='funded')i.stop=st==='gestopt'?(stop||'eruit'):null;S.menu=null;render();}
function addForm(){
  const k=S.form.kind;
  return `<div class="panel"><div class="phead"><h3>${k==='challenge'?'Challenge toevoegen':'Funded account toevoegen'}</h3></div><div class="pbody"><div class="formrow">
    <div class="field"><label>Firm</label><input id="nF" list="firms" placeholder="FTMO, Breakout, …"></div>
    <div class="field"><label>Naam</label><input id="nN" placeholder="${k==='challenge'?'bijv. 100k #3':'bijv. 50k funded'}"></div>
    <div class="field"><label>Grootte (startkapitaal)</label><input id="nS" inputmode="decimal" placeholder="100.000"></div>
    <div class="field"><label>Status</label><select id="nT">${Object.entries(k==='challenge'?ST_CH:ST_FU).map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select></div>
    <div class="actions"><button class="btn pri" onclick="addItem('${k}')">Toevoegen</button><button class="btn" onclick="S.form=null;render()">Annuleren</button></div></div>
    <p class="setintro" style="margin:10px 0 0">De grootte is nodig voor het P&L-%. Login-nummers hoef je niet in te vullen: de import onthoudt ze.</p></div></div>`;
}
function addItem(kind){const v=id=>document.getElementById(id).value.trim();const size=parseFloat(v('nS').replace(/\./g,'').replace(',','.'))||0;
  if(!v('nF')||!v('nN')||!size){alertField();return;}
  const i={id:'n'+Date.now(),kind,firm:v('nF'),name:v('nN'),size,status:v('nT'),logins:[],start:'2026-10-25'};if(kind==='funded'){i.payouts=[];i.stop=null;}
  D.items.push(i);S.form=null;S.open=i.id;render();}
function alertField(){['nF','nN','nS'].forEach(id=>{const e=document.getElementById(id);if(e&&!e.value.trim())e.closest('.field').querySelector('label').style.color='var(--red)';});}
function convert(cid){const c=itemOf(cid),nm=document.getElementById('cvName').value.trim()||c.name;
  const f={id:'f'+Date.now(),kind:'funded',firm:c.firm,name:nm,size:c.size,status:'actief',stop:null,logins:[],start:'2026-10-25',from:c.id,payouts:[]};
  D.items.push(f);c.funded=f.id;S.form=null;S.open=f.id;render();}
function addPayout(id){const a=parseFloat(String(document.getElementById('pA').value).replace(/\./g,'').replace(',','.'));if(!(a>0))return;
  itemOf(id).payouts.push({amount:a,date:document.getElementById('pD').value||'2026-10-25'});S.form=null;render();}

/* ── Import (Instellingen → Accounts, zoals de CSV-import in de app) ── */
const FILES={
  blofin:{name:'blofin-order-history.csv',kind:'Blofin-CSV',firm:'Blofin',own:'blofin',login:'',n:5,from:'2026-10-14',to:'2026-10-23',hint:'eigen exchange'},
  funded:{name:'ReportHistory-1510004444.html',kind:'MT5-rapport (HTML)',firm:'FTMO',login:'1510004444',size:100000,n:3,from:'2026-10-23',to:'2026-10-24',hint:'login van een funded account'},
  fase2:{name:'ReportHistory-1510003333.html',kind:'MT5-rapport (HTML)',firm:'FTMO',login:'1510003333',size:100000,n:5,from:'2026-09-09',to:'2026-09-22',hint:'tweede login van een challenge'},
  nieuw:{name:'ReportHistory-1510009876.html',kind:'MT5-rapport (HTML)',firm:'FTMO',login:'1510009876',size:10000,n:2,from:'2026-10-23',to:'2026-10-24',hint:'login nog onbekend'},
};
function suggest(f){
  if(f.own){const a=OWN.find(o=>o.id===f.own);return {pick:'own:'+a.id,opts:[{id:'own:'+a.id,label:a.name,why:'Herkend aan de kolommen van het bestand.'},...OWN.filter(o=>o!==a).map(o=>({id:'own:'+o.id,label:o.name,why:'eigen account'}))]};}
  if(!S.fm)return {pick:'man',opts:[{id:'man',label:`Nieuw handmatig account "${f.firm} ${f.login}"`,why:'Telt als eigen geld, zoals elk account.'},...OWN.map(o=>({id:'own:'+o.id,label:o.name,why:'eigen account'}))]};
  const hit=D.items.find(i=>i.logins.includes(f.login));
  if(hit)return {pick:'it:'+hit.id,known:true,opts:[{id:'it:'+hit.id,label:fullName(hit)+(hit.kind==='funded'?' (funded account)':' (challenge)'),why:`Login ${f.login} hoort bij dit ${hit.kind==='funded'?'funded account':'challenge'}${hit.logins.length>1?` (onthouden logins: ${hit.logins.join(', ')})`:''}.`}]};
  const same=D.items.filter(i=>i.firm===f.firm).sort((a,b)=>isLive(b)-isLive(a));
  const opts=[{id:'new',label:`Nieuwe challenge "${f.firm} ${f.size/1000}k"`,why:`Login ${f.login} is nog onbekend. Grootte ${usd(f.size)} uit de balansregel van het rapport.`},
    ...same.map(i=>({id:'it:'+i.id,label:fullName(i)+(i.kind==='funded'?' (funded account)':' (challenge)'),why:`${isLive(i)?(i.kind==='funded'?'actief':'lopend'):'afgerond'} · login ${f.login} wordt erbij onthouden (bijv. een nieuwe fase)`}))];
  return {pick:'new',opts};
}
function impSection(){
  const btns=Object.entries(FILES).map(([k,f])=>`<button class="filebtn ${S.file===k?'on':''}" onclick="pickFile('${k}')"><b>${esc(f.name)}</b><small>${esc(f.kind)}${S.fm?' · '+esc(f.hint):''}</small></button>`).join('');
  let out=`<div class="section-sub">📄 CSV-import <span class="hint">(werkt voor élke exchange, geen API-keys nodig)</span></div>
    <div class="panel"><div class="setrow"><div class="txt"><b>Trade-history importeren (CSV / XLSX${S.fm?' / MT5-rapport':''})</b><small>Exporteer je history en lees het bestand hier in. Kraken, Blofin, MEXC, Hyperliquid, FTMO en OKX worden automatisch herkend.</small></div><button class="btn pri" onclick="pickFile('${S.fm?'funded':'blofin'}')">Bestand kiezen</button></div>
    <div class="pbody" style="border-top:1px solid var(--line2)"><div class="chip" style="margin-bottom:8px">Voorbeeldbestanden in de demo</div><div class="files">${btns}</div></div></div>`;
  if(!S.file)return out;
  const f=FILES[S.file],sg=suggest(f),pick=sg.opts.some(o=>o.id===S.choice)?S.choice:sg.pick;
  out+=`<div class="panel" style="margin-top:12px"><div class="phead"><h3>Bij welk account hoort dit?</h3></div><div class="pbody"><div class="kv">
    <div><small>Bestand</small><b>${esc(f.name)}</b></div><div><small>${f.own?'Exchange':'Firm'}</small><b>${esc(f.firm)}</b></div>${f.login?`<div><small>Login</small><b>${esc(f.login)}</b></div>`:''}<div><small>Trades</small><b>${f.n} · ${dmy(f.from)} t/m ${dmy(f.to)}</b></div></div>
    ${!S.fm&&!f.own?`<div class="dov-note info" style="margin-top:12px">Handel je met geld van een prop firm? Zet <b>Funded modus</b> aan in <button class="linkbtn" onclick="${toFunded}">Instellingen → Funded</button>. Dan blijft dit buiten je eigen balans.</div>`:''}
    ${sg.known?`<div class="dov-note ok" style="margin-top:12px">Login herkend. Bij de echte import gaat dit zonder vraag, met alleen een melding.</div>`:''}</div>
    <div>${sg.opts.map(o=>`<label class="opt ${pick===o.id?'on':''}"><input type="radio" name="imp" ${pick===o.id?'checked':''} onchange="S.choice='${o.id}';render()"><div class="txt"><b>${esc(o.label)}</b> ${o.id===sg.pick?'<span class="badge own">voorstel</span>':''}<small>${esc(o.why)}</small></div></label>`).join('')}</div>
    <div class="pbody" style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line2)"><button class="btn" onclick="pickFile(null)">Annuleren</button><button class="btn pri" onclick="doImport()">Importeren</button></div></div>`;
  if(S.msg)out+=`<div class="dov-note ok" style="margin-top:12px">${S.msg}</div>`;
  return out;
}
function pickFile(k){S.file=k;S.choice=null;S.msg='';render();}
function doImport(){const f=FILES[S.file],sg=suggest(f),pick=sg.opts.some(o=>o.id===S.choice)?S.choice:sg.pick;let target;
  if(pick==='new'){target={id:'n'+Date.now(),kind:'challenge',firm:f.firm,name:`${f.size/1000}k`,size:f.size,status:'bezig',logins:[f.login],start:f.from};D.items.push(target);}
  else if(pick.startsWith('it:')){target=itemOf(pick.slice(3));if(!target.logins.includes(f.login))target.logins.push(f.login);}
  const label=target?fullName(target):sg.opts.find(o=>o.id===pick).label;
  S.msg=`Demo: ${f.n} trades zouden naar <b>${esc(label)}</b> gaan${target?`. Login ${esc(f.login)} staat nu bij dit ${target.kind==='funded'?'funded account':'challenge'}; een volgende import herkent hem zelf`:', als eigen geld'}.`;render();}

document.addEventListener('click',e=>{if(S.menu&&!e.target.closest('.smenu')){S.menu=null;render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.menu){S.menu=null;render();}});
applyState(S.state,true);
</script>
</body>
</html>
