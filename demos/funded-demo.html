<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Funded modus · demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── Overgenomen uit work/syncjournal.html (variabelen, shell, panel, kpi, tbl, btn, seg, setrow, sw, field, empty, tabs) ── */
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --raise:#FBFCFE; --sink:#F7F9FC;
  --ink:#191E2A; --ink2:#525A6B; --muted:#6B7385; --faint:#7A8291;
  --line:#E8EBF2; --line2:#F0F2F7;
  --accent:#3B5BD9; --accent-soft:#EDF0FD; --accent-line:#CDD6F7;
  --green:#12946A; --green-soft:#E3F4EC; --red:#D64259; --red-soft:#FBE8EC; --amber:#C0821C; --amber-soft:#F8EFDD;
  --violet:#7C5CE0; --teal:#0E9E96;--pink:#D6409F;
  --grid:#EDEFF5; --hover:#F6F8FC; --track:#EEF1F6; --zebra:#FAFBFD;
  --fb:'Inter',sans-serif; --fd:'Plus Jakarta Sans',sans-serif; --fn:'IBM Plex Mono',monospace;
  --sh:0 1px 2px rgba(20,30,60,.05);
}
body.dark{
  --bg:#0E1218; --surface:#141A22; --raise:#171E28; --sink:#10151c;
  --ink:#F4F7FB; --ink2:#C7CFDB; --muted:#939CAC; --faint:#6C7583;
  --line:#232B36; --line2:#1C232D;
  --accent:#6E86F0; --accent-soft:#1B2436; --accent-line:#2E3B57;
  --green:#37C48B; --green-soft:#12261F; --red:#F0637A; --red-soft:#2A1820; --amber:#E0A63C; --amber-soft:#28210F;
  --violet:#A78BFA; --teal:#2CC5B6;--pink:#F472B6;
  --grid:#1B222C; --hover:#19212B; --track:#1E2732; --zebra:#12171f;
  --sh:0 1px 2px rgba(0,0,0,.25);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .35s,color .35s}
.num{font-family:var(--fn);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.g{color:var(--green)} .r{color:var(--red)} .a{color:var(--accent)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
h1,h2,h3,h4{font-family:var(--fd);font-weight:700;letter-spacing:-.01em}
input,select{font-family:inherit}
.shell{display:grid;grid-template-columns:236px 1fr;min-height:calc(100vh - 52px)}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column}
.logo{font-family:var(--fd);font-weight:800;font-size:17px;letter-spacing:-.02em;padding:20px 22px 16px}
.logo span{color:var(--accent)}
.side nav{display:flex;flex-direction:column;gap:2px;padding:6px 12px}
.side nav button{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;color:var(--ink2);font-size:13.5px;font-weight:600;text-align:left;width:100%;border-left:2px solid transparent}
.side nav button:hover{background:var(--hover);color:var(--ink)}
.side nav button.on{background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent);border-left-color:var(--accent);border-radius:0 8px 8px 0}
.body{min-width:0;display:flex;flex-direction:column}
.appbar{display:flex;align-items:center;gap:16px;padding:0 30px;height:62px;border-bottom:1px solid var(--line);background:var(--bg)}
.appbar h1{font-size:19px}
.appbar .ptbar{width:4px;height:21px;border-radius:3px;background:var(--accent);flex:none;margin-right:-8px}
.appbar .sp{flex:1}
main{padding:26px 30px 46px}
.grid{display:grid;gap:16px}
.grid>*,.kpis>*{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--sh)}
.phead{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.phead h3{font-size:14px}
.phead .sp{flex:1}
.pbody{padding:16px}
.chip{font-size:11px;color:var(--muted);font-weight:600}
.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:15px 16px 15px 18px;box-shadow:var(--sh);position:relative}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:.85;border-radius:9px 0 0 9px}
.kpi.pos::before{background:var(--green)}.kpi.neg::before{background:var(--red)}.kpi.fund::before{background:var(--violet)}.kpi.mix::before{background:var(--amber)}
.kpi .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.kpi .v{font-family:var(--fn);font-variant-numeric:tabular-nums;font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:9px;color:var(--ink)}
.kpi .v.g{color:var(--green)} .kpi .v.r{color:var(--red)}
.kpi .d{font-size:12.5px;margin-top:6px;color:var(--muted)}
.tblwrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl thead th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sink)}
.tbl thead th.rt,.tbl td.rt{text-align:right}
.tbl td.num{white-space:nowrap}
.tbl tbody td{padding:8px 14px;border-bottom:1px solid var(--line2)}
.tbl tbody tr:nth-child(even) td{background:var(--zebra)}
.tbl tbody tr:hover td{background:var(--hover)}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl tfoot td{padding:11px 14px;border-top:1px solid var(--line);font-weight:700;font-size:12.5px}
.pill{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap}
.pill.long{color:var(--green);background:var(--green-soft)} .pill.short{color:var(--red);background:var(--red-soft)}
.seg{display:flex;gap:2px;background:var(--sink);border:1px solid var(--line);border-radius:9px;padding:3px;width:max-content;max-width:100%;flex-wrap:wrap}
.seg button{color:var(--muted);font-size:12px;font-weight:600;padding:5px 11px;border-radius:6px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.setrow{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.setrow:last-child{border-bottom:none}
.setrow .txt{flex:1;min-width:0}
.setrow .txt b{font-size:13.5px;font-weight:600}
.setrow .txt small{display:block;color:var(--muted);font-size:11.5px}
.sw{width:42px;height:24px;border-radius:999px;background:var(--track);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.sw.on{background:var(--accent)} .sw.on::after{left:21px}
.btn{font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn:hover{border-color:var(--accent-line)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.field input,.field select{border:1px solid var(--line);border-radius:9px;background:var(--sink);color:var(--ink);padding:9px 11px;font-size:13.5px;outline:none;min-width:0}
.field input:focus,.field select:focus{border-color:var(--accent);background:var(--surface)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:42px 24px;max-width:460px;margin:0 auto}
.empty-ico{font-size:34px;margin-bottom:14px;line-height:1}
.empty-h{font-size:17px;margin-bottom:8px}
.empty-d{color:var(--muted);font-size:13px;line-height:1.55;margin-bottom:18px}
.dov-note{padding:9px 13px;border-radius:8px;font-size:12.5px;line-height:1.55}
.dov-note.warn{background:var(--amber-soft);color:var(--amber)} .dov-note.bad{background:var(--red-soft);color:var(--red)} .dov-note.ok{background:var(--green-soft);color:var(--green)} .dov-note.info{background:var(--sink);color:var(--muted)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:none;background:none;color:var(--muted);font-size:13.5px;font-weight:600;padding:8px 13px;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.settabs button{padding:9px 15px}
.settabs{flex-wrap:wrap;row-gap:2px}
.settabs .tico2{margin-right:7px;font-size:13px;filter:grayscale(.15)}
.setintro{font-size:12.5px;color:var(--muted);margin:0 0 14px;line-height:1.5}
.section-sub{font-size:12px;font-weight:700;color:var(--ink2);margin:20px 2px 8px;letter-spacing:-.01em}
.section-sub .hint{font-weight:500;color:var(--muted);font-size:11.5px}
.setrow.trsel{background:var(--accent-soft)}

/* ── Alleen voor deze demo (uitsluitend app-variabelen) ── */
.newbar{font-size:12.5px;color:var(--ink2);padding:8px 30px;background:var(--accent-soft);border-bottom:1px solid var(--accent-line)}
.newbar b{color:var(--accent)}
.fmstate{font-size:12px;color:var(--muted);margin-left:auto}
.fmstate b{color:var(--ink)} .fmstate b.a{color:var(--accent)}
.fmstate button,.linkbtn{color:var(--accent);font-weight:600;text-decoration:underline;font-size:inherit;padding:0}
.appbar .badge{cursor:pointer}
.rin{width:100%;min-width:64px;border:1px solid var(--line);border-radius:7px;background:var(--sink);color:var(--ink);padding:5px 8px;font-size:12.5px;font-family:var(--fn)}
.rin:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.demobar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding:9px 16px;min-height:52px;background:var(--surface);border-bottom:2px dashed var(--accent-line)}
.demobar .lbl{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.demobar .grp{display:flex;align-items:center;gap:8px}
.demobar .swl{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--ink2)}
.vnote{font-size:12.5px;color:var(--ink2);padding:10px 30px;border-bottom:1px solid var(--line2);background:var(--raise)}
.vnote b{color:var(--ink)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;letter-spacing:.02em;white-space:nowrap;border:1px solid transparent}
.badge.fund{background:color-mix(in srgb,var(--violet) 12%,transparent);color:var(--violet);border-color:color-mix(in srgb,var(--violet) 30%,transparent)}
.badge.mix{background:var(--amber-soft);color:var(--amber);border-color:color-mix(in srgb,var(--amber) 35%,transparent)}
.badge.own{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.badge.st-bezig{background:var(--accent-soft);color:var(--accent)}
.badge.st-gehaald{background:var(--green-soft);color:var(--green)}
.badge.st-gefaald{background:var(--red-soft);color:var(--red)}
.badge.st-eruit{background:var(--amber-soft);color:var(--amber)}
.badge.guide{background:var(--sink);color:var(--muted);border-color:var(--line);border-style:dashed}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.hero{padding:20px 22px}
.hero .big{font-family:var(--fd);font-size:32px;font-weight:800;letter-spacing:-.03em;margin:6px 0 4px}
.hero .meta{color:var(--ink2);font-size:13px;display:flex;gap:6px 16px;flex-wrap:wrap}
.hero.fundside{border-left:3px solid var(--violet)}
.hero.ownside{border-left:3px solid var(--accent)}
.hero.mixside{border-left:3px solid var(--amber)}
.split{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.split span{font-size:12px;color:var(--muted);background:var(--sink);border:1px solid var(--line2);border-radius:7px;padding:4px 9px}
.split span b{color:var(--ink);font-family:var(--fn)}
.calc{font-family:var(--fn);font-size:12px;color:var(--ink2);background:var(--sink);border-radius:7px;padding:8px 11px;margin-top:6px;overflow-x:auto;white-space:nowrap}
.sect{font-size:12px;font-weight:700;color:var(--ink2);margin:22px 2px 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chal{margin-bottom:14px}
.chal.closed{opacity:.78}
.chal .phead h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.phase{border-top:1px solid var(--line2)}
.phase summary{list-style:none;display:flex;align-items:center;gap:12px;padding:11px 16px;cursor:pointer;flex-wrap:wrap}
.phase summary::-webkit-details-marker{display:none}
.phase summary:hover{background:var(--hover)}
.phase .pn{font-weight:700;min-width:70px}
.phase .pm{color:var(--muted);font-size:12px;flex:1;min-width:150px}
.phase .pv{font-family:var(--fn);font-weight:700;white-space:nowrap}
.phase select{border:1px solid var(--line);border-radius:7px;background:var(--sink);color:var(--ink);padding:4px 8px;font-size:12px;font-weight:600}
.phase .pd{padding:4px 16px 16px;display:grid;gap:12px}
.rules{display:flex;gap:6px;flex-wrap:wrap}
.rules span{font-size:11.5px;color:var(--ink2);background:var(--sink);border:1px solid var(--line2);border-radius:6px;padding:3px 8px}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
.bar .bl{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.bar .bl b{font-family:var(--fn);color:var(--ink);font-weight:600}
.bar .tr{height:8px;border-radius:5px;background:var(--track);overflow:hidden;position:relative;background-image:repeating-linear-gradient(90deg,transparent 0 6px,color-mix(in srgb,var(--line) 70%,transparent) 6px 7px)}
.bar .fl{height:100%;border-radius:5px;background:var(--accent)}
.bar .fl.ok{background:var(--green)} .bar .fl.near{background:var(--amber)} .bar .fl.over{background:var(--red)}
.guideline{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:flex-start}
.money{display:flex;gap:6px 14px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line2);background:var(--raise);font-size:12px;color:var(--muted)}
.money b{font-family:var(--fn);color:var(--ink)}
.filterbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border-bottom:1px solid var(--line2);cursor:pointer}
.opt:last-child{border-bottom:none}
.opt:hover{background:var(--hover)}
.opt.on{background:var(--accent-soft)}
.opt input{margin-top:3px;accent-color:var(--accent);flex:none}
.opt .txt{flex:1;min-width:0}
.opt .txt b{font-weight:600}
.opt .txt small{display:block;color:var(--muted);font-size:11.5px}
.opt .sub{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
.files{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.filebtn{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:12px 14px;box-shadow:var(--sh)}
.filebtn:hover{border-color:var(--accent-line)}
.filebtn.on{border-color:var(--accent);background:var(--accent-soft)}
.filebtn b{display:block;font-family:var(--fn);font-size:12px;word-break:break-all}
.filebtn small{color:var(--muted);font-size:11.5px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kv div{background:var(--sink);border-radius:8px;padding:8px 11px}
.kv div small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.kv div b{font-family:var(--fn);font-size:13px}
.formrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
.dim{color:var(--muted)}
.acc-name{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
@media(max-width:960px){.kpis{grid-template-columns:1fr 1fr}.duo{grid-template-columns:1fr}.files{grid-template-columns:1fr}}
@media(max-width:720px){
  .shell{grid-template-columns:1fr}
  .side{flex-direction:row;align-items:center;border-right:none;border-bottom:1px solid var(--line);overflow-x:auto}
  .logo{padding:12px 14px;font-size:15px;flex:none}
  .side nav{flex-direction:row;padding:6px 8px 6px 0}
  .side nav button{white-space:nowrap;padding:7px 10px;border-left:none;border-bottom:2px solid transparent}
  .side nav button.on{border-radius:8px 8px 0 0;border-bottom-color:var(--accent)}
  .appbar{padding:10px 16px;height:auto;flex-wrap:wrap;gap:8px 12px}
  main{padding:16px 16px 40px}
  .vnote{padding:9px 16px}
  .newbar{padding:8px 16px}
  .fmstate{margin-left:0}
  .settabs{flex-wrap:nowrap}
  .settabs button{padding:8px 11px}
  .kpis{grid-template-columns:1fr}
  .demobar .grp{max-width:100%}
  .setrow{flex-wrap:wrap}
  .setrow .txt{flex:1 1 100%}
  .demobar .seg{width:auto}
  .demobar .seg button{padding:5px 8px}
  .bars{grid-template-columns:1fr}
  .hero .big{font-size:27px}
  .tbl thead th,.tbl tbody td,.tbl tfoot td{padding:7px 9px}
}
</style>
</head>
<body>
<div class="demobar" id="demobar"></div>
<div class="newbar"><b>Nieuw in deze versie:</b> Funded is een functie die je aanzet in Instellingen → Funded (standaard uit). "Funded meetellen" staat daar ook, en de import zit nu in Instellingen → Accounts.</div>
<div class="vnote" id="vnote"></div>
<div class="shell">
  <aside class="side"><div class="logo">Sync<span>Journal</span></div><nav id="nav"></nav></aside>
  <div class="body">
    <div class="appbar" id="appbar"></div>
    <main id="main"></main>
  </div>
</div>
<script>
'use strict';
/* ═══ Nepdata (hardcoded) ═══
   R-risico per account: 1% van het startkapitaal bij funded, een vast bedrag bij eigen geld. */
const OWN=[
  {id:'blofin',name:'Blofin',kind:'API',start:5000,risk:50},
  {id:'kraken',name:'Kraken Futures',kind:'API',start:3000,risk:40},
];
const RULES={
  ftmo_p1:{target:10,daily:5,max:10,dd:'statisch',minDays:4},
  ftmo_p2:{target:5,daily:5,max:10,dd:'statisch',minDays:4},
  ftmo_f:{target:null,daily:5,max:10,dd:'statisch',minDays:null},
  bo_p1:{target:10,daily:4,max:6,dd:'trailing',minDays:null},
  bo_f:{target:null,daily:4,max:6,dd:'trailing',minDays:null},
};
const R_=r=>({...r});
const CHALLENGES_FULL=[
  {id:'c1',firm:'FTMO',label:'FTMO 100k #1',program:'2-Step',size:100000,phases:[
    {key:'p1',name:'Fase 1',acct:'f1p1',login:'1510001111',start:'2026-08-03',end:'2026-08-14',status:'gefaald',rules:R_(RULES.ftmo_p1)},
  ],money:[{type:'fee',amount:540,date:'2026-08-02',note:'Challenge-fee'}]},
  {id:'c2',firm:'FTMO',label:'FTMO 100k #2',program:'2-Step',size:100000,phases:[
    {key:'p1',name:'Fase 1',acct:'f2p1',login:'1510002222',start:'2026-08-24',end:'2026-09-04',status:'gehaald',rules:R_(RULES.ftmo_p1)},
    {key:'p2',name:'Fase 2',acct:'f2p2',login:'1510003333',start:'2026-09-09',end:'2026-09-22',status:'gehaald',rules:R_(RULES.ftmo_p2)},
    {key:'f',name:'Funded',acct:'f2f',login:'1510004444',start:'2026-09-29',end:null,status:'bezig',rules:R_(RULES.ftmo_f)},

function fundedAccounts(){
  if(S.leeg||!S.fm)return [];
  return storedFunded();
}
function storedFunded(){
  if(S.leeg)return [];
  const out=[];CH.forEach(c=>c.phases.forEach(p=>out.push({id:p.acct,name:S.variant==='A'?`${c.firm} ${c.size/1000}k · ${p.login||'nog geen login'}`:`${c.label} · ${p.name}`,firm:c.firm,login:p.login,size:c.size,risk:c.size/100,phase:p,ch:c})));
  return out;
}
function allTrades(){
  const fa=fundedAccounts(),risk={};OWN.forEach(a=>risk[a.id]=a.risk);fa.forEach(a=>risk[a.id]=a.risk);
  return TRADES_RAW.filter(t=>risk[t[1]]!=null).map(([date,acct,pair,dir,pb,r])=>({date,acct,pair,dir,pb,r,pnl:Math.round(r*risk[acct]),funded:!OWN.some(o=>o.id===acct)}));
}
const tradesOf=id=>allTrades().filter(t=>t.acct===id);
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
function accStats(a){const ts=tradesOf(a.id);const pnl=sum(ts,t=>t.pnl);const base=a.start||a.size;return {n:ts.length,pnl,bal:base+pnl,pct:base?pnl/base*100:0,base};}
// Telt een funded account mee in "balans"? Variant A kent geen status, dus alles; B en C alleen een lopende fase.
const fundedLive=a=>S.variant==='A'?true:a.phase.status==='bezig';
function totals(){
  const own=OWN.map(a=>({a,...accStats(a)})),fa=fundedAccounts().map(a=>({a,...accStats(a)}));
  const o={bal:sum(own,x=>x.bal),pnl:sum(own,x=>x.pnl),base:sum(own,x=>x.base)};
  const live=fa.filter(x=>fundedLive(x.a)),traded=fa.filter(x=>x.n>0);
  const f={bal:sum(live,x=>x.bal),pnl:sum(fa,x=>x.pnl),base:sum(traded,x=>x.base),nLive:live.length,nAll:fa.length};
  o.pct=o.base?o.pnl/o.base*100:0;f.pct=f.base?f.pnl/f.base*100:0;
  const m={bal:o.bal+f.bal,pnl:o.pnl+f.pnl,base:o.base+f.base};m.pct=m.base?m.pnl/m.base*100:0;
  return {own,fa,o,f,m};
}
function chStatus(c){
  const last=c.phases[c.phases.length-1];
  if(c.phases.some(p=>p.status==='gefaald'))return 'gefaald';
  if(last.status==='eruit')return 'eruit';
  if(last.status==='bezig')return 'bezig';
  return 'gehaald';
}
function moneyOf(c){const g=t=>sum(c.money.filter(m=>m.type===t),m=>m.amount);const kost=g('fee')+g('reset'),terug=g('refund'),uit=g('payout');return {kost,terug,uit,net:uit+terug-kost};}
function phaseProgress(p,size){
  const ts=tradesOf(p.acct).slice().sort((a,b)=>a.date<b.date?-1:1);
  let cum=0,peak=0,minCum=0,dd=0;const days={};
  ts.forEach(t=>{cum+=t.pnl;peak=Math.max(peak,cum);minCum=Math.min(minCum,cum);dd=Math.max(dd,peak-cum);days[t.date]=(days[t.date]||0)+t.pnl;});
  const worstDay=Math.max(0,...Object.values(days).map(v=>-v));
  const ddPct=(p.rules.dd==='trailing'?dd:-minCum)/size*100;
  return {n:ts.length,pnl:cum,winPct:cum/size*100,ddPct,dayPct:worstDay/size*100,days:Object.keys(days).length};
}

function chCard(c){
  const st=chStatus(c),m=moneyOf(c);
  const phases=c.phases.map(p=>{
    const g=phaseProgress(p,c.size),R=p.rules;
    // good=true: a goal to reach (green when full); otherwise a limit (amber near, red over)
    const bar=(label,val,lim,good,unit)=>{if(lim==null)return '';const w=Math.min(100,Math.max(0,val/lim*100));const k=good?(w>=100?'ok':''):(w>=100?'over':w>=80?'near':'');
      const v=unit==='d'?String(val):val.toFixed(1).replace('.',',')+'%',l=unit==='d'?lim+' dagen':lim+'%';
      return `<div class="bar"><div class="bl"><span>${label}</span><b>${v} / ${l}</b></div><div class="tr"><div class="fl ${k}" style="width:${w}%"></div></div></div>`;};
    const over=(g.ddPct>=R.max||g.dayPct>=R.daily)&&p.status==='bezig';
    return `<details class="phase" ${p.status==='bezig'?'open':''}><summary><span class="pn">${p.name}</span><span class="pm">${p.login?'login '+esc(p.login):'nog geen login'} · ${dmy(p.start)} t/m ${dmy(p.end)} · ${g.n} trades</span><span class="pv ${cls(g.pnl)}">${g.n?usd(g.pnl,1)+' · '+pct(g.winPct):'–'}</span>
      <select aria-label="Status ${esc(c.label)} ${p.name}" onclick="event.stopPropagation()" onchange="setStatus('${c.id}','${p.key}',this.value)">${Object.keys(STATUS).map(s=>`<option value="${s}" ${p.status===s?'selected':''}>${STATUS[s]}</option>`).join('')}</select></summary>
      <div class="pd"><div class="rules">${R.target?`<span>winstdoel ${R.target}%</span>`:''}<span>dagverlies ${R.daily}%</span><span>max drawdown ${R.max}% · ${R.dd}</span>${R.minDays?`<span>min. ${R.minDays} handelsdagen</span>`:''}</div>
      ${g.n?`<div class="bars">${bar('Winstdoel',Math.max(0,g.winPct),R.target,true)}${bar('Max drawdown',g.ddPct,R.max)}${bar('Slechtste dag',g.dayPct,R.daily)}${R.minDays?bar('Handelsdagen',g.days,R.minDays,true,'d'):''}</div>`
        :`<div class="dov-note info">Nog geen trades in deze fase. Importeer een MT5-bestand (Instellingen → Accounts) of voeg een trade toe; de voortgang verschijnt dan hier.</div>`}
      ${over?`<div class="dov-note warn">Volgens de richtlijn is een grens geraakt. Check je dashboard bij de firm en zet de status zelf.</div>`:''}
      <div class="guideline"><span class="badge guide">richtlijn</span><span>Op basis van gesloten trades. De firm meet op equity met open posities, dus de journal beslist niet dat je gefaald of gehaald bent: de status zet je zelf.</span></div></div></details>`;}).join('');
  const last=c.phases[c.phases.length-1];
  const next=last.status==='gehaald'&&last.key!=='f'?`<div class="pbody" style="padding-top:0"><div class="dov-note info">Fase gehaald, nog geen volgende fase. Bij de volgende import met een nieuwe login stelt de journal "nieuwe fase" voor.</div></div>`:'';
  const geld=S.variant==='C'?`<div class="money"><span>Kosten <b>${usd(m.kost)}</b></span><span>Payouts <b>${usd(m.uit)}</b></span><span>Fee terug <b>${usd(m.terug)}</b></span><span>Netto echt geld <b class="${cls(m.net)}">${usd(m.net,1)}</b></span></div>`:'';
  const why={gefaald:'Gefaald in de evaluatie. Trades blijven in je analyse.',eruit:'Gehaald, daarna als funded account eruit gezet. Trades blijven in je analyse.'}[st];
  return `<div class="panel chal ${st==='gefaald'||st==='eruit'?'closed':''}"><div class="phead"><h3>${esc(c.label)} ${stBadge(st)}</h3><span class="sp"></span><span class="chip">${esc(c.firm)} · ${esc(c.program)} · ${usd(c.size)}</span></div>
    ${why?`<div class="pbody" style="padding:8px 16px;font-size:12px;color:var(--muted)">${why}</div>`:''}${phases}${next}${geld}</div>`;
}

function suggest(f){
  if(f.own){const a=OWN.find(o=>o.id===f.own);return {pick:'own:'+a.id,opts:[{id:'own:'+a.id,label:a.name,why:'Herkend aan de kolommen van het bestand.'},...OWN.filter(o=>o!==a).map(o=>({id:'own:'+o.id,label:o.name,why:'eigen account'}))]};}
  // Funded modus uit: de vraag blijft, maar dan alleen met gewone accounts. Geen funded-keuze.
  if(!S.fm)return {pick:'man',opts:[{id:'man',label:`Nieuw handmatig account "${f.firm}${f.login?' '+f.login:''}"`,why:'Telt als eigen geld, zoals elk account.'},...OWN.map(o=>({id:'own:'+o.id,label:o.name,why:'eigen account'}))]};
  const fa=fundedAccounts().filter(a=>a.firm===f.firm);
  const opts=[];
  if(f.login){const hit=fa.find(a=>a.login===f.login);
    if(hit)return {pick:'acc:'+hit.id,opts:[{id:'acc:'+hit.id,label:hit.name,why:`Herkend op login ${f.login}. Koppelen zonder vragen, met een melding.`}]};
  }
  if(S.variant==='A'){
    fa.slice(-3).forEach(a=>opts.push({id:'acc:'+a.id,label:a.name,why:'bestaand funded account'}));
    opts.unshift({id:'newacc',label:'Nieuw funded account',why:f.login?`Login ${f.login} kent de journal nog niet.`:'Maak een funded account aan voor dit bestand.'});
    return {pick:'newacc',opts};
  }
  const live=fa.filter(a=>a.phase.status==='bezig');
  if(f.login){const noLogin=live.find(a=>!a.login&&a.size===f.size);
    if(noLogin)opts.push({id:'acc:'+noLogin.id,label:noLogin.name,why:`Deze fase heeft nog geen login en hetzelfde startkapitaal (${usd(f.size)}). Login ${f.login} wordt eraan gekoppeld.`});
  }else live.forEach(a=>{const fits=f.from>=a.phase.start&&(!a.phase.end||f.to<=a.phase.end);opts.push({id:'acc:'+a.id,label:a.name,why:fits?`De trades (${dmy(f.from)} t/m ${dmy(f.to)}) vallen binnen deze fase.`:`Past niet: deze fase begon pas op ${dmy(a.phase.start)}.`,fits});});
  opts.sort((a,b)=>(b.fits?1:0)-(a.fits?1:0));
  opts.push({id:'phase',label:'Nieuwe fase van een challenge',why:'Je hebt een fase gehaald en een nieuwe login gekregen.'});
  opts.push({id:'chal',label:'Nieuwe challenge',why:'Een nieuwe aankoop bij de firm.'});
  if(S.leeg)return {pick:'chal',opts:opts.filter(o=>o.id==='chal')};
  return {pick:opts[0].id,opts};
}

const TL={fee:'Fee',reset:'Reset',payout:'Payout',refund:'Fee terug'};
function ledgerRows(limit){const l=CH.flatMap(c=>c.money.map(m=>({...m,c}))).sort((a,b)=>a.date<b.date?1:-1).slice(0,limit||999);
  return l.map(m=>{const plus=m.type==='payout'||m.type==='refund';return `<tr><td class="num">${dmy(m.date)}</td><td>${esc(m.c.label)}</td><td>${TL[m.type]}</td><td class="dim">${esc(m.note||'')}</td><td class="rt num ${plus?'g':'r'}">${plus?'+':'−'}${usd(m.amount)}</td></tr>`;}).join('');}
const ledgerHead=`<thead><tr><th>Datum</th><th>Challenge</th><th>Soort</th><th>Notitie</th><th class="rt">Bedrag</th></tr></thead>`;
function pGeld(){
  if(S.leeg)return empty('🧾','Nog geen prop-kosten of payouts','Voeg een challenge toe in Instellingen → Funded en zet daar de fee, resets, payouts en terugbetaalde fees: het echte geld, los van je balans.','Naar Instellingen → Funded',toFunded);
  const firms=[...new Set(CH.map(c=>c.firm))];
  const row=cs=>{const m=cs.map(moneyOf);const kost=sum(m,x=>x.kost),terug=sum(m,x=>x.terug),uit=sum(m,x=>x.uit),net=uit+terug-kost;const n=cs.length,pass=cs.filter(c=>c.phases.some(p=>p.key==='f')).length;
    return `<td class="rt num">${n}</td><td class="rt num">${pass} / ${n}</td><td class="rt num">${usd(kost)}</td><td class="rt num">${usd(uit+terug)}</td><td class="rt num ${cls(net)}">${usd(net,1)}</td><td class="rt num ${cls(net)}">${kost?pct(net/kost*100):'–'}</td>`;};
  return `<div class="dov-note info" style="margin-bottom:16px">Dit is het enige echte geld rond prop. Het staat los van je balans: een payout die op je bank of Kraken landt, zit daar al in, dus hier tellen we hem niet nog een keer in je balans.</div>
  <div class="panel"><div class="phead"><h3>Uitgegeven tegenover verdiend</h3></div><div class="tblwrap"><table class="tbl"><thead><tr><th>Firm</th><th class="rt">Challenges</th><th class="rt">Funded gehaald</th><th class="rt">Uitgegeven</th><th class="rt">Verdiend</th><th class="rt">Netto</th><th class="rt">ROI</th></tr></thead>
    <tbody>${firms.map(fm=>`<tr><td><b>${esc(fm)}</b></td>${row(CH.filter(c=>c.firm===fm))}</tr>`).join('')}</tbody><tfoot><tr><td>Totaal</td>${row(CH)}</tr></tfoot></table></div></div>
  <div class="panel" style="margin-top:16px"><div class="phead"><h3>Boekingen</h3><span class="sp"></span><button class="btn" onclick="${toFunded}">+ Boeking in Instellingen</button></div>
    <div class="tblwrap"><table class="tbl">${ledgerHead}<tbody>${ledgerRows()}</tbody></table></div></div>`;
}

/* ── Instellingen ── */
function pSet(){
  const tab=SET_TABS.some(t=>t[0]===S.setTab)?S.setTab:'funded';
  const tabs=`<div class="tabs settabs">${SET_TABS.map(([k,ic,l])=>`<button class="${tab===k?'on':''}" onclick="set('setTab','${k}')"><span class="tico2">${ic}</span>${l}</button>`).join('')}</div><div style="height:18px"></div>`;
  const stub=l=>`<div class="panel"><div class="empty"><div class="empty-ico">🧩</div><h3 class="empty-h">${esc(l)}</h3><p class="empty-d">Deze tab is in de demo leeg; hij werkt zoals in de app. Kijk bij <b>Funded</b> en bij <b>Accounts</b> (CSV-import).</p></div></div>`;
  const body=tab==='funded'?setFunded():tab==='accounts'?setAccounts():stub(SET_TABS.find(t=>t[0]===tab)[2]);
  return `<div style="max-width:1000px">${tabs}${body}</div>`;
}
function setAccounts(){
  const conn=OWN.map(a=>`<div class="setrow"><div class="txt"><b>${esc(a.name)}</b><small>gekoppeld via API · read-only</small></div><span class="badge st-gehaald">verbonden</span></div>`).join('');
  return `<p class="setintro">Koppel je exchanges via read-only API-keys, of houd accounts handmatig bij.</p>
    <div class="section-sub">🔗 Exchange-koppelingen</div><div class="panel">${conn}</div>
    ${impSection()}
    <div class="section-sub">✎ Handmatige accounts <span class="hint">(geen exchange, zelf bijhouden)</span></div>
    <div class="panel"><div class="setrow"><div class="txt" style="color:var(--muted);font-size:12.5px">${S.fm?(S.variant==='A'?'Funded accounts staan hier ook, met de funded-vlag aan (beheer in de tab Funded).':'Fase-accounts van challenges beheer je in de tab Funded.'):'Nog geen handmatige accounts.'}</div></div></div>`;
}
function setFunded(){
  const sw=(on,label,small,act,id)=>`<div class="setrow"><div class="txt"><b>${label}</b><small>${small}</small></div><button class="sw ${on?'on':''}" role="switch" aria-checked="${on}" aria-label="${esc(label)}" ${id?`id="${id}"`:''} onclick="${act}"></button></div>`;
  const hidden=storedFunded(),hiddenN=TRADES_RAW.filter(t=>hidden.some(a=>a.id===t[1])).length;
  let out=`<p class="setintro">Voor wie een challenge handelt bij een prop firm (FTMO, Breakout). Funded geld is van de firm tot een payout: het blijft buiten je eigen balans en P&L-%, maar de trades tellen mee in je analyse.</p>
    <div class="panel">${sw(S.fm,'Funded modus','Uit: de journal toont niets van prop firms. Aan: funded accounts, challenges en de funded-vraag bij de import.',`set('fm',${!S.fm})`,'swFm')}
    ${S.fm?sw(S.fundedMee,'Funded meetellen','Uit: eigen en funded naast elkaar, elk met een eigen totaal. Aan: één totaal op Dashboard en Accounts, gemarkeerd als "incl. funded".',`set('fundedMee',${!S.fundedMee})`,'swFunded'):''}
    ${S.fm&&!S.leeg?pctExplain(totals()):''}</div>`;
  if(!S.fm){
    out+=hidden.length?`<div class="dov-note info" style="margin-top:14px">${hidden.length} funded accounts met ${hiddenN} trades zijn verborgen, niet gewist. Ze tellen niet als eigen geld en staan niet in je analyse. Zet de modus aan om ze terug te zien.</div>`
      :`<div class="dov-note info" style="margin-top:14px">Je hebt geen funded accounts. Zolang de modus uit staat, verandert er niets aan je journal.</div>`;
    return out;
  }
  if(S.variant==='A')return out+setFundedA();
  return out+setChallenges()+(S.variant==='C'?setMoney():'');
}
function setFundedA(){
  const fa=fundedAccounts();
  const rows=[...OWN.map(a=>({name:a.name,sub:'eigen geld · API',on:false})),...fa.map(a=>({name:a.name,sub:`login ${a.login||'–'} · ${usd(a.size)}`,on:true}))]
    .map(r=>`<div class="setrow"><div class="txt"><b>${esc(r.name)}</b><small>${esc(r.sub)}</small></div>${r.on?'<span class="badge fund">funded</span>':''}<span class="sw ${r.on?'on':''}" role="img" aria-label="funded ${r.on?'aan':'uit'}" title="In de demo alleen ter illustratie"></span></div>`).join('');
  return `<div class="section-sub">🏁 Welke accounts zijn funded? <span class="hint">(per account een vlag)</span></div>
    <div class="panel">${rows}
      <div class="setrow"><div class="formrow" style="flex:1"><div class="field"><label>Naam</label><input placeholder="bv. FTMO 100k · 1510004444"></div><div class="field"><label>Startkapitaal</label><input inputmode="decimal" placeholder="100.000"></div><div class="field"><label>Login (optioneel)</label><input placeholder="uit MT5"></div><button class="btn pri" onclick="S.fmsg='Demo: funded account zou worden toegevoegd.';render()">+ Funded account</button></div></div></div>
    ${S.fmsg?`<div class="dov-note ok" style="margin-top:10px">${S.fmsg}</div>`:''}
    <div class="dov-note info" style="margin-top:14px">Meer is er in variant A niet: geen challenges, fases, regels of geld.</div>`;
}
function setChallenges(){
  if(S.leeg)return `<div class="section-sub">🏁 Challenges</div>${empty('🏁','Nog geen challenges','Voeg je eerste challenge toe: firm, programma en startkapitaal. Of importeer een MT5-bestand bij Accounts; de journal stelt dan zelf een challenge voor.','Challenge toevoegen',"S.fmsg='Demo: hier opent het formulier voor een nieuwe challenge.';render()")}${S.fmsg?`<div class="dov-note ok" style="margin-top:10px">${S.fmsg}</div>`:''}`;
  const sel=CH.find(c=>c.id===S.selCh)||CH[0];
  const list=CH.map(c=>`<div class="setrow ${c.id===sel.id?'trsel':''}"><div class="txt"><b>${esc(c.label)}</b> ${stBadge(chStatus(c))}<small>${esc(c.firm)} · ${esc(c.program)} · ${usd(c.size)} · ${c.phases.length} fase${c.phases.length===1?'':'s'}</small></div><button class="btn" onclick="S.selCh='${c.id}';render()">${c.id===sel.id?'Regels ▾':'Regels'}</button></div>`).join('');
  const num=(c,p,k,v)=>`<input class="rin" inputmode="decimal" aria-label="${k} ${esc(p.name)}" value="${v==null?'':v}" placeholder="–" onchange="setRule('${c.id}','${p.key}','${k}',this.value)">`;
  const rules=sel.phases.map(p=>`<tr><td><b>${p.name}</b><small class="dim" style="display:block">${p.login?'login '+esc(p.login):'nog geen login'}</small></td>
    <td>${num(sel,p,'target',p.rules.target)}</td><td>${num(sel,p,'daily',p.rules.daily)}</td><td>${num(sel,p,'max',p.rules.max)}</td>
    <td><select class="rin" aria-label="type drawdown ${esc(p.name)}" onchange="setRule('${sel.id}','${p.key}','dd',this.value)">${['statisch','EOD-trailing','trailing'].map(d=>`<option ${p.rules.dd===d?'selected':''}>${d}</option>`).join('')}</select></td>
    <td>${num(sel,p,'minDays',p.rules.minDays)}</td></tr>`).join('');
  return `<div class="section-sub">🏁 Challenges <span class="hint">(status en voortgang zie je bij Accounts; hier richt je ze in)</span></div>
    <div class="panel">${list}
      <div class="setrow"><div class="formrow" style="flex:1"><div class="field"><label>Firm</label><select><option>FTMO</option><option>Breakout</option><option>Andere firm</option></select></div><div class="field"><label>Programma</label><select><option>2-Step</option><option>1-Step</option></select></div><div class="field"><label>Startkapitaal</label><input inputmode="decimal" placeholder="100.000"></div><button class="btn pri" onclick="S.fmsg='Demo: challenge zou worden toegevoegd, met de regels van FTMO 2-Step voorgesteld.';render()">+ Challenge</button></div></div></div>
    ${S.fmsg?`<div class="dov-note ok" style="margin-top:10px">${S.fmsg}</div>`:''}
    <div class="section-sub">📏 Regels per fase · ${esc(sel.label)} <span class="hint">(in %; leeg = geldt niet)</span></div>
    <div class="panel"><div class="tblwrap"><table class="tbl"><thead><tr><th>Fase</th><th>Winstdoel</th><th>Dagverlies</th><th>Max drawdown</th><th>Type</th><th>Min. dagen</th></tr></thead><tbody>${rules}</tbody></table></div>
      <div class="pbody" style="padding-top:10px"><div class="dov-note info">Bij FTMO staan de regels van het programma al ingevuld; pas aan als jouw challenge afwijkt. Firms veranderen hun regels, dus de journal overschrijft nooit wat jij invult. Wijzig je hier iets, dan zie je het meteen terug in de voortgang bij Accounts.</div></div></div>`;
}
// Re-rendering removes the focused input, which fires a second change on blur: skip no-op changes and render after the event.
function setRule(cid,key,k,v){const r=CH.find(c=>c.id===cid).phases.find(p=>p.key===key).rules;
  let nv=v;if(k!=='dd'){const n=parseFloat(String(v).replace(',','.'));nv=isFinite(n)&&n>0?n:null;}
  if(r[k]===nv)return;r[k]=nv;setTimeout(render);}
function setMoney(){
  return `<div class="section-sub">🧾 Kosten en payouts <span class="hint">(echt geld · het overzicht staat op de pagina Prop-geld)</span></div>
    <div class="panel"><div class="pbody" style="border-bottom:1px solid var(--line2)"><div class="formrow"><div class="field"><label>Challenge</label><select id="mC">${CH.map(c=>`<option value="${c.id}">${esc(c.label)}</option>`).join('')}</select></div><div class="field"><label>Soort</label><select id="mT">${Object.entries(TL).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></div><div class="field"><label>Bedrag ($)</label><input id="mA" inputmode="decimal" placeholder="bijv. 450"></div><button class="btn pri" onclick="addMoney()">+ Boeking</button></div></div>
    <div class="tblwrap"><table class="tbl">${ledgerHead}<tbody>${ledgerRows(4)}</tbody></table></div>
    <div class="pbody" style="padding-top:10px;display:flex;justify-content:flex-end"><button class="btn" onclick="set('page','geld')">Alles in Prop-geld →</button></div></div>`;
}
function addMoney(){const a=parseFloat(String(document.getElementById('mA').value).replace(',','.'));if(!(a>0))return;
  CH.find(c=>c.id===document.getElementById('mC').value).money.push({type:document.getElementById('mT').value,amount:a,date:'2026-10-25',note:'toegevoegd in de demo'});render();}

render();
</script>
</body>
</html>
