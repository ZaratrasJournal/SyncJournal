<!doctype html>
<!-- PROTOTYPE v4 (14-10-2026): deel-paneel terug als 'Selectie & delen', de gewone filterbalk van de app,
     meer trade-info in de presentatie, Discord-beeld met trade-info. -->
<!-- PROTOTYPE v3 (14-10-2026): Zaratras koos indeling 1 (kaarten), 3 per rij, selecteerbaar; Presenteer =
     maand zonder selectie, geselecteerde met selectie. Daaronder de toelichting van v2. -->
<!-- PROTOTYPE v2 — weggooi-demo (14-10-2026). Vraag: Zaratras koos variant C (coach-sessie) uit v1, maar wil
     meer trade-info, de trade kunnen reviewen, blokken per maand waar je met ‹ › doorheen gaat (minder op
     je scherm, grotere miniaturen), en werkende knoppen: samen doorlopen, coach-pakket, kopieer voor Discord.
     Drie indelingen via ?variant=1|2|3 en de balk onderin. ← → = vorige/volgende maand. Nep-data, alles in
     het geheugen. Notities: demos/review-beeld-NOTES.md. -->

<style>
:root{--bg:#f4f5f9;--surface:#fff;--sink:#f0f2f7;--line:#e4e7ef;--line2:#eef0f5;--ink:#141826;--ink2:#3b4256;--muted:#717892;
  --accent:#4655d4;--accent-soft:#e8eafb;--green:#169a6d;--green-soft:#e2f5ee;--red:#d4424e;--red-soft:#fbe8ea;--amber:#d08a1b;--track:#e9ecf3;

body.dark{--bg:#0d1118;--surface:#151a23;--sink:#10141c;--line:#252c39;--line2:#1d2330;--ink:#eef1f7;--ink2:#c3c9d6;--muted:#8a92a6;

.card{gap:9px}.card{display:flex;flex-direction:column}.card .kv .l{font-size:9.5px}.card .kv .v{font-size:12px}
.card.on{outline:2px solid var(--accent);outline-offset:-1px}

.cbx.on{background:var(--accent);border-color:var(--accent)}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:62px;z-index:55;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 12px;max-width:calc(100vw - 40px);box-shadow:0 10px 30px rgba(0,0,0,.25)}

.volg{position:absolute;bottom:calc(100% + 8px);left:0;width:340px;padding:10px 12px}
.iconbtn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.card{padding:12px;display:flex;flex-direction:column;gap:8px}

.strip .s .sv{position:absolute;top:6px;right:8px;background:var(--accent);color:#fff;border-radius:99px;font-size:10px;font-weight:800;padding:1px 6px}

.laag{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line)}.laag .tf{font-family:'IBM Plex Mono',monospace;font-weight:700;min-width:46px}

.lb.on{display:grid}.lb.nopanel{grid-template-columns:1fr}
.lb .stage{display:flex;align-items:center;justify-content:center;padding:24px 70px 170px;position:relative;min-width:0}

.lb .nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:24px}
.lb .prev{left:14px}.lb .next{right:14px}
.lb .x{position:absolute;top:14px;right:16px;border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:9px;padding:6px 11px;font-size:16px}

@media(max-width:1000px){.app{grid-template-columns:1fr}.side{display:none}.layout,.focus{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.row{grid-template-columns:1fr}.lb{grid-template-columns:1fr}.lb aside{display:none}}

<body>
<div class="app"><div class="side"><div class="logo">Sync<b>Journal</b></div><div class="nav"><div>Dashboard</div><div>Trades</div><div>Analytics</div><div>Tendencies</div><div>Kalender</div><div>Playbook</div><div class="on">Review</div></div></div>
<div class="main" id="main"></div></div>
<div class="lb" id="lb"></div><div class="toast" id="toast"></div><div class="switch" id="switch"></div>
<script>
// ── nep-data ───────────────────────────────────────────────────────────
let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};const pick=a=>a[Math.floor(rnd()*a.length)];
const PB=['Trend-pullback','London SFP','BOS-retest','Range-fade','1H MSB/BOS'],TAGS=['Liquidity Sweep','FVG','EQL/EQH','Range retest','Support OB','Session sweep'];
const PAIRS=['BTC/USDT','ETH/USDT','SOL/USDT','BTC/USDC','ETH/USDC'],TFS=[['4H','1H'],['Daily','1H'],['1H','15M'],['4H','15M']],SES=['Azië','London','New York','US PM'];
const EMOS=['Kalm','Gefocust','Zelfverzekerd','FOMO','Twijfel','Gehaast','Revenge'],CHECKS=['Setup uit playbook','Risk ≤ 1%','Plan vooraf genoteerd','Geen emotionele instap','TP/SL vooraf gezet'];
const NOTES=['Mooie sweep van de Asia-low, geduldig op de retest gewacht.','Te vroeg in, geen bevestiging op de 15M.','TP1 geraakt, rest op break-even gezet.','Tegen de 4H-bias in — had ik niet moeten nemen.','Precies volgens plan, A+ setup.','FOMO-entry na een gemiste eerste kans.',''];
function chart(t,k){const c=document.createElement('canvas');c.width=1280;c.height=760;const g=c.getContext('2d');const dark=(t.id+k)%3!==0;
  g.fillStyle=dark?'#131722':'#fff';g.fillRect(0,0,1280,760);g.strokeStyle=dark?'#1e2433':'#eef0f4';
  for(let x=0;x<1280;x+=80){g.beginPath();g.moveTo(x,0);g.lineTo(x,700);g.stroke();}for(let y=0;y<700;y+=70){g.beginPath();g.moveTo(0,y);g.lineTo(1180,y);g.stroke();}
  let p=380;const pts=[];const up=t.dir==='long';for(let i=0;i<95;i++){const o=p;const drift=i<55?(up?1.4:-1.4):(t.r>0?(up?-4:4):(up?3:-3));p+=(rnd()-0.5)*24+drift;pts.push([o,p,Math.min(o,p)-rnd()*14,Math.max(o,p)+rnd()*14]);}
  pts.forEach(([o,cl,h,l],i)=>{const x=20+i*12;g.strokeStyle=g.fillStyle=cl<o?'#26a69a':'#ef5350';g.beginPath();g.moveTo(x+4,h);g.lineTo(x+4,l);g.stroke();g.fillRect(x,Math.min(o,cl),8,Math.max(2,Math.abs(cl-o)));});
  const ey=pts[55][1],sy=ey+(up?60:-60),ty=ey-(up?150:-150);g.fillStyle='rgba(38,166,154,.2)';g.fillRect(680,Math.min(ey,ty),420,150);g.fillStyle='rgba(239,83,80,.2)';g.fillRect(680,Math.min(ey,sy),420,60);
  g.font='bold 22px Inter,sans-serif';g.fillStyle=dark?'#d1d4dc':'#131722';g.fillText(t.pair.replace('/','')+' · '+(k?t.tf[1]:t.tf[0])+' · '+t.setup,24,40);
  g.fillStyle='#2962ff';g.fillRect(1180,ey-12,100,24);g.fillStyle='#fff';g.font='bold 15px monospace';g.fillText('ENTRY',1196,ey+5);return c.toDataURL('image/jpeg',0.8);}
const TRADES=[];const d0=new Date('2026-10-13T12:00:00');
for(let i=0;i<44;i++){const dt=new Date(d0-i*86400000*2.1);const R=+((rnd()<0.52?1:-1)*(0.3+rnd()*2.6)).toFixed(2);const entry=+(60000+rnd()*30000).toFixed(1),dist=entry*(0.004+rnd()*0.008);
  const dir=rnd()<0.55?'long':'short',stop=+(dir==='long'?entry-dist:entry+dist).toFixed(1),exit=+(dir==='long'?entry+dist*R:entry-dist*R).toFixed(1);
  const t={id:100+i,date:dt.toISOString().slice(0,10),time:String(7+Math.floor(rnd()*13)).padStart(2,'0')+':'+pick(['05','15','30','45']),pair:pick(PAIRS),dir,setup:pick(PB),tf:pick(TFS),
    bias:pick(['Bullish','Bearish','']),ses:pick(SES),entry,stop,exit,r:R,pnl:Math.round(R*95),dur:Math.round(20+rnd()*600),grade:pick(['A','B','C']),
    tags:[...new Set([pick(TAGS),...(rnd()<0.4?[pick(TAGS)]:[])])],note:pick(NOTES),lesson:R<0?'Wacht op de candle-close boven het level.':'',emo:pick(EMOS),
    reviewed:i>8&&rnd()<0.5,rating:0,checks:CHECKS.map(()=>rnd()<0.7),coach:'',shots:[],tv:[]};
  Object.assign(t,{ex:pick(['Blofin','OKX','Hyperliquid','Kraken']),size:Math.round(500+rnd()*3000),lev:pick([3,5,10,20]),risk:+(0.5+rnd()).toFixed(1),fees:+(0.4+rnd()*3).toFixed(2),
    mistakes:rnd()<0.6?[]:[pick(['Te vroeg in','Geen plan','SL te krap','Te groot'])],rrPlanned:+(1.5+rnd()*2).toFixed(1),

   <div class="film" id="film">${LB.items.map((x,j)=>`<div class="f ${j===LB.i?'on':''}" onclick="LB.i=${j};drawLb()" title="${fmtD(x.t.date)} · ${esc(x.t.pair)}">${x.src?`<img src="${x.src}" alt="">`:'<div class="tvf">📈</div>'}<div class="fc"><span>${fmtD(x.t.date)}</span><b class="${x.t.r>=0?'pos':'neg'}">${rTxt(x.t.r)}</b></div></div>`).join('')}</div>
   <div class="capbar"><b>${fmtD(t.date)} ${t.time}</b> · ${esc(t.pair)} · ${esc(t.setup)} ${rB(t.r)}${money(t.pnl)} <span style="opacity:.6">· ${LB.i+1}/${LB.items.length}</span><span class="sp"></span>${tvLinks(t)}</div></div>
   ${LB.panel?`<aside><div class="mu" style="font-size:12px">${fmtD(t.date)} · ${t.time} · ${t.ses}</div><h3 style="margin:2px 0 6px">${esc(t.pair)} · ${esc(t.setup)}</h3>${rB(t.r)}${money(t.pnl)}
     ${infoVol(t)}${review(t,false)}
     <div class="lbl">Coach-feedback</div><textarea onchange="T(${t.id}).coach=this.value" placeholder="Wat zegt je coach? Gaat mee in het pakket.">${esc(t.coach)}</textarea></aside>`:''}`;filmInBeeld();}
function filmInBeeld(){document.getElementById('switch').style.display=LB?'none':'';const f=document.querySelector('#film .f.on');if(f)f.scrollIntoView({block:'nearest',inline:'center'});}
function lbGo(d){if(!LB)return;LB.i=(LB.i+d+LB.items.length)%LB.items.length;drawLb();}
function closeLb(){LB=null;drawLb();document.getElementById('switch').style.display='';draw();}
// ── coach-pakket: echt HTML-bestand ───────────────────────────────────
function coachPakket(){const sel=S.sel.map(T);const hide=S.hide;
  const blok=t=>`<section><h2>${esc(fmtD(t.date))} ${esc(t.time)} · ${esc(t.pair)} <span class="${t.dir}">${t.dir.toUpperCase()}</span> · ${esc(t.setup)} <span class="r ${t.r>=0?'pos':'neg'}">${rTxt(t.r)}</span>${hide?'':` <span class="${t.pnl>=0?'pos':'neg'}">${t.pnl>=0?'+':'−'}$ ${Math.abs(t.pnl)}</span>`}</h2>
    <div class="shots">${t.shots.map(s=>`<a href="#z${t.id}_${t.shots.indexOf(s)}"><img src="${s}" alt=""></a><a class="zoom" id="z${t.id}_${t.shots.indexOf(s)}" href="#"><img src="${s}" alt=""></a>`).join('')}</div>
    ${t.tv.length?`<p>${t.tv.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener">📈 TradingView ↗</a>`).join(' · ')}</p>`:''}
    <table><tr><th>Sessie</th><td>${esc(t.ses)}</td><th>Lagen</th><td>${esc(t.tf.join(' → '))}</td><th>HTF-bias</th><td>${esc(t.bias||'—')}</td></tr>
    <tr><th>Entry</th><td>${fmtP(t.entry)}</td><th>Stop</th><td>${fmtP(t.stop)}</td><th>Exit</th><td>${fmtP(t.exit)}</td></tr>
    <tr><th>Emotie</th><td>${esc(t.emo)}</td><th>Discipline</th><td>${t.checks.filter(Boolean).length}/5</td><th>Rating</th><td>${'★'.repeat(t.rating)||'—'}</td></tr></table>
    ${t.tags.length?`<p class="tags">${t.tags.map(x=>`<span>${esc(x)}</span>`).join('')}</p>`:''}
    ${t.note?`<h4>Wat gebeurde er?</h4><p>${esc(t.note)}</p>`:''}${t.lesson?`<h4>Leerpunt</h4><p>${esc(t.lesson)}</p>`:''}${t.coach?`<h4>Coach-feedback</h4><p>${esc(t.coach)}</p>`:''}</section>`;
  const html=`<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trade-review van ${esc(S.name)}</title>
<style>body{font:15px/1.5 system-ui,sans-serif;background:#f4f5f9;color:#141826;max-width:1000px;margin:0 auto;padding:24px}section{background:#fff;border:1px solid #e4e7ef;border-radius:14px;padding:16px 18px;margin:16px 0}
h1{margin:0}h2{font-size:17px;margin:0 0 10px}h4{margin:12px 0 2px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#717892}.pos{color:#169a6d}.neg{color:#d4424e}.long{color:#169a6d}.short{color:#d4424e}
.shots img{width:100%;border-radius:10px;border:1px solid #e4e7ef;margin-bottom:8px}table{border-collapse:collapse;width:100%;font-size:13px}th{color:#717892;text-align:left;font-weight:600;padding:3px 8px 3px 0}td{padding:3px 14px 3px 0;font-family:monospace}
.tags span{display:inline-block;background:#f0f2f7;border-radius:99px;padding:2px 9px;margin:0 4px 4px 0;font-size:12px}.zoom{display:none}.zoom:target{display:flex;position:fixed;inset:0;background:rgba(0,0,0,.92);align-items:center;justify-content:center;z-index:9}.zoom:target img{max-width:96vw;max-height:94vh;width:auto}</style></head>
<body><h1>Trade-review</h1><p>Gedeeld door <b>${esc(S.name)}</b> · ${sel.length} trades · ${new Date().toLocaleDateString('nl-NL')} · gemaakt met SyncJournal${hide?' · bedragen verborgen':''}</p>${sel.map(blok).join('')}</body></html>`;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='trade-review-'+new Date().toISOString().slice(0,10)+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  toast('⬇ Coach-pakket gedownload ('+sel.length+' trades) — open het bestand om te zien wat je coach krijgt');}
// ── Discord: beeld met balk + tekst naar het klembord ─────────────────
function discord(){discordVan(S.sel[0]);}
function discordVan(id){const t=T(id);const img=new Image();img.onload=async()=>{
  const W=1280,H=760,P=440,c=document.createElement('canvas');c.width=W+P;c.height=H+64;const g=c.getContext('2d');
  g.fillStyle='#0d1118';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,W,H);
  // info-paneel rechts
  let y=48;const x=W+28;const regel=(l,v,col)=>{g.fillStyle='#8a92a6';g.font='600 19px Inter,sans-serif';g.fillText(l,x,y);g.fillStyle=col||'#eef1f7';g.font='600 21px "IBM Plex Mono",monospace';g.fillText(v,x+170,y);y+=38;};
  g.fillStyle='#eef1f7';g.font='bold 32px Inter,sans-serif';g.fillText(t.pair,x,y);g.fillStyle=t.dir==='long'?'#2fbf8a':'#ef5d6a';g.font='bold 20px Inter,sans-serif';g.fillText(t.dir.toUpperCase(),x+g.measureText(t.pair).width+150,y);y+=40;
  g.fillStyle='#c3c9d6';g.font='600 22px Inter,sans-serif';g.fillText(t.setup+' · '+t.tf.join(' → '),x,y);y+=26;
  g.fillStyle=t.r>=0?'#2fbf8a':'#ef5d6a';g.font='bold 54px "IBM Plex Mono",monospace';y+=48;g.fillText(rTxt(t.r),x,y);y+=50;
  if(!S.hide){g.font='bold 24px "IBM Plex Mono",monospace';g.fillText((t.pnl>=0?'+':'−')+'$ '+Math.abs(t.pnl),x,y-8);y+=26;}
  regel('Datum',fmtD(t.date)+' '+t.time);regel('Sessie',t.ses);regel('HTF-bias',t.bias||'—',t.bias==='Bullish'?'#2fbf8a':t.bias==='Bearish'?'#ef5d6a':null);
  regel('Entry',fmtP(t.entry));regel('Stop',fmtP(t.stop),'#ef5d6a');regel('Exit',fmtP(t.exit));regel('R:R gepland',String(t.rrPlanned).replace('.',',')+' : 1');
  regel('TP geraakt',t.tps.filter(x=>x.hit).map(x=>x.n).join(', ')||'—');regel('Duur',dur(t.dur));
  g.fillStyle='#8a92a6';g.font='600 18px Inter,sans-serif';y+=6;g.fillText((t.conf[0]||[]).concat(t.tags).slice(0,4).join(' · '),x,y);
  // voetbalk
  g.fillStyle='#151a23';g.fillRect(0,H,c.width,64);g.fillStyle='#7d88ff';g.font='bold 24px Inter,sans-serif';g.fillText('SyncJournal',24,H+41);
  g.fillStyle='#8a92a6';g.font='20px Inter,sans-serif';const nt=t.note?'“'+t.note+'”':'';g.fillText(nt.length>110?nt.slice(0,107)+'…”':nt,200,H+40);
  const tekst=`**${t.pair} ${t.dir.toUpperCase()}** · ${t.setup} (${t.tf.join(' → ')}) · ${rTxt(t.r)}${S.hide?'':' · '+(t.pnl>=0?'+':'−')+'$'+Math.abs(t.pnl)}\n`+
    `Entry ${fmtP(t.entry)} · Stop ${fmtP(t.stop)} · Exit ${fmtP(t.exit)} · R:R gepland ${String(t.rrPlanned).replace('.',',')}\n${t.note||''}${t.tv[0]?'\n'+t.tv[0]:''}`.trim();
  c.toBlob(async blob=>{S.dprev=URL.createObjectURL(blob);try{await navigator.clipboard.write([new ClipboardItem({'image/png':blob,'text/plain':new Blob([tekst],{type:'text/plain'})})]);toast('📋 Beeld + tekst gekopieerd — plak in Discord (Ctrl+V)');}
    catch(e){const a=document.createElement('a');a.href=S.dprev;a.download='discord-'+t.date+'.png';a.click();try{await navigator.clipboard.writeText(tekst);}catch(_){}toast('Klembord niet toegestaan in deze browser: beeld gedownload, tekst gekopieerd');}},'image/png');};
  img.src=t.shots[0]||chart(t,0);}
// ── render ────────────────────────────────────────────────────────────
function draw(){const v=S.variant;const {M,m}=cur();
  let body;if(!m)body=filterBar()+'<div class="panel" style="padding:40px;text-align:center" class="mu">Geen trades met beeld in deze selectie. Pas je filter aan.</div>';
  else body=filterBar()+monthHead(M,m)+`<div class="layout"><div>${V1(M,m)}</div>${basket()}</div>`;
  document.getElementById('main').innerHTML=`<div class="top"><h1>Review</h1><span class="mu">leer van elke trade</span><span class="sp"></span>
   <div class="modes"><button>Per trade</button><button class="on">🖼 Beeld</button></div><button class="iconbtn" onclick="S.hide=!S.hide;draw()">${S.hide?'👁 Toon bedragen':'🙈 Verberg bedragen'}</button></div>`+body;
  document.getElementById('switch').innerHTML=`<span class="lbl2">Demo v4 — kaarten + Selectie & delen</span><button onclick="document.body.classList.toggle('stijl-kop');this.textContent=document.body.classList.contains('stijl-kop')?'stijl: kop':'stijl: rand'">stijl: rand</button><button onclick="document.body.classList.toggle('dark')">licht/donker</button>`;}
function cyc(d){const ks=VARIANTS.map(x=>x[0]);S.variant=ks[(ks.indexOf(S.variant)+d+ks.length)%ks.length];const u=new URL(location);u.searchParams.set('variant',S.variant);history.replaceState(null,'',u);draw();}
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select'))return;
  if(LB){if(e.key==='ArrowLeft')lbGo(-1);else if(e.key==='ArrowRight')lbGo(1);else if(e.key==='Escape')closeLb();return;}
  if(e.key==='ArrowLeft')mGo(1);else if(e.key==='ArrowRight')mGo(-1);});
draw();
</script>
</body>
</html>
