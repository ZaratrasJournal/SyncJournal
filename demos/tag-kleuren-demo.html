<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tag-kleuren · demo</title>
<!--
  Demo voor backlog C5 (29-09-2026): acht tag-soorten, acht kleuren, overal gelijk.
  Kleurwaarden komen letterlijk uit work/syncjournal.html (:root en body.dark), behalve
  --pink, dat nieuw is. Chip-stijlen zijn overgenomen uit de app (.tagchip, .tagopt, .tagmanage).
-->
<style>
  *{box-sizing:border-box;margin:0}
  body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#e9edf3;color:#191E2A;padding:24px}
  .top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .top h1{font-size:20px;font-weight:800}
  .top p{font-size:13px;color:#525A6B}
  .seg{display:inline-flex;border:1px solid #cfd6e2;border-radius:9px;overflow:hidden;background:#fff}
  .seg button{border:0;background:none;padding:8px 16px;font:600 13px/1 inherit;cursor:pointer;color:#525A6B}
  .seg button.on{background:#3B5BD9;color:#fff}
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:1100px){.duo{grid-template-columns:1fr}}

  /* ── thema-tokens, uit de app ── */
  .thema{border-radius:14px;padding:18px;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
  .licht{--bg:#F4F6FA;--surface:#FFFFFF;--sink:#F7F9FC;--ink:#191E2A;--ink2:#525A6B;--muted:#6B7385;--line:#E8EBF2;--line2:#F0F2F7;
         --accent:#3B5BD9;--accent-soft:#EDF0FD;--green:#12946A;--red:#D64259;--amber:#C0821C;--violet:#7C5CE0;--teal:#0E9E96;--pink:#D6409F}
  .donker{--bg:#0E1218;--surface:#141A22;--sink:#10151c;--ink:#F4F7FB;--ink2:#C7CFDB;--muted:#939CAC;--line:#232B36;--line2:#1C232D;
         --accent:#6E86F0;--accent-soft:#1B2436;--green:#37C48B;--red:#F0637A;--amber:#E0A63C;--violet:#A78BFA;--teal:#2CC5B6;--pink:#F472B6}
  .thema-kop{font:700 12px/1 inherit;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}

  .blok{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
  .blok h3{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .blok h3 small{text-transform:none;letter-spacing:0;font-weight:500;margin-left:6px}

  /* legenda */
  .leg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .leg div{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--ink2)}
  .leg i{width:14px;height:14px;border-radius:4px;background:var(--c);flex:none}

  /* ── in de trade: .tagopt uit de app, aangeklikt in de soortkleur ── */
  .rij{margin-bottom:10px}.rij:last-child{margin-bottom:0}
  .rij .lab{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .tagopt{font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:6px;border:1px solid var(--line);color:var(--ink2);background:var(--surface)}
  .tagopt.on{color:var(--c);border-color:color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 14%,transparent)}
  .tagopt.on::before{content:"✓ "}
  .twee{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  /* ── overzicht: .tagchip.col uit de app ── */
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  td{padding:9px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
  tr:last-child td{border-bottom:0}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px}
  .tagchip{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;padding:2px 7px;border-radius:5px;margin:1px 2px;white-space:nowrap;
           color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);border:1px solid color-mix(in srgb,var(--c) 30%,transparent)}
  .tagchip::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--c);flex:none}
  .leeg{color:var(--muted);font-size:11px}

  /* ── instellingen: .tagcard + .tagmanage uit de app ── */
  .kaarten{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .kaart{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--sink)}
  .kaart.breed{grid-column:1/-1}
  .kaart-h{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;margin-bottom:8px}
  .kaart-h i{width:8px;height:8px;border-radius:50%;background:var(--c)}
  .kaart-h span{margin-left:auto;font-size:10.5px;color:var(--muted);font-weight:600}
  .tagmanage{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;margin:2px;
             border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:var(--surface);color:var(--ink2)}
  .tagmanage i{width:7px;height:7px;border-radius:50%;background:var(--c)}
  .kolom-kop{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:2px 0 6px;color:var(--c)}
  .let-op{font-size:11px;color:var(--muted);margin-top:8px;font-style:italic}
</style>
</head>
<body>
<div class="top">
  <h1>Tag-kleuren</h1>
  <div class="seg" role="group" aria-label="Weergave">
    <button id="bNu" onclick="zet('nu')">Nu</button>
    <button id="bVoorstel" class="on" onclick="zet('voorstel')">Voorstel</button>
  </div>
  <p id="uitleg"></p>
</div>
<div class="duo">
  <div class="thema licht"><div class="thema-kop">Licht thema</div><div class="inhoud"></div></div>
  <div class="thema donker"><div class="thema-kop">Donker thema</div><div class="inhoud"></div></div>
</div>

<script>
/* De acht soorten, met de tags uit DEFAULT_TAGCONFIG van de app. */
const SOORTEN = [
  { key:'setup',   naam:'Setup-type',        tags:['BOS','MSB','SFP','F2R','Structuur','Range'] },
  { key:'conf',    naam:'Confirmaties',      tags:['Liquidity Sweep','OB','FVG','EQL/EQH','Support OB'] },
  { key:'tf',      naam:'Timeframe',         tags:['15M','1H','4H','Daily'] },
  { key:'emoPos',  naam:'Emoties, positief', tags:['Geduldig','Rustig','Zelfverzekerd'] },
  { key:'emoNeg',  naam:'Emoties, negatief', tags:['FOMO','Gehaast','Twijfels'] },
  { key:'fout',    naam:'Fouten',            tags:['Te vroeg in','SL te krap','Geen plan','TP te vroeg'] },
  { key:'missed',  naam:'Missed-redenen',    tags:['Durf','Te laat gespot','Buiten regels'] },
  { key:'eigen',   naam:'Eigen tags',        tags:['nieuwsdag','high conviction'] },
];

/* Kleur per soort, per plek. 'nu' is gemeten in de app op 29-09-2026 (v1.2):
   het formulier, Instellingen en het overzicht hebben elk hun eigen schema. */
const NEUTRAAL = 'var(--accent)';   // aangeklikt-kleur in het formulier voor setups/conf/tf nu
const NU = {
  trade:   { setup:NEUTRAAL, conf:NEUTRAAL, tf:NEUTRAAL, emoPos:'var(--green)', emoNeg:'var(--red)', fout:'var(--amber)', missed:'var(--muted)', eigen:'#7a869c' },
  overzicht:{ setup:'#5aa9ff', conf:'#12b39b', tf:null, emoPos:'#c0821c', emoNeg:'#c0821c', fout:'#e8823c', missed:null, eigen:'#7a869c' },
  inst:    { setup:'#5aa9ff', conf:'#12b39b', tf:'#a78bfa', emoPos:'#c0821c', emoNeg:'#c0821c', fout:'#e8823c', missed:'#8a92a3', eigen:'#7a869c' },
};
const EEN = { setup:'var(--accent)', conf:'var(--teal)', tf:'var(--violet)', emoPos:'var(--green)', emoNeg:'var(--red)', fout:'var(--amber)', missed:'var(--pink)', eigen:'var(--muted)' };
const VOORSTEL = { trade:EEN, overzicht:EEN, inst:EEN };

/* Wat er in de trade aangeklikt is — dezelfde trade komt terug in het overzicht. */
// Missed-redenen horen in de app bij een gemiste trade; hier staat er een aan zodat de kleur zichtbaar is.
const AAN = { setup:['MSB'], conf:['OB'], tf:['1H'], emoPos:['Geduldig'], emoNeg:['FOMO'], fout:['Te vroeg in'], missed:['Te laat gespot'], eigen:['nieuwsdag'] };
const TRADES = [
  { t:'28-09 17:40', ex:'Hyperliquid', tags:{ setup:['MSB'], tf:['1H'], emoPos:['Geduldig'] } },
  { t:'28-09 16:14', ex:'OKX',         tags:{ setup:['MSB','BOS'], conf:['OB'], tf:['1H'], emoNeg:['FOMO'], fout:['Te vroeg in'], eigen:['nieuwsdag'] } },
  { t:'27-09 09:00', ex:'Gemist',      tags:{ setup:['SFP'], tf:['4H'], missed:['Te laat gespot'] } },
];
const VOLGORDE = ['setup','tf','conf','emoPos','emoNeg','fout','missed','eigen'];

let modus = 'voorstel';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function legenda(p){
  return `<div class="blok"><h3>De acht soorten</h3><div class="leg">${
    SOORTEN.map(s => `<div style="--c:${p.inst[s.key]}"><i></i>${s.naam}</div>`).join('')}</div></div>`;
}
function inDeTrade(p){
  const rij = s => `<div class="rij"><div class="lab">${s.naam}</div><div class="chips">${
    s.tags.map(tg => `<span class="tagopt ${AAN[s.key].includes(tg)?'on':''}" style="--c:${p.trade[s.key]}">${esc(tg)}</span>`).join('')}</div></div>`;
  const s = k => SOORTEN.find(x => x.key === k);
  return `<div class="blok"><h3>In de trade <small>het formulier, aangeklikte chips</small></h3>
    ${rij(s('tf'))}${rij(s('setup'))}${rij(s('conf'))}
    <div class="twee">${rij(s('emoNeg'))}${rij(s('emoPos'))}</div>
    ${rij(s('fout'))}${rij(s('missed'))}${rij(s('eigen'))}</div>`;
}
function overzicht(p){
  const cel = tr => {
    const chips = VOLGORDE.flatMap(k => (tr.tags[k]||[]).map(tg => p.overzicht[k] ? `<span class="tagchip" style="--c:${p.overzicht[k]}">${esc(tg)}</span>` : '')).join('');
    return chips || '<span class="leeg">—</span>';
  };
  return `<div class="blok"><h3>Trade-overzicht <small>Tags-kolom</small></h3>
    <table><thead><tr><th>Datum</th><th>Exchange</th><th>Tags</th></tr></thead><tbody>${
      TRADES.map(tr => `<tr><td class="mono">${tr.t}</td><td>${tr.ex}</td><td>${cel(tr)}</td></tr>`).join('')}</tbody></table>
    ${modus==='nu'?'<div class="let-op">Nu: timeframe en missed-redenen verschijnen hier niet.</div>':''}</div>`;
}
function instellingen(p){
  const kaart = (k, breed) => { const s = SOORTEN.find(x => x.key === k);
    return `<div class="kaart ${breed?'breed':''}"><div class="kaart-h" style="--c:${p.inst[k]}"><i></i>${s.naam}<span>${s.tags.length}</span></div>${
      s.tags.map(tg => `<span class="tagmanage" style="--c:${p.inst[k]}"><i></i>${esc(tg)}</span>`).join('')}</div>`; };
  const emoties = modus === 'nu'
    ? (() => { const alle = [...SOORTEN.find(x=>x.key==='emoNeg').tags, ...SOORTEN.find(x=>x.key==='emoPos').tags];
        return `<div class="kaart breed"><div class="kaart-h" style="--c:${p.inst.emoNeg}"><i></i>Emoties<span>${alle.length}</span></div>${
          alle.map(tg => `<span class="tagmanage" style="--c:${p.inst.emoNeg}"><i></i>${esc(tg)}</span>`).join('')}
          <div class="let-op">Nu: één lijst, geen splitsing. Een zelf toegevoegde emotie belandt in het formulier bij Positief.</div></div>`; })()
    : `<div class="kaart breed"><div class="kaart-h" style="--c:var(--ink2)"><i style="background:linear-gradient(90deg,var(--red) 50%,var(--green) 50%)"></i>Emoties<span>6</span></div>
        <div class="twee">
          <div><div class="kolom-kop" style="--c:${p.inst.emoNeg}">Negatief</div>${SOORTEN.find(x=>x.key==='emoNeg').tags.map(tg => `<span class="tagmanage" style="--c:${p.inst.emoNeg}"><i></i>${esc(tg)}</span>`).join('')}</div>
          <div><div class="kolom-kop" style="--c:${p.inst.emoPos}">Positief</div>${SOORTEN.find(x=>x.key==='emoPos').tags.map(tg => `<span class="tagmanage" style="--c:${p.inst.emoPos}"><i></i>${esc(tg)}</span>`).join('')}</div>
        </div></div>`;
  return `<div class="blok"><h3>Instellingen → Tags</h3><div class="kaarten">
    ${kaart('setup')}${kaart('conf')}${kaart('tf')}${kaart('fout')}${emoties}${kaart('missed')}${kaart('eigen')}</div></div>`;
}

function zet(m){
  modus = m;
  document.getElementById('bNu').classList.toggle('on', m === 'nu');
  document.getElementById('bVoorstel').classList.toggle('on', m === 'voorstel');
  document.getElementById('uitleg').textContent = m === 'nu'
    ? 'Zoals v1.2 het nu doet: drie plekken, drie kleurenschema’s.'
    : 'Voorstel C5: elke soort één kleur, op alle drie de plekken gelijk.';
  const p = m === 'nu' ? NU : VOORSTEL;
  document.querySelectorAll('.inhoud').forEach(el => { el.innerHTML = legenda(p) + inDeTrade(p) + overzicht(p) + instellingen(p); });
}
zet('voorstel');
</script>
</body>
</html>
