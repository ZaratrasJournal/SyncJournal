<!doctype html>
<html lang="nl" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Trading Plan</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233B5BD9'/%3E%3Cstop offset='1' stop-color='%237C6CF0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M32 4l24 14v28L32 60 8 46V18z' fill='url(%23g)'/%3E%3Ctext x='32' y='40' text-anchor='middle' font-family='Arial' font-weight='800' font-size='24' fill='white'%3ETP%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Tokens 1-op-1 uit work/syncjournal.html (:root + body.dark). Het plan volgt het thema van de journal
   (sj_state.theme) via data-theme op <html>; geen eigen themaknop. */
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --raise:#FBFCFE; --sink:#F7F9FC;
  --ink:#191E2A; --ink2:#525A6B; --muted:#6B7385; --faint:#7A8291;
  --line:#E8EBF2; --line2:#F0F2F7;
  --accent:#3B5BD9; --accent-soft:#EDF0FD; --accent-line:#CDD6F7; --on-accent:#FFFFFF;
  --green:#12946A; --green-soft:#E3F4EC; --red:#D64259; --red-soft:#FBE8EC; --amber:#C0821C; --amber-soft:#F8EFDD;
  --violet:#7C5CE0; --teal:#0E9E96; --pink:#D6409F;
  --hover:#F6F8FC; --track:#EEF1F6;
  --scrim:rgba(10,14,22,.45); --sh:0 1px 2px rgba(20,30,60,.05); --shl:0 12px 40px -12px rgba(20,30,60,.25);
  --fb:'Inter',system-ui,sans-serif; --fd:'Plus Jakarta Sans',sans-serif;
  /* Eén typeschaal voor het hele plan (polish punt 5): klein · gewoon · kop · titel */
  --t1:12px; --t2:13.5px; --t3:15px; --t4:19px;
}
:root[data-theme="dark"]{
  --bg:#0E1218; --surface:#141A22; --raise:#171E28; --sink:#10151c;
  --ink:#F4F7FB; --ink2:#C7CFDB; --muted:#939CAC; --faint:#6C7583;
  --line:#232B36; --line2:#1C232D;
  --accent:#6E86F0; --accent-soft:#1B2436; --accent-line:#2E3B57; --on-accent:#FFFFFF;
  --green:#37C48B; --green-soft:#12261F; --red:#F0637A; --red-soft:#2A1820; --amber:#E0A63C; --amber-soft:#28210F;
  --violet:#A78BFA; --teal:#2CC5B6; --pink:#F472B6;
  --hover:#19212B; --track:#1E2732;
  --scrim:rgba(0,0,0,.6); --sh:0 1px 2px rgba(0,0,0,.25); --shl:0 12px 40px -12px rgba(0,0,0,.6);
}
:root{--violet-soft:color-mix(in srgb,var(--violet) 12%,var(--surface));--teal-soft:color-mix(in srgb,var(--teal) 12%,var(--surface));--pink-soft:color-mix(in srgb,var(--pink) 12%,var(--surface))}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--fb);font-size:var(--t2);font-variant-numeric:tabular-nums;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:var(--t1)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 80px}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0;text-decoration:none;color:inherit}
.logo{width:30px;height:30px;flex:none}
.brand b{font-family:var(--fd);font-size:var(--t3);font-weight:800;letter-spacing:-.01em}
.brand span{display:block;font-size:var(--t1);color:var(--muted)}
.tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--track);border-radius:9px;padding:2px;gap:2px}
.seg button{padding:5px 10px;border-radius:7px;font-size:var(--t1);font-weight:600;color:var(--ink2);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh)}
.seg.sm button{padding:3px 8px;font-size:var(--t1)}
.ibtn{height:30px;min-width:30px;padding:0 9px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:var(--t1);font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;justify-content:center;gap:5px;text-decoration:none}
.ibtn:hover{background:var(--hover)}
.tabs{width:100%;display:flex;gap:2px;margin-top:4px;overflow-x:auto}
.tabs button{padding:9px 12px 10px;font-weight:600;font-size:var(--t2);color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button{--tbc:var(--accent);display:inline-flex;align-items:center;gap:7px}
.tabs button::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--tbc);opacity:.45}
.tabs button[data-v="week"]{--tbc:var(--violet)} .tabs button[data-v="dag"]{--tbc:var(--accent)} .tabs button[data-v="afsluiting"]{--tbc:var(--green)} .tabs button[data-v="log"]{--tbc:var(--amber)}
.tabs button:hover{color:var(--ink2)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--tbc)}
.tabs button.on::before{opacity:1}

/* basics */
.c-accent{--kc:var(--accent)} .c-green{--kc:var(--green)} .c-red{--kc:var(--red)} .c-amber{--kc:var(--amber)} .c-teal{--kc:var(--teal)} .c-violet{--kc:var(--violet)} .c-pink{--kc:var(--pink)}
.kd{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--kc);margin-right:7px;vertical-align:1px;flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh)}
.pad{padding:14px}
h1{font-family:var(--fd);font-size:var(--t4);font-weight:800;letter-spacing:-.01em}
h2{font-family:var(--fd);font-size:var(--t3);font-weight:700}
h3{font-size:var(--t1);font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack>*+*{margin-top:12px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:18px 0 14px}
.pagehead p{color:var(--muted);font-size:var(--t2);margin-top:2px}
.pagehead .kopr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.moriset{font-size:var(--t1);color:var(--muted)}
.moriset:hover{color:var(--accent)}
/* Mori side panel: the journal's own Mori in an iframe (?embed=mori). Desktop: 420 px on the right, the page makes room;
   phone: full screen from the bottom. It stays in the DOM when closed, so the conversation lasts until you leave. */
.moripanel{position:fixed;top:0;right:0;bottom:0;width:420px;z-index:40;display:flex;flex-direction:column;background:var(--bg);border-left:1px solid var(--line);box-shadow:var(--shl)}
.moripanel[hidden]{display:none}
.mph{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.mph b{font-family:var(--fd);font-size:var(--t3)}
.mph .ibtn{margin-left:auto}
.moripanel iframe{flex:1;min-height:0;width:100%;border:0;background:var(--bg)}
body.mori-open{padding-right:420px}
body.mori-open .rdetail{grid-template-columns:minmax(0,1fr)}   /* 420 px less: the open scenario reads as on a narrow screen */
@media(max-width:900px){body.mori-open{padding-right:0;overflow:hidden}.moripanel{width:100%;left:0;border-left:0;animation:moriOp .2s ease-out}}
@keyframes moriOp{from{transform:translateY(100%)}to{transform:none}}
@media(prefers-reduced-motion:reduce){.moripanel{animation:none}}
.btn{padding:7px 12px;border-radius:9px;font-weight:600;font-size:var(--t2);border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none;color:var(--accent)}
.btn.sm{padding:4px 9px;font-size:var(--t1);border-radius:8px}
.btn.danger{color:var(--red)}
.inp{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--raise);outline:none}
.inp:focus{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{resize:vertical;min-height:64px}
label.f{display:block;font-size:var(--t1);font-weight:600;color:var(--muted);margin-bottom:4px}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:var(--t2)}
.empty b{display:block;color:var(--ink2);margin-bottom:3px;font-size:var(--t2)}
.empty .row{justify-content:center;margin-top:12px}
.enote{font-size:var(--t1);color:var(--muted);margin-top:6px}
.enote b{color:var(--ink2);font-weight:600}
.callout{border-radius:10px;padding:10px 12px;font-size:var(--t2);background:var(--accent-soft);color:var(--ink2);border:1px solid var(--accent-line)}
.callout.warn{background:var(--amber-soft);border-color:var(--amber)}
.callout.ok{background:var(--green-soft);border-color:var(--green)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid .full{grid-column:1/-1}

/* gevoel (emoties) + dagstart */
.emos{display:flex;flex-wrap:wrap;gap:5px}
.chip.emo{--tc:var(--green)} .chip.emo.neg{--tc:var(--red)}
.chip.emo.pick{color:var(--tc);border-color:color-mix(in srgb,var(--tc) 35%,transparent);background:transparent}
.chip.emo.pick::before{display:none}
.chip.emo.pick.on{background:var(--tc);border-color:var(--tc);color:var(--surface)}
.emoregels{margin-top:7px;display:flex;flex-direction:column;gap:2px}
.emoregel{font-size:var(--t1);color:var(--ink2)}
.emoregel.weinig{color:var(--faint)}
.gvrij{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:var(--t2)}
.gvrij+.gvrij{border-top:1px dashed var(--line2)}
.gvrij .gvtxt{min-width:0;flex:1}
.gvrij.weinig .gvtxt{color:var(--faint)}
.gvrij .rel{flex:none}
.box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--faint);display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:var(--t1);color:var(--on-accent);font-weight:800}
.pf{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 7px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:var(--t2);font-weight:600;color:var(--ink2)}
.pf .box{width:16px;height:16px;border-radius:50%}
.pf.on{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.pf.on .box{background:var(--green);border-color:var(--green)}
.dslijst{display:flex;flex-direction:column;gap:5px}
.dsrij{display:flex;gap:6px;align-items:center}
.dsrij .inp{padding:5px 9px;font-size:var(--t2);min-width:0}
.dsrij .btn{flex:none}
.fstep .fbew{margin:-4px -6px 0 0}

/* chips: de pill van de journal (.tagchip.col): 12% van de kleur, rand 30%, stip vooraan. --tc per tag-soort zoals
   TAG_CATS/tagKleur in work/syncjournal.html. Eigen = vol; geërfd = gedimd met stippelrand; uitgezet = grijs, doorgestreept. */
.chip{--tc:var(--muted);display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:var(--t1);font-weight:600;line-height:1.35;
  color:var(--tc);background:color-mix(in srgb,var(--tc) 12%,transparent);border:1px solid color-mix(in srgb,var(--tc) 30%,transparent);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--tc);flex:none}
.chip.set{--tc:var(--accent)} .chip.conf{--tc:var(--teal)} .chip.tf{--tc:var(--violet)} .chip.eigen{--tc:var(--muted)}
.chip.inh{background:transparent;border-style:dashed;border-color:color-mix(in srgb,var(--tc) 55%,transparent);opacity:.72}
.chip.inh::before{display:none}
button.chip.inh{cursor:pointer}
button.chip.inh:hover{opacity:1}
.chip.inh.off{--tc:var(--faint);text-decoration:line-through;opacity:.55;border-color:var(--line)}
.chip.pick{cursor:pointer;background:var(--surface);color:var(--ink2);border-color:var(--line)}
.chip.pick:hover{border-color:color-mix(in srgb,var(--tc) 45%,transparent)}
.chip.pick.on{color:var(--tc);background:color-mix(in srgb,var(--tc) 12%,transparent);border-color:color-mix(in srgb,var(--tc) 30%,transparent)}
.chip.st-open{--tc:var(--accent)} .chip.st-genomen{--tc:var(--green)} .chip.st-gemist{--tc:var(--amber)} .chip.st-niet{--tc:var(--muted)} .chip.st-ongeldig{--tc:var(--red)}
.chip.d-long{--tc:var(--green)} .chip.d-short{--tc:var(--red)}
.bias{font-size:var(--t1);font-weight:700;padding:2px 7px;border-radius:6px}
.bias.Bullish{color:var(--green);background:var(--green-soft)}
.bias.Bearish{color:var(--red);background:var(--red-soft)}
.bias.Neutraal{color:var(--ink2);background:var(--track)}
/* bias-knoppen: omlijnd in hun kleur, gekozen = gevuld */
.bsel{display:inline-flex;gap:3px}
.bsel button{--bc:var(--muted);font-size:var(--t1);font-weight:700;padding:3px 8px;border-radius:999px;color:var(--bc);border:1px solid color-mix(in srgb,var(--bc) 35%,transparent);background:transparent}
.bsel button:hover{background:color-mix(in srgb,var(--bc) 10%,transparent)}
.bsel button.Bullish{--bc:var(--green)} .bsel button.Bearish{--bc:var(--red)} .bsel button.Neutraal{--bc:var(--muted)}
.bsel button.on{background:var(--bc);border-color:var(--bc);color:var(--surface)}
.bsel button.erf{border-style:dashed;border-color:color-mix(in srgb,var(--bc) 70%,transparent);background:color-mix(in srgb,var(--bc) 10%,transparent)}
/* lagen als kaartjes (ronde 3 punt 6): per tijdframe één regel tijdframe · bias · tags; tikken = bewerken.
   Zelfde opbouw als .laag/revLaag in de journal (tijdframe links, bias en tags erachter). */
.lagen{display:flex;flex-direction:column;gap:6px}
.lrij{display:flex;align-items:center;gap:6px;width:100%;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:9px;background:var(--sink);text-align:left;overflow:hidden}
button.lrij:hover{border-color:var(--accent-line);background:var(--hover)}
.lrij .tf{flex:none;font-size:var(--t1);font-weight:700;color:var(--violet);background:var(--violet-soft);border:1px solid color-mix(in srgb,var(--violet) 30%,transparent);border-radius:6px;padding:1px 7px;font-variant-numeric:tabular-nums}
.lrij .bias{flex:none;border:1px solid transparent;opacity:1}
.bias.erf{background:transparent;border:1px dashed currentColor;opacity:.72}
.bias.leeg{color:var(--faint);background:var(--track);font-weight:600}
.lchips{display:flex;gap:4px;align-items:center;min-width:0;flex:0 1 auto;overflow:hidden}
.lchips .chip{flex:none}
.chip.meer{--tc:var(--muted);flex:none}
.lrij [hidden]{display:none}
.chip.meer::before{display:none}
.weekregel{display:block;width:100%;text-align:left;font-size:var(--t1);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 0 6px}
.weekregel b{font-weight:700;color:var(--ink2)}
.weekregel:hover{color:var(--accent)}
.linkbtn{font-size:var(--t1);font-weight:600;color:var(--accent);padding:2px 0;margin-top:6px}
.linkbtn:hover{text-decoration:underline}
.ibt{font-size:var(--t2);line-height:1;color:var(--faint);padding:0 3px;text-transform:none;letter-spacing:0;vertical-align:-1px}
.ibt:hover,.ibt[aria-expanded="true"]{color:var(--accent)}
.infotxt{background:var(--sink);border-radius:8px;padding:7px 9px;margin-bottom:7px;display:flex;flex-direction:column;gap:4px}
.infotxt .inhnote{margin:0}
.entrymark{flex:none;font-size:var(--t1);font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--violet)}
.lrm{color:var(--faint);font-weight:700;font-size:var(--t3);padding:1px 4px;line-height:1.2}
.lrm:hover{color:var(--red)}
.inhnote{font-size:var(--t1);color:var(--faint)}
.tfpick{margin-top:8px;padding:10px;border:1px dashed var(--line);border-radius:10px;background:var(--sink)}

/* cockpit: links de trechter, rechts de scenario's */
.cockpit{display:grid;grid-template-columns:340px minmax(0,1fr);gap:14px;align-items:start}
.funnel{position:sticky;top:96px;min-width:0}
.fstep{position:relative;padding:10px 12px 10px 26px}
.fstep::before{content:"";position:absolute;left:11px;top:16px;bottom:-10px;width:2px;background:var(--line)}
.fstep:last-child::before{display:none}
.fstep::after{content:"";position:absolute;left:7px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--kc,var(--accent));border:2px solid var(--kc,var(--accent));box-shadow:0 0 0 3px color-mix(in srgb,var(--kc,var(--accent)) 18%,transparent)}
.fstep h3{margin-bottom:4px}
.rlist{display:flex;flex-direction:column;gap:8px}
.lvls{white-space:pre-line;font-size:var(--t2);margin-bottom:6px;}
.ritem{--sc:var(--accent);overflow:hidden;border-left:4px solid var(--sc)}
.ritem.s-genomen{--sc:var(--green)} .ritem.s-gemist{--sc:var(--amber)} .ritem.s-niet{--sc:var(--muted)} .ritem.s-ongeldig{--sc:var(--red)}
.ritem.dim .rrow{opacity:.55}
.ritem.ready{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.rrow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 12px;cursor:pointer}
.rrow:hover{background:var(--hover)}
.rnum{font-family:var(--fd);font-weight:800;font-size:var(--t4);color:var(--faint);text-align:center}
.rnum.one{color:var(--green)}
.ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.meta{gap:6px;font-size:var(--t1);color:var(--muted);margin:3px 0}
.rline{font-size:var(--t1);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rline.weinig,.rline.weinig .pos,.rline.weinig .neg{color:var(--faint)}
.rdetail{border-top:1px solid var(--line2);padding:12px 14px 14px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.tag-sterk{font-size:var(--t1);font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--green);background:var(--green-soft);padding:2px 7px;border-radius:6px;flex:none}
.rel{font-size:var(--t1);font-weight:600;padding:1px 7px;border-radius:6px;white-space:nowrap}
.rel.weinig{color:var(--amber);background:var(--amber-soft)} .rel.redelijk{color:var(--accent);background:var(--accent-soft)} .rel.genoeg{color:var(--green);background:var(--green-soft)}
.dots{letter-spacing:1px;font-size:var(--t1);white-space:nowrap}
.dots .w{color:var(--green)} .dots .l{color:var(--red)} .dots .b{color:var(--faint)}
.pos{color:var(--green)} .neg{color:var(--red)}
.dir{font-size:var(--t1);font-weight:700;padding:2px 7px;border-radius:6px;text-transform:uppercase;letter-spacing:.03em}
.dir.long{color:var(--green);background:var(--green-soft)} .dir.short{color:var(--red);background:var(--red-soft)}
.grade{font-family:var(--fd);font-weight:800;font-size:var(--t1);width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;background:var(--track);color:var(--ink);flex:none}
.grade.A{background:var(--green-soft);color:var(--green)} .grade.B{background:var(--accent-soft);color:var(--accent)} .grade.C{background:var(--amber-soft);color:var(--amber)}
.st{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}

<script>
'use strict';
/* TradingPlan v3 (docs/plan-v3-ontwerp-2026-10-27.md, besluiten 13–22 gaan voor).
   Eén los bestand op dezelfde origin als de journal. Leest de journal-opslag (IndexedDB sj_db/kv:
   trades, pbook; localStorage sj_tagconfig, sj_state) en schrijft alleen eigen sleutels tp3:*.
   tp2:* (plan v2) wordt niet gelezen en niet gewist. */

// ───────────────────────── opslag ─────────────────────────
const LS={plans:'tp3:plans',cfg:'tp3:cfg',handoff:'tp3:handoff',mori:'tp3:mori'};
const SJ={state:'sj_state',tags:'sj_tagconfig'};
// Stijl bepaalt alleen de lagen waarmee een nieuwe week en dag starten (besluit 14).
const STIJLEN={
  swing:   {label:'Swing',    week:['Weekly','Daily'],dag:['4H','1H'], entry:'1H'},
  daytrade:{label:'Daytrade', week:['Weekly','Daily'],dag:['4H','1H'], entry:'15M'},
  scalp:   {label:'Scalp',    week:['Daily','4H'],    dag:['1H','15M'],entry:'5M'},
};
const CFG_STD={stijl:'daytrade',risk:{A:1,B:0.5,C:0},pre:['Nieuws gecheckt','Goed geslapen','Limieten in orde']};
const DAGSTART_MAX=8;   // hooguit 8 dagstart-punten (ronde 3 punt 3; was 3 pre-flight-vinkjes)
// Een lijst dagstart-punten: teksten, zonder lege of dubbele, hooguit 8.
function normPre(a){const out=[];(Array.isArray(a)?a:[]).forEach(x=>{const t=str(x).trim().replace(/\s+/g,' ');if(t&&!out.includes(t)&&out.length<DAGSTART_MAX)out.push(t);});return out;}

function lsGet(k,fb){try{const v=JSON.parse(localStorage.getItem(k)||'null');return v==null?fb:v;}catch(e){return fb;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){toast('Opslaan lukte niet: je browseropslag is vol of geblokkeerd.');return false;}}
const isObj=o=>!!o&&typeof o==='object'&&!Array.isArray(o);
// Opslag kan half kapot zijn (handmatig bewerkt, oude back-up): elk veld krijgt zijn vorm, onbruikbare items vallen weg.
const arr=(v,f)=>Array.isArray(v)?v.filter(f||(()=>true)):[];
const str=v=>typeof v==='string'?v:v==null?'':String(v);
const normLaag=L=>({tf:str(L.tf),bias:['Bullish','Bearish','Neutraal'].includes(L.bias)?L.bias:'',setups:arr(L.setups,x=>typeof x==='string'),confirmations:arr(L.confirmations,x=>typeof x==='string')});
const normMedia=m=>({imgs:arr(isObj(m)?m.imgs:null,x=>typeof x==='string'),links:arr(isObj(m)?m.links:null,x=>typeof x==='string')});
const STATUSSEN=['open','genomen','gemist','niet','ongeldig'];
function normScen(s){return Object.assign({},s,{id:str(s.id),title:str(s.title),pair:str(s.pair),dir:s.dir==='short'?'short':'long',pb:str(s.pb),grade:['A','B','C'].includes(s.grade)?s.grade:'B',
  trigger:str(s.trigger),invalid:str(s.invalid),entry:normLaag(isObj(s.entry)?s.entry:{}),off:arr(s.off,x=>typeof x==='string'),checked:arr(s.checked,x=>typeof x==='string'),critChecked:arr(s.critChecked,x=>typeof x==='string'),
  stop:str(s.stop),tps:arr(s.tps).map(str),media:normMedia(s.media),note:str(s.note),status:STATUSSEN.includes(s.status)?s.status:'open',statusTs:+s.statusTs>0?+s.statusTs:null,
  trades:arr(s.trades,x=>typeof x==='number'||typeof x==='string')});}
const DAG_ID=/^\d{4}-\d{2}-\d{2}$/,WEEK_ID=/^\d{4}-W\d{2}$/;
function load(){const P=lsGet(LS.plans,null),out={v:1,weeks:{},days:{}};if(!isObj(P))return out;
  // Oude dagen (pre-flight) hebben pre: [bool,bool,bool] op de index van de toenmalige cfg.pre: omzetten naar teksten.
  const oc=lsGet(LS.cfg,{}),oudPre=isObj(oc)&&Array.isArray(oc.pre)?oc.pre.map(x=>str(x).trim()):CFG_STD.pre;
  const dagstart=d=>Array.isArray(d.dagstart)?d.dagstart.filter(x=>typeof x==='string'):Array.isArray(d.pre)?oudPre.filter((t,i)=>t&&d.pre[i]===true):[];
  Object.entries(isObj(P.weeks)?P.weeks:{}).forEach(([k,w])=>{if(!WEEK_ID.test(k)||!isObj(w))return;
    out.weeks[k]=Object.assign({},w,{id:k,layers:arr(w.layers,isObj).map(normLaag),levels:str(w.levels),noTrade:str(w.noTrade),focus:str(w.focus),media:normMedia(w.media),les:str(w.les)});});
  Object.entries(isObj(P.days)?P.days:{}).forEach(([k,d])=>{if(!DAG_ID.test(k)||!isObj(d))return;
    out.days[k]=Object.assign({},d,{id:k,week:WEEK_ID.test(d.week)?d.week:isoWeek(k),layers:arr(d.layers,isObj).map(normLaag),levels:str(d.levels),mental:[1,2,3,4,5].includes(d.mental)?d.mental:null,
      dagstart:dagstart(d),emoties:arr(d.emoties,x=>typeof x==='string'),off:arr(d.off,x=>typeof x==='string'),media:normMedia(d.media),les:str(d.les),scenarios:arr(d.scenarios,s=>isObj(s)&&s.id).map(normScen)});});
  Object.values(out.days).forEach(d=>{delete d.pre;snoeiDag(d,out.weeks[d.week]);});
  return out;}
// save(p) zet een heel plan (alleen __tp3 in de specs): daarna normaal ingelezen, zodat PL nooit een scenario zonder
// critChecked e.d. heeft (dat gaf af en toe een fout in snoeiCriteria als de journal net klaar was met laden).
function save(p){if(p){if(!lsSet(LS.plans,p))return false;PL=load();return true;}return lsSet(LS.plans,PL);}
function cfg(){const c=lsGet(LS.cfg,{}),o=isObj(c)?c:{};
  const risk=Object.assign({},CFG_STD.risk,isObj(o.risk)?o.risk:{});['A','B','C'].forEach(g=>{risk[g]=Math.max(0,+risk[g]||0);});
  const pre=Array.isArray(o.pre)?normPre(o.pre):[...CFG_STD.pre];
  return {stijl:STIJLEN[o.stijl]?o.stijl:CFG_STD.stijl,risk,pre};}
function stijlLagen(stijl){const s=STIJLEN[stijl]||STIJLEN[CFG_STD.stijl];return {week:[...s.week],dag:[...s.dag],entry:s.entry};}

// ───────────────────────── datums (Amsterdam) ─────────────────────────
const AMS=new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Amsterdam',year:'numeric',month:'2-digit',day:'2-digit'});
const amsDag=ms=>AMS.format(new Date(+ms));
const vandaag=()=>amsDag(Date.now());
// ISO-week, gekopieerd uit coachIsoWeek in work/syncjournal.html
function isoWeek(iso){const [y,m,d]=String(iso).split('-').map(Number);const t=new Date(Date.UTC(y,m-1,d)),day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);
  const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return t.getUTCFullYear()+'-W'+String(Math.ceil(((t-y0)/864e5+1)/7)).padStart(2,'0');}
// maandag en zondag van een ISO-week-id
function weekBereik(wid){const [y,w]=wid.split('-W').map(Number),j4=new Date(Date.UTC(y,0,4)),ma=new Date(j4);ma.setUTCDate(j4.getUTCDate()-((j4.getUTCDay()||7)-1)+(w-1)*7);

const DAGEN=['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
const MAANDEN=['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
const dUTC=iso=>new Date(iso+'T12:00:00Z');

};
function tags(){const t=lsGet(SJ.tags,null),o=isObj(t)?t:JSON.parse(JSON.stringify(TAGS_STD));
  ['setupTags','confirmationTags','timeframeTags','emotionTags'].forEach(k=>{if(!Array.isArray(o[k]))o[k]=[...TAGS_STD[k]];});
  if(!Array.isArray(o.emotionNeg))o.emotionNeg=[...EMO_NEG_STD];return o;}
// Welke emoties negatief (rood) zijn: tagConfig.emotionNeg, startwaarde EMO_NEG_START uit work/syncjournal.html.

// Timeframe → minuten, gekopieerd uit tfMinuten in work/syncjournal.html ('M' = minuten). Onleesbaar = Infinity.
function tfMinuten(tf){const s=String(tf||'').trim().toLowerCase();if(!s)return null;
  const woord={weekly:10080,week:10080,daily:1440,day:1440,monthly:43200,month:43200}[s];if(woord)return woord;
  const m=s.match(/^(\d+)\s*(m|min|h|d|w)$/);if(!m)return Infinity;
  return +m[1]*{m:1,min:1,h:60,d:1440,w:10080}[m[2]];}
const topDown=(a,b)=>tfMinuten(b)-tfMinuten(a);   // hoogste tijdframe eerst, zoals sorteerLagen in de journal
const sorteerLagen=L=>[...L].sort((a,b)=>topDown(a.tf,b.tf));
// "1m" → "1M", "4h" → "4H", "daily" → "Daily": dezelfde schrijfwijze als de journal-tags
function tfNorm(tf){const s=String(tf||'').trim().replace(/\s+/g,'');const w={weekly:'Weekly',daily:'Daily',monthly:'Monthly'}[s.toLowerCase()];return w||s.toUpperCase();}
// Tags en tijdframes beheer je alleen in de journal (Instellingen → Tags, ronde 3 punt 1): het plan leest sj_tagconfig

const naarTags=(wat)=>`<div class="faint small geentags">${esc(wat)} Voeg ze toe in de journal: <a href="${esc(LINK_TAGS())}">Instellingen → Tags</a></div>`;
const tagSoort=g=>tags().setupTags.includes(g)?'set':'conf';
// Kleur per tag-soort, zoals TAG_CATS/tagKleur in work/syncjournal.html (eigen labels en onbekende tags: muted).
const TAG_KLASSE={set:'var(--accent)',conf:'var(--teal)',tf:'var(--violet)',eigen:'var(--muted)'};
function tagKlasse(g){const t=tags();return t.setupTags.includes(g)?'set':t.confirmationTags.includes(g)?'conf':t.timeframeTags.includes(g)?'tf':'eigen';}

// Trades en playbooks staan in IndexedDB sj_db/kv (zoals IDB in de journal). Versie 1 en de store 'kv'
// aanmaken zoals de journal: open je hem zonder versie, dan krijgt een nieuw lid een lege database zonder store.
const JR={trades:[],pbook:{},klaar:false};
function sjDbLees(keys){return new Promise(res=>{let r;try{r=indexedDB.open('sj_db',1);}catch(e){return res({});}
  r.onupgradeneeded=()=>r.result.createObjectStore('kv');
  r.onerror=()=>res({});
  r.onsuccess=()=>{const db=r.result,out={};try{const tx=db.transaction('kv','readonly'),st=tx.objectStore('kv');
    keys.forEach(k=>{const q=st.get(k);q.onsuccess=()=>{out[k]=q.result;};});tx.oncomplete=()=>{db.close();res(out);};tx.onerror=()=>{db.close();res(out);};}catch(e){db.close();res(out);}};});}
async function laadJournal(){const o=await sjDbLees(['trades','pbook']);
  JR.trades=(Array.isArray(o.trades)?o.trades:[]).filter(isObj).map(t=>Object.assign({},t,{pnl:+t.pnl||0}));
  JR.pbook=isObj(o.pbook)?o.pbook:{};JR.klaar=true;if(snoeiCriteria())save();render();}
// Playbook-criteria uit de journal (sj_db → kv → pbook). Oud formaat (een lijst met teksten) zoals pbNormalize in de journal.
function pbInfo(naam){const v=naam&&JR.pbook[naam];if(!v)return null;
  const crit=(Array.isArray(v)?v.map(t=>({text:t,mandatory:false})):arr(v.criteria,isObj)).map(c=>({text:str(c.text).trim(),mandatory:!!c.mandatory})).filter(c=>c.text);
  const anti=(Array.isArray(v)?[]:arr(v.antiCriteria,isObj)).map(c=>str(c.text).trim()).filter(Boolean);
  const o=Array.isArray(v)?{}:v;return {criteria:crit,anti,stop:str(o.stop).trim(),target:str(o.target).trim(),minRR:str(o.minRR).trim()};}
// Verandert het playbook in de journal, dan vallen vinkjes van criteria die niet meer bestaan weg (polish punt 6).
function snoeiCriteria(){let weg=false;alleScenarios().forEach(({s})=>{const p=pbInfo(s.pb);if(!p)return;const t=new Set(p.criteria.map(c=>c.text)),n=s.critChecked.filter(x=>t.has(x));
  if(n.length!==s.critChecked.length){s.critChecked=n;weg=true;}});return weg;}

// ───────────────────────── R en statistiek (gekopieerd uit work/syncjournal.html) ─────────────────────────
// R alleen van trades mét stop: tradeROrNull geeft null bij onbekend, 0 is break-even (CLAUDE.md).
const R_SANE_MAX=100, PF_ONEINDIG=99;
function isLive(t){return !t.kind||t.kind==='live';}
function rNetto(t){const entry=+t.entry,stop=+t.stop,size=+t.size,pnl=t.pnlUsd!=null?+t.pnlUsd:+t.pnl;
  if(!(entry>0)||!(stop>0)||!(size>0)||!isFinite(pnl)||Math.abs(entry-stop)<entry*1e-4)return null;
  const risk=Math.abs(entry-stop)/entry*size;return risk>0?pnl/risk:null;}
function theoR(t){const entry=+t.entry,stop=+t.stop;if(!(entry>0)||!(stop>0)||stop===entry)return null;
  const dir=t.dir==='short'?-1:1;let exit=+t.hindsightExit||+t.exit||0;
  if(!exit&&Array.isArray(t.tps)&&t.tps.length){exit=+((t.tps[t.tps.length-1]||{}).price)||0;}
  if(!exit)exit=+t.tp||0; if(!exit)return null;
  return +(((exit-entry)*dir)/Math.abs(entry-stop)).toFixed(2);}
function tradeROrNull(t){
  if(t&&isLive(t)&&(t.status==='closed'||t._geboekt)){const n=rNetto(t);if(n!=null&&Math.abs(n)<=R_SANE_MAX)return n;}
  const r=+t.r;if(r&&Math.abs(r)<=R_SANE_MAX)return r;const th=theoR(t);return (th==null||!isFinite(th)||Math.abs(th)>R_SANE_MAX)?null:th;}
function aggR(rows){let sum=0,n=0;(rows||[]).forEach(t=>{const r=tradeROrNull(t);if(r!=null){sum+=r;n++;}});return {sum,n};}
const rS=v=>{const a=Math.abs(+v||0);return (v<0?'−':'+')+a.toFixed(a>0&&a<1?2:1).replace('.',',')+'R';};

// ───────────────────────── edge per scenario (blok A, besluiten 4, 14, 16, 17) ─────────────────────────
const MIN_N=5;                          // onder 5 trades valt eerst de richting weg, dan de minst specifieke tag
const REL_REDELIJK=10, REL_GENOEG=30;   // < 10 weinig · 10–29 redelijk · ≥ 30 genoeg
const BASIS_LIVE_MIN=10;                // basis = Live vanaf 10 Live-trades, anders Backtest; "sterkste" ook pas vanaf 10
const betrouwbaarheid=n=>n>=REL_GENOEG?'genoeg':n>=REL_REDELIJK?'redelijk':'weinig';
const isBacktest=t=>t.kind==='backtest'||t.kind==='paper';   // Paper telt bij Backtest
const telt=t=>t.kind==='gemist'||t.status==='closed';         // een open trade heeft nog geen uitkomst
const nieuwsteEerst=(a,b)=>(+b.openTime||0)-(+a.openTime||0)||String(b.date+b.time).localeCompare(String(a.date+a.time));
// Tijdframes waar minstens één journal-trade een laag mee heeft: alleen die tellen mee (besluit 14).
const _tfCache=new WeakMap();
function tradeTfs(trades){if(_tfCache.has(trades))return _tfCache.get(trades);const s=new Set();
  trades.forEach(t=>(t.layers||[]).forEach(L=>{if(L&&L.timeframe)s.add(tfNorm(L.timeframe));}));_tfCache.set(trades,s);return s;}
function stat(list){const n=list.length;
  if(!n)return {n:0,wr:null,gemR:null,expGeld:null,pf:null,laatste10:[],betr:betrouwbaarheid(0)};
  const pnl=t=>+t.pnl||0,w=list.filter(t=>pnl(t)>0),gW=w.reduce((s,t)=>s+pnl(t),0),gL=Math.abs(list.filter(t=>pnl(t)<0).reduce((s,t)=>s+pnl(t),0)),R=aggR(list);
  return {n,wr:w.length/n*100,gemR:R.n?R.sum/R.n:null,expGeld:list.reduce((s,t)=>s+pnl(t),0)/n,pf:gL?gW/gL:(gW>0?PF_ONEINDIG:0),
    laatste10:[...list].sort(nieuwsteEerst).slice(0,10).map(t=>pnl(t)>0?true:pnl(t)<0?false:null),betr:betrouwbaarheid(n)};}
// De week-lagen zoals ze op een dag gelden: wat de dag uitzet (Day.off, "<tf>|<tag>", ronde 3 punt 2) valt weg.
function weekVoorDag(week,day){const uit=new Set((day&&day.off)||[]),weg=L=>g=>!uit.has(L.tf+'|'+g);
  return ((week&&week.layers)||[]).map(L=>Object.assign({},L,{setups:(L.setups||[]).filter(weg(L)),confirmations:(L.confirmations||[]).filter(weg(L))}));}
// Eisen van een scenario: week → dag (min wat dit scenario uitzet) + de eigen entry-laag. Elke tag hoort bij zijn tijdframe.
function eisen(sc,day,week){const out=[],seen=new Set();
  const add=(L,erft)=>{if(!L)return;const tf=tfNorm(L.tf);[...(L.setups||[]).map(g=>[g,'set']),...(L.confirmations||[]).map(g=>[g,'conf'])].forEach(([tag,kind])=>{
    const key=L.tf+'|'+tag;if(erft&&(sc.off||[]).includes(key))return;if(seen.has(tf+'|'+tag))return;seen.add(tf+'|'+tag);out.push({tf,tag,kind,label:tf+' '+tag});});};
  weekVoorDag(week,day).forEach(L=>add(L,true));((day&&day.layers)||[]).forEach(L=>add(L,true));add(sc.entry,false);return out;}
const heeftTag=(t,r)=>(t.layers||[]).some(L=>L&&tfNorm(L.timeframe)===r.tf&&((L.setups||[]).includes(r.tag)||(L.confirmations||[]).includes(r.tag)));
// minst specifiek eerst: hoogste tijdframe; binnen een tijdframe eerst de confirmations, dan de setups (besluit 16)
const valVolgorde=(a,b)=>topDown(a.tf,b.tf)||(a.kind===b.kind?0:a.kind==='conf'?-1:1);
function edge(sc,day,week,trades){
  trades=trades||JR.trades;const tfs=tradeTfs(trades),alle=eisen(sc,day,week);
  const tfLijst=[...new Set(alle.map(r=>r.tf).concat([day,week].filter(Boolean).flatMap(x=>(x.layers||[]).map(L=>tfNorm(L.tf))),[tfNorm(sc.entry&&sc.entry.tf)]))].filter(Boolean).sort(topDown);
  const meetellend=tfLijst.filter(tf=>tfs.has(tf)),context=tfLijst.filter(tf=>!tfs.has(tf));
  let reqs=alle.filter(r=>tfs.has(r.tf)),richtingLos=false;
  const basis=sc.pb?trades.filter(t=>t.setup===sc.pb&&telt(t)):[];
  const match=()=>basis.filter(t=>(richtingLos||t.dir===sc.dir)&&reqs.every(r=>heeftTag(t,r)));
  const n=m=>m.filter(t=>t.kind!=='gemist').length;
  let m=match();if(n(m)<MIN_N){richtingLos=true;m=match();}
  const zonder=[],zonderTags=[],rij=[...reqs].sort(valVolgorde);
  while(n(m)<MIN_N&&rij.length){const d=rij.shift();reqs=reqs.filter(r=>r!==d);zonder.push(d.label);zonderTags.push({tf:d.tf,tag:d.tag});m=match();}
  const live=stat(m.filter(isLive)),bt=stat(m.filter(isBacktest)),gem=m.filter(t=>t.kind==='gemist');
  return {basis:live.n>=BASIS_LIVE_MIN?'live':'backtest',live,bt,gemist:{n:gem.length,somR:aggR(gem).sum},zonder,zonderTags,richtingLos,meetellend,context};
}
// Rangschik op gem. R van de basis (= expectancy in R, te vergelijken tussen Live en Backtest; besluit 17).
// "Sterkste": alleen de eerste, met ≥ 10 trades op de basis en een positieve gem. R.
function rangschik(scens,day,week,trades){
  day=day||dayOf(vandaag());week=week===undefined?weekOf(day&&day.week):week;
  const r=scens.map(s=>{const e=edge(s,day,week,trades),b=e.basis==='live'?e.live:e.bt;return {id:s.id,e,score:b.gemR,n:b.n};});
  r.sort((a,b)=>(b.score==null?-Infinity:b.score)-(a.score==null?-Infinity:a.score));
  return r.map((x,i)=>({id:x.id,plek:i+1,sterkste:i===0&&x.n>=BASIS_LIVE_MIN&&x.score!=null&&x.score>0,e:x.e}));
}

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl=(v,d=1)=>(+v).toFixed(d).replace('.',',');

// ───────────────────────── lagen (week, dag en scenario gebruiken dezelfde regel) ─────────────────────────
// pad: "week" / "day". Een laag die je kunt bewerken: "week.0", "day.1" of "draft.entry". Een scenario-regel zonder eigen
// laag: "scen:<id>@<tf>" (opgeslagen) of "draft@<tf>" (formulier); daar zet je alleen geërfde tags uit.
function lagenVan(pad){if(pad==='week')return (weekOf(isoWeek(vandaag()))||{}).layers;if(pad==='day')return (dayOf(vandaag())||{}).layers;return null;}
function laagRef(p){if(p==='draft.entry')return (draftOf()||{}).entry||null;if(p.includes('@'))return null;
  const [w,i]=p.split('.');return (lagenVan(w)||[])[+i]||null;}
function draftOf(){const M=S.modal;return M&&(M.draft&&M.type==='scen'?M.draft:M.back&&M.back.draft);}
function chipH(tag,o={}){const k=tagKlasse(tag);
  if(o.inh){const bron=o.bron==='dag'?'Uit je dagplan':'Uit je weekplan',waar=o.act==='dagOff'?'vandaag':'dit scenario';
    return `<button class="chip ${k} inh ${o.off?'off':''}" data-a="${o.act||'off'}" data-v="${esc(o.key)}"${o.sid?` data-s="${esc(o.sid)}"`:''} title="${bron} · ${o.off?'uitgezet voor '+waar+', tik om weer mee te tellen':'tik om voor '+waar+' uit te zetten'}">${esc(o.label||tag)}</button>`;}
  return `<span class="chip ${k}">${esc(tag)}</span>`;}
const BIASSEN=['Bullish','Bearish','Neutraal'];
// erf: de bias van de week op dit tijdframe; zolang de dag er zelf geen kiest, staat die knop gestippeld
function biasSeg(p,val,erf){return `<span class="bsel" role="group" aria-label="bias">${BIASSEN.map(b=>{const e=!val&&erf===b;
  return `<button class="${b} ${val===b?'on':''} ${e?'erf':''}" aria-pressed="${val===b}" data-a="bias" data-p="${p}" data-v="${b}"${e?' title="Uit je weekplan · tik om hem voor vandaag vast te zetten"':''}>${b==='Neutraal'?'Neutr.':b}</button>`;}).join('')}</span>`;}
const tagsVan=L=>[...L.setups,...L.confirmations];
// Geërfde tags op één tijdframe: [{g, key "<tf>|<tag>", bron, off}]. lagen = week (voor de dag) of week + dag (scenario).
const erfOp=(lagen,tf,uit)=>lagen.filter(L=>L.tf===tf).flatMap(L=>tagsVan(L).map(g=>({g,key:L.tf+'|'+g,bron:L.bron||'week',off:uit.includes(L.tf+'|'+g)})));
const erfBiasOp=(lagen,tf)=>lagen.filter(L=>L.tf===tf&&L.bias).pop()||null;
// Eén regel per laag (ronde 3 punt 6): tijdframe · bias · tags, nooit een tweede regel (kapRijen zet er "+N" van).
// o.bias: eigen bias · o.erfBias {bias,bron}: gestippeld · o.vraag: lege bias als "bias?" · o.erft: geërfde tags (erfOp) ·
// o.eigen: eigen tags · o.p: tikken opent het venster voor dit pad; zonder o.p alleen lezen.
function lRij(tf,o={}){const eb=!o.bias&&o.erfBias;
  const bias=o.bias?`<span class="bias ${esc(o.bias)}">${esc(o.bias)}</span>`:eb?`<span class="bias ${esc(eb.bias)} erf" title="${eb.bron==='dag'?'Uit je dagplan':'Uit je weekplan'}">${esc(eb.bias)}</span>`:o.vraag?'<span class="bias leeg">bias?</span>':'';
  const chips=[...(o.erft||[]).map(x=>`<span class="chip ${tagKlasse(x.g)} inh ${x.off?'off':''}" data-v="${esc(x.key)}" title="${x.bron==='dag'?'Uit je dagplan':'Uit je weekplan'}${x.off?' · uitgezet':''}">${esc(x.g)}</span>`),
    ...(o.eigen||[]).map(g=>chipH(g))].join('')||`<span class="faint small">${o.leeg||'geen tags'}</span>`;
  const binnen=`<span class="tf">${esc(tf)}</span>${o.entry?'<span class="entrymark">entry</span>':''}${bias}<span class="lchips">${chips}</span><span class="chip meer" hidden></span>`;
  return o.p?`<button class="lrij" data-tf="${esc(tf)}" data-a="picker" data-p="${esc(o.p)}" title="Laag ${esc(tf)} bewerken">${binnen}</button>`:`<div class="lrij" data-tf="${esc(tf)}">${binnen}</div>`;}
// Tags die niet op de regel passen: verbergen van achteren af en "+N" tonen. Na elke render en bij een andere breedte.
function kapRijen(){document.querySelectorAll('.lrij').forEach(r=>{const box=r.querySelector('.lchips'),meer=r.querySelector('.meer');if(!box||!meer)return;
  const chips=[...box.querySelectorAll('.chip')];chips.forEach(c=>{c.hidden=false;});meer.hidden=true;if(!box.clientWidth)return;
  let weg=0;while(box.scrollWidth>box.clientWidth+1&&weg<chips.length-1){chips[chips.length-1-weg].hidden=true;weg++;meer.hidden=false;meer.textContent='+'+weg;}});}
window.addEventListener('resize',()=>{clearTimeout(kapRijen.t);kapRijen.t=setTimeout(kapRijen,80);});
const ERF_UITLEG={dag:'Gestippeld = uit je weekplan. Tik op een laag om ze voor vandaag uit te zetten.',scen:'Gestippeld = uit je week- of dagplan. Tik op een laag om ze voor dit scenario uit te zetten.'};
const erfUitleg=w=>`<div class="inhnote erfuitleg">${ERF_UITLEG[w]}</div>`;
const tfsVan=(...lijsten)=>[...new Set(lijsten.flat().map(L=>L.tf))].sort(topDown);
const geenLagen='<div class="faint small" style="padding:4px 0">Nog geen lagen. Voeg een tijdframe toe.</div>';
// Week-scherm: de eigen lagen als regels.
function weekRegels(layers){return `<div class="lagen">${layers.map((L,i)=>lRij(L.tf,{bias:L.bias,vraag:1,eigen:tagsVan(L),p:'week.'+i})).join('')||geenLagen}</div>${tfKeuze('week',layers)}`;}
// Vandaag: alleen de dag-lagen als regels; week-tags op hetzelfde tijdframe gestippeld erin (uit te zetten voor vandaag).
// De week zelf staat erboven als één gedimde regel (weekRegel).
function dagRegels(d,w){const W=(w&&w.layers)||[];
  return `<div class="lagen">${d.layers.map((L,i)=>lRij(L.tf,{bias:L.bias,erfBias:erfBiasOp(W,L.tf),vraag:1,erft:erfOp(W,L.tf,d.off),eigen:tagsVan(L),p:'day.'+i})).join('')||geenLagen}</div>${tfKeuze('day',d.layers)}`;}
function weekRegel(w){if(!w)return '';const delen=w.layers.map(L=>L.tf+(L.bias?' '+L.bias:''));
  return `<button class="weekregel" data-a="tab" data-v="week" title="Naar je weekplan"><b>Week</b> · ${delen.length?delen.map(esc).join(' · '):'geen lagen'}</button>`;}
function tfKeuze(pad,layers){
  if(S.tfOpen!==pad)return `<button class="linkbtn" data-a="tfPicker" data-p="${pad}">+ Tijdframe</button>`;
  const bezet=new Set(layers.map(l=>l.tf)),vrij=tags().timeframeTags.filter(tf=>!bezet.has(tf)).sort(topDown);
  return `<div class="tfpick"><div class="row" style="gap:5px">${vrij.map(tf=>`<button class="chip pick tf" data-a="addTf" data-p="${pad}" data-v="${esc(tf)}">+ ${esc(tf)}</button>`).join('')}</div>${vrij.length?'':naarTags(tags().timeframeTags.length?'Alle tijdframes uit je journal zijn al een laag.':'Nog geen tijdframes.')}
    <div class="row" style="margin-top:8px"><button class="btn sm ghost" data-a="tfPicker" data-p="">Klaar</button></div></div>`;}
// geërfde tags op een scenario: week → dag, elke tag als "<tf>|<tag>", uit te zetten per scenario
function geerfd(day){return [...weekVoorDag(weekOf(day.week),day).map(L=>Object.assign({},L,{bron:'week'})),...day.layers.map(L=>Object.assign({},L,{bron:'dag'}))];}
// De lagen van een scenario: één regel per tijdframe (week + dag geërfd), de entry-laag in zijn eigen tijdframe-regel.
// edit: in het formulier (de entry-regel bewerkt de entry-laag); anders het opgeslagen scenario sc.
// In het opengeklapte scenario toont de entry-regel alleen de setups: de confirmations staan eronder als afvinklijst.
function scenRijen(sc,day,o={}){const G=geerfd(day),E=sc.entry,bron=o.edit?'draft':'scen:'+sc.id;
  return tfsVan(G,[E]).map(tf=>{const erft=erfOp(G,tf,sc.off),isE=tf===E.tf;
    if(!isE)return lRij(tf,{erft,erfBias:erfBiasOp(G,tf),p:bron+'@'+tf});
    return lRij(tf,{erft,entry:1,bias:E.bias,erfBias:erfBiasOp(G,tf),vraag:o.edit,eigen:o.edit?tagsVan(E):E.setups,p:o.edit?'draft.entry':bron+'@'+tf});}).join('');}
// Wat het venster "Tags · <tf>" bij een regel laat zien: de eigen laag (bias + tags), geërfde tags om uit te zetten
// (act dagOff = vandaag, off = dit scenario) en of de laag weg kan.
function laagInfo(p){
  const at=p.indexOf('@'),M=S.modal||{},dayVan=()=>dayOf(((M.back||M).day)||vandaag());
  if(at>0||p==='draft.entry'){const draft=p.startsWith('draft'),x=draft?null:scenOf(p.slice(5,at)),sc=x?x.s:draftOf(),day=x?x.day:dayVan();
    if(!sc||!day)return null;const tf=at>0?p.slice(at+1):sc.entry.tf;
    return {tf,L:p==='draft.entry'?sc.entry:null,erft:erfOp(geerfd(day),tf,sc.off),act:'off',sid:x?x.s.id:'',wie:'dit scenario',entry:!draft&&tf===sc.entry.tf?sc.entry:null};}
  const L=laagRef(p);if(!L)return null;
  if(p.startsWith('day.')){const d=dayOf(vandaag()),W=((weekOf(d.week)||{}).layers)||[];
    return {tf:L.tf,L,erft:erfOp(W,L.tf,d.off),erfBias:(erfBiasOp(W,L.tf)||{}).bias,act:'dagOff',wie:'vandaag',rm:'day'};}
  return {tf:L.tf,L,erft:[],rm:'week'};}
// Een lege dag-laag met een tijdframe dat de week al heeft, is een dubbele rij zonder inhoud: weg (polish punt 3).
// Behalve als de dag op dat tijdframe een week-tag uitzet: zonder de regel zou je dat niet meer zien.
function snoeiDag(d,w){if(!w)return d;const wt=new Set(w.layers.map(L=>L.tf)),uit=d.off||[];
  d.layers=d.layers.filter(L=>!(wt.has(L.tf)&&!L.bias&&!L.setups.length&&!L.confirmations.length&&!uit.some(k=>k.startsWith(L.tf+'|'))));return d;}
function toggleTag(L,g){const k=tagSoort(g)==='set'?'setups':'confirmations',i=L[k].indexOf(g);if(i>=0)L[k].splice(i,1);else L[k].push(g);}
function bewaarLaagPad(p){if(p.startsWith('draft'))return;save();}

// Plaatjes in IndexedDB tp3/img (sleutel = id, waarde = data:image/jpeg-URL); in het plan alleen de id's.
const MAX_MEDIA={dag:8,week:8,scen:4};   // per soort: zoveel afbeeldingen én zoveel links
const WAAR={dag:'per dag',week:'per week',scen:'per scenario'};
const IMG={};                            // id → data-URL, in het geheugen voor de weergave
let _tp3db=null;
const tp3Db=()=>_tp3db||(_tp3db=new Promise((res,rej)=>{const r=indexedDB.open('tp3',1);r.onupgradeneeded=()=>r.result.createObjectStore('img');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));
function imgReq(mode,fn){return tp3Db().then(db=>new Promise(res=>{let q;try{const tx=db.transaction('img',mode);q=fn(tx.objectStore('img'));
  tx.oncomplete=()=>res(q?q.result:true);tx.onerror=tx.onabort=()=>res(undefined);}catch(e){res(undefined);}})).catch(()=>undefined);}
const imgLees=id=>imgReq('readonly',st=>st.get(id));
const imgZet=(id,v)=>imgReq('readwrite',st=>{st.put(v,id);});
const imgWis=id=>{delete IMG[id];return imgReq('readwrite',st=>{st.delete(id);});};
async function laadBeelden(){const db=await tp3Db().catch(()=>null);if(!db)return;
  await new Promise(res=>{try{const tx=db.transaction('img','readonly'),c=tx.objectStore('img').openCursor();
    c.onsuccess=()=>{const cur=c.result;if(!cur)return;if(isBeeld(cur.value))IMG[cur.key]=cur.value;cur.continue();};tx.oncomplete=tx.onerror=res;}catch(e){res();}});
  render();}
const isBeeld=v=>typeof v==='string'&&/^data:image\/(png|jpe?g|gif|webp);base64,/.test(v);
// Verkleinen zoals compressImg in work/syncjournal.html: max 1400×1000, JPEG 0,82.
function compressImg(file,maxW=1400,maxH=1000,q=0.82){return new Promise((res,rej)=>{const rd=new FileReader();rd.onerror=()=>rej();rd.onload=e=>{const img=new Image();img.onerror=()=>rej();img.onload=()=>{let w=img.width,h=img.height;if(w>maxW||h>maxH){const r=Math.min(maxW/w,maxH/h);w=Math.round(w*r);h=Math.round(h*r);}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',q));};img.src=e.target.result;};rd.readAsDataURL(file);});}
// isHttpUrl en tvShort uit work/syncjournal.html
const isHttpUrl=u=>{try{const x=new URL(u);return x.protocol==='http:'||x.protocol==='https:';}catch(e){return false;}};
const tvShort=u=>{try{const x=new URL(u);const p=x.pathname.length>1?x.pathname:'';return x.hostname.replace(/^www\./,'')+p;}catch(e){return u;}};
// TradingView-snapshotlink (tradingview.com/x/<id>/) → het voorbeeldplaatje, anders null
function tvSnapshot(u){try{const x=new URL(u);if(!/(^|\.)tradingview\.com$/.test(x.hostname)||!/^https?:$/.test(x.protocol))return null;
  const m=x.pathname.match(/^\/x\/([A-Za-z0-9]+)\/?$/);return m?`https://s3.tradingview.com/snapshots/${m[1][0].toLowerCase()}/${m[1]}.png`:null;}catch(e){return null;}}
// doel = "dag:<dag-id>" · "week:<week-id>" · "scen:<scenario-id>"
function doelMedia(doel){const i=String(doel||'').indexOf(':'),soort=doel.slice(0,i),id=doel.slice(i+1);
  const o=soort==='dag'?dayOf(id):soort==='week'?weekOf(id):soort==='scen'?(scenOf(id)||{}).s:null;
  if(!o)return null;if(!isObj(o.media))o.media=leegMedia();return {m:o.media,soort};}
async function voegBeeldToe(file,doel){
  const x=doelMedia(doel);if(!x)return false;const max=MAX_MEDIA[x.soort];
  if(!file||!/^image\//.test(file.type||'')){toast('Alleen afbeeldingen (png, jpg, gif of webp).');return false;}
  if(x.m.imgs.length>=max){toast(`Hooguit ${max} afbeeldingen ${WAAR[x.soort]}.`);return false;}
  let url;try{url=await compressImg(file);}catch(e){toast('Kon de afbeelding niet lezen.');return false;}
  if(!isBeeld(url))return false;
  const y=doelMedia(doel);   // opnieuw: tijdens het verkleinen kan er al een plaatje bij gekomen zijn
  if(!y||y.m.imgs.length>=max){toast(`Hooguit ${max} afbeeldingen ${WAAR[x.soort]}.`);return false;}
  const id='i_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  if(await imgZet(id,url)===undefined){toast('Opslaan van de afbeelding lukte niet (browseropslag vol?).');return false;}
  IMG[id]=url;y.m.imgs.push(id);save();render();return id;}
function voegLinkToe(url,doel){
  const x=doelMedia(doel);if(!x)return false;const u=String(url||'').trim(),max=MAX_MEDIA[x.soort];
  if(!isHttpUrl(u)){toast('Alleen http(s)-links. "'+(u.length>40?u.slice(0,40)+'…':u)+'" is geweigerd.');return false;}
  if(x.m.links.includes(u)){toast('Die link staat er al.');return false;}
  if(x.m.links.length>=max){toast(`Hooguit ${max} links ${WAAR[x.soort]}.`);return false;}
  x.m.links.push(u);save();render();return u;}
const TV_KAPOT=new Set();   // voorbeeldplaatjes die niet laadden: die worden een gewone chip
function mediaBlok(m,o){
  const max=MAX_MEDIA[o.doel.split(':')[0]],d=esc(o.doel);
  const thumbs=m.imgs.map(id=>`<div class="thumb" data-i="${esc(id)}">${IMG[id]?`<img src="${esc(IMG[id])}" alt="afbeelding" data-a="lb" data-d="${d}" data-v="${esc(id)}">`:'<span class="faint small">…</span>'}<button class="x" data-a="rmBeeld" data-d="${d}" data-v="${esc(id)}" aria-label="afbeelding weghalen" title="weghalen">×</button></div>`).join('');

    return tv&&!TV_KAPOT.has(tv)?`<div class="tvprev"><a href="${esc(u)}" target="_blank" rel="noopener noreferrer" title="${esc(u)}"><img src="${esc(tv)}" alt="TradingView-chart" data-tv="${esc(tv)}" referrerpolicy="no-referrer"><span>📈 ${esc(tvShort(u))}</span></a>${rm}</div>`
      :`<span class="lchip"><a href="${esc(u)}" target="_blank" rel="noopener noreferrer" title="${esc(u)}">${tv?'📈 ':'🔗 '}${esc(tvShort(u))} ↗</a>${rm}</span>`;}).join('');
  return `<div class="media" data-doel="${d}">${thumbs||links?`<div class="thumbs">${thumbs}${links}</div>`:''}
    <div class="row" style="gap:6px;flex-wrap:nowrap"><label class="btn sm" style="flex:none">+ Afbeelding<input type="file" accept="image/*" multiple hidden data-doel="${d}"></label>
      <input class="inp linkinp" placeholder="https://… (TradingView)" aria-label="link toevoegen" style="padding:5px 8px;font-size:var(--t1);min-width:0"><button class="btn sm" data-a="linkToe" data-d="${d}" style="flex:none">+ Link</button></div>
    <div class="enote">${m.imgs.length}/${max} afbeeldingen · ${m.links.length}/${max} links${o.hint?' · plak (Ctrl/Cmd+V) of sleep hierheen':''}</div></div>`;}
// Waar een plak-actie heen gaat: het scenario dat openstaat, anders de dag; op het Week-scherm de week.
function plakDoel(){if(S.modal)return null;const id=vandaag();
  if(S.tab==='week'){const wid=isoWeek(id);return weekOf(wid)?'week:'+wid:null;}
  if(S.tab!=='dag'||!dayOf(id))return null;
  const sid=S.laatstOpen&&S.open[S.laatstOpen]&&dayOf(id).scenarios.some(s=>s.id===S.laatstOpen)?S.laatstOpen:null;
  return sid?'scen:'+sid:'dag:'+id;}
async function voegBestandenToe(files,doel){for(const f of files){if(await voegBeeldToe(f,doel)===false)break;}}
document.addEventListener('paste',ev=>{
  const cd=ev.clipboardData;if(!cd)return;const el=ev.target,inVeld=el&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.isContentEditable);
  const files=[...(cd.files||[])].filter(f=>f&&f.type);
  if(files.length){ev.preventDefault();const doel=plakDoel();if(!doel){toast(S.modal?'Sluit eerst dit venster, dan kun je plakken.':'Maak eerst een dag- of weekplan, dan kun je plakken.');return;}voegBestandenToe(files,doel);return;}
  if(inVeld)return;   // tekst in een tekstveld: gewoon plakken
  const txt=(cd.getData('text/plain')||'').trim();if(!txt)return;
  const doel=plakDoel();if(!doel)return;ev.preventDefault();voegLinkToe(txt,doel);});
document.addEventListener('change',ev=>{const el=ev.target;if(el&&el.type==='file'&&el.dataset.doel){voegBestandenToe([...el.files],el.dataset.doel);el.value='';}});
document.addEventListener('dragover',ev=>{const m=ev.target.closest&&ev.target.closest('.media');if(m){ev.preventDefault();m.classList.add('sleep');}});
document.addEventListener('dragleave',ev=>{const m=ev.target.closest&&ev.target.closest('.media');if(m)m.classList.remove('sleep');});
document.addEventListener('drop',ev=>{const m=ev.target.closest&&ev.target.closest('.media');if(!m)return;ev.preventDefault();m.classList.remove('sleep');
  const dt=ev.dataTransfer,files=[...((dt&&dt.files)||[])];
  if(files.length)voegBestandenToe(files,m.dataset.doel);else{const u=dt&&(dt.getData('text/uri-list')||dt.getData('text/plain'));if(u)voegLinkToe(u.split('\n')[0],m.dataset.doel);}});
document.addEventListener('error',ev=>{const t=ev.target;if(t&&t.tagName==='IMG'&&t.dataset&&t.dataset.tv&&!TV_KAPOT.has(t.dataset.tv)){TV_KAPOT.add(t.dataset.tv);render();}},true);

// Scenario.trades (journal-trade-id's) is de bron; de journal zet planRef op de trade als spiegel (planSync).
const AMS_TIJD=new Intl.DateTimeFormat('nl-NL',{timeZone:'Europe/Amsterdam',hour:'2-digit',minute:'2-digit',hour12:false});
const geldigMs=v=>{const n=+v;return n>0&&isFinite(new Date(n).getTime())?n:0;};   // een kapotte openTime valt terug op date/time
const tradeDag=t=>geldigMs(t.openTime)?amsDag(geldigMs(t.openTime)):String(t.date||'');
const tradeTijd=t=>geldigMs(t.openTime)?AMS_TIJD.format(new Date(geldigMs(t.openTime))):String(t.time||'');
function dagNa(iso){const d=dUTC(iso);d.setUTCDate(d.getUTCDate()+1);return d.toISOString().slice(0,10);}
// welke trade bij welk scenario hoort (een trade hoort bij hooguit één)
function bezetting(){const m=new Map();alleScenarios().forEach(({s})=>(s.trades||[]).forEach(id=>{if(!m.has(String(id)))m.set(String(id),s);}));return m;}
// Kandidaten: standaard hetzelfde pair en dezelfde richting, geopend op de dag van het scenario; nieuwste boven.
function kandidaten(s,day,o){const dagen=new Set([day.id]);if(o.erna)dagen.add(dagNa(day.id));
  return JR.trades.filter(t=>dagen.has(tradeDag(t))&&(o.alle||(pairBase(t.pair)===pairBase(s.pair)&&String(t.dir).toLowerCase()===s.dir))).sort(nieuwsteEerst);}
function tradeKort(t){const r=tradeROrNull(t);return `<span class="num">${esc(tradeTijd(t))}</span> <b>${esc(t.pair)}</b> <span class="dir ${t.dir==='short'?'short':'long'}">${esc(t.dir)}</span>${t.kind&&t.kind!=='live'?` <span class="faint small">${esc(t.kind)}</span>`:''} <span class="num">${t.status==='closed'||t.kind==='gemist'?rH(r)+' · '+geld(+t.pnl||0):'<span class="faint">loopt nog</span>'}</span>`;}
// Lagen zoals ze op de trade komen (week + dag + entry, zelfde tijdframe samen); zelfde regel als planLagen in de journal.
function zetOmLagen(s,day,week){const per=new Map(),uit=new Set(s.off||[]),uniq=a=>[...new Set(a)];
  const add=(L,erft,entry)=>{if(!L||!L.tf)return;const set=L.setups.filter(g=>!erft||!uit.has(L.tf+'|'+g)),conf=L.confirmations.filter(g=>(!erft||!uit.has(L.tf+'|'+g))&&(!entry||s.checked.includes(g)));
    if(erft&&!set.length&&!conf.length&&!L.bias)return;const k=L.tf.toLowerCase(),o=per.get(k)||{tf:L.tf,bias:'',setups:[],confirmations:[]};
    if(L.bias)o.bias=L.bias;o.setups=uniq([...o.setups,...set]);o.confirmations=uniq([...o.confirmations,...conf]);per.set(k,o);};
  weekVoorDag(week,day).forEach(L=>add(L,true,false));((day&&day.layers)||[]).forEach(L=>add(L,true,false));add(s.entry,false,true);
  return sorteerLagen([...per.values()]);}
// Rustig venster (polish punt 4): kop in één regel, twee tabs, filters als pills, trades als rijen die je aantikt.

  const later='<button class="btn ghost sm tlink" data-a="laterKoppelen">Nog niet binnen? Markeer als genomen</button>';
  if(M.weg==='hand'){const L=zetOmLagen(s,day,week),unch=s.entry.confirmations.filter(g=>!s.checked.includes(g));
    return {t:'Zet om in trade',kop,h:tabs+`<p class="mline">Handmatig, backtest of paper: de journal opent het tradeformulier met dit al ingevuld.</p>
      ${c.risk[s.grade]?'':`<div class="callout warn" style="margin-bottom:12px">Grade ${esc(s.grade)} staat in je instellingen op <b>niet traden</b>.</div>`}
      <dl class="kv"><dt>Playbook</dt><dd>${esc(s.pb)||'–'}</dd><dt>Risico</dt><dd>${c.risk[s.grade]?pctTxt(c.risk[s.grade])+' (grade '+s.grade+')':'grade '+s.grade+': niet traden'}</dd>
      <dt>Lagen</dt><dd>${L.map(l=>`<div class="row" style="gap:5px;margin-bottom:4px"><span class="chip tf">${esc(l.tf)}</span>${l.bias?`<span class="bias ${esc(l.bias)}">${esc(l.bias)}</span>`:''}${[...l.setups,...l.confirmations].map(g=>chipH(g)).join('')}</div>`).join('')||'–'}${unch.length?`<div class="faint small">Niet afgevinkt, gaat niet mee: ${unch.map(esc).join(', ')}</div>`:''}</dd>
      <dt>Stop</dt><dd class="num">${esc(s.stop)||'–'}</dd><dt>TP's</dt><dd class="num">${s.tps.map(esc).join(' · ')||'–'}</dd>
      <dt>Beeld</dt><dd>${s.media.imgs.length} afbeelding${s.media.imgs.length===1?'':'en'} · ${s.media.links.length} link${s.media.links.length===1?'':'s'}</dd></dl>`,
      f:`<span></span><button class="btn pri" data-a="naarFormulier">Open tradeformulier</button>`};}
  const bz=bezetting(),lijst=kandidaten(s,day,M);

const MENTAAL_LAAG=2;   // oude dagen: mentaal ≤ 2 → "overweeg alleen A-setups" (besluit 18)

const STATUS=[['open','Open'],['genomen','Genomen'],['gemist','Uitgekomen, niet genomen'],['niet','Niet uitgekomen'],['ongeldig','Ongeldig']];

    const bron=I.erft.some(x=>x.bron==='dag')?(I.erft.some(x=>x.bron==='week')?'Uit je week- en dagplan':'Uit je dagplan'):'Uit je weekplan';

    h=`<div class="fgrid">
      <div class="full"><label class="f" for="sc-title">Titel</label><input class="inp" id="sc-title" data-f="draft.title" value="${esc(d.title)}" placeholder="bv. BTC London sweep"></div>

      <div><label class="f">Grade</label><span class="seg" style="display:flex">${['A','B','C'].map(x=>`<button style="flex:1" class="${d.grade===x?'on':''}" data-a="dset" data-p="grade" data-v="${x}">${x}</button>`).join('')}</span></div>

      <div class="full"><label class="f" for="sc-inv">Ongeldig als</label><input class="inp" id="sc-inv" data-f="draft.invalid" value="${esc(d.invalid)}" placeholder="één regel"></div>
      <div class="full"><div class="row between" style="margin-bottom:2px"><label class="f" style="margin:0">Lagen</label>
        <label class="row small muted" for="sc-tf" style="gap:6px;flex-wrap:nowrap">Entry-tijdframe <select class="inp" id="sc-tf" style="width:auto;padding:4px 8px" data-f="draft.entry.tf">${tfs.map(x=>`<option ${d.entry.tf===x?'selected':''}>${esc(x)}</option>`).join('')}</select></label></div>${geerfd(day).some(L=>tagsVan(L).length)?erfUitleg('scen'):''}<div class="lagen" style="margin-top:4px">${scenRijen(d,day,{edit:1})}</div></div>
      <div><label class="f" for="sc-stop">Stop <span class="faint">(optioneel)</span></label><input class="inp num" id="sc-stop" data-f="draft.stop" value="${esc(d.stop)}"></div>
      <div><label class="f" for="sc-tps">TP's <span class="faint">(optioneel, spatie ertussen)</span></label><input class="inp num" id="sc-tps" data-f="draft.tpsTxt" value="${esc(d.tps.join(' '))}"></div>
      <div class="full"><label class="f" for="sc-note">Notitie</label><textarea class="inp" id="sc-note" data-f="draft.note">${esc(d.note)}</textarea></div>
      <div class="full card pad" style="background:var(--sink)">${(()=>{const e=edge(d,day,weekOf(day.week));return `<div class="row between"><h3>Edge van deze combinatie</h3>${d.pb&&JR.klaar?relH(e):''}</div><div class="rline" style="margin-top:6px;white-space:normal">${edgeLijn(e,d)}</div>${d.pb&&(e.live.n||e.bt.n)?edgeNoten(e):''}`;})()}</div>
    </div>`;
    f=`${M.isNew?'':'<button class="btn danger" style="margin-right:auto" data-a="delScen">Verwijder</button>'}<button class="btn" data-a="close">Annuleer</button><button class="btn pri" data-a="saveScen">Bewaar</button>`;
  }
  if(M.type==='lb'){const x=doelMedia(M.doel),n=x?x.m.imgs.length:0,i=x?x.m.imgs.indexOf(M.id)+1:0;
    return `<div class="ov" data-a="ovclose"><div class="lb" role="dialog" aria-modal="true" aria-label="afbeelding"><img src="${esc(IMG[M.id]||'')}" alt="afbeelding ${i} van ${n}">

  return `<div class="ov" data-a="ovclose"><div class="modal ${cls}" role="dialog" aria-modal="true" aria-label="${esc(t)}"><div class="mh">${kop||`<h2>${esc(t)}</h2>`}<button class="ibtn" data-a="close" aria-label="sluit">✕</button></div><div class="mb">${h}</div><div class="mf">${f}</div></div></div>`;

  afslDag:el=>{S.afslDag=el.dataset.v;S.afslEdit=null;},
  afslEdit:el=>{S.afslEdit=S.afslEdit===el.dataset.s?null:el.dataset.s;},
  logEdit:el=>{S.logEdit=S.logEdit===el.dataset.s?null:el.dataset.s;},
  logReset:()=>{S.logF={status:'',pb:'',dir:''};},
  logF:el=>{const k=el.dataset.p;S.logF[k]=S.logF[k]===el.dataset.v?'':el.dataset.v;},
  lbStap:el=>{const x=doelMedia(S.modal.doel);if(!x)return;const L=x.m.imgs,i=L.indexOf(S.modal.id);if(L.length)S.modal.id=L[(i+ +el.dataset.v+L.length)%L.length];},
  rmBeeld:el=>{const x=doelMedia(el.dataset.d),id=el.dataset.v;if(!x)return;x.m.imgs=x.m.imgs.filter(i=>i!==id);imgWis(id);save();if(S.modal&&S.modal.type==='lb')S.modal=null;},
  rmLink:el=>{const x=doelMedia(el.dataset.d);if(!x)return;x.m.links=x.m.links.filter(u=>u!==el.dataset.v);save();},
  linkToe:el=>{const inp=el.closest('.media').querySelector('.linkinp'),v=inp?inp.value:'';if(!v.trim())return false;if(voegLinkToe(v,el.dataset.d)===false)return false;},
  ctx:()=>{S.ctxOpen=!S.ctxOpen;},
  chk:el=>{const x=scenOf(el.dataset.s);if(!x)return;const c=x.s.checked,i=c.indexOf(el.dataset.v);if(i>=0)c.splice(i,1);else c.push(el.dataset.v);save();},
  crit:el=>{const x=scenOf(el.dataset.s);if(!x)return;const c=x.s.critChecked,i=c.indexOf(el.dataset.v);if(i>=0)c.splice(i,1);else c.push(el.dataset.v);snoeiCriteria();save();},
  status:el=>{const x=scenOf(el.dataset.s);if(!x)return;x.s.status=el.dataset.v;x.s.statusTs=el.dataset.v==='open'?null:Date.now();save();},
  overnemen:el=>{const id=vandaag(),van=dayOf(el.dataset.v);if(!van||PL.days[id])return;const d=nieuweDag(id),kopie=o=>JSON.parse(JSON.stringify(o));
    d.layers=kopie(van.layers);snoeiDag(d,weekOf(d.week));d.levels=van.levels;if(van.week===d.week)d.off=[...van.off];
    // Alleen de nog open scenario's, met een nieuw id en een lege afvinklijst. Afbeeldingen niet: die horen bij de
    // dag van gisteren (een gedeeld plaatje zou met het weghalen bij de één ook bij de ander verdwijnen); links wel.
    d.scenarios=van.scenarios.filter(s=>s.status==='open').map(s=>Object.assign(kopie(s),{id:nieuwId('s_',x=>!!scenOf(x)||d.scenarios.some(y=>y.id===x)),status:'open',statusTs:null,checked:[],trades:[],media:{imgs:[],links:[...(s.media&&s.media.links||[])]}}));
    PL.days[id]=d;save();toast('Overgenomen van '+datumKort(van.id)+': '+d.scenarios.length+' open scenario\'s');},
  dset:el=>{S.modal.draft[el.dataset.p]=el.dataset.v;},
  saveScen:()=>{const M=S.modal,d=M.draft,day=dayOf(M.day);if(!day)return;
    d.pair=pairBase(d.pair)||'BTC';if(!d.title.trim())d.title=(d.pb||'Scenario')+' '+d.pair;
    if(M.isNew)day.scenarios.push(d);else{const i=day.scenarios.findIndex(s=>s.id===d.id);if(i>=0)day.scenarios[i]=d;}
    S.modal=null;save();},
  delScen:()=>{const M=S.modal,day=dayOf(M.day);if(!day||!confirm('Scenario "'+titel(M.draft)+'" verwijderen?'))return false;
    const weg=day.scenarios.find(s=>s.id===M.draft.id);((weg&&weg.media&&weg.media.imgs)||[]).forEach(imgWis);
    day.scenarios=day.scenarios.filter(s=>s.id!==M.draft.id);S.modal=null;save();},
};
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-a]');if(!el)return;
  const fn=A[el.dataset.a];if(!fn)return;
  if(el.tagName==='A')ev.preventDefault();
  if(fn(el,ev)===false)return;
  render();
});
// Hernoemen in de trechter bij het verlaten van het veld (of Enter), niet bij elke toets.
document.addEventListener('change',ev=>{const el=ev.target;if(el&&el.dataset&&el.dataset.ds!=null){dsHernoem(+el.dataset.ds,el.value);render();}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&S.modal){A.close();render();}
  const t=ev.target;if(ev.key==='Enter'&&t&&(t.id==='ds-nieuw'||t.id==='set-ds-nieuw')){ev.preventDefault();const b=t.parentElement.querySelector('button');if(b)b.click();}
  if(ev.key==='Enter'&&t&&t.dataset&&t.dataset.ds!=null){ev.preventDefault();t.blur();}
});
// Een playbook kiezen vult de entry-laag en de grade uit het journal-playbook (laatste laag = entry).
function vulVanPlaybook(d){const p=JR.pbook[d.pb];if(!p)return;const L=(p.layers||[]).filter(isObj),e=L[L.length-1];
  if(e&&e.timeframe)d.entry={tf:tfNorm(e.timeframe),bias:d.dir==='short'&&e.bias==='Bullish'?'Bearish':(e.bias||''),setups:[...(e.setups||[])],confirmations:[...(e.confirmations||[])]};
  if(/^[ABC]$/.test(p.defaultGrade||''))d.grade=p.defaultGrade;d.checked=[];d.critChecked=[];}
// data-f="week.focus" / "draft.risk.A": schrijft zonder opnieuw te renderen (focus blijft staan)
document.addEventListener('input',ev=>{
  const el=ev.target,f=el.dataset&&el.dataset.f;if(!f)return;
  if(f==='draft.tpsTxt'){S.modal.draft.tps=el.value.split(/\s+/).filter(Boolean);return;}
  if(f.startsWith('les.')){const [,soort,id]=f.split('.');   // les.dag.<id> · les.week.<id>: een weekles maakt zo nodig het weekplan aan
    const o=soort==='dag'?dayOf(id):(weekOf(id)||(PL.weeks[id]=nieuweWeek(id)));if(o){o.les=el.value;save();}return;}
  const parts=f.split('.');let o;
  if(parts[0]==='draft')o=S.modal.draft;
  else if(parts[0]==='week')o=weekOf(isoWeek(vandaag()));
  else if(parts[0]==='day')o=dayOf(vandaag());
  if(!o)return;
  const p=parts.slice(1);for(let i=0;i<p.length-1;i++)o=o[p[i]];
  o[p[p.length-1]]=el.value;
  if(f==='draft.pb')vulVanPlaybook(S.modal.draft);
  if(parts[0]!=='draft')save();
  if(el.tagName==='SELECT')render();
});
